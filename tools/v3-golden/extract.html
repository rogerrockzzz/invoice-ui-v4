<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>v3 golden extractor</title></head>
<body>
<pre id="out">…</pre>
<script>
/* Runs journey-opd-v3.html's own functions and dumps what they return, so v4's ported domain can be
   compared against it (docs/PLAN-v4-M1.md §6.2). Served from the project root; run via `npm run golden`. */
const f = document.createElement("iframe");
f.style.cssText = "width:1200px;height:900px";
f.onload = () => {
  const out = document.getElementById("out");
  try {
    const w = f.contentWindow, E = (s) => w.eval(s);
    const cases = E("cases"), patients = E("patients");
    const calcLine = E("calcLine"), priceLines = E("priceLines"), dedPool = E("dedPool"), planOf = E("planOf");
    const nextStep = E("nextStep"), storyStage = E("storyStage"), visitStories = E("visitStories"), mainStory = E("mainStory");
    const pendingSummary = E("pendingSummary"), collected = E("collected"), creditTotal = E("creditTotal");
    const ledgerRows = E("ledgerRows"), suggestNotes = E("suggestNotes"), approvedOrders = E("approvedOrders");
    const pendingVisits = E("pendingVisits"), activePayerOf = E("activePayerOf"), visitsOf = E("visitsOf");
    const parentVisit = E("parentVisit"), rootVisit = E("rootVisit"), visitNo = E("visitNo");
    const plans = {
      none: null,
      bupaGold: patients["7000667"].payers[0].plan,
      ncciA: patients["7000203"].payers[0].plan,
      tawSilver: patients["7100482"].payers[0].plan,
    };
    const statuses = ["approved", "partial", "pending", "rejected", "notcovered", "notinsured"];
    const calc = [];
    for (const [pk, plan] of Object.entries(plans))
      for (const ins of statuses)
        for (const dLeft of [0, 10, 143, 1000])
          for (const price of [90, 250, 1500, 333.33])
            calc.push({ plan: pk, ins, dLeft, price, out: calcLine({ price, ins }, dLeft, plan) });
    for (const ins of ["approved", "partial"]) calc.push({ plan: "bupaGold", ins, dLeft: 143, price: 300, selfPay: true,
      out: calcLine({ price: 300, ins, selfPay: true }, 143, plans.bupaGold) });

    const btn = (b) => b ? b.label : null;
    const visits = cases.map((c) => {
      const s = nextStep(c);
      const stories = visitStories(c);
      const ps = pendingSummary(c);
      return {
        id: c.id, mrn: c.mrn, visitNo: visitNo(c),
        dedPool: dedPool(c),
        priceConsult: strip(priceLines(c, [c.consult])),
        priceApproved: strip(priceLines(c, approvedOrders(c))),
        priceAllApproved: strip(priceLines(c, c.orders.map((o) => ({ ...o, ins: "approved" })))),
        step: {
          key: s.key, tone: s.tone, tag: s.tag, q: s.q, sub: s.sub || "", amt: s.amt ?? null, amtLabel: s.amtLabel || null,
          amts: (s.amts || []).map((a) => ({ v: a.v, label: a.label })),
          ext: s.ext ? { title: s.ext.title, codes: s.ext.lines.map((l) => l.code), selectable: !!s.ext.selectable, note: s.ext.note || null } : null,
          buttons: [btn(s.yes), btn(s.no), ...(s.acts || []).map((a) => a.label)].filter(Boolean),
          back: !!s.back,
        },
        stories, main: mainStory(c),
        stages: Object.fromEntries(stories.map((id) => [id, storyStage(c, id)])),
        pending: { kind: ps.kind, owed: ps.owed },
        collected: collected(c),
        parent: (parentVisit(c) || {}).id ?? null,
        root: rootVisit(c).id,
        badges: Object.fromEntries(stories.map((id) => [id, E("storyBadge")(c, id)])),
        locks: Object.fromEntries(Object.keys(E("STORIES")).map((id) => [id, E("storyLock")(c, id)])),
        invoices: c.invoices.map((inv) => ({ id: inv.id, refundable: E("refundable")(inv), state: E("refundState")(inv),
          type: E("invType")(inv), status: E("invStatus")(inv), mode: E("invMode")(inv), payerType: E("invPayerType")(c, inv),
          date: E("invDate")(c, inv), credit: E("creditOf")(inv) })),
      };
    });
    const anyDate = { preset: "any", from: "", to: "", clinic: "", doctor: "", payer: "", type: "", status: "", mode: "" };
    const queries = [["", anyDate], ["qahtani", anyDate], ["INV-771204", anyDate], ["7000203", anyDate],
      ["", { ...anyDate, mode: "Credit" }], ["", { ...anyDate, clinic: "CARDIOLOGY", status: "Paid" }],
      ["", { ...anyDate, payer: "Cash" }], ["", { ...anyDate, type: "Consultation" }]]
      .map(([q, f]) => ({ q, f, ids: E("queryInvoices")(f, q).map((r) => r.inv.id) }));
    const payerSearch = [{ group: "bupa" }, { group: "" }, { group: "charity" }, { contract: "61" }, { policy: "class b" }, { group: "5101" }]
      .map((f) => ({ f, ids: E("searchPayers")(f).map((x) => x.id) }));
    const pats = Object.keys(patients).map((mrn) => {
      const pv = pendingVisits(mrn);
      const ap = activePayerOf(patients[mrn]);
      return {
        mrn,
        creditTotal: creditTotal(mrn),
        ledgerADV: ledgerRows(mrn, "ADV").map(lr),
        ledgerCREDIT: ledgerRows(mrn, "CREDIT").map(lr),
        walletDocs: (patients[mrn].walletDocs || []).map((d) => ({ id: d.id, wtype: d.wtype, amount: d.amount, visitId: d.visitId, invoiceId: d.invoiceId })),
        visitOrder: visitsOf(mrn).map((c) => c.id),
        pending: { today: pv.today.map((x) => x.c.id), upcoming: pv.upcoming.map((x) => x.c.id), earlier: pv.earlier.map((x) => x.c.id) },
        activePayer: { id: ap.payer.id, from: ap.from },
      };
    });
    const notes = [0.05, 46, 65.55, 273.69, 999.99, 1234.5].map((a) => ({ amount: a, out: suggestNotes(a) }));
    function strip(t) { return { patient: t.patient, company: t.company, deductible: t.deductible, rows: t.rows.map((r) => ({ code: r.line.code, calc: r.calc })) }; }
    function lr(e) { return { type: e.type, amount: e.amount, balance: e.balance, inflow: e.inflow, docId: e.docId || null, invoiceId: e.invoiceId || null }; }

    /* Scripted flows (checkpoint 1b): v3's own actions, run one op at a time, with a snapshot of the visit
       after each. The ops are written to the JSON so the v4 test replays exactly the same script.
       Invoice numbers come from a seeded Math.random (v4 uses the same sequence); times are masked. */
    let seed = 42;
    w.Math.random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const due = E("due"), startBill = E("startBill"), selectedLines = E("selectedLines"), round2 = (x) => +x.toFixed(2);
    const FLOWS = [
      { name: "visit 1: bill the consultation, cash at the desk", ops: [
        ["billConsult", 1], ["cancelBill", 1], ["billConsult", 1],
        ["pay", 1, "Cash", "tendered SAR 100.00 (1×SAR 100) · change SAR 54.00", [["Cash", "rest"]]],
      ] },
      { name: "visit 3: approval, link, doctor, orders, hold, release, approval, credit", ops: [
        ["approveConsult", 3], ["approveConsult", 3], ["billConsult", 3], ["sendLink", 3], ["simStale", 3], ["resendLink", 3],
        ["simPaid", 3], ["checkDoctor", 3], ["checkDoctor", 3], ["checkOrders", 3], ["checkOrders", 3],
        ["waitAll", 3], ["checkApproval", 3], ["release", 3], ["billApproved", 3], ["sendLink", 3], ["cancelBill", 3],
        ["billApproved", 3], ["pay", 3, "Span", "4417 · 884120", [["Span", "rest", "884120", "4417"]]],
        ["checkApproval", 3], ["checkApproval", 3], ["checkApproval", 3], ["billApproved", 3],
        ["pay", 3, "Credit", "", [["Credit", "rest"]]], ["checkOrders", 3], ["checkOrders", 3],
      ] },
      { name: "visit 2: tick and untick, then split Span + OPEN advance", ops: [
        ["toggle", 2, "PKG-100"], ["toggle", 2, "LAB-010"], ["toggle", 2, "RAD-050"], ["toggle", 2, "PKG-100"], ["billApproved", 2],
        ["toggle", 2, "LAB-010"], ["toggle", 2, "RAD-050"],
        ["pay", 2, "Span + OPEN", "Span SAR 100.00 + OPEN SAR 173.69", [["Span", 100], ["OPEN", "rest"]]],
        ["cashBill", 2], ["cancelBill", 2], ["cashBill", 2], ["simApproval", 2],
      ] },
      { name: "visit 20: interbranch orders billed here", ops: [
        ["billApproved", 20], ["pay", 20, "Cash", "", [["Cash", "rest"]]], ["simApproval", 20], ["billApproved", 20], ["markLinkPaid", 20],
      ] },
      { name: "visit 13: a nil follow-up is recorded", ops: [["billConsult", 13], ["pay", 13, "No charge", null, null]] },
      { name: "visit 31: part paid, part on credit", ops: [
        ["billConsult", 31], ["pay", 31, "Span + Credit", "Span SAR 20.00 + Credit SAR 26.00", [["Span", 20], ["Credit", "rest"]]],
      ] },
      { name: "visit 30: approval, then all on credit", ops: [
        ["approveConsult", 30], ["billConsult", 30], ["pay", 30, "Credit", "", [["Credit", "rest"]]],
      ] },
      /* checkpoint 1c: the wallet, the payer story, the walk-in */
      { name: "7000667 wallet: add, spend, refund advance; settle credit from visit 2", ops: [
        ["addAdvance", 2, "Doctor", "Cash", 250], ["addAdvance", 30, "Clinic", "Span", 40.5],
        ["refundAdvance", 2, "Open", 100, "Cash", "patient travelling"], ["refundAdvance", 2, "Doctor", 50, "Visa", "not continuing"],
        ["settleCredit", 2, "Span", null, 2],
      ] },
      { name: "visit 31 credit: link from the story, then settle it in cash from visit 1", ops: [
        ["openCreditPicker", 31], ["creditLink", 31], ["settleCredit", 1, "Cash", "first", null],
      ] },
      { name: "walk-in: 1063301 with the new GIG policy, 7000667 a follow-up on BUPA", ops: [
        ["walkin", 100, { mrn: "1063301", type: "Consultation", clinic: "CARDIOLOGY", doctor: "AHMED AL SUBAIE", slot: "15:00", payer: "GIG-C", items: [] }],
        ["walkin", 101, { mrn: "7000667", type: "Follow-up", clinic: "ENT", doctor: "LINA FAROUK", slot: "16:30", payer: "BUPA-GOLD", items: ["LAB-CBC", "PKG-EXEC"] }],
        ["walkin", 102, { mrn: "8825140", type: "Procedure only", clinic: "DERMATOLOGY", doctor: "OMAR HASSAN", slot: null, payer: "CASH", items: ["LAB-LIPID"] }],
        ["walkin", 103, { mrn: "7100482", type: "Consultation", clinic: "ENT", doctor: "SARA AL DOSSARI", slot: "17:00", payer: "manual:zakat:CH-ZAKAT:ZK-1", items: [] }],
      ] },
      { name: "payer story on the new visits — cash, insurer, charity, back to the insurer", ops: [
        ["eligibility", 100], ["choosePayer", 100, "CASH"],
        ["eligibility", 100], ["choosePayer", 100, "GIG-C"], ["savePayer", 100],
        ["eligibility", 100], ["manualPick", 100, "charity", "CH-HABIB", "CH-2026-0412"],
        ["eligibility", 100], ["choosePayer", 100, "GIG-C"], ["savePayer", 100],
        ["eligibility", 103], ["choosePayer", 103, "TAW-SILVER"], ["savePayer", 103], ["setPayer", 103, "CASH"],
        ["reprint", 12, "first"], ["addOrders", 100, ["LAB-VITD", "PKG-DIAB", "LAB-VITD"]],
      ] },
      /* milestone 2 — 2a: the Add orders story */
      { name: "2a: add orders through the story on visit 4, then bill and pay them", ops: [
        ["addOrdersStory", 4, ["LAB-CBC", "PKG-EXEC"]], ["billApproved", 4], ["pay", 4, "Cash", "", [["Cash", "rest"]]],
        ["addOrdersStory", 4, ["LAB-CBC"]],
      ] },
      /* 2b: refunds, worked in the Refund story and completed in the slide-in */
      { name: "2b: refund one line by cash, the rest to the wallet; a consultation with a payer share", ops: [
        ["refund", 4, "first", ["LAB-CBC"], "Cash", "", "ordered twice"],
        ["refund", 4, "first", null, "Advance wallet", "", "patient changed their mind"],
        ["refund", 1, "first", null, "Span", "4417", "left before being seen"],
      ] },
    ];
    const caseOf = (id) => cases.find((x) => x.id === id);
    const S = E("state"), doc = w.document, R = (c) => E("renderPayerStory")(c), click = (root, sel) => root.querySelector(sel).click();
    const type = (root, k, v) => { const i = root.querySelector(`[data-f="${k}"]`); i.value = v; i.dispatchEvent(new w.Event("input")); };
    const chooseV3 = (c, spec) => {
      if (spec.startsWith("manual:")) {
        const [, query, id, ref] = spec.split(":");
        click(R(c), "#pyManual");
        let b = R(c); type(b, "group", query); click(b, `[data-pick="${id}"]`);
        b = R(c); type(b, "policyNo", ref); click(b, "#pySave");
        return;
      }
      click(R(c), `[data-choose="${spec}"]`);
      if (c.payerStory && c.payerStory.stage === 3) click(R(c), "#pySave");
    };
    const creditIds = (mrn, ids) => ids === "first" ? [E("creditInvoices")(mrn)[0].inv.id] : ids;
    function runOp([op, id, ...a]) {
      const c = caseOf(id);
      if (op === "addAdvance") { S.adv = { c, cat: a[0], mode: a[1], amount: String(a[2]), fromWallet: false }; E("render")(); doc.getElementById("aGo").click(); }
      else if (op === "refundAdvance") { S.drawer = { c, mode: a[2], amount: a[1], advRefund: { cat: a[0], reason: a[3] } }; E("render")(); doc.getElementById("dGo").click(); }
      else if (op === "settleCredit") {
        const ids = creditIds(c.mrn, a[1]);
        const list = E("creditInvoices")(c.mrn).filter((x) => !ids || ids.includes(x.inv.id));
        const amount = round2(list.reduce((s, x) => s + E("creditOf")(x.inv), 0));
        S.caseId = a[2]; S.drawer = { c, mode: a[0], amount, credit: true, ids: ids || undefined }; E("render")(); doc.getElementById("dGo").click(); S.caseId = null;
      }
      else if (op === "creditLink") click(E("renderCreditStory")(c), "#ccLink");
      else if (op === "eligibility") { E("startPayerStory")(c); E("finishEligibility")(c); }
      else if (op === "choosePayer") click(R(c), `[data-choose="${a[0]}"]`);
      else if (op === "savePayer") click(R(c), "#pySave");
      else if (op === "manualPick") chooseV3(c, `manual:${a[0]}:${a[1]}:${a[2]}`);
      else if (op === "setPayer") E("setPayer")(c, a[0]);
      else if (op === "reprint") E("reprint")(a[0] === "first" ? c.invoices[0].id : a[0]);
      else if (op === "addOrders") E("addReceptionOrders")(c, a[0].map((code) => E("ORDER_CATALOG").find((x) => x.code === code)));
      else if (op === "refund") {
        const [which, codes, mode, ref, reason] = a;
        const inv = which === "first" ? c.invoices.find((i) => E("refundable")(i)) : c.invoices.find((i) => i.id === which);
        S.caseId = null; E("openRefund")(inv.id);
        if (codes) S.refund.sel = Object.fromEntries(codes.map((k) => [k, true]));
        S.refund.reason = reason;
        click(E("renderRefundWork")(c), "#rfGo");
        S.drawer.mode = mode; S.drawer.ref = ref; E("render")(); doc.getElementById("dGo").click();
      }
      else if (op === "addOrdersStory") {
        c.addStory = { stage: 2, sel: Object.fromEntries(a[0].map((k) => [k, true])), q: "" };
        click(E("renderAddOrdersStory")(c), "#aoGo");
      }
      else if (op === "walkin") {
        const sp = a[0], chosen = patients[sp.mrn], fee = E("CONSULT_FEES")[sp.clinic] || 200;
        const d = { stage: 4, mrn: sp.mrn, type: sp.type, clinic: sp.clinic, doctor: sp.doctor, slot: sp.slot, payerId: null,
          cart: { sel: Object.fromEntries(sp.items.map((k) => [k, true])), q: "" } };
        E("startWalkinPayer")(d, chosen, fee);
        E("finishEligibility")(d.pctx);
        chooseV3(d.pctx, sp.payer);
        E("createWalkinVisit")(d, chosen, fee);
        S.walkin = null;
      }
      else if (op === "billConsult") startBill(c, "consult", [c.consult]);
      else if (op === "billApproved") startBill(c, "orders", selectedLines(c, approvedOrders(c)));
      else if (op === "approveConsult") E("simApproveConsult")(c);
      else if (op === "waitAll") nextStep(c).no.fn();
      else if (op === "release") nextStep(c).acts.find((x) => /approved order\(s\) now/.test(x.label)).fn();
      else if (op === "toggle") E("toggleLine")(c, a[0], nextStep(c).ext.lines);
      else if (op === "cashBill") E("startCashBill")(c, E("pendingOrders")(c).filter((o) => !o.paid && !o.invoiceId));
      else if (op === "markLinkPaid") E("payAll")(c, "Payment link");
      else if (op === "pay") {
        const [via, detail, spec] = a;
        let parts = null;
        if (spec) {
          const fixed = spec.filter((p) => p[1] !== "rest").reduce((s, p) => s + p[1], 0);
          parts = spec.map(([mode, amt, ref, ref2]) => ({ mode, amount: amt === "rest" ? round2(due(c) - fixed) : amt, ref: ref || "", ref2: ref2 || "" }));
        }
        E("payAll")(c, via, detail || "", parts);
      } else E(op)(c);
    }
    const norm = (s) => String(s ?? "").replace(/\s+/g, " ").trim().replace(/\b\d\d:\d\d\b/g, "HH:MM");
    function snap(c) {
      const s = nextStep(c), p = patients[c.mrn], stories = visitStories(c);
      return {
        step: s.key, q: norm(s.q), sub: norm(s.sub), amt: s.amt ?? null,
        buttons: [btn(s.yes), btn(s.no), ...(s.acts || []).map((x) => x.label)].filter(Boolean),
        stories, active: E("activeStory")(c), stages: Object.fromEntries(stories.map((id) => [id, storyStage(c, id)])),
        due: due(c), dedUsed: c.dedUsed, link: c.link ? c.link.ageMin : null, waitAll: !!c.prefs.waitAll,
        bill: c.bill ? { scope: c.bill.scope, codes: c.bill.codes, patient: c.bill.patient, company: c.bill.company, deductible: c.bill.deductible, cashOnly: !!c.bill.cashOnly } : null,
        lines: [c.consult, ...c.orders].map((l) => ({ code: l.code, ins: l.ins, price: l.price, paid: !!l.paid, via: l.via || null, invoiceId: l.invoiceId || null,
          urgentCash: !!l.urgentCash, approvalPending: !!l.approvalPending, refunded: !!l.refunded })),
        invoices: c.invoices.map((i) => ({ id: i.id, scope: i.scope, patient: i.patient, company: i.company, deductible: i.deductible, paid: i.paid,
          via: i.via, viaDetail: norm(i.viaDetail), payments: i.payments || null, payer: i.payer, branch: i.branch || null, cashOnly: !!i.cashOnly,
          billType: i.billType || null, rows: i.rows.map((r) => r.code + (r.refunded ? ":refunded" : "")),
          refunded: i.refundedTotal || 0, refunds: (i.refunds || []).map((r) => `${r.amount}:${r.mode}:${norm(r.reason)}:${norm(r.detail)}:${r.codes.join("+")}:${r.refundInvoiceId}`),
          replaced: i.replaced ? `${i.replaced.newId}:${i.replaced.to}` : null, replaces: i.replaces || null, credited: i.credited || 0 })),
        refundInvoices: (c.refundInvoices || []).map((r) => `${r.id}:${r.refOf}:${r.patient}:${r.company}:${r.deductible}:${r.via}:${norm(r.viaDetail)}:${norm(r.reason)}:${r.payer}:${r.rows.map((x) => x.code).join("+")}`),
        history: c.history.map((h) => ({ ic: h.ic || "", tx: norm(h.tx), sub: norm(h.sub), type: h.type || "", by: h.by || "",
          invoiceId: h.invoiceId || null, amount: h.amount ?? null, mode: h.mode || null })),
        wallet: { ...p.wallet.advance }, credit: creditTotal(c.mrn),
        ledger: (p.ledger || []).map((e) => ({ type: e.type, amount: e.amount, note: norm(e.note), invoiceId: e.invoiceId || null, visitId: e.visitId ?? null, docId: e.docId || null })),
        visit: { type: c.visitType, clinic: c.clinic, doctor: c.doctor, slot: c.slot || null, consult: { name: c.consult.name, code: c.consult.code, price: c.consult.price } },
        payerId: c.payerId, policy: c.policy ? norm(Object.values(c.policy).join("|")) : null, payers: p.payers.map((x) => x.id),
        payerStory: c.payerStory ? c.payerStory.stage : null,
        done: Object.fromEntries(Object.entries(c.storyDone || {}).map(([k, v]) => [k, `${norm(v.title)} | ${norm(v.sub)}${v.cash ? " | cash" : ""}`])),
        settled: E("visitsOf")(c.mrn).flatMap((v) => v.invoices.filter((i) => i.settled).map((i) => `${i.id}:${i.settledVia}`)),
        appr: [c.consult, ...c.orders].map((l) => l.appr || null),
        docs: (p.walletDocs || []).map((d) => `${d.id}:${d.wtype}:${d.amount}:${d.visitId}:${d.invoiceId || ""}:${norm(d.note)}`),
      };
    }
    const flows = FLOWS.map((f) => ({ name: f.name, ops: f.ops, snaps: f.ops.map((o) => { try { runOp(o); } catch (e) { e.message = `${JSON.stringify(o)}: ${e.message}`; throw e; } return snap(caseOf(o[1])); }) }));
    out.textContent = JSON.stringify({ build: E("BUILD"), generatedAt: new Date().toISOString(), calc, visits, patients: pats, notes, queries, payerSearch, flows });
  } catch (e) {
    out.textContent = "ERROR " + e.message + "\n" + e.stack;
  }
  document.title = "GOLDEN-READY";
};
f.src = "../../docs/Devin%20Invoice%20UI/journey-opd-v3.html";
document.body.appendChild(f);
</script>
</body>
</html>
