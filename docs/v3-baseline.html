/* ---- procedures charged in a date range ---- */
function chatRange(q, ctx){
  const need = chatNeed(ctx,"patient"); if(need) return need;
  const ql = q.toLowerCase();
  const day = (str)=>{
    str = str.trim();
    if(/today/.test(str)) return presetRange("today")[0];
    if(/yesterday/.test(str)) return presetRange("yesterday")[0];
    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str); if(m) return str;
    m = /^(\d{1,2})\s*([a-z]{3})[a-z]*$/.exec(str);
    if(m){ const mo = Object.keys(MONTHS).find(k=>k.toLowerCase()===m[2]); if(mo) return isoDay(new Date(new Date().getFullYear(), MONTHS[mo], +m[1])); }
    return null;
  };
  let from = "", to = "", label = "";
  const r = /from\s+(.+?)\s+(?:to|until|till|-)\s+(.+?)(?:\?|$)/.exec(ql);
  if(r){ from = day(r[1]); to = day(r[2]); label = `${r[1]} to ${r[2]}`; }
  else if(/this month/.test(ql)){ [from,to] = presetRange("month"); label = "this month"; }
  else if(/last 7 days|this week/.test(ql)){ [from,to] = presetRange("week"); label = "the last 7 days"; }
  else if(/today/.test(ql)){ [from,to] = presetRange("today"); label = "today"; }
  if(!from || !to) return `Which dates? Ask like <i>“List procedures charged from 1 Sep to 30 Sep”</i>, <i>“… this month”</i> or <i>“… today”</i>.`;
  const rows = [];
  visitsOf(ctx.mrn).forEach(c=>liveInv(c).forEach(i=>{ const d = invDate(c, i);
    if(d>=from && d<=to) i.rows.forEach(r=>rows.push({ c, i, r, d })); }));
  rows.sort((a,b)=>a.d.localeCompare(b.d));
  if(!rows.length) return `Nothing was charged to ${first(ctx.p)} ${label} (${from} → ${to}).`;
  const tot = rows.reduce((a,x)=>a+x.r.calc.patientWithTax,0);
  return `${rows.length} line(s) charged to ${first(ctx.p)} ${label} — patient share <b>${fmt(tot)}</b>:
    <table class="chtab"><tr><th>Date</th><th>Line</th><th>Invoice</th><th class="num">Patient</th></tr>
    ${rows.map(x=>`<tr><td>${x.d.slice(5)}</td><td>${x.r.name}${x.r.refunded?" <i>(refunded)</i>":""}</td><td>${ilink(x.i.id)}</td><td class="num">${fmt(x.r.calc.patientWithTax)}</td></tr>`).join("")}</table>`;
}

/* ---- open / show: answer with links to the invoice, profile or visit asked for ---- */

  }
  if(/\bvisit\b/.test(ql)){

  }

/* match the question to what it is asking */
function chatAnswer(q){
  const ql = q.toLowerCase().trim(), ctx = chatContext(q);
  if(!ql || /^(help|hi|hello|what can i ask)/.test(ql)) return CHAT_HELP;
  if(/\b(refund|reprint|replace|pay|settle|book|cancel)\b/.test(ql) && /^(please |can you |)(refund|replace|settle|book|cancel)\b/.test(ql))
    return `I can't make changes — I only answer questions. Use the <b>${/refund/.test(ql)?"Invoices / Refund":/replace/.test(ql)?"Replace":/settle/.test(ql)?"wallet (Credit tab)":"relevant"}</b> story on the visit to do that.`;
  if(/deductible/.test(ql)) return chatDeductible(ctx);
  if(/approv/.test(ql)) return chatApproval(ctx);
  if(/(last|latest|previous)\b.*(order|done|performed|did)|when was .*(order|done)/.test(ql)) return chatLastOrdered(q, ctx);
  if(/(list|show|which|what).*(procedure|order|test|line|charged|item)s?.*(from|this month|last 7|this week|today|between)/.test(ql)) return chatRange(q, ctx);
  if(/(why|explain|how (is|was) .*calculated|break ?down)/.test(ql) && /(share|pay|charge|amount|bill|cost|much)/.test(ql)) return chatExplain(ctx);
  if(/(patient share|charged|collected|how much .*(paid|pay))/.test(ql)) return chatShare(ctx);
  if(/\b(open|show|go to|take me|view|find|link|list)\b/.test(ql) || /\b(profile|visits|invoices)\b/.test(ql)){
    const nav = chatNavigate(q, ctx); if(nav) return nav; }
  if(/\b(owe|outstanding|credit)\b/.test(ql)) return chatCredit(ctx);
  if(/advance|wallet/.test(ql)) return chatAdvance(ctx);
  if(/refund/.test(ql)) return chatRefunds(ctx);
  if(/pending|next|to do|waiting|status/.test(ql)) return chatPending(ctx);
  if(/payer|insur|policy|coverage|nphies/.test(ql)) return chatPayer(ctx);
  if(ctx.inv) return chatInvoice(ctx);
  return `I didn't catch that. ${CHAT_HELP}`;
}
function chatAsk(q){
  const cs = chatState();
  if(!q.trim()) return;
  cs.msgs.push({ who:"me", html:escHtml(q) });
  cs.msgs.push({ who:"bot", html:chatAnswer(q) });
  cs.draft = ""; cs.focusNext = true;
  renderChat();
}
function renderChat(){
  const cs = chatState();
  document.querySelectorAll(".chatfab,.chatbox").forEach(x=>x.remove());
  /* out of the way while money is being taken in the slide-in */
  if(state.drawer || state.adv) return;
  const fab = el(`<button class="chatfab ${cs.open?"on":""}" title="Ask about this patient's billing">${cs.open?"✕":"💬"}<span>${cs.open?"":"Ask VIDA"}</span></button>`);
  fab.onclick = ()=>{ cs.open = !cs.open; cs.focusNext = cs.open; renderChat(); };
  document.body.appendChild(fab);
  if(!cs.open) return;
  const ctx = chatContext("");
  const about = ctx.c && state.screen==="visit" ? `${ctx.p.name} · ${visitNo(ctx.c)}` : ctx.p ? ctx.p.name : "No patient open — name one in your question";
  const sugg = state.screen==="visit" ? CHAT_SUGGEST_VISIT : ctx.p ? CHAT_SUGGEST_PATIENT : CHAT_SUGGEST_HOME;
  const box = el(`<div class="chatbox">
    <div class="chh"><b>Ask VIDA</b><span>${about}</span></div>
    <div class="chm" id="chMsgs">${cs.msgs.length ? cs.msgs.map(m=>`<div class="cm ${m.who}">${m.html}</div>`).join("")
      : `<div class="cm bot">Hi — ask me about ${ctx.p?first(ctx.p)+"'s":"a patient's"} billing: deductible, approvals, what was charged, credit, advance, refunds or what's pending.</div>`}</div>
    <div class="chs">${sugg.map(x=>`<button class="chq">${x}</button>`).join("")}</div>
    <div class="chi"><input id="chIn" placeholder="Ask a question…" value="${escHtml(cs.draft||"")}"><button class="btn sm blue" id="chGo">Ask</button></div>
  </div>`);
  const inp = box.querySelector("#chIn");
  inp.oninput = (e)=>{ cs.draft = e.target.value; };
  inp.onkeydown = (e)=>{ if(e.key==="Enter") chatAsk(inp.value); };
  box.querySelector("#chGo").onclick = ()=>chatAsk(inp.value);
  box.querySelectorAll(".chq").forEach(b=>b.onclick = ()=>chatAsk(b.textContent));
  box.querySelectorAll(".invlink").forEach(a=>a.onclick = ()=>openInvoice(a.dataset.inv));
  box.querySelectorAll(".vlink").forEach(a=>a.onclick = ()=>openVisit(+a.dataset.visit));
  box.querySelectorAll(".plink").forEach(a=>a.onclick = ()=>openPatient(a.dataset.mrn));
  document.body.appendChild(box);
  const m = box.querySelector("#chMsgs"); m.scrollTop = m.scrollHeight;
  /* only take the cursor when the chat was just opened or a question was just asked */
  if(cs.focusNext){ cs.focusNext = false; setTimeout(()=>{ const i = document.getElementById("chIn"); if(i) i.focus(); }, 0); }
}

/* ---------------- the step engine ---------------- */
function nextStep(c){
  const owed = due(c);
  const insured = !!planOf(c);            /* no policy → nothing to approve */
  const appr = approvedOrders(c), pend = pendingOrders(c);

  if(!consultDone(c)){
    if(isPending(c.consult)) return { key:"CONSULT_WAIT", tone:"wait", tag:"Consultation",
      q:`Approval not received for the consultation — please wait.`,
      sub:`The request is with ${payerName(c)}.`,
      acts:[{ label:"Check for approval", primary:true, fn:()=>simApproveConsult(c) }] };

    const t = priceLines(c, [c.consult]);
    return { key:"CONSULT_BILL", tone:"", tag:"Consultation",
      q:insured ? `Approval received. Do you wish to bill the consultation?`
                : `Do you wish to bill the consultation?`,
      sub:t.patient===0
        ? `${c.consult.name} · <b>no charge</b> for this visit type.`
        : `${c.consult.name} · <b>${insured?insStatuses[c.consult.ins].label:"self-pay"}</b> · orders stay locked until this is settled.`,
      amt:t.patient, amtLabel:"patient share",
      ext:{ title:"What is being charged", lines:[c.consult] },
      yes:{ label:"Yes, bill it", fn:()=>{ startBill(c,"consult",[c.consult]); render(); } },
 };
  }

  /* a follow-up or courtesy line that carries no charge — nothing to collect */
  if(c.bill && owed===0) return { key:"COLLECT_ZERO", tone:"", tag:"Nothing to collect",
    q:`${c.bill.scope==="consult"?`${c.consult.name} carries`:"These orders carry"} no charge. Record it and send ${pt(c).name.split(" ")[0]} in?`,
    sub:`An invoice is still raised, at <b>SAR 0.00</b>.`,
    amt:0, amtLabel:"patient share",
    ext:{ title:"What is being recorded", lines:[c.consult, ...c.orders].filter(l=>onBill(c,l)) },
    yes:{ label:"Yes, record it", fn:()=>payAll(c, "No charge") },
    back:()=>cancelBill(c) };

  /* a replacement in hand: only the difference changes hands */
  if(c.bill && c.bill.replacing){
    const t = c.bill.replacing.to, dif = due(c);
    return { key:"REPLACE_COLLECT", tone:"", tag:"Replacement",
      q:`Collect ${fmt(dif)} to finish the replacement?`,
      sub:`${c.bill.replacing.partial
          ? (t==="cash" ? `Orders now at <b>cash prices</b> · the patient stays on ${payerOf(c).label}` : `Order moved onto the policy`)
          : `Now billed as <b>${t==="cash"?"a cash patient":"an insurance patient"}</b>`} · new total ${fmt(c.bill.patient)}${c.bill.replacing.credited>0?` · <b>${fmt(c.bill.replacing.credited)}</b> already paid carried over`:""}.`,
      amt:dif, amtLabel:"difference to collect",
      ext:{ title:`${c.bill.rows.length} line(s) on the new invoice`,
            lines:[c.consult, ...c.orders].filter(l=>c.bill.codes.includes(l.code)) },
      acts:[{ label:"Take it at the desk", primary:true, fn:()=>{ state.drawer = { c, mode:"Cash", amount:dif }; render(); } },
            { label:"Send a payment link", fn:()=>sendLink(c) },
            { label:"Cancel the replacement", ghost:true, fn:()=>undoReplace(c) }],
      back:()=>undoReplace(c) };
  }
  if(owed>0){
    if(c.link) return { key:"COLLECT_WAIT", tone:"wait", tag:"Payment",
      q:`Waiting for ${pt(c).name.split(" ")[0]} to pay ${fmt(owed)}.`,
      sub:`Link sent at ${c.link.at} to <b>${pt(c).mobile}</b>${c.link.ageMin>=10?` — <b>no payment after ${c.link.ageMin} minutes</b>`:""}.`,
      amt:owed, amtLabel:"awaiting payment",
      acts:[{ label:"Take payment at the desk", primary:true, fn:()=>{ state.drawer = { c, mode:"Cash", amount:owed }; render(); } },
            { label:"Resend link", fn:()=>resendLink(c) },
            { label:"Mark as paid (link confirmed)", ghost:true, fn:()=>payAll(c,"Payment link") }],
      back:()=>cancelBill(c) };
    const scope = c.bill.scope==="consult" ? "consultation" : "orders";
    return { key:"COLLECT", tone:"", tag:"Payment",
      q:`How is ${pt(c).name.split(" ")[0]} paying for the ${scope} — ${fmt(owed)}?`,
      sub:`The invoice is created when the payment goes through.`,
      amt:owed, amtLabel:"to collect",
      /* the desk is where most payments are taken, so it leads */
      yes:{ label:"Take payment at the desk", fn:()=>{ state.drawer = { c, mode:"Cash", amount:owed }; render(); } },
      no:{ label:"Send payment link", fn:()=>{ sendLink(c,false); render(); } },
      back:()=>cancelBill(c),
      /* the charge is not an invoice yet, so a line can still be dropped here */
      ext:{ title:"What is being charged", selectable:c.bill.scope==="orders",
            lines:[c.consult, ...c.orders].filter(l=>onBill(c,l) || (c.bill.scope==="orders" && !l.invoiceId && l!==c.consult && c.sel?.[l.code]===false)) } };
  }

  /* a package procedure was paid inside the package — this is a print, not a charge */
  if(c.fromPackage && appr.length){
    const src = appr[0].fromPackage || {};
    return { key:"PKG_PRINT", tone:"", tag:"Package procedure",
      q:`Print the invoice for ${appr.length} package procedure(s)?`,
      sub:`${appr.map(o=>o.name).join(", ")} · already paid inside <b>${src.parent||"the package"}</b>
           on <a class="invlink" data-inv="${src.invoiceId}">${src.invoiceId}</a> · <b>no charge</b>.`,
      ext:{ title:`${appr.length} procedure(s) from the package`, lines:appr },
      yes:{ label:"Yes, print it", fn:()=>printPackageOrders(c, appr) } };
  }
  if(c.fromPackage && !appr.length && !pend.length){
    const inv = c.invoices.find(i=>!i.voided);
    if(inv){
      const src = (c.orders[0]||{}).fromPackage || {};
      return { key:"PKG_DONE", tone:"done", tag:"Package procedure",
        q:`This package procedure has been recorded.`,
        sub:`<a class="invlink" data-inv="${inv.id}">${inv.id}</a> printed at <b>no charge</b> · package paid on
             <a class="invlink" data-inv="${src.invoiceId}">${src.invoiceId}</a>.`,
        acts:[{ label:`Undo the print · ${inv.id}`, danger:true, fn:()=>{ state.voidPop = { c, invId:inv.id, reason:"" }; render(); } }] };
    }
  }

  if(appr.length || pend.length){
    const chosen = selectedLines(c, appr);          /* all ticked by default */
    const t = priceLines(c, chosen);
    const someOff = chosen.length < appr.length;
    const where = c.interbranch ? ` at <b>${c.fromBranch}</b>` : "";
    const onBehalf = c.interbranch ? ` Collected here on behalf of ${c.fromBranch}.` : "";
    if(appr.length && pend.length && !c.prefs.waitAll) return { key:"ORDERS_MIXED", tone:"", tag:c.interbranch?"Interbranch orders":"Doctor's orders",
      q:`${c.orders.filter(o=>!o.paid).length} procedures were ordered${c.interbranch?` at ${c.fromBranch}`:""}. ${appr.length} ${appr.length===1?"has":"have"} approval, ${pend.length} ${pend.length===1?"does":"do"} not.`,
      sub:`${onBehalf.trim()||`Bill the approved ones now, or wait and bill them together.`}`,
      amt:t.patient, amtLabel:someOff?`${chosen.length} of ${appr.length} approved · patient share`
                                     :`${appr.length} approved · patient share`,
      ext:{ title:`${appr.length+pend.length} order(s) still to bill`, lines:[...appr, ...pend], selectable:true,
            note:(()=>{ const done = c.orders.filter(o=>o.invoiceId).length;
              return done ? `${done} earlier order(s) on this visit have already been billed — see the history below.` : ""; })() },
      yes:{ label:insured?`Bill the ${chosen.length} approved now`:`Bill the ${chosen.length} now`,
            fn:()=>{ startBill(c,"orders",chosen); render(); } },
      no:{ label:"Wait for all approvals", fn:()=>{ c.prefs.waitAll = true;
              record(c,"i","<b>Holding for the remaining approvals</b>",
                `${appr.length} approved order(s) held back so everything is billed together`,
                { type:"HOLD", lines:c.orders.filter(o=>!o.paid).map(o=>({ name:o.name, code:o.code, ins:o.ins, price:o.price })) });
              render(); } } };

    if(appr.length && !pend.length) return { key:"ORDERS_BILL", tone:"", tag:c.interbranch?"Interbranch orders":"Doctor's orders",
      q:`${appr.length} procedure(s) were ordered${c.interbranch?` at ${c.fromBranch}`:""}${insured?" and are approved":""}. Bill ${someOff?`the ${chosen.length} ticked`:"them"}?`,
      sub:(insured ? `Nothing else is waiting on approval.` : `Self-pay — the patient carries the whole charge.`) + onBehalf,
      amt:t.patient, amtLabel:someOff?`${chosen.length} of ${appr.length} ticked · patient share`:"patient share",
      ext:{ title:`${appr.length} order(s)`, lines:appr, selectable:true, open:someOff },
      yes:{ label:someOff?`Yes, bill the ${chosen.length} ticked`:"Yes, bill them",
            fn:()=>{ startBill(c,"orders",chosen); render(); } } };

    /* still waiting on the payer — one button, and it reports what came back */
    const checked = c.lastCheck;
    const cashable = pend.filter(o=>!o.paid && !o.invoiceId);
    return { key:"ORDERS_WAIT", tone:"wait", tag:c.interbranch?"Interbranch orders":"Remaining orders",
      q:`Waiting for approval on ${pend.length} order(s).`,
      sub:(checked ? `⚠ <b>Checked at ${checked} — no answer yet.</b> ` : ``)
          + (c.prefs.waitAll && appr.length ? `<b>${appr.length} approved order(s)</b> are being held with them.` : ``),
      /* what is known, and what is still a guess — priced in the order they will be billed */
      amts:(()=>{
        const heldLines = c.prefs.waitAll ? appr : [];
        const held = heldLines.length ? priceLines(c, heldLines).patient : 0;
        const all  = priceLines(c, [...heldLines, ...pend.map(o=>({ ...o, ins:"approved" }))]).patient;
        return [
          ...(held ? [{ v:held, label:`ready to bill · ${appr.length} approved`, tone:"due" }] : []),
          { v:+(all - held).toFixed(2), label:"up to this much more, if approved in full", tone:"soft" }
        ];
      })(),
      ext:{ title:`${pend.length} order(s) awaiting approval`, lines:pend },
      acts:[{ label:"Check approval", primary:true, fn:()=>checkApproval(c) },
        /* changed your mind about waiting — go back and bill what is approved */
        ...(c.prefs.waitAll && appr.length ? [{ label:`Bill the ${appr.length} approved order(s) now`,
          fn:()=>{ c.prefs.waitAll = false;
            record(c, "i", `<b>Held orders released for billing</b>`,
              `${appr.length} approved order(s) will be billed now; ${pend.length} still awaiting approval`,
              { type:"HOLD", lines:appr.map(o=>({ name:o.name, code:o.code, ins:o.ins, price:o.price })) });
            toast("", `${appr.length} approved order(s) ready to bill`, pt(c).name);
            render(); } }] : []),
        /* the order cannot wait: bill it at the cash price on its own, and move it later */
        ...(cashable.length?[{ label:`Bill the ${cashable.length} pending order(s) as cash now`,
          fn:()=>{ startCashBill(c, cashable); render(); } }]:[]),
        ] };
  }

  /* the patient left before the doctor saw them */
  if(c.lwbs) return { key:"LWBS", tone:"wait", tag:"Left without being seen",
    q:`${pt(c).name.split(" ")[0]} left without being seen.`,
    sub:`Marked at ${c.lwbs.at} by ${c.lwbs.by}${c.lwbs.reason?` · ${c.lwbs.reason}`:""}.
         ${liveInvoices(c).some(i=>refundable(i))?"The consultation is still paid — refund it from the Refund story if needed.":""}`,
    acts:[{ label:"The patient came back — undo", ghost:true, fn:()=>undoLwbs(c) }] };

  /* consultation settled — the patient goes to the doctor; nothing moves until the doctor starts */
  if(!c.closed && !doctorOrders(c).length && !c.interbranch && !procOnly(c) && consultDone(c) && !c.clinical){
    const checked = c.lastDocCheck;
    return { key:"SEE_DOCTOR", tone:"wait", tag:"See the doctor",
      q:`${pt(c).name.split(" ")[0]} can now see the doctor.`,
      sub:(checked ? `⚠ <b>Checked at ${checked} — the doctor has not started yet.</b> ` : ``) +
          `The visit moves on once the doctor starts the consultation.`,
      acts:[{ label:"Check if the doctor has started", primary:true, fn:()=>checkDoctor(c) },
            { label:"Left without being seen", ghost:true, fn:()=>{ state.lwbsPop = { c, reason:"" }; render(); } }] };
  }

  /* a procedure-only visit has no doctor step: it waits for reception to add what is being done */
  if(!c.closed && procOnly(c) && !c.orders.length && !c.fromPackage) return { key:"NO_ORDERS", tone:"", tag:"Orders",
    q:`No orders on this visit yet.`,
    sub:`Add the procedures or packages ${pt(c).name.split(" ")[0]} has come for.`,
    acts:[{ label:"Add orders", primary:true, fn:()=>switchStory(c, "addorders") }] };

  /* consultation settled and the doctor has not ordered anything yet — the visit stays open */
  if(!c.closed && !c.orders.length && !c.interbranch && consultDone(c)){
    const checked = c.lastOrderCheck;
    return { key:"WAIT_DOCTOR", tone:"wait", tag:"With the doctor",
      q:`${pt(c).name.split(" ")[0]} is with the doctor.`,
      sub:(checked ? `⚠ <b>Checked at ${checked} — nothing ordered yet.</b> ` : ``) +
          `Anything the doctor orders will appear here to be billed.`,
      acts:[{ label:"Check for new orders", primary:true, fn:()=>checkOrders(c) }] };
  }

  const onCredit = visitCredit(c), creditHere = visitCreditTot(c);

  if(!c.closed) return { key:"CLOSE", tone:"done", tag:"Orders complete",
    q:onCredit.length ? `Everything ordered so far has been billed.` : `Everything ordered so far has been billed and paid.`,
    sub:`Collected <b>${fmt(collected(c))}</b> across ${c.invoices.length} invoice(s).` +
        (onCredit.length ? ` <b>${fmt(creditHere)}</b> on ${onCredit.length} invoice(s) sits on credit.` : ``) +
        (c.lastOrderCheck?` ⚠ <b>Checked at ${c.lastOrderCheck} — nothing new from the doctor.</b>`:``),
    acts:[{ label:"Check for new orders", primary:true, fn:()=>checkOrders(c) }] };

  return { key:"CLOSED", tone:"done", tag:"Closed",
    q:`This visit is closed.`,
    sub:`Collected <b>${fmt(collected(c))}</b>.`,
    acts:[{ label:"Reopen", ghost:true, fn:()=>{ c.closed=false; render(); } }] };
}

const isToday  = (c)=>c.date==="Today";
/* The visit a visit belongs to: an explicit link, the visit that paid for the package, or — for a
   follow-up — the latest earlier consultation in the same clinic. */
function parentVisit(c){
  if(c.parentId) return cases.find(x=>x.id===c.parentId) || null;
  if(c.fromPackage){ const src = ((c.orders||[]).find(o=>o.fromPackage)||{}).fromPackage;
    return src ? cases.find(x=>x.id===src.visitId) || null : null; }
  if(c.visitType==="Follow-up")
    return cases.filter(x=>x.mrn===c.mrn && x.id!==c.id && x.clinic===c.clinic && x.visitType==="Consultation" && (x.sortKey||0) < (c.sortKey||0))
                .sort((a,b)=>(b.sortKey||0)-(a.sortKey||0))[0] || null;
  return null;
}
function rootVisit(c){
  let r = c; const seen = new Set([c.id]);
  for(let p = parentVisit(r); p && !seen.has(p.id); p = parentVisit(r)){ seen.add(p.id); r = p; }
  return r;
}
const relationTo = (c)=>c.fromPackage ? "Package procedure from" : c.visitType==="Follow-up" ? "Follow-up of" : "Linked to";
/* a visit number the receptionist can quote, and a real date to filter on */
const visitNo  = (c)=>"V"+String(100000 + c.id);
const MONTHS = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
function visitDate(c){
  const t = new Date(); t.setHours(0,0,0,0);
  let d = t;
  const m = /^(\d{1,2}) (\w{3})$/.exec(c.date||"");
  if(m && MONTHS[m[2]]!==undefined) d = new Date(t.getFullYear(), MONTHS[m[2]], +m[1]);
  const pad = (n)=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
const isFuture = (c)=>!!c.future;
/* the open visits with something to do or wait for, sorted into today / upcoming / earlier */
function pendingVisits(mrn){
  const open = visitsOf(mrn).filter(c=>!c.closed).map(c=>({ c, ...pendingSummary(c) })).filter(x=>x.kind!=="done");
  return { today: open.filter(x=>isToday(x.c)),
           upcoming: open.filter(x=>isFuture(x.c)).sort((a,b)=>(a.c.sortKey||0)-(b.c.sortKey||0)),
           earlier: open.filter(x=>!isToday(x.c) && !isFuture(x.c)) };
}
/* one pending visit, as a tile: when, what, where the story is, what it needs */
function actionTile(x, opts={}){
  const { c, s, kind, owed } = x;
  const main = mainStory(c);
  const pos = storyStage(c, main), total = STORIES[main].stages.length;
  const amt = owed>0 ? owed : (s.amt||0);
  /* home: just when, what, the next step, and the money */
  if(opts.compact){
    const t = el(`
      <div class="atile mini ${kind}">
        <b class="tm">${c.arrived}</b>
        <span class="vv">${c.visitType} · ${c.clinic}${c.interbranch?` <span class="ib" title="From ${c.fromBranch}">⇄</span>`:""}</span>
        <span class="nx ${kind}">${kind==="act"?"":kind==="ongoing"?"Ongoing · ":"Waiting · "}${STORIES[main].stages[pos.index]}</span>
        <span class="am ${owed>0?"due":""}">${amt?fmt(amt):""}</span>
        <button class="btn sm ${kind==="act"?"blue":""}">Open ›</button>
      </div>`);
    t.onclick = ()=>openVisit(c.id);
    return t;
  }
  /* credit belongs to the patient, not the visit — it is on the card already, not repeated per tile */
  /* the profile tile: when, what, who, the payer, the status and the next action — nothing else */
  const status = isFuture(c) ? "Upcoming" : kind==="act" ? "To do" : kind==="ongoing" ? "Ongoing" : "Waiting";
  const next = STORIES[main].stages[pos.index];
  const when = c.slot || c.arrived;
  const t = el(`
    <div class="atile pt ${kind} ${isFuture(c)?"future":""}">
      <div class="when"><b>${when}</b><span>${isFuture(c)?c.date:isToday(c)?"Today":c.date}</span></div>
      <div class="body">
        <div class="vh"><b>${c.visitType} · ${c.clinic}</b>${c.interbranch?` <span class="ibtag">⇄ ${c.fromBranch}</span>`:""}</div>
        <div class="who">Dr ${c.doctor} · ${payerOf(c).label}</div>
        <div class="sl"><span class="pill ${kind}">${status}</span><span class="nxt">Next: <b>${next}</b></span></div>
      </div>
      <div class="side"><button class="btn ${kind==="act"?"blue":""}" data-go="${c.id}">Open ›</button></div>
    </div>`);
  t.onclick = ()=>openVisit(c.id);
  return t;
}
function pendingSummary(c){
  const s = nextStep(c);
  const kind = ["CONSULT_BILL","ORDERS_MIXED","ORDERS_BILL","COLLECT","COLLECT_ZERO","PKG_PRINT","NO_ORDERS"].includes(s.key) ? "act"
             : ["CONSULT_WAIT","COLLECT_WAIT","ORDERS_WAIT","SEE_DOCTOR"].includes(s.key) ? "wait"
             : s.key==="WAIT_DOCTOR" ? "ongoing" : "done";
  return { s, kind, owed:due(c) };
}

/* ---------------- simulated world ---------------- */
function simApproveConsult(c){
  if(!isPending(c.consult)){ toast("", "Nothing to check", "The consultation approval is already in."); return; }
  c.consult.ins = "approved";
  record(c,"i","<b>Approval received</b> for the consultation",`${payerName(c)} · approved in full`,
    { type:"APPROVAL", by:payerName(c), lines:[{ name:c.consult.name, code:c.consult.code, ins:"approved" }] });
  toast("ok","Approval received", `${pt(c).name} · consultation can be billed.`);
  render();
}
const LATER_ORDERS = [
  [{ code:"LAB-208", name:"CRP Quantitative",   price:180, kind:"approved" },
   { code:"RAD-311", name:"Chest CT",           price:900, kind:"pending"  }],
  [{ code:"LAB-415", name:"Blood Culture",      price:260, kind:"approved" }],
  [{ code:"PHY-120", name:"Physiotherapy Session", price:220, kind:"approved" },
   { code:"LAB-660", name:"Vitamin B12",        price:150, kind:"pending"  }]
];
function simOrders(c){
  const insured = !!planOf(c);
  const round = (c.orderRounds || 0) + 1;
  c.orderRounds = round;
  let batch;
  if(round===1){
    batch = [
      { code:"LAB-022", name:"Urea & Electrolytes",  price:140, ins:insured?"approved":"notinsured", ordered:now(), paid:false },
      { code:"RAD-018", name:"Abdominal Ultrasound", price:420, ins:insured?"partial":"notinsured",  ordered:now(), paid:false },
      { code:"LAB-440", name:"Thyroid Panel",        price:260, ins:insured?"pending":"notinsured",  ordered:now(), paid:false }
    ];
  } else {
    const src = LATER_ORDERS[(round-2) % LATER_ORDERS.length];
    batch = src.map(o=>({ code:o.code, name:o.name, price:o.price,
      ins: insured ? o.kind : "notinsured", ordered:now(), paid:false }))
      .filter(o=>!c.orders.some(x=>x.code===o.code));
    if(!batch.length){ toast("", "Nothing new", `${pt(c).name} · the doctor has not added anything else.`); render(); return; }
  }
  c.orders.push(...batch);
  record(c,"i",`<b>Dr ${c.doctor.split(" ")[0]} placed ${batch.length} ${round>1?"more ":""}order${batch.length>1?"s":""}</b>`,
    insured ? `${batch.filter(o=>o.ins!=="pending").length} approved · ${batch.filter(o=>o.ins==="pending").length} awaiting approval`
            : `self-pay · billed straight to the patient`,
    { type:"ORDERS", by:"Dr "+c.doctor, lines:batch.map(o=>({ name:o.name, code:o.code, ins:o.ins, price:o.price })) });
  toast("", round>1?"More orders placed":"Orders placed", `${pt(c).name} · ${batch.length} procedure(s)`);
  render();
}
/* The receptionist checks the payer. The first check comes back empty; the
   next one brings the approval and the flow moves on to billing. */
function checkApproval(c){
  const pend = [...pendingOrders(c), ...cashHeld(c)];
  if(!pend.length){ toast("", "Nothing pending", pt(c).name); return; }
  c.checks = (c.checks || 0) + 1;
  if(c.checks < 2){
    c.lastCheck = now();
    record(c, "w", `<b>Approval checked</b> — no answer yet`, `${payerName(c)} · ${pend.length} order(s) still pending`,
      { type:"CHECK", by:USER, lines:pend.map(o=>({ name:o.name, code:o.code, ins:o.ins, price:o.price })) });
    toast("warn", "Approval still not received", `${payerName(c)} has not answered on ${pend.length} order(s). Try again shortly.`);
    render(); return;
  }
  c.checks = 0; c.lastCheck = null;
  simApproval(c);
}

function simApproval(c){
  const held = cashHeld(c);
  const p = [...pendingOrders(c), ...held];
  if(!p.length){ toast("", "Nothing pending", pt(c).name); return; }
  pendingOrders(c).forEach(o=>o.ins="approved");
  /* a cash-billed order keeps its cash invoice until it is actually replaced */
  held.forEach(o=>{ o.approvalPending = false; o.approvalGranted = "approved"; });
  record(c,"i",`<b>Approval received</b> for ${p.length} order(s)`,
    `${p.map(o=>o.name).join(", ")}${held.length?` · ${held.length} billed as cash — move it onto the policy from the Replace story`:""}`,
    { type:"APPROVAL", by:payerName(c), lines:p.map(o=>({ name:o.name, code:o.code, ins:"approved", price:o.price })) });
  c.prefs.waitAll = false;                       /* everything is approved now, so bill it together */
  toast("ok", `Approval received · ${p.length} order(s)`, `${pt(c).name} · ready to bill and collect`);
  render();
}
function simPaid(c){ if(c.link) payAll(c, "Payment link"); }
function simStale(c){ if(c.link){ c.link.ageMin = 14; render(); } }

/* ---------------- navigation ---------------- */
const visitsOf = (mrn)=>cases.filter(c=>c.mrn===mrn).sort((a,b)=>(b.sortKey||0)-(a.sortKey||0));
function openPatient(mrn){
  if(!state.tabs.includes(mrn)) state.tabs.push(mrn);      /* several patients can be open at once */
  dropInlineRefund();
  state.activeMrn = mrn; state.caseId = null; state.screen = "patient";
  render();
}
function openVisit(id){
  const c = cases.find(x=>x.id===id);
  if(!c) return;
  if(!state.tabs.includes(c.mrn)) state.tabs.push(c.mrn);
  if(state.caseId!==id) dropInlineRefund();
  state.activeMrn = c.mrn; state.caseId = id; state.screen = "visit";
  c.activeStory = null; c.visitPinned = false;       /* a visit always opens on its main story */
  Object.keys(c.storyDone||{}).forEach(k=>settleDone(c, k));
  render();
}
function closeTab(mrn){
  state.tabs = state.tabs.filter(m=>m!==mrn);
  if(state.activeMrn===mrn){
    const next = state.tabs[state.tabs.length-1];
    if(next){ state.activeMrn = next; state.caseId = null; state.screen = "patient"; }
    else { state.activeMrn = null; state.caseId = null; state.screen = "home"; }
  }
  render();
}
/* work started inside a visit's story does not follow you out of the visit */
const dropInlineRefund = ()=>{ if(refundInline()) state.refund = null; if(replaceInline()) state.replace = null; };
function goHome(){ dropInlineRefund(); state.screen = "home"; state.activeMrn = null; state.caseId = null; render(); }

/* ---------------- render ---------------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderTabs());
  app.appendChild(state.screen==="visit" ? renderVisit()
                : state.screen==="patient" ? renderPatient()
                : state.screen==="invoices" ? renderInvoices() : renderHome());
  document.querySelectorAll(".scrim,.drawer,.setbox,.pop").forEach(x=>x.remove());
  if(state.drawer) document.body.appendChild(renderDrawer());
  if(state.adv) document.body.appendChild(renderAdvanceDrawer());
  if(state.eventPop) document.body.appendChild(renderEventPop());
  if(state.invPop) document.body.appendChild(renderInvoicePop());
  if(state.pkgBook) document.body.appendChild(renderPkgBookPop());
  if(state.voidPop) document.body.appendChild(renderVoidPop());
  if(state.replace && !replaceInline()) document.body.appendChild(renderReplacePop());
  if(state.storyMap) document.body.appendChild(renderStoryMap());
  if(state.lwbsPop) document.body.appendChild(renderLwbsPop());
  if(state.ledgerPop) document.body.appendChild(renderLedgerPop());
  if(state.settingsOpen) document.body.appendChild(renderSettings());
  renderChat();
  const bs = document.getElementById("branchSel");
  if(bs){
    bs.innerHTML = BRANCHES.map(b=>`<option ${b===settings.branch?"selected":""}>${b}</option>`).join("");
    bs.onchange = (e)=>{ settings.branch = e.target.value;
      toast("", "Hospital changed", `Now working at ${settings.branch}.`); render(); };
  }
  const g = document.getElementById("gear");
  if(g) g.onclick = ()=>{ state.settingsOpen = !state.settingsOpen; render(); };
  renderSim();
}

/* open patients live as tabs, so several can be worked at once */
function renderTabs(){
  const bar = el(`<div class="tabs"></div>`);
  const home = el(`<button class="tab ${state.screen==="home"?"on":""}">⌂ Home</button>`);
  home.onclick = goHome;
  bar.appendChild(home);
  state.tabs.forEach(mrn=>{
    const p = patients[mrn];
    const acts = visitsOf(mrn).filter(c=>!c.closed && pendingSummary(c).kind==="act").length;
    const t = el(`<div class="tab ${state.activeMrn===mrn && state.screen!=="home" && state.screen!=="invoices" ?"on":""}">
      <span class="nm">${p.name.split(" ")[0]} ${p.name.split(" ")[1]||""}</span>
      ${acts?`<span class="dot">${acts}</span>`:""}
      <span class="x" data-close="${mrn}">✕</span></div>`);
    t.onclick = (e)=>{ if(e.target.dataset.close) return; openPatient(mrn); };
    t.querySelector("[data-close]").onclick = (e)=>{ e.stopPropagation(); closeTab(mrn); };
    bar.appendChild(t);
  });
  const inv = el(`<button class="tab ghost ${state.screen==="invoices"?"on":""}" id="tabInv">Invoices</button>`);
  /* the Invoices screen always opens asking what to load */
  inv.onclick = ()=>{ state.screen="invoices"; state.invLoaded=null; state.invEdit=false; state.invQ=""; state.invF=null; render(); };
  bar.appendChild(inv);          /* pushed to the far end of the row */
  return bar;
}

function renderHome(){
  const wrap = document.createElement("div");
  const q = (state.q||"").trim().toLowerCase();
  /* a doctor can be typed with or without the "Dr" */
  const dq = q.replace(/^dr\.?\s*/, "");
  const byDoctor = (p)=>dq.length>=2 ? visitsOf(p.mrn).filter(c=>(c.doctor||"").toLowerCase().includes(dq)) : [];
  const found = q ? Object.values(patients).filter(p=>
        p.name.toLowerCase().includes(q) || p.mrn.includes(q) ||
        p.mobile.replace(/\s/g,"").includes(q.replace(/\s/g,"")) ||
        byDoctor(p).length) : [];
  const viaDoctor = found.filter(p=>!(p.name.toLowerCase().includes(q) || p.mrn.includes(q)) && byDoctor(p).length);

  /* find the patient; everything else starts from the patient */
  const box = el(`
    <div class="hsearch">
      <div class="grow">
        <div class="lbl">Find a patient <a class="smap" id="storyMap">ⓘ Story map</a></div>
        <div class="box"><input id="q" placeholder="Name, MRN, mobile or doctor" value="${state.q||""}" autofocus><button class="go" id="goQ">🔍</button></div>
      </div>
    </div>`);
  box.querySelector("#q").oninput = (e)=>{ state.q = e.target.value; render(); };
  box.querySelector("#goQ").onclick = ()=>render();
  box.querySelector("#storyMap").onclick = ()=>{ state.storyMap = true; render(); };
  wrap.appendChild(box);

  if(!q){
    wrap.appendChild(el(`
      <div class="blank">
        <div class="big">Search for a patient to begin</div>
        <div class="sm">Nothing is loaded until you search — type a name, MRN, mobile number or doctor above.
          ${state.tabs.length?`You have <b>${state.tabs.length}</b> patient(s) open in the tabs above.`:""}</div>
      </div>`));
    return wrap;
  }

  /* the patients — each one expands to show its own pending work */
  wrap.appendChild(el(`<div class="hhead"><h1>Patients</h1><span>${found.length}${viaDoctor.length?` · ${viaDoctor.length} by doctor`:""}</span></div>`));
  if(!found.length) wrap.appendChild(el(`<div class="blank"><div class="sm">No patient matches “${state.q}”.</div></div>`));

  found.forEach(p=>{
    const vs = visitsOf(p.mrn);
    const pv = pendingVisits(p.mrn);
    const acts = pv.today.filter(x=>x.kind==="act");
    const waits = pv.today.filter(x=>x.kind==="wait");
    const ongoing = pv.today.filter(x=>x.kind==="ongoing");
    const on = state.homeSel === p.mrn;

    const card = el(`<div class="pcard ${on?"open":""}"></div>`);
    const dv = byDoctor(p);
    const row = el(`
      <div class="prow patient click lean">
        <div class="pi"><b>${p.name}</b><span>MRN ${p.mrn} · ${p.age}/${p.gender} · ${p.mobile}</span></div>
        <div class="ps">
          ${dv.length?`<span class="badge blue">Dr ${[...new Set(dv.map(c=>c.doctor))].join(", Dr ")}</span>`:""}
        </div>
        <button class="btn sm link" data-open="${p.mrn}">Profile ›</button>
        <span class="chev">${on?"▾":"▸"}</span>
      </div>`);
    row.onclick = (e)=>{
      if(e.target.dataset.open) return;
      if(state.homeSel === p.mrn){ state.homeSel = null; state.homePanel = null; }
      else { state.homeSel = p.mrn; state.homePanel = null; state.walkin = null; }
      render();
    };
    row.querySelector("[data-open]").onclick = (e)=>{ e.stopPropagation(); openPatient(p.mrn); };
    card.appendChild(row);

    /* once selected: what can be done for this patient, as cards */
    if(on){
      const panel = state.homePanel;
      const opts = el(`<div class="pexp hopts">
        <button class="hopt ${panel==="pending"?"on":""} ${pv.today.length?"":"empty"} ${acts.length?"due":""}" data-hp="pending">
          <span class="hi">⏱</span>
          <span class="ht"><b>Today's pending actions</b>
            <span>${pv.today.length?[acts.length&&`${acts.length} to do`, ongoing.length&&`${ongoing.length} ongoing`, waits.length&&`${waits.length} waiting`].filter(Boolean).join(" · "):"Nothing pending today"}</span></span>
          ${pv.today.length?`<span class="hn">${pv.today.length}</span>`:""}
        </button>
        <button class="hopt ${panel==="walkin"?"on":""}" data-hp="walkin">
          <span class="hi">${STORIES.walkin.icon}</span>
          <span class="ht"><b>${STORIES.walkin.title}</b><span>Book a new visit</span></span>
        </button>
      </div>`);
      opts.querySelectorAll("[data-hp]").forEach(b=>b.onclick = ()=>{
        const hp = b.dataset.hp;
        if(state.homePanel === hp){ state.homePanel = null; render(); return; }
        if(hp==="walkin") startWalkin(p.mrn);
        else { state.homePanel = "pending"; render(); }
      });
      card.appendChild(opts);
      if(panel==="pending"){
        const inner = el(`<div class="pexp tiles"></div>`);
        if(!pv.today.length) inner.appendChild(el(`<div class="pnone">Nothing to do or wait for today.${pv.upcoming.length?` ${pv.upcoming.length} upcoming visit(s) are on the profile.`:""}</div>`));
        [...acts, ...ongoing, ...waits].forEach(x=>inner.appendChild(actionTile(x, { compact:true })));
        card.appendChild(inner);
      }
      if(panel==="walkin"){
        const inner = el(`<div class="pexp walk"></div>`);
        inner.appendChild(renderWalkin());
        card.appendChild(inner);
      }
    }
    wrap.appendChild(card);
  });
  return wrap;
}

/* ---------------- patient profile: the visits, newest first ---------------- */
function renderPatient(){
  const p = patients[state.activeMrn];
  const wrap = document.createElement("div");
  const vs = visitsOf(p.mrn);
  const credit = creditTotal(p.mrn);
  const adv = ADV_CATS.reduce((a,k)=>a+p.wallet.advance[k],0);

  wrap.appendChild(el(`<div class="crumb"><a id="bHome">← Home</a> &nbsp;/&nbsp; ${p.name}</div>`));

  /* the payer in force right now — taken from the latest visit on file */
  const cur = vs.find(x=>!x.closed && !x.future) || vs.find(x=>!x.closed) || vs[0];
  const ap = activePayerOf(p);
  const curPayer = ap.payer;
  const curPlan = curPayer.plan;
  const head = el(`
    <div class="phead two">
      <div class="idrow">
        <div class="nm"><b>${p.name}</b><span>MRN ${p.mrn} · ${p.age}/${p.gender} · ${p.mobile}</span></div>
        <div class="sp"></div>
        <div class="col"><div class="k">Visits on file</div><div class="v">${vs.length}</div></div>
        ${walletChipHtml(p.mrn)}
      </div>
      <div class="ctxrow">
        <span class="ctx">Active payer${ap.from?` · ${ap.from}`:""}</span>
        <div class="sp"></div>
        ${p.payers.length>1?`<span class="ctx">${p.payers.length} payers on file</span>`:""}
        <button class="payer ${curPlan?"":"cashp"} edit" id="profPayerBtn" title="Change the patient's payer">
          <span class="pd"><b>${curPayer.label}</b>
          ${curPlan?`<span>deductible ${Math.round(curPlan.deductiblePct*100)}% · cap ${fmt(Math.min(curPlan.visitCap,curPlan.annualLeft))}${curPlan.discountPct?` · ${Math.round(curPlan.discountPct*100)}% discount`:""}</span>`
                  :`<span>no policy on file</span>`}</span>
          <span class="pc">Change ▾</span>
        </button>
      </div>
    </div>`);
  const wo2 = head.querySelector("#wOpen");
  if(wo2) wo2.onclick = ()=>{ state.walletOpen = !state.walletOpen; render(); };
  head.querySelector("#profPayerBtn").onclick = ()=>startProfilePayer(p.mrn);
  wrap.appendChild(head);
  /* the payer flow, right under the header while it runs */
  if(state.profPayer && state.profPayer.mrn===p.mrn) wrap.appendChild(renderProfilePayer(p));
  else if(state.profPayer) state.profPayer = null;
  if(state.walletOpen) wrap.appendChild(renderWalletSection(p.mrn, vs[0] || { mrn:p.mrn, history:[] }));

  /* every pending action for this patient, including visits booked for later */
  const pv = pendingVisits(p.mrn);
  const pendTotal = pv.today.length + pv.upcoming.length + pv.earlier.length;
  const pendOpen = state.profPendOpen !== false;
  const pendBox = el(`<div class="pendbox fold ${pendOpen?"":"shut"}"><h3 id="pendHead"><span class="tg">${pendOpen?"▾":"▸"}</span> Pending actions
    <span class="r">${pendTotal?`${pendTotal} visit(s)${pendOpen?"":` · ${pv.today.length} today · ${pv.upcoming.length} upcoming`}`:"nothing pending"}</span></h3></div>`);
  pendBox.querySelector("#pendHead").onclick = ()=>{ state.profPendOpen = !pendOpen; render(); };
  /* today first; upcoming and past are a button away */
  if(pendOpen){
    const views = { today:["Today", pv.today], upcoming:["Upcoming", pv.upcoming], past:["Past", pv.earlier] };
    const view = views[state.pendView] ? state.pendView : "today";
    const seg = el(`<div class="pseg">${Object.entries(views).map(([k,[label,list]])=>
      `<button class="ps ${k===view?"on":""}" data-pv="${k}">${label}<span>${list.length}</span></button>`).join("")}</div>`);
    seg.querySelectorAll("[data-pv]").forEach(b=>b.onclick = ()=>{ state.pendView = b.dataset.pv; render(); });
    pendBox.appendChild(seg);
    const list = views[view][1];
    if(!list.length) pendBox.appendChild(el(`<div class="pnone">${
      view==="today" ? "Nothing to do or wait for today."
      : view==="upcoming" ? "No upcoming visit has anything pending."
      : "No earlier visit is still waiting on anything."}</div>`));
    list.forEach(x=>pendBox.appendChild(actionTile(x)));
  }

  const grid = el(`<div class="pgrid full"></div>`);
  const visOpen = state.profVisitsOpen !== false;
  const vf = state.vf || (state.vf = { no:"", from:"", to:"" });
  const shown = vs.filter(c=>{
    const want = vf.no.trim().toLowerCase().replace(/^v/,"");
    if(want && !visitNo(c).toLowerCase().replace(/^v/,"").includes(want)) return false;
    const d = visitDate(c);
    if(vf.from && d < vf.from) return false;
    if(vf.to && d > vf.to) return false;
    return true;
  });
  const filtered = vf.no || vf.from || vf.to;
  const listBox = el(`<div class="vlist fold ${visOpen?"":"shut"}">
    <h3 id="visHead"><span class="tg">${visOpen?"▾":"▸"}</span> Visits
      <span class="r">${filtered?`${shown.length} of ${vs.length}`:`${vs.length} on file`} · newest first</span></h3>
    ${visOpen?`<div class="vfilter">
      <input id="vfNo" placeholder="Visit no. e.g. V100001" value="${vf.no}">
      <label>From <input id="vfFrom" type="date" value="${vf.from}"></label>
      <label>To <input id="vfTo" type="date" value="${vf.to}"></label>
      ${filtered?`<button class="btn sm" id="vfClear">Clear</button>`:""}
      <label class="vtog" title="Group each consultation with its follow-ups and package procedures">
        <input type="checkbox" id="vfGroup" ${state.visGroup?"checked":""}><span class="sw"></span> Pair related visits</label>
    </div>`:""}
  </div>`);
  listBox.querySelector("#visHead").onclick = ()=>{ state.profVisitsOpen = !visOpen; render(); };
  if(visOpen){
    listBox.querySelector("#vfNo").oninput = (e)=>{ vf.no = e.target.value; state.vfFocus = true; render(); };
    listBox.querySelector("#vfFrom").onchange = (e)=>{ vf.from = e.target.value; render(); };
    listBox.querySelector("#vfTo").onchange = (e)=>{ vf.to = e.target.value; render(); };
    listBox.querySelector("#vfGroup").onchange = (e)=>{ state.visGroup = e.target.checked; render(); };
    const cl = listBox.querySelector("#vfClear");
    if(cl) cl.onclick = ()=>{ state.vf = { no:"", from:"", to:"" }; render(); };
    /* typing in the visit number keeps the cursor where it was */
    if(state.vfFocus) setTimeout(()=>{ const i = document.getElementById("vfNo");
      if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } state.vfFocus = false; }, 0);
  }
  /* paired: each group led by its first visit, children beneath in date order; groups by latest activity */
  let ordered = shown.map(c=>({ c, child:null }));
  if(state.visGroup){
    const groups = new Map();
    shown.forEach(c=>{
      const r = rootVisit(c), key = shown.includes(r) ? r.id : c.id;
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    });
    ordered = [...groups.entries()]
      .sort((a,b)=>Math.max(...b[1].map(x=>x.sortKey||0)) - Math.max(...a[1].map(x=>x.sortKey||0)))
      .flatMap(([key, list])=>{
        const head = list.find(x=>x.id===key);
        const kids = list.filter(x=>x!==head).sort((a,b)=>(a.sortKey||0)-(b.sortKey||0));
        return [{ c:head, child:null, size:list.length }, ...kids.map(k=>({ c:k, child:parentVisit(k)||head }))];
      });
  }
  (visOpen ? ordered : []).forEach(({ c, child, size })=>{
    const { s, kind, owed } = pendingSummary(c);
    const row = el(`
      <div class="vrow ${c.closed?"done":kind} ${child?"vchild":""} ${state.visGroup&&!child&&size>1?"vhead":""}">
        <div class="d">
          ${child?`<span class="vrel">↳ ${relationTo(c)} ${visitNo(child)}</span>`:""}
          <b>${c.visitType} · ${c.clinic}</b>${c.interbranch?` <span class="ibtag">⇄ ${c.fromBranch}</span>`:""}
          ${state.visGroup&&!child&&size>1?` <span class="vcount">${size-1} related</span>`:""}
          <span><b class="vno">${visitNo(c)}</b> · ${c.date} ${c.arrived} · Dr ${c.doctor} · ${payerOf(c).label}
            · ${c.invoices.length} invoice(s)</span>
        </div>
        <div class="st">${c.closed?`<span class="badge ok">Closed</span>`
          :c.lwbs?`<span class="badge warn">LWBS</span>`
          :isFuture(c)?`<span class="badge cash">Upcoming</span>`
          :kind==="act"?`<span class="badge due">Action needed</span>`
          :kind==="ongoing"?`<span class="badge blue">Ongoing</span>`
          :kind==="wait"?`<span class="badge warn">Waiting</span>`:`<span class="badge ok">Settled</span>`}
          <div class="q">${c.closed?`Collected ${fmt(collected(c))}`:s.q}</div></div>
        <div class="a ${owed>0?"due":""}">${owed>0?fmt(owed):""}</div>
      </div>`);
    row.onclick = ()=>openVisit(c.id);
    listBox.appendChild(row);
  });
  if(visOpen && !vs.length) listBox.appendChild(el(`<div class="blank"><div class="sm">No visits on file yet.</div></div>`));
  if(visOpen && vs.length && !shown.length) listBox.appendChild(el(`<div class="blank"><div class="sm">No visit matches the filter.</div></div>`));
  const col = el(`<div class="pcol"></div>`);
  col.appendChild(pendBox); col.appendChild(listBox);
  grid.appendChild(col);
  wrap.appendChild(grid);
  wrap.appendChild(renderPackageItems(p.mrn));     /* procedures paid inside a package */
  wrap.appendChild(renderPatientInvoices(p.mrn));   /* statements live behind the wallet links */

  wrap.querySelector("#bHome").onclick = goHome;
  return wrap;
}

function renderStep(c, s){
  const box = el(`
    <div class="step ${s.tone}">
      <span class="tag ${s.tone==="wait"?"warn":s.tone==="done"?"ok":""}">${s.tag}</span>
      ${s.back?`<button class="stepback" id="stBack">‹ Back</button>`:""}
      <h2>${s.q}</h2>
      <div class="sub">${s.sub||""}</div>
      ${s.amt!==undefined&&s.amt!==null?`<div class="amt">${fmt(s.amt)}<small>${s.amtLabel||""}</small></div>`:""}
      ${s.amts?`<div class="amtrow">${s.amts.map(a=>
        `<div class="amt ${a.tone==="soft"?"soft":""}">${fmt(a.v)}<small>${a.label}</small></div>`).join("")}</div>`:""}
      <div class="acts"></div>
    </div>`);
  const sb = box.querySelector("#stBack");
  if(sb) sb.onclick = s.back;
  const acts = box.querySelector(".acts");
  const add = (label, cls, fn)=>{ const b = el(`<button class="btn ${cls}">${label}</button>`); b.onclick = fn||(()=>render()); acts.appendChild(b); };
  if(s.yes) add(s.yes.label, "yes", s.yes.fn);
  if(s.no)  add(s.no.label, "", s.no.fn);
  (s.acts||[]).forEach(a=>add(a.label, a.primary?"blue":a.danger?"danger":a.ghost?"link":"", a.fn));
  box.querySelectorAll(".sub .invlink").forEach(a=>a.onclick = ()=>openInvoice(a.dataset.inv));
  if(s.ext) box.appendChild(orderTable(c, s.ext));
  return box;
}

function orderTable(c, ext){
  const plan = planOf(c);
  const pick = !!ext.selectable;
  let left = dedPool(c).left;
  const rows = ext.lines.map(l=>{
    const on = !pick || c.sel?.[l.code] !== false;
    const calc = calcLine(l, (isPending(l)||!on)?0:left, plan);
    if(!isPending(l) && on) left = +(left-calc.deductible).toFixed(2);
    return { l, calc, on };
  });
  /* an order already on an invoice is history — it is never part of what is being charged now */
  const tot = rows.filter(r=>!isPending(r.l) && !r.l.invoiceId && r.on)
    .reduce((a,r)=>({p:a.p+r.calc.patientWithTax, co:a.co+r.calc.companyWithTax}), {p:0,co:0});
  const box = el(`
    <details class="ext" ${ext.open?"open":""}>
      <summary>${ext.title}</summary>
      <table class="ord">
        <thead><tr>${pick?`<th class="tick"></th>`:""}<th>Procedure</th><th>Approval</th><th class="num">Price</th>
          <th class="num">Patient + VAT</th><th class="num">Payer + VAT</th></tr></thead>
        <tbody>${rows.map(({l,calc,on})=>`<tr class="${isPending(l)?"pend":l.invoiceId?"done":!on?"off":""}">
          ${pick?`<td class="tick">${(isPending(l)||l.invoiceId)?""
            :`<input type="checkbox" class="lnChk" data-code="${l.code}" ${on?"checked":""}>`}</td>`:""}
          <td><b>${l.name}</b><div style="font-size:10px;color:var(--muted)">${l.code}${l.ordered?` · ordered ${l.ordered}`:""}${l.branch?` · <span class="ibtag">⇄ ${l.branch}</span>`:""}${l.fromPackage?` · <span class="pkgtag">from ${l.fromPackage.parent}</span>`:""}</div>
            ${l.package&&l.children?`<div class="kids">${l.children.map(k=>`<span>${k.name}</span>`).join("")}</div>`:""}</td>
          <td>${l.urgentCash
              ? `<span class="badge warn">${l.approvalPending?"Cash · approval outstanding":l.approvalGranted?"Cash · approval received":"Billed as cash"}</span>`
              : `<span class="badge ${l.invoiceId?"cash":l.ins==="approved"?"ok":l.ins==="partial"?"blue":isPending(l)?"warn":"cash"}">${l.invoiceId?"Already billed":insStatuses[l.ins].label}</span>`}</td>
          <td class="num">${fmt(l.price)}</td>
          <td class="num"><b>${l.invoiceId?`<span class="muted">${l.invoiceId}</span>`:isPending(l)?"—":!on?"—":fmt(calc.patientWithTax)}</b></td>
          <td class="num">${(l.invoiceId||isPending(l)||!on)?"—":fmt(calc.companyWithTax)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="${pick?4:3}">Charged now${pick?`
          <span class="sm">${rows.filter(r=>r.on&&!isPending(r.l)&&!r.l.invoiceId).length} of
            ${rows.filter(r=>!isPending(r.l)&&!r.l.invoiceId).length} line(s) ticked</span>`:""}</td>

/* The doctor's free 15-minute slots from now until the clinic closes. A slot is taken if a visit today
   already holds it, or the doctor's schedule has it booked (simulated, the same every time for a doctor). */
const CLINIC_CLOSE = 20*60;
const hhmm = (m)=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function freeSlots(doctor){
  const t = new Date();
  const from = Math.ceil((t.getHours()*60 + t.getMinutes() + 5)/15)*15;
  const held = new Set(cases.filter(c=>c.doctor===doctor && isToday(c) && c.slot).map(c=>c.slot));
  const seed = [...doctor].reduce((a,ch)=>a+ch.charCodeAt(0), 0);
  const out = [];
  for(let m=Math.max(from, 8*60); m<CLINIC_CLOSE; m+=15){
    const s = hhmm(m);
    if(held.has(s) || (seed + m/15) % 3===0) continue;   /* booked */
    out.push(s);
  }
  return out;
}
/* back to the payer choices, keeping the eligibility answer already received */
function backToPayerChoices(d){
  d.payerDecision = null;
  if(d.pctx && d.pctx.results) d.pctx.payerStory = { stage:2, results:d.pctx.results, at:d.pctx.checkedAt };

/* a stand-in for the visit-to-be, so the payer story can run before the visit exists */
/* the payer story on a stand-in visit, for when there is no visit to run it on (walk-in, profile) */
function payerDraft(mrn, fee, currentId, onDecision){
  const draft = { isDraft:true, mrn, payerId:currentId||null, dedUsed:0, invoices:[], orders:[], history:[],
    consult:{ name:"Consultation", code:"CON-0", price:fee, ins:"approved" } };
  draft.onPayer = (c)=>{
    const ps = c.payerStory;
    c.results = ps.results; c.checkedAt = ps.at;
    const decision = { choice:{ ...ps.choice }, form: ps.form ? { ...ps.form } : null };
    c.payerStory = null;
    onDecision(decision);
  };
  draft.payerStory = { stage:1, checking:true, at:now() };
  setTimeout(()=>finishEligibility(draft), 1100);
  return draft;
}
/* put a payer found by NPHIES or entered manually on the patient, so it is there next time */
function keepPayerOnPatient(p, ch){
  if(ch.id!=="CASH" && !p.payers.some(x=>x.id===ch.id))
    p.payers.splice(p.payers.length-1, 0, { id:ch.id, label:ch.label, plan:ch.plan, internal:ch.kind!=="Company" });

function activePayerOf(p){
  const vs = visitsOf(p.mrn);
  const cur = vs.find(x=>!x.closed && !x.future) || vs.find(x=>!x.closed) || vs[0];
  if(p.activePayerId) return { payer: p.payers.find(x=>x.id===p.activePayerId) || CASH_PAYER, from:"set on the profile" };
  return { payer: cur ? payerOf(cur) : (p.payers[0] || CASH_PAYER),
           from: cur ? `from ${cur.closed?"the last":"the open"} visit ${cur.date} ${cur.arrived}` : "" };
}

function startWalkinPayer(d, chosen, fee){

function createWalkinVisit(d, chosen, fee){
  /* the payer comes from the payer stage; called without one, it falls back to a plain payer id */

    if(ch.id!=="CASH" && !chosen.payers.some(x=>x.id===ch.id))
      chosen.payers.splice(chosen.payers.length-1, 0, { id:ch.id, label:ch.label, plan:ch.plan, internal:ch.kind!=="Company" });
    d.payerId = ch.id;
  }
  const insured = d.payerId !== "CASH";
  const internal = !!(pd && pd.choice.plan && pd.choice.plan.internal);
  const c = { id:nextCaseId++, mrn:chosen.mrn, visitType:d.type, clinic:d.clinic, doctor:d.doctor, arrived:now(),
    payerId:d.payerId, dedUsed:0, date:"Today", sortKey:9001, slot:d.slot||null,
    consult:{ name:`${d.clinic.charAt(0)+d.clinic.slice(1).toLowerCase()} ${d.type==="Follow-up"?"Follow-up":"Consultation"}`,
      code:"CON-"+Math.floor(100+Math.random()*899), price:fee,
      ins: d.type==="Procedure only" ? "notcovered" : (insured ? (internal ? "approved" : "pending") : "notinsured"),
      paid: d.type==="Procedure only" },
    orders:[], invoices:[], bill:null, link:null, closed:false, prefs:{},
    policy: pd && pd.form ? { ...pd.form, payer:pd.choice.label } : null,
    history:[{ at:now(), ic:"i", tx:"<b>Visit created</b> at reception", sub:`Walk-in · ${d.type} · ${d.clinic} · Dr ${d.doctor}${d.slot?` · appointment ${d.slot}`:""}`, type:"VISIT", story:"walkin", by:USER }] };
  /* what the payer stage did comes with the visit */
  if(pd){
    (d.pctx && d.pctx.history || []).slice().reverse().forEach(h=>c.history.unshift({ ...h, story:"payer" }));
    c.history.unshift({ at:now(), ic:"i", tx:`<b>Payer set</b> — ${pd.choice.label}`,
      sub: pd.form ? `${pd.form.type} · ${pd.form.type==="Company"?"policy":"reference"} ${pd.form.policyNo}${pd.form.validTo?` · valid to ${pd.form.validTo}`:""}` : "Self-pay",
      type:"PAYER", story:"payer", by:USER });
  }
  if(insured && !internal && d.type!=="Procedure only")
    c.history.unshift({ at:now(), ic:"i", tx:"<b>Approval requested</b> from "+chosen.payers.find(p=>p.id===d.payerId).label.split("·")[0].trim(),
      sub:"Consultation", type:"APPROVAL", story:"walkin", by:USER });
  cases.unshift(c);
  const items = cartItems(d.cart || {});
  if(items.length) addReceptionOrders(c, items, "walkin");
  toast("ok", "Visit created", `${chosen.name} · ${d.clinic}`);
  return c;

      <button class="wt ${ws.tab==="CREDIT"?"on":""}" data-wt="CREDIT">Credit<b class="${credit>0?"due":""}">${fmt(credit)}</b></button>
    </div>
    <div class="wbody"></div></div>`);
  box.querySelector("#wClose").onclick = ()=>{ state.walletOpen = false; render(); };
  box.querySelectorAll("[data-wt]").forEach(b=>b.onclick = ()=>{ if(ws.flow) return toast("warn","Finish this first","Complete or cancel what you started."); ws.tab = b.dataset.wt; ws.stmt = false; render(); });
  const body = box.querySelector(".wbody");
  const back = ()=>{ ws.flow = null; ws.done = null; render(); };

  /* a finished story shows its result until it is closed */
  if(ws.done){
    const id = ws.done.story;
    body.appendChild(el(`<div>${stagesBar(id, { index:STORIES[id].stages.length-1, skipped:[], complete:true })}
      <h2>${ws.done.title}</h2><div class="sub">${ws.done.sub}</div>
      <div class="acts"><button class="btn blue" id="wDone">Done</button></div></div>`));
    body.querySelector("#wDone").onclick = back;
    return box;
  }

  if(ws.tab==="ADV"){
    /* add advance: pot and amount here, the money in the slide-in */
    if(ws.flow==="add"){
      const amt = parseFloat(ws.amount)||0;
      body.appendChild(el(`<div>${stagesBar("advadd", { index: state.adv ? 1 : 0, skipped:[] })}
        <h2>How much advance is ${p.name.split(" ")[0]} paying?</h2>
        <div class="modes">${ADV_CATS.map(k=>`<div class="m ${ws.cat===k?"on":""}" data-pot="${k}">${k}<span class="sm">${fmt(w.advance[k])} now</span></div>`).join("")}</div>
        <div class="fld" style="max-width:260px"><label>Amount</label><input id="waAmt" type="number" value="${ws.amount||""}" placeholder="0.00"></div>
        <div class="acts"><button class="btn yes" id="waGo" ${amt>0?"":"disabled"}>Take payment · ${fmt(amt)}</button>
          <button class="btn link" id="waCancel">Cancel</button></div></div>`));
      body.querySelectorAll("[data-pot]").forEach(x=>x.onclick = ()=>{ ws.cat = x.dataset.pot; render(); });
      const ai = body.querySelector("#waAmt");
      ai.oninput = (e)=>{ ws.amount = e.target.value; const v = parseFloat(ws.amount)||0;
        const g = body.querySelector("#waGo"); g.disabled = !(v>0); g.textContent = `Take payment · ${fmt(v)}`; };
      body.querySelector("#waGo").onclick = ()=>{ const v = parseFloat(ws.amount)||0; if(!(v>0)) return;
        state.adv = { c, cat:ws.cat, amount:String(v), mode:"Cash", fromWallet:true }; render(); };
      body.querySelector("#waCancel").onclick = back;
      return box;
    }
    /* refund advance: pot, amount and reason here, the refund mode in the slide-in */
    if(ws.flow==="refund"){
      const amt = parseFloat(ws.amount)||0, max = w.advance[ws.cat]||0;
      const ok = amt>0 && amt<=max+0.001 && (ws.reason||"").trim().length>2;
      const inDrawer = state.drawer && state.drawer.advRefund;
      body.appendChild(el(`<div>${stagesBar("advrefund", { index: inDrawer ? 2 : (amt>0 && amt<=max ? 1 : 0), skipped:[] })}
        <h2>Refund advance to ${p.name.split(" ")[0]}?</h2>
        <div class="modes">${ADV_CATS.map(k=>`<div class="m ${ws.cat===k?"on":""} ${w.advance[k]>0?"":"off"}" data-pot="${k}">${k}<span class="sm">${fmt(w.advance[k])} available</span></div>`).join("")}</div>
        <div class="fgrid">
          <div class="fld"><label>Amount</label><input id="wrAmt" type="number" value="${ws.amount||""}" placeholder="up to ${fmt(max)}"></div>
          <div class="fld"><label>Reason <span style="color:var(--red)">*</span></label><input id="wrReason" value="${ws.reason||""}" placeholder="e.g. patient travelling, not continuing treatment"></div>
        </div>
        <div class="amt rfamt" id="wrShow">${fmt(Math.min(amt,max))}<small>back to the patient from ${ws.cat} advance</small></div>
        <div class="acts"><button class="btn danger" id="wrGo" ${ok?"":"disabled"}>Yes, refund ${fmt(amt)}</button>
          <a class="btn sm link" id="wrAll">Refund all ${fmt(max)}</a>
          <button class="btn link" id="wrCancel">Cancel</button></div></div>`));
      body.querySelectorAll("[data-pot]").forEach(x=>x.onclick = ()=>{ if(w.advance[x.dataset.pot]<=0) return;
        ws.cat = x.dataset.pot; ws.amount = ""; render(); });
      const upd = ()=>{ const v = parseFloat(ws.amount)||0, ok2 = v>0 && v<=max+0.001 && (ws.reason||"").trim().length>2;
        const g = body.querySelector("#wrGo"); g.disabled = !ok2; g.textContent = `Yes, refund ${fmt(v)}`;
        body.querySelector("#wrShow").firstChild.textContent = fmt(Math.min(v,max));
        if(v>max+0.001) body.querySelector("#wrShow small").textContent = `only ${fmt(max)} available in ${ws.cat} advance`;
        else body.querySelector("#wrShow small").textContent = `back to the patient from ${ws.cat} advance`; };
      body.querySelector("#wrAmt").oninput = (e)=>{ ws.amount = e.target.value; upd(); };
      body.querySelector("#wrReason").oninput = (e)=>{ ws.reason = e.target.value; upd(); };
      body.querySelector("#wrAll").onclick = ()=>{ ws.amount = String(max); render(); };
      body.querySelector("#wrGo").onclick = ()=>{ const v = parseFloat(ws.amount)||0;
        if(!(v>0 && v<=max+0.001 && (ws.reason||"").trim().length>2)) return;
        state.drawer = { c, mode:"Cash", amount:+v.toFixed(2), advRefund:{ cat:ws.cat, reason:ws.reason.trim() } }; render(); };
      body.querySelector("#wrCancel").onclick = back;
      return box;
    }
    /* at a glance */
    body.appendChild(el(`<div>
      <div class="wpots">${ADV_CATS.map(k=>`<div class="wpot ${w.advance[k]>0?"":"nil"}"><span>${k} advance</span><b>${fmt(w.advance[k])}</b></div>`).join("")}</div>
      <div class="acts"><button class="btn blue" id="wAdd">＋ Add advance</button>
        <button class="btn" id="wRefund" ${adv>0?"":"disabled"}>↩ Refund advance</button>
        <button class="btn link" id="wStmt">${ws.stmt?"▾":"▸"} Advance statement</button></div></div>`));
    body.querySelector("#wAdd").onclick = ()=>{ ws.flow = "add"; ws.cat = "Open"; ws.amount = ""; render(); };
    const rf = body.querySelector("#wRefund");
    if(adv>0) rf.onclick = ()=>{ ws.flow = "refund"; ws.cat = ADV_CATS.find(k=>w.advance[k]>0); ws.amount = ""; ws.reason = ""; render(); };
  } else {
    /* settle credit: choose the invoices here, the payment in the slide-in */
    if(ws.flow==="settle"){
      const sel = ws.sel || (ws.sel = Object.fromEntries(crList.map(x=>[x.inv.id,true])));
      const chosen = crList.filter(x=>sel[x.inv.id]);
      const amt = +chosen.reduce((a,x)=>a+creditOf(x.inv),0).toFixed(2);
      const inDrawer = state.drawer && state.drawer.credit && state.drawer.fromWallet;
      body.appendChild(el(`<div>${stagesBar("credit", { index: inDrawer ? 1 : 0, skipped:[] })}
        <h2>Settle ${fmt(amt)} of credit?</h2>
        <div class="sub">${chosen.length} of ${crList.length} invoice(s) · the rest stays on the account</div>
        <div class="crlist">${crList.map(x=>`<label class="crrow ${sel[x.inv.id]?"on":""}">
          <input type="checkbox" class="wcChk" data-id="${x.inv.id}" ${sel[x.inv.id]?"checked":""}>
          <div class="d"><a class="invlink" data-inv="${x.inv.id}"><b>${x.inv.id}</b></a>
            <span>${/\d{1,2} \w{3}/.test(x.inv.at)?x.inv.at:`${x.c.date||""} ${x.inv.at}`} · ${x.c.clinic} · ${x.inv.rows.map(r=>r.name).join(", ")}</span></div>
          <div class="a">${fmt(creditOf(x.inv))}</div><span></span></label>`).join("")}</div>
        <div class="acts"><button class="btn yes" id="wcDesk" ${amt?"":"disabled"}>Take payment at the desk</button>
          <button class="btn" id="wcLink" ${amt?"":"disabled"}>Send payment link</button>
          <button class="btn link" id="wcCancel">Cancel</button></div></div>`));
      body.querySelectorAll(".wcChk").forEach(k=>k.onchange = ()=>{ if(k.checked) sel[k.dataset.id] = true; else delete sel[k.dataset.id]; render(); });
      body.querySelectorAll(".invlink").forEach(a=>a.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); openInvoice(a.dataset.inv); });
      if(amt){
        body.querySelector("#wcDesk").onclick = ()=>{ state.drawer = { c, mode:"Cash", amount:amt, credit:true, fromWallet:true, ids:chosen.map(x=>x.inv.id) }; render(); };
        body.querySelector("#wcLink").onclick = ()=>{
          const target = (c.id && c.history) ? c : (visitsOf(mrn)[0]);
          if(target) record(target, "i", `<b>Credit payment link sent</b> — ${fmt(amt)}`, `To ${p.mobile} · ${chosen.map(x=>x.inv.id).join(", ")}`,
            { type:"CREDIT", amount:amt, mode:"Payment link", invoiceId:chosen[0].inv.id, invoiceIds:chosen.map(x=>x.inv.id) });
          ws.done = { story:"credit", title:`Payment link sent for ${fmt(amt)}`, sub:`To ${p.mobile} · ${chosen.map(x=>x.inv.id).join(", ")}` };
          ws.sel = null; toast("", "Link sent", `${p.name} · ${fmt(amt)} credit`); render(); };
      }
      body.querySelector("#wcCancel").onclick = ()=>{ ws.sel = null; back(); };
      return box;
    }
    body.appendChild(el(`<div>
      ${crList.length?`<div class="crlist">${crList.map(x=>`<div class="crrow click" data-open="${x.inv.id}"><span></span>
        <div class="d"><b>${x.inv.id}</b><span>${/\d{1,2} \w{3}/.test(x.inv.at)?x.inv.at:`${x.c.date||""} ${x.inv.at}`} · ${x.c.clinic} · ${x.inv.rows.map(r=>r.name).join(", ")}</span></div>
        <div class="a">${fmt(creditOf(x.inv))}</div><span></span></div>`).join("")}</div>`
        :`<div class="pnone">Nothing on credit.</div>`}
      <div class="acts"><button class="btn blue" id="wSettle" ${credit>0?"":"disabled"}>Settle credit${credit>0?` · ${fmt(credit)}`:""}</button>
        <button class="btn link" id="wStmt">${ws.stmt?"▾":"▸"} Credit statement</button></div></div>`));
    body.querySelectorAll("[data-open]").forEach(r=>r.onclick = ()=>openInvoice(r.dataset.open));
    const st = body.querySelector("#wSettle");
    if(credit>0) st.onclick = ()=>{ ws.flow = "settle"; ws.sel = null; render(); };
  }
  /* the statement, on demand, for the tab in view */
  body.querySelector("#wStmt").onclick = ()=>{ ws.stmt = !ws.stmt; render(); };
  if(ws.stmt) body.appendChild(renderLedger(mrn, ws.tab, { inPop:true }));
  return box;
}

function renderAdvanceDrawer(){
  const d = state.adv, c = d.c, w = patients[c.mrn].wallet;
  const total = ADV_CATS.reduce((a,k)=>a+w.advance[k],0);
  const frag = document.createDocumentFragment();
  const scrim = el(`<div class="scrim"></div>`);
  const amt = parseFloat(d.amount)||0;
  const dw = el(`
    <div class="drawer">
      <div class="dw-head" style="background:#eef6fd">
        <div><div class="k">Add advance · ${patients[c.mrn].name}</div><div class="v">${fmt(amt)}</div></div>
        <div class="x" id="ax">✕</div>
      </div>
      <div class="dw-body">
        <span class="lbl">Advance type</span>
        <div class="modes">${ADV_CATS.map(k=>`<div class="m ${d.cat===k?"on":""}" data-c="${k}">${k}<span class="sm">${fmt(w.advance[k])} now</span></div>`).join("")}</div>
        <span class="lbl">Received by</span>
        <div class="modes">${DESK_MODES.map(m=>`<div class="m ${d.mode===m?"on":""}" data-m="${m}">${m}</div>`).join("")}</div>

      <div class="dw-foot">
        <button class="cancel" id="aCancel">Cancel</button>
        <button class="go" id="aGo" ${amt>0?"":"disabled"}>Add advance</button>

  dw.querySelectorAll("[data-c]").forEach(x=>x.onclick = ()=>{ d.cat = x.dataset.c; render(); });
  dw.querySelectorAll("[data-m]").forEach(x=>x.onclick = ()=>{ d.mode = x.dataset.m; render(); });
  dw.querySelector("#aAmt").oninput = (e)=>{ d.amount = e.target.value; render(); };
  const close = ()=>{ state.adv=null; render(); };
  scrim.onclick = close; dw.querySelector("#ax").onclick = close; dw.querySelector("#aCancel").onclick = close;
  const go = dw.querySelector("#aGo");
  if(amt>0) go.onclick = ()=>{
    w.advance[d.cat] = +(w.advance[d.cat]+amt).toFixed(2);
    const target = (c.id && cases.find(x=>x.id===c.id)) || visitsOf(c.mrn)[0];
    if(target) record(target, "i", `<b>Advance added</b> — ${fmt(amt)}`, `${d.cat} advance · ${d.mode}`,
      { type:"ADVANCE", amount:amt, mode:d.mode, cat:d.cat });
    logLedger(c.mrn, { type:"ADV_IN", amount:amt, cat:d.cat, mode:d.mode,
      visitId:target?target.id:null, note:`${d.cat} advance received` });
    toast("ok", `Advance added · ${fmt(amt)}`, `${patients[c.mrn].name} · ${d.cat}`);
    if(d.fromWallet && state.wallet){ state.wallet.flow = null;
      state.wallet.done = { story:"advadd", title:`Advance added — ${fmt(amt)}`, sub:`${d.cat} advance · ${d.mode} · ${d.cat} now ${fmt(w.advance[d.cat])}` }; }
    state.adv = null; render();
  };
  frag.appendChild(scrim); frag.appendChild(dw);
  return frag;
}

/* Settling credit: pick which unsettled invoices are being paid, then carry on
   through the usual link / desk choice. */

const escHtml = (t)=>String(t).replace(/[&<>"']/g, ch=>({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
/* a comment left on the visit, for yourself or whoever opens it next */
function addComment(c, text, important){
  record(c, "c", escHtml(text.trim()), "", { type:"COMMENT", important:!!important });
  toast("ok", important ? "Important comment saved" : "Comment saved", `${pt(c).name} · visible to everyone who opens this visit`);
}
function renderHistory(c){
  /* open unless the receptionist folded it away — the choice sticks across visits */
  const open = state.histOpen !== false;
  const last = c.history[0];
  const draft = state.comment && state.comment.cid===c.id ? state.comment : null;
  const notes = c.history.filter(h=>h.type==="COMMENT");
  const pinned = notes.filter(h=>h.important);
  const box = el(`<div class="hist ${open?"open":"shut"}">
    <h3 id="hiHead"><span class="tg">${open?"▾":"▸"}</span> What has happened on this visit
      ${pinned.length?`<span class="pinc">📌 ${pinned.length} important</span>`:""}
      <span class="r">${open?"click any line for the detail"
        :`${c.history.length} event(s)${last?` · last: ${last.tx.replace(/<[^>]+>/g,"")} · ${last.at}`:""}`}</span></h3></div>`);
  box.querySelector("#hiHead").onclick = ()=>{ state.histOpen = !open; render(); };
  if(!open) return box;
  /* the way in to a comment sits where the reading starts */
  if(!draft){
    const bar = el(`<div class="cmbar" id="cmAdd"><span class="ci">💬</span> Leave a comment for yourself or the next person on this visit…</div>`);
    bar.onclick = ()=>{ state.comment = { cid:c.id, text:"", important:false }; render(); };
    box.appendChild(bar);
  }
  /* writing a comment */
  if(draft){
    const cm = el(`<div class="cmbox">
      <textarea id="cmText" rows="2" placeholder="Leave a comment for yourself or the next person on this visit">${escHtml(draft.text)}</textarea>
      <div class="cmrow">
        <label class="chk"><input type="checkbox" id="cmImp" ${draft.important?"checked":""}> Mark as important — pin it to the top</label>
        <div class="sp"></div>
        <button class="btn sm" id="cmCancel">Cancel</button>
        <button class="btn sm blue" id="cmSave" ${draft.text.trim()?"":"disabled"}>Save comment</button>
      </div></div>`);
    const ta = cm.querySelector("#cmText"), sv = cm.querySelector("#cmSave");
    ta.oninput = (e)=>{ draft.text = e.target.value; sv.disabled = !draft.text.trim(); };
    cm.querySelector("#cmImp").onchange = (e)=>{ draft.important = e.target.checked; };
    cm.querySelector("#cmCancel").onclick = ()=>{ state.comment = null; render(); };
    sv.onclick = ()=>{ if(!draft.text.trim()) return; addComment(c, draft.text, draft.important); state.comment = null; render(); };
    box.appendChild(cm);
    setTimeout(()=>{ const t = document.getElementById("cmText"); if(t && document.activeElement!==t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 0);
  }
  /* important comments stay on top, whatever happens after them — any comment can be pinned or unpinned */
  const togglePin = (i)=>{ const h = c.history[i]; h.important = !h.important;
    h.pinnedBy = USER; h.pinnedAt = now();
    toast("", h.important ? "Pinned as important" : "Unpinned", h.tx.replace(/<[^>]+>/g,"").slice(0,60)); render(); };
  if(pinned.length){
    const pb = el(`<div class="pinbox"><div class="ph">📌 Important</div>${c.history.map((h,i)=>h.type==="COMMENT"&&h.important?`
      <div class="pin"><div class="tx">${h.tx}</div>
        <div class="by">${h.by} · ${h.at}<button class="pinbtn" data-pin="${i}">Unpin</button></div></div>`:"").join("")}</div>`);
    pb.querySelectorAll("[data-pin]").forEach(b=>b.onclick = ()=>togglePin(+b.dataset.pin));
    box.appendChild(pb);
  }
  if(!c.history.length) box.appendChild(el(`<div class="empty">Nothing recorded yet.</div>`));
  c.history.forEach((h, i)=>{
    if(h.type==="COMMENT"){
      const row = el(`
        <div class="hev cmt ${h.important?"imp":""}">
          <div class="ic c">💬</div>
          <div class="tx">${h.tx}<span>${h.by}${h.important?" · marked important":""}</span></div>
          <div class="tm"><span class="schip s-comment">${h.important?"Important":"Comment"}</span>${h.at}
            <button class="pinbtn" data-pin="${i}">${h.important?"Unpin":"📌 Pin"}</button></div>
        </div>`);
      row.querySelector("[data-pin]").onclick = ()=>togglePin(i);
      box.appendChild(row);
      return;
    }
    /* any invoice number in the line becomes its own link to the preview */
    const sub = (h.sub||"").replace(/((?:INV|RFD)-\d+)/g, `<a class="invlink" data-inv="$1">$1</a>`);
    const row = el(`
      <div class="hev click">
        <div class="ic ${h.ic||""}">${h.ic==="i"?"i":h.ic==="w"?"!":"✓"}</div>
        <div class="tx">${h.tx}${sub?`<span>${sub}</span>`:""}</div>
        <div class="tm"><span class="schip s-${storyOfEvent(h)}">${STORIES[storyOfEvent(h)].title}</span>${h.at}<span class="more">detail ›</span></div>
      </div>`);
    row.onclick = ()=>{ state.eventPop = { c, i }; render(); };
    row.querySelectorAll(".invlink").forEach(a=>a.onclick = (e)=>{
      e.stopPropagation();                         /* the number opens the invoice, not the event */
      openInvoice(a.dataset.inv);
    });
    box.appendChild(row);
  });
  return box;
}

/* ---------------- an invoice, wherever it lives ---------------- */
function findInvoice(id){
  for(const c of cases){ const inv = c.invoices.find(i=>i.id===id) || (c.refundInvoices||[]).find(i=>i.id===id); if(inv) return { c, inv }; }
  for(const p of Object.values(patients)){ const d = (p.walletDocs||[]).find(x=>x.id===id); if(d) return { c:walletDocVisit(d), inv:d }; }
  return null;
}
/* Every refund raises a refund invoice (credit note) with its own number, pointing at the invoice it refunds.
   It is kept apart from the visit's invoices so collected totals, billing and claims are not disturbed. */
function raiseRefundInvoice(c, inv, rows, amt, company, dedBack, mode, reason, detail){
  const id = "RFD-" + Math.floor(100000 + Math.random()*899999);
  const rinv = { id, kind:"refund", refOf:inv.id, at:now(), scope:inv.scope, patient:+amt.toFixed(2), company:+(company||0).toFixed(2),
    deductible:+(dedBack||0).toFixed(2), via:mode, viaDetail:detail||"", reason, payer:inv.payer || payerOf(c).label, by:USER,
    rows: rows.map(r=>({ name:r.name, code:r.code, calc:r.calc })) };
  (c.refundInvoices = c.refundInvoices || []).push(rinv);
  return rinv;
}
const visitDocs = (c)=>[...c.invoices, ...(c.refundInvoices||[])];
function openInvoice(id){ const hit = findInvoice(id); if(hit) { state.invPop = { id }; render(); } }

/* ---------------- what happened, in detail ---------------- */
const EV_TITLES = { PAYMENT:"Payment", LINK:"Payment link", APPROVAL:"Payer approval", ORDERS:"Doctor's orders",
  PAYER:"Payer changed", ADVANCE:"Advance received", CREDIT:"Credit settled", VISIT:"Visit created",
  REPRINT:"Invoice reprinted", PKGBOOK:"Package procedure booked", PKGPRINT:"Package procedure printed",
  PKGREADY:"Package procedures ready to book", VOID:"Print undone", REPLACE:"Invoice replaced",
  ELIGIBILITY:"Eligibility checked on NPHIES", CLINICAL:"Doctor started the consultation", LWBS:"Left without being seen", ADDORDER:"Orders added at reception",
  LINKCANCEL:"Payment link cancelled",
  REPLACE_START:"Replacement started", REPLACE_CANCEL:"Replacement cancelled",
  CASH_URGENT:"Billed as cash, approval outstanding", CHECK:"Approval checked" };
function renderEventPop(){
  const { c, i } = state.eventPop;
  const h = c.history[i];
  const plain = h.tx.replace(/<[^>]+>/g,"");
  const frag = document.createDocumentFragment();
  const scrim = el(`<div class="scrim"></div>`);
  const rows = [];
  const add = (k,v)=>{ if(v!==undefined && v!==null && v!=="") rows.push(`<div class="r"><span>${k}</span><b>${v}</b></div>`); };
  add("When", `${h.at} today`);
  add("Recorded by", h.by || USER);
  add("Patient", `${pt(c).name} · MRN ${pt(c).mrn}`);
  add("Visit", `${c.visitType} · ${c.clinic} · Dr ${c.doctor}`);
  if(h.amount!==undefined) add(h.type==="ADVANCE"?"Amount received":h.type==="CREDIT"?"Amount settled":"Patient share", fmt(h.amount));
  if(h.company) add(`${payerName(c)} share`, fmt(h.company));
  if(h.deductible) add("Deductible consumed", fmt(h.deductible));
  add("Payment mode", h.mode);
  add("Reference", h.ref);
  add("Advance type", h.cat ? h.cat+" advance" : "");
  add("Scope", h.scope==="consult" ? "Consultation" : h.scope==="orders" ? "Doctor's orders" : "");
  if(h.type==="PAYER"){ add("Was", h.from); add("Now", h.to); }
  if(h.invoiceIds && h.invoiceIds.length>1)
