<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIDA — Guided OPD Billing</title>
<style>
  :root{
    --navy:#0f3a5f; --blue:#1f6fb2; --blue-dark:#155a94; --red:#e2231a;
    --bg:#eef2f6; --card:#fff; --line:#e3e7ec; --text:#1f2733; --muted:#6b7684;
    --green:#1c8a4b; --green-bg:#e9f7ef; --amber:#b6710a; --amber-bg:#fdf3e0;
    --red-bg:#fdecec; --purple:#6b46a8; --purple-bg:#f1ebfa;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-size:13px;}
  button{font-family:inherit;cursor:pointer;}

  header{background:#fff;border-bottom:1px solid var(--line);padding:9px 20px;display:flex;align-items:center;gap:13px;position:sticky;top:0;z-index:30;}
  header .mark{width:25px;height:25px;border-radius:6px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  header .brand b{display:block;font-size:11.5px;color:var(--navy);}
  header .brand span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  header .vida{font-size:18px;font-weight:800;color:var(--red);margin-left:3px;}
  header .sp{flex:1;}
  header .gear{background:none;border:none;font-size:16px;color:#9aa3ad;padding:4px 8px;}
  header .who{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
  header .who .av{width:27px;height:27px;border-radius:50%;background:#dde5ec;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10.5px;}

  main{max-width:960px;margin:0 auto;padding:14px 18px 70px;}

  /* open patients as tabs */
  .tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .tabs .tab{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;font-size:11.5px;font-weight:600;color:#5b6470;cursor:pointer;}
  .tabs .tab:hover{border-color:#bcd4ea;}
  .tabs .tab.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .tabs .tab.ghost{margin-left:auto;color:var(--blue);}
  .tabs .tab.ghost.on{color:#fff;}
  .tabs .tab .dot{background:var(--amber);color:#fff;border-radius:9px;font-size:9px;padding:1px 5px;font-weight:700;}
  .tabs .tab.on .dot{background:#fff;color:var(--navy);}
  .tabs .tab .x{color:#9aa3ad;font-size:10px;}
  .tabs .tab.on .x{color:#cfe0ee;}
  .tabs .tab .x:hover{color:var(--red);}

  .blank{background:#fff;border:1px dashed #cfd8e2;border-radius:10px;padding:30px 20px;text-align:center;}
  .blank .big{font-size:16px;font-weight:700;color:var(--navy);}
  .blank .sm{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55;}

  /* visits on the patient profile */
  .vlist{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .vlist h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:12px 15px 8px;}
  .vlist h3 span{float:right;text-transform:none;letter-spacing:0;color:#9aa3ad;}
  .fold h3{cursor:pointer;user-select:none;}
  .fold h3 .tg{float:none;display:inline-block;width:12px;color:var(--blue);}
  .fold h3 .r{float:right;text-transform:none;letter-spacing:0;font-weight:400;color:#9aa3ad;}
  .pendbox.shut{padding-bottom:13px;} .pendbox.shut h3{margin-bottom:0;}
  .vfilter{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 15px 11px;border-bottom:1px solid var(--line);}
  .vfilter input{height:30px;border:1px solid #ccd4dd;border-radius:6px;padding:0 9px;font-size:12px;}
  .vfilter #vfNo{width:190px;}
  .vfilter label{font-size:11px;color:#5b6470;display:flex;align-items:center;gap:6px;}
  .vrow .vno{color:var(--blue);font-weight:700;}
  .vtog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#3f4a57;cursor:pointer;user-select:none;}
  .vtog input{display:none;}
  .vtog .sw{width:32px;height:18px;border-radius:10px;background:#cfd8e2;position:relative;transition:background .15s;}
  .vtog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;}
  .vtog input:checked + .sw{background:var(--blue);} .vtog input:checked + .sw::after{left:16px;}
  .vrow.vhead{background:#f8fbfe;}
  .pinvbar{display:flex;justify-content:flex-end;padding:0 15px 8px;}
  tr.ivgrp td{background:#eef4fb;border-top:2px solid #d3e0ee;font-size:11.5px;color:var(--navy);padding:7px 12px;}
  tr.ivgrp .vcount{display:inline-block;font-size:10px;font-weight:700;background:#fff;color:var(--blue);border-radius:8px;padding:1px 7px;margin-left:8px;}
  tr.ivgrp .ivgs{float:right;color:#5b6470;}
  tr.ivchild td:first-child{padding-left:26px;}
  .ivrel{display:block;font-size:10px;font-weight:700;color:var(--blue);margin-bottom:1px;}
  .vrow.vchild{padding-left:42px;background:#fbfcfd;position:relative;}
  .vrow.vchild::before{content:"";position:absolute;left:22px;top:0;bottom:0;border-left:2px solid #c9d6e3;}
  .vrow .vrel{display:block;font-size:10.5px;font-weight:700;color:var(--blue);margin-bottom:1px;}
  .vrow .d .vcount{display:inline-block;width:auto;vertical-align:middle;font-size:10px;font-weight:700;background:#e8f1fb;color:var(--blue);border-radius:8px;padding:1px 7px;margin-left:6px;}
  .vrow .d .ibtag{display:inline-block;width:auto;margin-left:6px;vertical-align:middle;}
  .vrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:12px;align-items:center;
    padding:11px 15px;border-top:1px solid #f2f4f7;cursor:pointer;}
  .vrow:hover{background:#f8fbfe;}
  .vrow .d b{font-size:12.5px;color:var(--navy);}
  .vrow .d span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;}
  .vrow .st .q{font-size:11px;color:#5b6470;margin-top:3px;}
  .vrow .a{font-weight:700;color:var(--navy);white-space:nowrap;}
  .vrow .a.due{color:var(--red);}
  .vrow.act{box-shadow:inset 3px 0 0 var(--amber);}
  .vrow.done{box-shadow:inset 3px 0 0 #bfe4cd;}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden;border-left:4px solid var(--blue);}
  .pcard.needs{border-left-color:var(--amber);}
  .pcard.open{box-shadow:0 3px 14px rgba(15,58,95,.07);}
  .pcard>.prow{border:none;border-radius:0;margin:0;background:transparent;box-shadow:none;}
  .pcard>.prow:hover{background:#f8fbfe;}
  .prow .tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
  .prow .exp{font-size:10.5px;color:var(--blue);font-weight:600;margin-top:4px;}
  .prow .amt .btn{margin-top:6px;}
  .pexp{border-top:1px solid var(--line);background:#fafbfc;}
  .pexp .arow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) auto;gap:12px;align-items:center;
    padding:10px 16px 10px 26px;border-bottom:1px solid #eef1f4;cursor:pointer;position:relative;}
  .pexp .arow:last-child{border-bottom:none;}
  .pexp .arow:hover{background:#f2f7fc;}
  .pexp .arow:before{content:"";position:absolute;left:14px;top:50%;width:6px;height:6px;border-radius:50%;background:#c3ccd6;}
  .pexp .arow.act:before{background:var(--amber);}
  .pexp .arow .d b{font-size:12px;color:var(--navy);}
  .pexp .arow .d span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;}
  .pexp .arow .q{font-size:12px;color:#3f4a57;}
  .pexp .arow .q .k{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:2px;}
  .pexp .arow .a{text-align:right;font-weight:700;color:var(--navy);white-space:nowrap;}
  .pexp .arow .a.due{color:var(--red);} .pexp .arow .a.wait{color:var(--amber);}
  .pexp .arow .a small{display:block;font-weight:400;font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);}
  .pnone{padding:12px 16px;font-size:11.5px;color:var(--muted);}
  .prow.patient{border-left:4px solid var(--blue);}
  .prow.lean{display:grid;grid-template-columns:1fr auto auto 18px;gap:14px;align-items:center;padding:12px 16px;}
  .prow.lean .pi b{display:block;font-size:13.5px;color:var(--navy);}
  .prow.lean .pi span{font-size:11px;color:var(--muted);}
  .prow.lean .ps{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .prow.lean .chev{color:var(--blue);font-size:12px;text-align:center;}
  .prow.lean .btn.link{padding:4px 6px;}
  .prow .amt .cr{font-size:10.5px;color:var(--amber);font-weight:700;}
  .hhead.sep{margin-top:20px;padding-top:4px;border-top:1px solid #dde5ec;}

  /* ---------- home ---------- */
  .hsearch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-end;}
  .hsearch .grow{flex:1;}
  .hsearch .lbl{font-size:11px;font-weight:600;color:#3f4a57;margin-bottom:7px;}
  .hsearch .box{display:flex;border:1px solid #ccd4dd;border-radius:8px;overflow:hidden;height:38px;}
  .hsearch input{flex:1;border:none;outline:none;padding:0 12px;font-size:13px;}
  .hsearch .go{width:44px;border:none;background:var(--blue);color:#fff;font-size:14px;}
  .hsearch .addv{height:38px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:12.5px;font-weight:600;padding:0 16px;white-space:nowrap;}
  .hsearch .addv:hover{background:#0c2f4d;}
  .hhead{display:flex;align-items:baseline;gap:10px;margin:0 4px 10px;}
  .hhead h1{font-size:16px;color:var(--navy);}
  .hhead span{font-size:11.5px;color:var(--muted);}
  .prow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:9px;
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr) auto;gap:14px;align-items:center;cursor:pointer;}
  .prow:hover{border-color:#bcd4ea;box-shadow:0 3px 12px rgba(15,58,95,.07);}
  .prow.act{border-left:4px solid var(--amber);}
  .prow.wait{border-left:4px solid #c3ccd6;}
  .prow.done{border-left:4px solid var(--green);}
  .prow b{font-size:13.5px;color:var(--navy);display:block;}
  .prow .meta{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .prow .todo{font-size:12.5px;color:#3f4a57;}
  .prow .todo .k{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:2px;}
  .prow .amt{text-align:right;white-space:nowrap;font-weight:700;color:var(--navy);}
  .prow .amt.due{color:var(--red);} .prow .amt.wait{color:var(--amber);}
  .prow .amt small{display:block;font-weight:400;font-size:9.5px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;}

  /* ---------- profile ---------- */
  .crumb{font-size:11.5px;color:var(--muted);margin-bottom:11px;}
  .crumb a{color:var(--blue);cursor:pointer;} .crumb a:hover{text-decoration:underline;}
  .phead{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .phead .nm b{font-size:15px;color:var(--navy);}
  .phead .nm span{display:block;font-size:11px;color:var(--muted);margin-top:1px;}
  .phead .sp{flex:1;}
  .phead .col{text-align:right;}
  .phead .col .k{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
  .phead .col .v{font-size:13px;font-weight:700;color:var(--navy);}
  .phead .col .v.due{color:var(--red);}
  .phead .other{font-size:10.5px;color:var(--blue);cursor:pointer;}
  .phead.two{display:block;padding:0;}
  .phead.two .idrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:11px 16px;}
  .phead.two .ctxrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
    padding:8px 16px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 10px 10px;}
  .phead.two .ctx{font-size:11px;color:var(--muted);}
  .phead.two .ctx b{color:var(--navy);font-size:11.5px;letter-spacing:.2px;}
  .phead.two .payer{background:#e8f2fb;border:1px solid #cfe2f4;border-radius:8px;padding:5px 7px 5px 11px;text-align:right;
    display:flex;align-items:center;gap:10px;margin:0;font-family:inherit;}
  .phead.two .payer .pd{display:block;}
  .phead.two .payer .pc{font-size:10.5px;font-weight:700;color:var(--blue);border-left:1px solid #cfe2f4;padding:3px 0 3px 9px;white-space:nowrap;}
  .phead.two .payer.edit{cursor:pointer;transition:box-shadow .15s, border-color .15s;}
  .phead.two .payer.edit:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(30,100,170,.18);}
  .phead.two .payer.locked{cursor:default;}
  .phead.two .payer.locked .pc{color:#9aa3ad;}
  .phead.two .payer b{display:block;font-size:11px;color:var(--blue-dark);}
  .phead.two .payer span{font-size:9.5px;color:#5b7fa0;}
  .phead.two .payer.cashp{background:#eef0f3;border-color:#dfe3e8;}
  .phead.two .payer.cashp b{color:#4a5560;} .phead.two .payer.cashp span{color:#7a838d;}
  .phead.two .ibx{background:var(--purple-bg);border:1px solid #ddd0f0;border-radius:8px;padding:4px 10px;
    font-size:10.5px;color:#5b3f8f;}
  .phead.two .ibx b{color:#4a2f7d;}
  .ibtag{background:var(--purple-bg);color:#5b3f8f;border-radius:8px;padding:1px 7px;font-size:9.5px;font-weight:700;white-space:nowrap;}
  .phead .other:hover{text-decoration:underline;}

  .badge{display:inline-block;border-radius:11px;padding:2px 9px;font-size:10px;font-weight:700;}
  .badge.ins{background:#e8f2fb;color:var(--blue-dark);}
  .badge.cash{background:#eef0f3;color:#5b6470;}
  .badge.ok{background:var(--green-bg);color:var(--green);}
  .badge.warn{background:var(--amber-bg);color:var(--amber);}
  .badge.due{background:var(--red-bg);color:var(--red);}
  .badge.blue{background:#e8f2fb;color:var(--blue-dark);}

  .step{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:18px 20px;margin-bottom:14px;}
  .step.wait{border-left-color:var(--amber);background:#fffdf8;}
  .step.done{border-left-color:var(--green);background:#f8fdfa;}
  .step .stepback{float:right;background:none;border:none;color:var(--blue);font-size:11.5px;font-weight:600;
    cursor:pointer;padding:2px 0;}
  .step .stepback:hover{text-decoration:underline;}
  .step .tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--blue);background:#e8f2fb;border-radius:10px;padding:3px 9px;margin-bottom:11px;}
  .step .tag.warn{color:var(--amber);background:var(--amber-bg);}
  .step .tag.ok{color:var(--green);background:var(--green-bg);}
  .step h2{font-size:16.5px;line-height:1.4;color:var(--navy);font-weight:700;}
  .step .sub{font-size:12px;color:#5b6470;line-height:1.55;margin-top:7px;}
  .step .sub b{color:#28323d;}
  .step .amt,.pop .amt.rfamt{font-size:21px;font-weight:800;color:var(--red);margin:9px 0 0;}
  .step .amt small,.pop .amt.rfamt small{font-size:11px;font-weight:600;color:var(--muted);margin-left:7px;}
  .step .amtrow{display:flex;gap:26px;flex-wrap:wrap;margin-top:9px;}
  .step .amtrow .amt{margin:0;font-size:19px;}
  .step .amt.soft{color:var(--amber);}
  .step .acts{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap;align-items:center;}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 18px;font-size:12.5px;font-weight:600;color:#3f4a57;}
  .btn:hover{background:#f6f9fc;}
  .btn.yes{background:var(--green);border-color:var(--green);color:#fff;}
  .btn.yes:hover{background:#166f3c;}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.blue:hover{background:var(--blue-dark);}
  .btn.sm{padding:6px 12px;font-size:11.5px;}
  .btn.link{border:none;background:none;color:var(--blue);padding:6px 0;}
  .btn.link:hover{text-decoration:underline;background:none;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  details.ext{margin-top:13px;border:1px solid var(--line);border-radius:8px;}
  details.ext>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--blue);}
  details.ext>summary::-webkit-details-marker{display:none;}
  details.ext>summary:before{content:"▸ ";}
  details.ext[open]>summary:before{content:"▾ ";}
  table.ord{width:100%;border-collapse:collapse;font-size:11.5px;}
  table.ord th{text-align:left;padding:6px 12px;font-size:9px;text-transform:uppercase;letter-spacing:.35px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafbfc;}
  table.ord td{padding:8px 12px;border-bottom:1px solid #f2f4f7;}
  table.ord .num,table.ord th.num{text-align:right;}
  table.ord tr.pend td{background:#fffdf7;}
  table.ord th.tick,table.ord td.tick{width:26px;padding-left:12px;}
  table.ord td.tick input{width:14px;height:14px;cursor:pointer;}
  table.ord tr.off td{opacity:.45;}
  table.ord tfoot .sm{font-weight:400;color:var(--muted);font-size:10.5px;margin-left:7px;}
  table.ord tr.done td{opacity:.55;}
  table.ord tr.done .muted{color:var(--muted);font-weight:600;font-size:10px;}
  .ext .extnote{font-size:11px;color:var(--muted);padding:9px 12px 11px;border-top:1px solid var(--line);}
  table.ord tfoot td{font-weight:700;color:var(--navy);background:#fafbfc;}

  /* the action card, with the wallet in line beside it */
  .pgrid{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:14px;align-items:start;margin-bottom:14px;}
  .pgrid.full{grid-template-columns:minmax(0,1fr);}
  .pgrid>.step{margin-bottom:0;}
  @media(max-width:900px){ .pgrid{grid-template-columns:minmax(0,1fr);} }
  .phead .wchip{background:#eef6fd;border:1px solid #cfe2f4;border-radius:20px;padding:6px 12px;font-size:11px;
    font-weight:600;color:var(--blue-dark);white-space:nowrap;}
  .phead .wchip:hover{background:#e2effb;}

  /* wallet */
  .wallet{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  /* the label lines up with the tag at the top of the action card */
  .wallet .wh{display:block;padding:16px 15px 12px;background:linear-gradient(180deg,#f8fbfe,#eef4fa);border-bottom:1px solid var(--line);position:relative;}
  .wallet .wcol{position:absolute;top:8px;right:8px;width:22px;height:22px;border:none;background:#fff;border:1px solid var(--line);
    border-radius:6px;color:var(--muted);font-size:13px;line-height:1;}
  .wallet .wcol:hover{color:var(--navy);background:#f6f9fc;}
  .wallet .wh .k{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
  .wallet .wh .v{font-size:17px;font-weight:800;color:var(--navy);}
  .wallet .wh .v small{font-size:10px;font-weight:400;color:var(--muted);margin-left:6px;text-transform:uppercase;letter-spacing:.3px;}
  .wallet .wh .sp{display:none;}
  .wallet .wh .cr{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:8px;border-top:1px dashed #d7e0ea;}
  .wallet .wh .cr .v{color:#8b95a1;font-size:14px;}
  .wallet .wh .cr.on .v{color:var(--amber);}
  .wallet .wb{display:grid;grid-template-columns:1fr;gap:2px;padding:9px 15px;}
  .wallet .wcat .t{padding:4px 0;border-bottom:1px solid #f2f4f7;}
  .wallet .wcat:last-child .t{border-bottom:none;}
  .wallet .wcat .t{display:flex;justify-content:space-between;font-size:11px;color:#5b6470;}
  .wallet .wcat .t b{color:#28323d;}
  .wallet .wcat.nil{opacity:.45;}
  .wallet .wa{display:flex;flex-direction:column;gap:6px;padding:0 15px 12px;}

/* ---------------- pricing ---------------- */
function dedPool(c){
  const plan = planOf(c);
  if(!plan) return { cap:0, used:0, left:0 };
  const cap = Math.min(plan.visitCap, plan.annualLeft);
  return { cap, used:c.dedUsed||0, left:Math.max(0, cap-(c.dedUsed||0)) };
}
function calcLine(line, dLeft, plan){
  if(line.selfPay) plan = null;                       /* reception-added, no doctor: the patient pays the cash price */
  const meta = insStatuses[line.ins || "notinsured"];
  const gross = line.price;
  const discount = +(gross * ((plan && plan.discountPct)||0)).toFixed(2);
  const net = +(gross - discount).toFixed(2);
  let company = 0, deductible = 0, patient = net;
  if(plan && meta.insured){
    const covered = +(net*meta.cov).toFixed(2), uncovered = +(net-covered).toFixed(2);
    deductible = +Math.min(covered*plan.deductiblePct, Math.max(0,dLeft)).toFixed(2);
    patient = +(deductible+uncovered).toFixed(2);
    company = +(covered-deductible).toFixed(2);
  }
  return { gross, discount, net, deductible, patient, company,
    patientWithTax:+(patient*(1+VAT)).toFixed(2), companyWithTax:+(company*(1+VAT)).toFixed(2) };
}
const isPending = (l)=>(l.ins||"")==="pending";
/* every line has two prices: the insured tariff and the cash tariff */
const CASH_FACTOR = 0.88;
const cashPriceOf = (l)=>l.priceCash!=null ? l.priceCash : +(l.priceIns!=null?l.priceIns:l.price)*CASH_FACTOR;
const insPriceOf  = (l)=>l.priceIns!=null ? l.priceIns : l.price;
function priceLines(c, lines, planOverride){
  const plan = planOverride!==undefined ? planOverride : planOf(c);
  let left = plan ? Math.min(plan.visitCap, plan.annualLeft) - (c.dedUsed||0) : 0;
  const t = { patient:0, company:0, deductible:0, rows:[] };
  lines.forEach(l=>{
    const calc = calcLine(l, Math.max(0,left), plan);
    left = +(left - calc.deductible).toFixed(2);
    t.patient += calc.patientWithTax; t.company += calc.companyWithTax; t.deductible += calc.deductible;
    t.rows.push({ line:l, calc });
  });
  ["patient","company","deductible"].forEach(k=>t[k]=+t[k].toFixed(2));
  return t;
}
/* a line is "on the bill" while it is waiting to be paid — no invoice exists yet */
const onBill = (c,l)=>!!(c.bill && c.bill.codes.includes(l.code));
/* invoiced is invoiced — credit means billed but unsettled, never "bill it again" */
const billedAlready = (c,l)=>!!l.invoiceId || onBill(c,l);
/* an order added at reception is billed once orders open — it never skips the doctor on a consultation */
const inPlay = (c,o)=>!o.byReception || ordersOpen(c);
const approvedOrders = (c)=>c.orders.filter(o=>!billedAlready(c,o) && !isPending(o) && inPlay(c,o));
const pendingOrders  = (c)=>c.orders.filter(o=>!billedAlready(c,o) && isPending(o) && inPlay(c,o));
const doctorOrders   = (c)=>c.orders.filter(o=>!o.byReception);
/* the invoice is only created when the money arrives, so "due" is the open charge */
/* on a replacement only the difference changes hands */
const due            = (c)=>c.bill ? (c.bill.due!=null ? c.bill.due : c.bill.patient) : 0;
const refundedOf     = (inv)=>+(inv.refundedTotal||0).toFixed(2);
/* what actually came in: the credit part of an invoice is not money collected */
const collected      = (c)=>+c.invoices.filter(i=>!i.voided && !i.replaced)
  .reduce((a,i)=>a + (i.settled ? i.patient : paidOf(i)) - refundedOf(i), 0).toFixed(2);
/* only money actually taken can be given back, and only what is left of it */
/* a line can be refunded only while it has not been performed and its company share has not been claimed */
function lineRefundable(inv, r){
  if(r.refunded || inv.claimed) return false;
  const h = findInvoice(inv.id);
  return !(h && performedOf(h.c, r.code));
}
const refundable     = (inv)=>!inv.voided && !inv.replaced && paidOf(inv) > 0.01 && refundedOf(inv) < paidOf(inv) - 0.01
                               && inv.rows.some(r=>lineRefundable(inv, r));
function refundState(inv){
  if(inv.replaced) return "Replaced";
  if(inv.voided) return "Void";
  const r = refundedOf(inv);
  if(r<=0) return "";
  return r >= inv.patient - 0.01 ? "Refunded" : "Partially refunded";
}
function refundableInvoices(mrn){
  const out = [];
  cases.filter(x=>x.mrn===mrn).forEach(x=>x.invoices.forEach(inv=>{ if(refundable(inv)) out.push({ c:x, inv }); }));
  return out;
}
/* done = billed elsewhere, not applicable (package visits), already paid, or invoiced */
const consultDone    = (c)=>!!(c.consult.elsewhere || c.consult.notApplicable
                               || c.consult.paid || billedAlready(c, c.consult));
/* what this visit still has sitting on credit */
/* how much of an invoice was left on credit — a payment can be part cash, part credit */
function creditOf(inv){
  if(inv.settled || inv.voided || inv.replaced) return 0;
  if(inv.payments && inv.payments.length)
    return +inv.payments.filter(p=>p.mode==="Credit").reduce((a,p)=>a+p.amount,0).toFixed(2);
  return inv.via==="Credit" ? inv.patient : 0;
}
const onCreditInv    = (inv)=>creditOf(inv) > 0.004;
const paidOf         = (inv)=>+(inv.patient - creditOf(inv)).toFixed(2);
const visitCredit    = (c)=>c.invoices.filter(onCreditInv);
const visitCreditTot = (c)=>+visitCredit(c).reduce((a,i)=>a+creditOf(i),0).toFixed(2);
const advTotal       = (c)=>ADV_CATS.reduce((a,k)=>a+walletOf(c).advance[k],0);
/* credit is not a loose number — it is the invoices left unsettled, across every visit */
function creditInvoices(mrn){
  const out = [];
  cases.filter(x=>x.mrn===mrn).forEach(x=>x.invoices.forEach(inv=>{
    if(onCreditInv(inv)) out.push({ c:x, inv });
  }));
  return out.sort((a,b)=>(a.inv.at||"").localeCompare(b.inv.at||""));
}
const creditTotal = (mrn)=>+creditInvoices(mrn).reduce((a,x)=>a+creditOf(x.inv),0).toFixed(2);

/* ---------------- replacing billing ----------------
   The patient type is decided when the visit starts. An insurance patient stays an
   insurance patient: replacing to cash re-prices only the invoiced orders at cash,
   and the consultation stays on the policy. A cash patient can be moved onto a
   policy, and then the whole visit moves so invoicing carries on with approvals. */
const liveInvoices = (c)=>c.invoices.filter(i=>!i.voided && !i.replaced && !i.packagePrint);
function billedLines(c){
  const ids = liveInvoices(c).map(i=>i.id);
  return [c.consult, ...c.orders].filter(l=>l.invoiceId && ids.includes(l.invoiceId));
}
const billingType = (c)=>planOf(c) ? "insurance" : "cash";
function replaceLinesFor(c, to){
  /* insurance → cash: the invoiced orders still on the policy, never the consultation */
  if(to==="cash") return billedLines(c).filter(l=>l!==c.consult && !l.urgentCash);
  /* cash → insurance: everything invoiced on the visit */
  return billedLines(c);
}
function replacePreview(c, to, payerId, only){
  const lines = only || replaceLinesFor(c, to);
  /* only the invoices these lines sit on are touched, and whole invoices at a time */
  const touched = liveInvoices(c).filter(i=>lines.some(l=>l.invoiceId===i.id));
  const all = [c.consult, ...c.orders];
  const set = [...lines];
  touched.forEach(i=>(i.rows||[]).forEach(r=>{
    const l = all.find(x=>x.code===r.code);
    if(l && !set.includes(l)) set.push(l);
  }));
  const plan = to==="insurance" ? (pt(c).payers.find(p=>p.id===payerId)||{}).plan : null;
  /* the pool already given to the invoices that are staying put */
  const keptDed = +liveInvoices(c).filter(i=>!touched.includes(i)).reduce((a,i)=>a+(i.deductible||0),0).toFixed(2);
  let left = plan ? Math.max(0, Math.min(plan.visitCap, plan.annualLeft) - keptDed) : 0;
  const rows = set.map(l=>{
    const price = to==="cash" ? cashPriceOf(l) : insPriceOf(l);
    const st = to==="cash" ? null : approvalOf(c, l, payerId);
    const ins = to==="cash" ? "notinsured" : (isApproved(st) ? st : "pending");
    const calc = calcLine({ ...l, price, ins }, Math.max(0,left), plan);
    left = +(left - calc.deductible).toFixed(2);
    return { line:l, price, ins, calc, was:+(l.price).toFixed(2), approval:st };
  });
  const newTotal = +rows.reduce((a,r)=>a+r.calc.patientWithTax,0).toFixed(2);
  const oldPaid  = +touched.reduce((a,i)=>a+i.patient-refundedOf(i),0).toFixed(2);
  const missing = to==="insurance" ? rows.filter(r=>!isApproved(r.approval)) : [];
  return { rows, plan, newTotal, oldPaid, keptDed, partial:!!only, missing,
    diff:+(newTotal-oldPaid).toFixed(2), ids:touched.map(i=>i.id) };
}

function undoReplace(c){
  const b = c.bill;
  if(!b || !b.replacing) return;
  const back = b.replacing.to==="cash" ? "insurance" : "cash";
  const lines = [c.consult, ...c.orders].filter(l=>b.codes.includes(l.code));
  lines.forEach(l=>{
    l.price = back==="cash" ? cashPriceOf(l) : insPriceOf(l);
    l.ins = back==="cash" ? "notinsured" : (l.insWas || l.ins);
    const old = c.invoices.find(i=>b.replacing.ids.includes(i.id) && (i.rows||[]).some(r=>r.code===l.code));
    if(old){ l.invoiceId = old.id; l.paid = !!old.via && old.via!=="Credit"; l.via = old.via; }
    else { l.invoiceId = null; l.paid = false; l.via = null; }
  });
  b.replacing.ids.forEach(id=>{ const old=c.invoices.find(i=>i.id===id); if(old){ delete old.replaced; old.paid = old.via!=="Credit"; } });
  c.payerId = back==="cash" ? "CASH" : (pt(c).payers.find(p=>p.plan)||{}).id;
  c.dedUsed = +liveInvoices(c).reduce((a,i)=>a+(i.deductible||0),0).toFixed(2);
  const ids = b.replacing.ids;
  c.bill = null; c.link = null;
  record(c, "i", `<b>Replacement cancelled</b> — ${b.replacing.to==="cash"?"cash":"insurance"} billing abandoned`,
    `${ids.length?`${ids.join(", ")} ${ids.length>1?"are":"is"} live again as ${back==="cash"?"cash":"insurance"} invoice(s)`
      :"nothing had been billed, so nothing changed"} · no money moved`,
    { type:"REPLACE_CANCEL", amount:0, replaced:ids, invoiceId:ids[0]||null,
      lines:lines.map(l=>({ name:l.name, code:l.code, ins:l.ins, price:l.price })) });
  toast("", "Replacement cancelled", "The invoices are back as they were.");
  render();
}
function doReplace(c, to, payerId, only){
  const pv = replacePreview(c, to, payerId, only);
  /* the lines being re-priced: a cash patient's whole visit, or an insured patient's orders */
  pv.rows.forEach(r=>{
    const l = r.line;
    if(l.priceIns==null) l.priceIns = l.price;
    if(l.priceCash==null) l.priceCash = cashPriceOf(l);
    if(to==="cash" && l.ins!=="notinsured") l.insWas = l.ins;
    l.price = r.price; l.ins = r.ins;
    l.paid = false; l.via = null; l.invoiceId = null;
    if(to==="insurance"){ delete l.urgentCash; delete l.approvalPending; delete l.approvalGranted; }
  });
  /* the visit charge decides the patient type: replacing it moves the patient onto the insurer;
     replacing an orders invoice on its own leaves the patient type alone */
  if(!pv.partial || pv.rows.some(r=>r.line===c.consult)) c.payerId = payerId;
  c.dedUsed = pv.keptDed;                         /* what the invoices staying put have used */
  c.link = null;
  /* a single invoice of a cash visit is priced on the insurer it is moving to */
  const insPlan = to==="insurance" ? (pt(c).payers.find(p=>p.id===payerId)||{}).plan : null;
  const t = priceLines(c, pv.rows.map(r=>r.line), to==="cash" ? (pv.partial ? null : undefined) : (insPlan || undefined));
  c.bill = { scope:pv.partial?"orders":"visit", codes:pv.rows.map(r=>r.line.code), at:now(),
    patient:t.patient, company:t.company, deductible:t.deductible,
    due:+(t.patient - pv.oldPaid).toFixed(2), billType:to,
    payerLabel: to==="insurance" ? (pt(c).payers.find(p=>p.id===payerId)||payerOf(c)).label : null,
    replacing:{ ids:pv.ids, credited:pv.oldPaid, to, partial:pv.partial },
    rows:t.rows.map(x=>({ name:x.line.name, code:x.line.code, calc:x.calc,
      package:!!x.line.package,
      children:x.line.children ? x.line.children.map(k=>({ code:k.code, name:k.name })) : null })) };
  state.replace = null;
  /* the switch itself is recorded, before any money moves */
  const dif = c.bill.due;
  record(c, dif>0.004?"w":"", `<b>Replacement started</b> — moving ${pv.partial?`${pv.rows.length} order(s)`:"the visit"} to ${to==="cash"?"cash":"insurance"} billing`,
    `${pv.rows.length} line(s) · ${pv.ids.length?`${pv.ids.join(", ")} to be reversed in full`:"nothing billed yet"} ·
     new total ${fmt(c.bill.patient)}${pv.oldPaid>0?` · ${fmt(pv.oldPaid)} already paid carried over`:""} ·
     ${dif>0.004?`${fmt(dif)} still to collect`:dif<-0.004?`${fmt(-dif)} to give back`:"nothing further to settle"}`,
    { type:"REPLACE_START", amount:c.bill.patient, diff:dif, credited:pv.oldPaid, to,
      replaced:pv.ids, invoiceId:pv.ids[0]||null,
      lines:pv.rows.map(r=>({ name:r.line.name, code:r.line.code, ins:r.ins, price:r.price })) });
  /* nothing to move, or money to give back — settle it in one action */
  if(c.bill.due <= 0.004){
    const back = -c.bill.due;
    if(back > 0.004){
      state.drawer = { c, mode:"Cash", amount:+back.toFixed(2),
        refundDiff:{ reason:`Replaced with ${to} pricing`, to } };
    } else {
      payAll(c, "Replaced");
    }
  }
  render();
}

/* ---------------- approvals, by insurer ----------------
   What a given insurer has said about a line. An order billed as cash while its
   approval was outstanding carries the visit insurer's answer as approvalGranted. */
function approvalOf(c, l, payerId){
  if(l.appr && l.appr[payerId]) return l.appr[payerId];
  if(payerId===c.payerId){
    if(l.approvalGranted) return l.approvalGranted;
    if(l.approvalPending) return "pending";
    if(["approved","partial"].includes(l.ins)) return l.ins;
  }
  return null;
}
const isApproved = (st)=>st==="approved" || st==="partial";
/* asking an insurer about lines on a cash visit — it answers on the second check, as everywhere */
function checkInsurerApproval(c, payerId, lines){
  const ins = pt(c).payers.find(p=>p.id===payerId);
  const missing = lines.filter(l=>!isApproved(approvalOf(c, l, payerId)));
  if(!missing.length){ toast("", "Already approved", ins.label); return; }
  c.insChecks = c.insChecks || {};
  c.insChecks[payerId] = (c.insChecks[payerId]||0) + 1;
  if(c.insChecks[payerId] < 2){
    record(c, "w", `<b>Approval checked</b> — no answer yet from ${ins.label}`, `${missing.length} line(s) still pending`,
      { type:"CHECK", lines:missing.map(l=>({ name:l.name, code:l.code, ins:"pending", price:l.price })) });
    toast("warn", "No answer yet", `${ins.label} has not replied on ${missing.length} line(s).`);
    render(); return;
  }
  c.insChecks[payerId] = 0;
  missing.forEach(l=>{ l.appr = { ...(l.appr||{}), [payerId]:"approved" }; });
  record(c, "i", `<b>Approval received</b> from ${ins.label}`, `${missing.map(l=>l.name).join(", ")} · the invoices can now be replaced onto ${ins.label}`,
    { type:"APPROVAL", by:ins.label, lines:missing.map(l=>({ name:l.name, code:l.code, ins:"approved", price:l.price })) });
  toast("ok", `Approval received · ${ins.label}`, `${missing.length} line(s)`);
  render();
}

/* ---------------- replace, one invoice at a time ----------------
   Offered only beside Refund on the invoice list:
   · insurance patient — a cash-billed order moves onto the policy once it is approved;
   · cash patient — every invoice on the visit moves onto an insurer that has approved it. */
function invoiceReplace(c, inv){
  if(inv.voided || inv.replaced || inv.packagePrint) return null;
  const lines = [c.consult, ...c.orders].filter(l=>l.invoiceId===inv.id);
  if(!lines.length) return null;
  if(planOf(c)){
    if(!lines.every(l=>l.urgentCash)) return null;           /* only orders billed as cash */
    const ok = lines.every(l=>isApproved(approvalOf(c, l, c.payerId)));
    return { ok, reason: ok ? "" : "approval outstanding",
      open:()=>{ c.activeStory = "replace"; if(c.storyDone) delete c.storyDone.replace;
        state.replace = { c, to:"insurance", payerId:c.payerId, lines, partial:true }; render(); } };
  }
  const insurers = pt(c).payers.filter(p=>p.plan);
  if(!insurers.length) return null;
  /* this invoice only — defaulting to the insurer that has approved most of its lines */
  const best = insurers.map(p=>({ p, n:lines.filter(l=>isApproved(approvalOf(c, l, p.id))).length }))
                       .sort((a,b)=>b.n-a.n)[0].p;
  return { ok:true, reason:"",
    open:()=>{ c.activeStory = "replace"; if(c.storyDone) delete c.storyDone.replace;
      state.replace = { c, to:"insurance", payerId:best.id, lines, partial:true }; render(); } };
}

/* ---------------- package procedures ----------------
   A package is billed once. Its child procedures can be performed on other days,
   each booked as its own nil-priced visit. Booking one never removes it from the
   package, nor from the visit the package was invoiced on. */
function packageItems(mrn){
  const out = [];
  cases.filter(x=>x.mrn===mrn).forEach(c=>c.invoices.forEach(inv=>{
    if(!inv.paid) return;
    (inv.rows||[]).forEach(r=>{
      if(!r.package || !r.children) return;
      r.children.forEach(ch=>out.push({ c, inv, parent:r, child:ch,
        doneOn: ch.visitId ? cases.find(v=>v.id===ch.visitId) : null }));
    });
  }));
  return out;
}
const packageItemsLeft = (mrn)=>packageItems(mrn).filter(x=>!x.child.visitId);

/* ---------------- advance & credit ledger ----------------
   Every movement of the patient's money, tied to the invoice it belongs to,
   so the wallet can be reconciled from one list. */
const LEDGER_LABEL = {
  ADV_IN:"Advance received", ADV_USED:"Advance used", REFUND_IN:"Refund to wallet", ADV_REFUND:"Advance refunded",
  CREDIT_RAISED:"Put on credit", CREDIT_SETTLED:"Credit settled"
};
let ledSeq = 9500000;                      /* anything logged now is the newest */
function logLedger(mrn, e){
  const p = patients[mrn];
  p.ledger = p.ledger || [];
  const entry = { at:now(), date:"Today", by:USER, k:++ledSeq, ...e };
  p.ledger.unshift(entry);
  makeWalletDoc(mrn, entry);
}
/* Advance and credit documents. Receiving, using and refunding advance, and raising and settling credit,
   each produce a numbered document: ADV- (advance received / used), RADV- (advance refunded),
   CRED- (credit raised / settled). They sit on the patient and, where there is one, the visit. */
const WALLET_DOC = {
  ADV_IN:       { pre:"ADV",  title:"ADVANCE RECEIPT",   label:"Advance received", sign:+1, acct:"Advance" },
  REFUND_IN:    { pre:"ADV",  title:"ADVANCE RECEIPT",   label:"Refund to advance", sign:+1, acct:"Advance" },
  ADV_USED:     { pre:"ADV",  title:"ADVANCE USED",      label:"Advance used",     sign:-1, acct:"Advance" },
  ADV_REFUND:   { pre:"RADV", title:"ADVANCE REFUND",    label:"Advance refunded", sign:-1, acct:"Advance" },
  CREDIT_RAISED:{ pre:"CRED", title:"CREDIT NOTE",       label:"Credit raised",    sign:+1, acct:"Credit" },
  CREDIT_SETTLED:{ pre:"CRED", title:"CREDIT SETTLEMENT", label:"Credit settled",   sign:-1, acct:"Credit" }
};
let walletDocSeq = 400100;
function makeWalletDoc(mrn, e){
  const t = WALLET_DOC[e.type];
  if(!t || e.docId) return null;
  const id = `${t.pre}-${++walletDocSeq}`;
  const doc = { id, kind:"wallet", wtype:e.type, mrn, at:e.at, date:e.date||"Today", amount:e.amount, cat:e.cat||"",
    mode:e.mode||"", visitId:e.visitId||null, invoiceId:e.invoiceId||null, note:e.note||"", by:e.by||USER };
  const p = patients[mrn];
  (p.walletDocs = p.walletDocs || []).push(doc);
  e.docId = id;
  return doc;
}
const walletDocsOf = (c)=>((patients[c.mrn]||{}).walletDocs||[]).filter(d=>d.visitId===c.id);
/* the visit a wallet document belongs to — or, for one raised on the profile, a stand-in */
function walletDocVisit(d){
  return cases.find(x=>x.id===d.visitId) || visitsOf(d.mrn)[0]
    || { id:null, mrn:d.mrn, clinic:"Wallet", visitType:"—", date:d.date, arrived:d.at, history:[], invoices:[] };
}
const ADV_TYPES = ["ADV_IN","ADV_USED","REFUND_IN","ADV_REFUND"];
const CREDIT_TYPES = ["CREDIT_RAISED","CREDIT_SETTLED"];
/* Advance and credit are two separate accounts, so each is replayed on its own. */
function ledgerRows(mrn, kind){
  const types = kind==="CREDIT" ? CREDIT_TYPES : ADV_TYPES;
  const es = (patients[mrn].ledger || []).filter(e=>types.includes(e.type)).sort((a,b)=>(a.k||0)-(b.k||0));
  let bal = 0;
  const out = es.map(e=>{
    const inflow = e.type==="ADV_IN" || e.type==="REFUND_IN" || e.type==="CREDIT_RAISED";
    bal = +(inflow ? bal + e.amount : bal - e.amount).toFixed(2);
    return { ...e, balance:bal, inflow };
  });
  return out.reverse();
}

/* ---------------- history / toast ---------------- */
const USER = "SAADAN SAAFAN";
function record(c, ic, tx, sub, meta){
  c.history.unshift({ at:now(), ic, tx, sub:sub||"", by:USER, ...(meta||{}) });
}
function toast(kind, title, sub){
  const t = el(`<div class="toast ${kind}" title="Click to dismiss">
    <div class="ti">${kind==="ok"?"✓":kind==="warn"?"!":"i"}</div>
    <div><b>${title}</b><span>${sub||""}</span></div></div>`);
  const box = document.getElementById("toasts");
  box.prepend(t);                                   /* newest on top, nearest the eye */
  while(box.children.length > 3) box.lastElementChild.remove();
  const gone = ()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); };
  t.onclick = gone;
  setTimeout(gone, 4200);
}

/* ---------------- actions ---------------- */
/* Prepare the charge. Nothing is invoiced at this point — the receptionist has
   only decided what is being collected. */
function startBill(c, scope, lines){
  const t = priceLines(c, lines);
  c.bill = { scope, codes:lines.map(l=>l.code), at:now(),
    patient:t.patient, company:t.company, deductible:t.deductible,
    rows:t.rows.map(x=>({ name:x.line.name, code:x.line.code, calc:x.calc,
      /* the invoice owns its own copy of the package contents */
      package:!!x.line.package,
      children:x.line.children ? x.line.children.map(k=>({ code:k.code, name:k.name })) : null })) };
  return c.bill;
}
/* An order that cannot wait for its approval: billed at the cash price on its own
   invoice, and moved onto the policy as soon as the approval lands. */
const cashHeld    = (c)=>c.orders.filter(o=>o.urgentCash && o.approvalPending);
function startCashBill(c, lines){
  lines.forEach(l=>{
    if(l.priceIns==null) l.priceIns = l.price;
    if(l.priceCash==null) l.priceCash = cashPriceOf(l);
    l.insWas = l.ins;                       /* the approval is still outstanding */
    l.approvalPending = true;
    l.urgentCash = true;
    l.ins = "notinsured";
    l.price = l.priceCash;
  });
  const t = priceLines(c, lines, null);     /* no plan: a pure cash price, no payer discount */
  c.bill = { scope:"orders", codes:lines.map(l=>l.code), at:now(), cashOnly:true,
    patient:t.patient, company:0, deductible:0,
    rows:t.rows.map(x=>({ name:x.line.name, code:x.line.code, calc:x.calc,
      package:!!x.line.package,
      children:x.line.children ? x.line.children.map(k=>({ code:k.code, name:k.name })) : null })) };
  record(c, "w", `<b>${lines.length} order(s) billed as cash while the approval is outstanding</b>`,
    `${lines.map(l=>`${l.name} at the cash price ${fmt(l.priceCash)}`).join(", ")} ·
     the consultation stays on ${payerName(c)} · its approval and move onto the policy continue in the Replace story`,
    { type:"CASH_URGENT", amount:t.patient, scope:"orders",
      lines:lines.map(l=>({ name:l.name, code:l.code, ins:"notinsured", price:l.price })) });
  return c.bill;
}
function cancelBill(c){
  const b = c.bill;
  if(!b) return;
  if(b.replacing) return undoReplace(c);
  const lines = [c.consult, ...c.orders].filter(l=>b.codes.includes(l.code));
  if(b.cashOnly) lines.forEach(l=>{                 /* the urgent cash conversion is undone too */
    l.ins = l.insWas || l.ins;
    l.price = insPriceOf(l);
    delete l.urgentCash; delete l.approvalPending; delete l.insWas;
  });
  const hadLink = !!c.link;
  c.bill = null; c.link = null;
  if(hadLink) record(c, "i", `<b>Payment link cancelled</b>`, `Nothing was charged`, { type:"LINKCANCEL" });
  toast("", hadLink?"Link cancelled":"Back", "Nothing was charged.");
  render();
}
function billLabel(c){ return c.bill && c.bill.scope==="consult" ? "Consultation" : "Orders"; }

function sendLink(c, auto){
  if(!c.bill) return;
  c.link = { at:now(), ageMin:0, auto:!!auto };
  record(c, "i", `<b>Payment link ${auto?"sent automatically":"sent"}</b> — ${fmt(c.bill.patient)}`, `To ${pt(c).mobile}`,
    { type:"LINK", amount:c.bill.patient, mode:"Payment link", scope:c.bill.scope, auto:!!auto, by:auto?"System":USER });
  toast("", `Payment link sent · ${fmt(c.bill.patient)}`, `${pt(c).name}`);
}
function resendLink(c){
  c.link = { at:now(), ageMin:0, auto:false };
  record(c, "i", `<b>Payment link resent</b> — ${fmt(due(c))}`, `To ${pt(c).mobile}`,
    { type:"LINK", amount:due(c), mode:"Payment link", resend:true });
  toast("", "Link resent", pt(c).name); render();
}

/* The payment is what creates the invoice — one event, one history line. */
function payAll(c, via, detail, parts){
  const b = c.bill;
  if(!b) return;
  const lines = [c.consult, ...c.orders].filter(l=>b.codes.includes(l.code));
  const creditPart = +(parts||[]).filter(p=>p.mode==="Credit").reduce((a,p)=>a+p.amount,0).toFixed(2);
  const paid = via==="Credit" ? false : creditPart <= 0.004;   /* part credit is not paid in full */
  const paidPart = +(b.patient - (via==="Credit" ? b.patient : creditPart)).toFixed(2);
  const inv = { id:"INV-"+Math.floor(100000+Math.random()*899999), scope:b.scope, at:now(),
    patient:b.patient, company:b.company, deductible:b.deductible,
    paid, via, viaDetail:detail||"", payments:parts?parts.map(p=>({ mode:p.mode, amount:p.amount, ref:[p.ref2,p.ref].filter(Boolean).join(" · ") })):null,
    payer:b.payerLabel || payerOf(c).label, rows:b.rows,
    branch: c.interbranch ? c.fromBranch : null,
    replaces: b.replacing ? b.replacing.ids.slice() : null,
    credited: b.replacing ? b.replacing.credited : 0,
    cashOnly: !!b.cashOnly,
    billType: b.cashOnly ? "cash" : (b.billType || billingType(c)) };
  c.invoices.unshift(inv);
  if(b.replacing){
    b.replacing.ids.forEach(id=>{
      const old = c.invoices.find(i=>i.id===id);
      if(old) old.replaced = { at:now(), by:USER, newId:inv.id, to:billingType(c) };
    });
  }
  lines.forEach(l=>{ l.paid = paid; l.via = via; l.invoiceId = inv.id; });
  c.dedUsed = +((c.dedUsed||0) + b.deductible).toFixed(2);   /* the pool is consumed on payment */
  const w = walletOf(c);
  /* each advance part draws on its own pot — OPEN, DOCTOR and CLINIC are separate purses */
  const advParts = (parts||[]).filter(p=>payMode(p.mode).advance);
  if(advParts.length){
    const drawn = [];
    advParts.forEach(p=>{
      const k = payMode(p.mode).advance;
      const take = Math.min(w.advance[k], p.amount);
      w.advance[k] = +(w.advance[k]-take).toFixed(2);
      drawn.push(`${fmt(take)} ${k.toLowerCase()}`);
    });
    logLedger(c.mrn, { type:"ADV_USED", amount:+advParts.reduce((a,p)=>a+p.amount,0).toFixed(2),
      invoiceId:inv.id, visitId:c.id,
      note:`Applied to ${b.scope==="consult"?"consultation":"orders"} · ${drawn.join(" + ")}` });
  } else if(via==="Advance"){                     /* the old single-mode route, still used by fixtures */
    let rem = b.patient;
    const drawn = [];
    ADV_CATS.forEach(k=>{ const take=Math.min(w.advance[k],rem);
      if(take>0) drawn.push(`${fmt(take)} ${k.toLowerCase()}`);
      w.advance[k]=+(w.advance[k]-take).toFixed(2); rem=+(rem-take).toFixed(2); });
    logLedger(c.mrn, { type:"ADV_USED", amount:b.patient, invoiceId:inv.id, visitId:c.id,
      note:`Applied to ${b.scope==="consult"?"consultation":"orders"} · ${drawn.join(" + ")}` });
  }
  const creditRaised = via==="Credit" ? b.patient : creditPart;
  if(creditRaised > 0.004) logLedger(c.mrn, { type:"CREDIT_RAISED", amount:creditRaised, invoiceId:inv.id, visitId:c.id,
    note:`${b.scope==="consult"?"Consultation":"Orders"} left unsettled${paidPart>0.004?` · ${fmt(paidPart)} paid at the desk`:""}` });
  const label = billLabel(c);
  if(b.replacing){
    const t = b.replacing.to;
    record(c, "", `<b>Invoice replaced</b> — ${b.replacing.ids.join(", ")} → ${inv.id}`,
      `${b.replacing.partial
          ? (t==="cash" ? `Orders now at cash prices · the patient stays on ${payerOf(c).label}` : `Order moved onto ${payerOf(c).label}`)
          : `Now billed as <b>${t==="cash"?"a cash patient":"an insurance patient"}</b> at ${t} prices`} ·
       ${fmt(b.replacing.credited)} already paid carried over ·
       ${b.due>0.004?`${fmt(b.due)} collected by ${via}`:b.due<-0.004?`${fmt(-b.due)} refunded`:"nothing further to settle"}`,
      { type:"REPLACE", invoiceId:inv.id, amount:b.patient, replaced:b.replacing.ids,
        credited:b.replacing.credited, diff:b.due, mode:via, scope:b.scope,
        lines:b.rows.map(r=>({ name:r.name, code:r.code, ins:"notcovered", price:r.calc.gross })) });
    if(b.due >= -0.004) markDone(c, "replace", `Replaced — ${b.replacing.ids.join(", ")} → ${inv.id}`,
      b.due>0.004 ? `${fmt(b.due)} collected by ${via}` : "No money moved");
    toast("ok", `Replaced · ${inv.id}`,
      `${pt(c).name} · ${t} prices · ${b.due>0.004?`${fmt(b.due)} collected`:b.due<-0.004?`${fmt(-b.due)} to refund`:"no money moved"}`);
    c.bill = null; c.link = null;
    render();
    return;
  }
  record(c, creditRaised>0.004?"w":"",
    creditRaised>0.004 && paidPart>0.004
      ? `<b>${label} part paid</b> — ${fmt(paidPart)} paid, ${fmt(creditRaised)} on credit`
      : `<b>${label} ${creditRaised>0.004?"put on credit":"paid"}</b> — ${fmt(b.patient)}`,
    `${via}${detail?" · "+detail:""} · invoice ${inv.id} created${b.company>0?` · ${fmt(b.company)} to ${payerName(c)}`:""}${c.interbranch?` · performed at ${c.fromBranch}`:""}`,
    { type:"PAYMENT", invoiceId:inv.id, amount:b.patient, company:b.company, deductible:b.deductible,
      mode:via, ref:detail||"", scope:b.scope });
  toast("ok", creditRaised>0.004 ? (paidPart>0.004?`${fmt(paidPart)} paid · ${fmt(creditRaised)} on credit`:`On credit · ${fmt(b.patient)}`)
    : `Payment received · ${fmt(b.patient)}`, `${pt(c).name} · ${inv.id}`);
  /* a paid package opens up its procedures for booking */
  const pkgRows = (inv.rows||[]).filter(r=>r.package && r.children && r.children.length);
  if(pkgRows.length && paid){
    const n = pkgRows.reduce((a,r)=>a+r.children.length,0);
    record(c, "i", `<b>${n} package procedure(s) can now be booked</b>`,
      `${pkgRows.map(r=>r.name).join(", ")} · paid on ${inv.id} · book a visit for each whenever the patient can attend`,
      { type:"PKGREADY", invoiceId:inv.id,
        lines:pkgRows.flatMap(r=>r.children.map(k=>({ name:k.name, code:k.code, ins:"notcovered", price:0 }))) });
    toast("", `${n} package procedures ready to book`, `${pt(c).name} · ${pkgRows.map(r=>r.name).join(", ")}`);
  }
  c.bill = null; c.link = null;
  render();
}

/* the payer can be switched while nothing has been billed yet */
function setPayer(c, id){
  const p = pt(c).payers.find(x=>x.id===id) || CASH_PAYER;
  const was = payerOf(c).label;
  c.dedUsed = 0;
  /* a new payer means a new approval position for anything not yet billed —
     but what the old insurer approved is kept, in case the visit goes back to it */
  const oldId = c.payerId;
  const reset = (l)=>{
    if(["approved","partial","rejected","pending"].includes(l.ins) && oldId && oldId!=="CASH")
      l.appr = { ...(l.appr||{}), [oldId]: l.ins };
    if(l.paid) return;
    l.ins = p.plan ? ((l.appr && l.appr[p.id]) || "pending") : "notinsured"; };
  reset(c.consult); c.orders.forEach(reset);
  c.payerId = p.id;
  record(c, "w", `<b>Payer changed</b> — ${was} → ${p.label}`,
    p.plan ? "Approval must be requested again for anything not yet billed" : "Everything not yet billed becomes self-pay",
    { type:"PAYER", from:was, to:p.label });
  toast("warn", "Payer changed", `${pt(c).name} · now ${p.label}`);
}

function openCreditPicker(c){
  c.creditSel = null;                                 /* all ticked again */
  if(c.storyDone) delete c.storyDone.credit;
  c.activeStory = "credit"; c.seen = { ...(c.seen||{}), credit:true };
  render();
}

/* the doctor's orders arrive in two goes, like the approval check */
/* the doctor opening the consultation is what moves the visit on — it answers on the second check */
function checkDoctor(c){
  c.docChecks = (c.docChecks||0) + 1;
  if(c.docChecks < 2){
    c.lastDocCheck = now();
    record(c, "w", `<b>Checked</b> — the doctor has not started yet`, `${pt(c).name} is waiting to be seen`,
      { type:"CHECK", by:USER });
    toast("warn", "Not started yet", `${pt(c).name} is still waiting to be seen.`);
    render(); return;
  }
  c.docChecks = 0; c.lastDocCheck = null;
  c.clinical = { at:now() };
  c.activeStory = "orders";                         /* the visit story is done; orders take over */
  record(c, "i", `<b>Dr ${c.doctor.split(" ")[0].charAt(0)+c.doctor.split(" ")[0].slice(1).toLowerCase()} started the consultation</b>`,
    `${pt(c).name} is with the doctor`, { type:"CLINICAL", by:"Dr "+c.doctor });
  toast("ok", "With the doctor", `${pt(c).name} · the consultation has started`);
  render();
}
function markLwbs(c, reason){
  c.lwbs = { at:now(), by:USER, reason };
  record(c, "w", `<b>Left without being seen</b> — LWBS`, `${reason||"No reason given"} · the doctor had not started`,
    { type:"LWBS", by:USER, reason });
  toast("warn", "Marked LWBS", `${pt(c).name} left without being seen`);
  state.lwbsPop = null;
  render();
}
function undoLwbs(c){
  const was = c.lwbs; delete c.lwbs;
  record(c, "i", `<b>LWBS cleared</b> — the patient came back`, `Marked at ${was.at}, cleared at ${now()}`,
    { type:"LWBS", by:USER });
  render();
}
function renderLwbsPop(){
  const d = state.lwbsPop, c = d.c;
  const reasons = ["Waited too long","Felt better","Went to the emergency department","Personal reasons"];
  const frag = document.createDocumentFragment();
  const scrim = el(`<div class="scrim"></div>`);
  const pop = el(`
    <div class="pop">
      <span class="x" id="lwX">✕</span>
      <h3>Mark ${pt(c).name.split(" ")[0]} as left without being seen?</h3>
      <div class="psub">${pt(c).name} · ${c.visitType} · ${c.clinic} — the doctor had not started the consultation.</div>
      <div class="fld"><label>Reason</label>
        <div class="modes">${reasons.map(r=>`<div class="m ${d.reason===r?"on":""}" data-r="${r}">${r}</div>`).join("")}</div></div>
      ${liveInvoices(c).some(i=>refundable(i))?`<div class="hint">The consultation stays paid. If the money goes back, use the Refund story.</div>`:""}
      <div class="foot">
        <button class="btn" id="lwCancel">Keep waiting</button>
        <button class="btn danger" id="lwGo">Mark as LWBS</button>
      </div>
    </div>`);
  pop.querySelectorAll("[data-r]").forEach(m=>m.onclick = ()=>{ d.reason = m.dataset.r; render(); });
  const close = ()=>{ state.lwbsPop = null; render(); };
  scrim.onclick = close; pop.querySelector("#lwX").onclick = close; pop.querySelector("#lwCancel").onclick = close;
  pop.querySelector("#lwGo").onclick = ()=>markLwbs(c, d.reason);
  frag.appendChild(scrim); frag.appendChild(pop);
  return frag;
}
function checkOrders(c){
  const again = c.orders.length > 0;
  c.orderChecks = (c.orderChecks || 0) + 1;
  if(c.orderChecks < 2){
    c.lastOrderCheck = now();
    toast("warn", again?"No new orders yet":"No orders yet",
      again ? `Nothing further from Dr ${c.doctor} for ${pt(c).name}. Check again in a moment.`
            : `${pt(c).name} is still with Dr ${c.doctor}. They will appear here as soon as they are placed.`);
    render(); return;
  }
  c.orderChecks = 0; c.lastOrderCheck = null;
  simOrders(c);
}

/* The receptionist can bill a subset: every candidate line starts ticked, and unticking
   one takes it out of this invoice (it stays on the visit, to be billed later). */
function selectedLines(c, lines){
  c.sel = c.sel || {};
  return lines.filter(l=>c.sel[l.code] !== false);
}
function toggleLine(c, code, lines){
  c.sel = c.sel || {};
  const nowOn = c.sel[code] === false;
  if(!nowOn && selectedLines(c, lines).length <= 1){
    toast("warn", "At least one line is needed", "Untick another line first, or bill this one.");
    return;
  }
  c.sel[code] = nowOn;
  /* a charge already prepared is re-priced on the spot */
  if(c.bill && !c.bill.replacing){
    const keep = selectedLines(c, lines).filter(l=>c.bill.codes.includes(l.code) || lines.includes(l));
    startBill(c, c.bill.scope, keep);
    c.link = null;
  }
  render();
}

/* ================= STORIES =================
   A visit is a set of stories. Each story has a FIXED list of stages — identical in
   every scenario — and records a known set of events, so the architecture can be
   designed once per story. Stories appear only when they are needed; only one is
   worked on at a time, and the receptionist can switch between them freely. */
const STORIES = {
  visit:{ title:"Visit invoicing", icon:"🧾", scope:"visit",
    appears:"Always — the first story of every visit (not on a visit received from another branch)",
    stages:["Consultation approval","Bill consultation","Collect consultation","See the doctor","With the doctor"],
    events:["VISIT","APPROVAL","CHECK","LINK","PAYMENT","PAYER","CLINICAL","LWBS","LINKCANCEL"] },
  orders:{ title:"Orders invoicing", icon:"🧪", scope:"visit",
    appears:"Always — locked until the visit is invoiced and the doctor has started seeing the patient",
    stages:["Doctor's orders","Orders approval","Bill orders","Collect orders","Orders complete"],
    events:["ORDERS","APPROVAL","CHECK","HOLD","CASH_URGENT","LINK","PAYMENT","PKGREADY","LINKCANCEL"] },
  pkgvisit:{ title:"Package procedure", icon:"📦", scope:"visit",
    appears:"Replaces Invoicing on a visit booked for a package procedure",
    stages:["Print invoice","Recorded"],
    events:["PKGBOOK","PKGPRINT","VOID"] },
  refund:{ title:"Invoices / Refund", icon:"🧾", scope:"visit",
    appears:"As soon as the visit has an invoice — every invoice is listed; refund only where lines are not yet performed",
    stages:["Invoices","Lines & reason","Refund mode","Refunded"],
    events:["REFUND"],
    rule:"Only lines not yet performed, and whose company share has not been claimed, may be refunded. Performed lines are shown, disabled." },
  replace:{ title:"Replace", icon:"⇄", scope:"visit",
    appears:"Insured visit: an order billed as cash. Cash visit: invoices exist and an insurer is on file",
    stages:["Choose invoice","Insurer & approvals","Settle difference","Replaced"],
    events:["REPLACE_START","APPROVAL","CHECK","REPLACE","REPLACE_CANCEL","REFUND"] },
  package:{ title:"Package booking", icon:"📦", scope:"visit",
    appears:"Once a package with procedures still to be booked has been paid",
    stages:["Choose procedures","Clinic & doctor","Visit booked"],
    events:["PKGBOOK"] },
  credit:{ title:"Credit settlement", icon:"💳", scope:"patient",
    appears:"When the patient has invoices left on credit, on any visit",
    stages:["Choose invoices","Payment","Settled"],
    events:["CREDIT"] },
  payer:{ title:"Payer", icon:"🛡", scope:"visit",
    appears:"When the payer is opened from the visit header, before anything is invoiced",
    stages:["Eligibility check","Choose payer","Policy details","Payer set"],
    events:["ELIGIBILITY","PAYER"] },
  addorders:{ title:"Add orders", icon:"➕", scope:"visit",
    appears:"Always on a visit — reception adds orders or packages that need no doctor",
    stages:["Choose orders","Review","Added"],
    events:["ADDORDER"] },
  advadd:{ title:"Add advance", icon:"👛", scope:"patient",
    appears:"From the wallet, whenever the patient pays money in advance",
    stages:["Pot & amount","Payment","Added"], events:["ADV_IN"] },
  advrefund:{ title:"Refund advance", icon:"↩", scope:"patient",
    appears:"From the wallet, when the patient asks for unused advance back",
    stages:["Pot & amount","Reason","Refund mode","Refunded"], events:["ADV_REFUND"] },
  walkin:{ title:"Walk-in visit", icon:"＋", scope:"home",
    appears:"Home page — after choosing a patient from the search",
    stages:["Patient","Visit details","Orders (optional)","Payer","Review","Visit created"],
    events:["VISIT","APPROVAL"] }
};
const EVENT_STORY = {};
Object.entries(STORIES).forEach(([id,st])=>st.events.forEach(e=>{ if(!EVENT_STORY[e]) EVENT_STORY[e]=id; }));
/* events both invoicing stories share are told apart by what they were about */
const ORDER_TYPES = ["ORDERS","HOLD","CASH_URGENT","PKGREADY"];
function storyOfEvent(h){
  if(h.story) return h.story;
  if(h.type==="ADDORDER") return "addorders";
  if(h.type==="ADVANCE") return "advadd";
  if(h.type==="ADVREFUND") return "advrefund";
  if(h.type==="ELIGIBILITY" || h.type==="PAYER") return "payer";
  if(ORDER_TYPES.includes(h.type)) return "orders";
  if(["PAYMENT","LINK","LINKCANCEL"].includes(h.type)) return h.scope==="orders" ? "orders" : "visit";
  if(["APPROVAL","CHECK"].includes(h.type)) return /order/i.test((h.tx||"")+(h.sub||"")) ? "orders" : "visit";
  return EVENT_STORY[h.type] || "visit";
}

/* the visit story owns everything up to the doctor starting; the rest is the orders story */
const VISIT_KEYS = ["CONSULT_WAIT","CONSULT_BILL","SEE_DOCTOR","LWBS"];
function isVisitStep(c, st){
  st = st || nextStep(c);
  if(VISIT_KEYS.includes(st.key)) return true;
  return ["COLLECT","COLLECT_WAIT","COLLECT_ZERO"].includes(st.key) && !!c.bill && c.bill.scope==="consult";
}
/* orders open once the visit is invoiced and the doctor has started (or has already ordered) */
const ordersOpen = (c)=>!c.lwbs && consultDone(c) && (!!c.clinical || doctorOrders(c).length>0 || !!c.interbranch || procOnly(c));
const visitDone  = (c)=>!!c.interbranch || procOnly(c) || (consultDone(c) && !isVisitStep(c));
function mainStory(c){
  if(c.fromPackage) return "pkgvisit";
  return (visitDone(c) && ordersOpen(c)) ? "orders" : "visit";
}
/* the stories this visit needs right now, in a fixed order */
function visitStories(c){
  const done = c.storyDone || {};
  const out = [];
  if(c.fromPackage) out.push("pkgvisit");
  else { if(!c.interbranch && !procOnly(c)) out.push("visit"); out.push("orders"); }
  if(c.invoices.length || (c.refundInvoices||[]).length || walletDocsOf(c).length || done.refund) out.push("refund");
  const replaceable = liveInvoices(c).filter(i=>invoiceReplace(c, i));
  if(replaceable.length || (c.bill && c.bill.replacing) || done.replace) out.push("replace");
  if(packageItemsLeft(c.mrn).length || done.package) out.push("package");
  if(creditInvoices(c.mrn).length || done.credit) out.push("credit");
  if(!c.fromPackage && !c.interbranch && !c.lwbs && !c.closed) out.push("addorders");
  if((c.payerStory && payerChangeable(c)) || done.payer) out.push("payer");
  return out;
}
/* what a story tab says about itself */
function storyBadge(c, id){
  if(id==="refund"){ const n = c.invoices.length, r = c.invoices.filter(i=>refundable(i)).length;
    return `${n} invoice(s)${r?` · ${r} refundable`:""}`; }
  if(id==="replace"){ const r = liveInvoices(c).filter(i=>invoiceReplace(c,i));
    const ready = r.filter(i=>invoiceReplace(c,i).ok).length;
    return ready ? `${ready} ready` : `${r.length} waiting`; }
  if(id==="package") return `${packageItemsLeft(c.mrn).length} to book`;
  if(id==="credit")  return fmt(creditTotal(c.mrn));
  if(id==="payer") return c.payerStory ? STORIES.payer.stages[storyStage(c,"payer").index] : payerOf(c).label;
  if(id==="addorders") return c.orders.some(o=>o.byReception) ? `${c.orders.filter(o=>o.byReception).length} added` : "Packages & tests";
  if(c.lwbs && id==="visit") return "Left without being seen";
  if(id==="visit" && visitDone(c)) return "Invoiced · with the doctor";
  if(id==="orders" && !ordersOpen(c)) return "Opens when the doctor sees the patient";
  return (STORIES[id].stages[storyStage(c,id).index]||"");
}
/* a story that money is already moving through holds the others back */
function storyLock(c, id){
  if(c.bill && c.bill.replacing && id!=="replace") return "Finish or cancel the replacement first";
  if(c.bill && !c.bill.replacing && id==="replace") return "Finish the payment in hand first";
  if(id==="orders" && !ordersOpen(c))
    return c.lwbs ? "The patient left without being seen" : "Locked until the visit is invoiced and the doctor sees the patient";
  return "";
}
function activeStory(c){
  const list = visitStories(c);
  if(c.bill && c.bill.replacing) return "replace";
  if(!c.activeStory || !list.includes(c.activeStory) || storyLock(c, c.activeStory)) c.activeStory = mainStory(c);
  /* once the visit story is finished the orders story takes over — unless the receptionist chose to look back */
  if(c.activeStory==="visit" && mainStory(c)==="orders" && !c.visitPinned) c.activeStory = "orders";
  return c.activeStory;
}
/* a finished story shows its result until you leave it; if there is more to do it then starts afresh */
function storyHasWork(c, id){
  if(id==="refund")  return liveInvoices(c).some(i=>refundable(i));
  if(id==="replace") return liveInvoices(c).some(i=>invoiceReplace(c,i));
  if(id==="package") return packageItemsLeft(c.mrn).length>0;
  if(id==="credit")  return creditInvoices(c.mrn).length>0;
  if(id==="addorders") return true;                    /* more can always be added */
  return false;
}
function settleDone(c, id){
  if(c.storyDone && c.storyDone[id] && storyHasWork(c, id)) delete c.storyDone[id];
}
function switchStory(c, id){
  const why = storyLock(c, id);
  if(why){ toast("warn", "Not just now", why); return; }
  if(c.activeStory && c.activeStory!==id){ settleDone(c, c.activeStory); settleDone(c, id); }
  c.activeStory = id;
  c.visitPinned = id==="visit";
  c.seen = { ...(c.seen||{}), [id]:true };
  render();
}
/* where a story is, as an index into its fixed stages */
function storyStage(c, id){
  const done = (c.storyDone||{})[id];
  const last = STORIES[id].stages.length-1;
  if(id==="visit"){
    const st = nextStep(c);
    const skipped = [];
    if(!planOf(c)) skipped.push(0);                       /* self-pay: nothing to approve */
    if(c.consult.price===0) skipped.push(2);              /* no charge: nothing to collect */
    if(!isVisitStep(c, st)) return { index:last, skipped, complete:true };
    const map = { CONSULT_WAIT:0, CONSULT_BILL:1, SEE_DOCTOR:3, LWBS:3 };
    const index = map[st.key]!==undefined ? map[st.key] : 2;
    const sk = skipped.filter(i=>i<index);
    if(st.key==="LWBS") sk.push(4);                       /* never reached the doctor */
    return { index, skipped:sk };
  }
  if(id==="orders"){
    const st = nextStep(c);
    if(!ordersOpen(c) || isVisitStep(c, st)) return { index:0, skipped:[], locked:true };
    const map = { WAIT_DOCTOR:0, NO_ORDERS:0, ORDERS_WAIT:1, ORDERS_MIXED:2, ORDERS_BILL:2, CLOSE:4, CLOSED:4 };
    let index = map[st.key];
    if(index===undefined) index = ["COLLECT","COLLECT_WAIT","COLLECT_ZERO"].includes(st.key) ? 3 : 0;
    const skipped = (!planOf(c) && index>1) ? [1] : [];   /* self-pay orders need no approval */
    return { index, skipped };
  }
  if(id==="pkgvisit") return { index: nextStep(c).key==="PKG_DONE" ? 1 : 0, skipped:[] };
  if(id==="refund"){
    if(state.drawer && state.drawer.c===c && state.drawer.refund) return { index:2, skipped:[] };
    if(state.refund && c.invoices.some(i=>i.id===state.refund.id)) return { index:1, skipped:[] };
    return { index: done ? last : 0, skipped:[] };
  }
  if(id==="replace"){
    if(state.replace && state.replace.c===c) return { index:1, skipped:[] };
    if(c.bill && c.bill.replacing) return { index:2, skipped:[] };
    if(state.drawer && state.drawer.c===c && state.drawer.refundDiff) return { index:2, skipped:[] };
    return { index: done ? last : 0, skipped:[] };
  }
  if(id==="package"){
    const ps = c.pkgStory;
    return { index: done ? last : (ps && ps.stage===2 ? 1 : 0), skipped:[] };
  }
  if(id==="credit"){
    if(state.drawer && state.drawer.c===c && state.drawer.credit) return { index:1, skipped:[] };
    return { index: done ? last : 0, skipped:[] };
  }
  if(id==="addorders") return { index: done ? last : ((c.addStory&&c.addStory.stage===2) ? 1 : 0), skipped:[] };
  if(id==="payer"){
    if(done && !c.payerStory) return { index:last, skipped: done.cash ? [2] : [] };
    const ps = c.payerStory || { stage:1 };
    return { index: ps.stage-1, skipped: (ps.choice && ps.choice.kind==="Cash" && ps.stage>3) ? [2] : [] };
  }
  return { index:0, skipped:[] };
}
function stagesBar(id, pos){
  return `<div class="stages ${pos.locked?"locked":""}" data-story="${id}">${STORIES[id].stages.map((name,i)=>{
    const cls = pos.skipped.includes(i) ? "skip" : (pos.complete || i<pos.index) ? "done" : (i===pos.index && !pos.locked) ? "now" : "next";
    return `<div class="sg ${cls}"><span class="n">${cls==="done"?"✓":cls==="skip"?"–":i+1}</span><span class="t">${name}</span></div>`;
  }).join("")}</div>`;
}
function withStages(box, c, id){
  box.insertBefore(el(stagesBar(id, storyStage(c, id))), box.firstChild);
  return box;
}
function markDone(c, id, title, sub){
  c.storyDone = { ...(c.storyDone||{}), [id]:{ title, sub, at:now() } };
}

function renderStoryStrip(c){
  const list = visitStories(c), act = activeStory(c);
  const main = mainStory(c);
  const bar = el(`<div class="stories">
    ${list.map(id=>{
      const st = STORIES[id], lock = storyLock(c, id), done = (c.storyDone||{})[id];
      /* only a story the system has just opened is flagged — never the visit's own, never a locked one */
      const fresh = (!["visit","pkgvisit","addorders"].includes(id) && !lock && id!==main && !(c.seen||{})[id] && id!==act)
        || (id==="replace" && id!==act && liveInvoices(c).some(i=>{ const r = invoiceReplace(c,i); return r && r.ok && planOf(c); }));
      return `<button class="story ${id===act?"on":""} ${lock?"locked":""} ${done?"done":""}" data-story="${id}" title="${lock||st.appears}">
        <span class="si">${st.icon}</span>
        <span class="st"><b>${st.title}${done&&id!==act?" ✓":""}</b><span>${lock?"🔒 "+lock:done?done.title:storyBadge(c,id)}</span></span>
        ${fresh?`<span class="dot" title="New"></span>`:""}
      </button>`; }).join("")}
    <a class="smap" id="storyMap" title="Every story, its stages and the events it records">ⓘ Story map</a>
  </div>`);

function renderStoryCard(c){
  const id = activeStory(c);
  const done = (c.storyDone||{})[id];
  if(id==="pkgvisit") return withStages(renderStep(c, nextStep(c)), c, id);
  if(id==="visit"){
    const st = nextStep(c);
    return withStages(isVisitStep(c, st) ? renderStep(c, st) : renderVisitDoneCard(c), c, id);
  }
  if(id==="orders") return withStages(renderStep(c, nextStep(c)), c, id);
  if(id==="replace" && c.bill && c.bill.replacing) return withStages(renderStep(c, nextStep(c)), c, id);
  if(done && !(id==="refund" && (refundInline() || (state.drawer && state.drawer.c===c && state.drawer.refund)))
           && !(id==="replace" && replaceInline()))
    return withStages(renderDoneCard(c, id, done), c, id);
  if(id==="refund")  return withStages(refundInline() ? renderRefundWork(c) : renderRefundStory(c), c, id);
  if(id==="replace") return withStages(replaceInline() ? renderReplaceWork(c) : renderReplaceStory(c), c, id);
  if(id==="package") return withStages(renderPackageStory(c), c, id);
  if(id==="credit")  return withStages(renderCreditStory(c), c, id);
  if(id==="addorders") return withStages(renderAddOrdersStory(c), c, id);
  if(id==="payer") return withStages(renderPayerStory(c), c, id);
  return withStages(renderStep(c, nextStep(c)), c, mainStory(c));
}

const nphiesPlan = (c, r)=>((pt(c).payers.find(p=>p.id===r.id)||{}).plan) || r.plan;
/* a table of benefits, drawn from the plan */
function tobHtml(plan, label){
  if(!plan) return "";
  const d = Math.round(plan.deductiblePct*100), cap = fmt(Math.min(plan.visitCap||0, plan.annualLeft||0));
  const gold = /GOLD|CLASS A/i.test(label||plan.name);
  const rows = plan.internal
    ? [["Consultation", d?`${100-d}% covered`:"Covered in full", d?`${d}% patient share`:"—", "Per visit", "Internal approval"],
       ["Laboratory & radiology", d?`${100-d}% covered`:"Covered in full", d?`${d}%`:"—", "Per visit", "Internal approval"],
       ["Packages & wellness", "Not covered", "—", "—", "—"]]
    : [["Consultation (GP & specialist)", `${100-d}% covered`, `${d}% deductible, max ${cap}`, "Per visit", "No"],
       ["Laboratory", `${100-d}% covered`, `${d}% deductible`, `Annual ${fmt(plan.annualLeft)} left`, "Above SAR 500"],
       ["Radiology — X-ray, ultrasound", `${100-d}% covered`, `${d}% deductible`, "Annual limit", "No"],
       ["Radiology — MRI, CT", `${100-d}% covered`, `${d}% deductible`, "Annual limit", "Yes"],
       ["Pharmacy", "80% covered", "20% co-pay", "Annual limit", "Above SAR 300"],
       ["Dental", gold?"Covered":"Not covered", gold?"20% co-pay":"—", gold?"SAR 2,000 / year":"—", gold?"Yes":"—"],
       ["Maternity", gold?"Covered":"Covered", "—", gold?"SAR 15,000":"SAR 8,000", "Yes"],
       ["Wellness packages", "Not covered", "—", "—", "—"]];
  return `<table class="ord tob"><thead><tr><th>Benefit</th><th>Coverage</th><th>Patient pays</th><th>Limit</th><th>Pre-approval</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i===0?`<b>${x}</b>`:x}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* put the chosen payer on the patient (if new) and on the visit */
function applyPayer(c){
  const ps = c.payerStory, ch = ps.choice, p = pt(c);
  if(ch.id!=="CASH" && !p.payers.some(x=>x.id===ch.id))
    p.payers.splice(p.payers.length-1, 0, { id:ch.id, label:ch.label, plan:ch.plan, internal:ch.kind!=="Company" });
  if(ch.id!==c.payerId) setPayer(c, ch.id);
  /* internal payers approve on their own reference */
  if(ch.plan && ch.plan.internal){
    [c.consult, ...c.orders].forEach(l=>{ if(!l.paid && l.ins==="pending") l.ins = "approved"; });
  }
  c.policy = ps.form ? { ...ps.form, payer:ch.label } : null;
  record(c, "i", `<b>Payer set</b> — ${ch.label}`,
    ps.form ? `${ps.form.type} · ${ps.form.type==="Company"?"policy":"reference"} ${ps.form.policyNo}${ps.form.cardId?` · card ${ps.form.cardId}`:""}${ps.form.validTo?` · valid to ${ps.form.validTo}`:""}`
            : "Self-pay — the patient pays the whole charge",
    { type:"PAYER", to:ch.label });
  markDone(c, "payer", `Payer set — ${ch.label}`,
    ps.form ? `${ps.form.type==="Company"?"Policy":"Reference"} ${ps.form.policyNo}${ps.form.validTo?` · valid to ${ps.form.validTo}`:""}${ch.plan&&ch.plan.internal?" · approved internally":""}`
            : "The patient pays the whole charge");
  if(!ps.form) c.storyDone.payer.cash = true;
  c.payerStory = null;
}

/* ================= ASK VIDA: answers from the billing data, never guessed =================

const CHAT_SUGGEST_VISIT = ["Why is the deductible over?", "Why is the approval still pending?",

/* who and which visit the question is about: named in it, or what is on screen */
function chatContext(q){

  let mrn = c ? c.mrn : (state.screen==="patient" ? state.activeMrn : null);

/* ---- why is the deductible over / how much is left ---- */
function chatDeductible(ctx){
  const need = chatNeed(ctx,"visit"); if(need) return need;
  const c = ctx.c, plan = planOf(c), p = pt(c);
  if(!plan) return `${vlink(c)} is <b>self-pay</b> (${payerOf(c).label}), so there is no deductible — ${first(p)} pays the full charge.`;
  const pool = dedPool(c), pct = Math.round(plan.deductiblePct*100);
  const capWhy = plan.annualLeft < plan.visitCap
    ? `the <b>${fmt(plan.annualLeft)} left on the yearly allowance</b> (lower than the per-visit cap of ${fmt(plan.visitCap)})`
    : `the <b>per-visit cap of ${fmt(plan.visitCap)}</b>`;
  const takers = liveInv(c).flatMap(i=>i.rows.filter(r=>r.calc.deductible>0 && !r.refunded).map(r=>({ i, r })));
  const list = takers.length ? `<ul>${takers.map(({i,r})=>`<li>${r.name} on ${ilink(i.id)} — ${fmt(r.calc.deductible)}</li>`).join("")}</ul>` : "";
  const head = `${payerOf(c).label} charges a deductible of <b>${pct}%</b> on each covered line, up to ${capWhy}.`;
  if(pool.left<=0.004) return `${head}<br>On ${vlink(c)} it is <b>used up</b>: ${fmt(pool.used)} of ${fmt(pool.cap)} has already been taken by:${list}
    So from now on, covered lines on this visit go <b>fully to ${payerName(c)}</b> — ${first(p)} pays no more deductible here (VAT and anything not covered still apply).`;
  return `${head}<br>On ${vlink(c)}, <b>${fmt(pool.used)}</b> has been used and <b>${fmt(pool.left)}</b> is left.${list?` Taken so far by:${list}`:""}`;
}

/* ---- why is the approval still pending ---- */
function chatApproval(ctx){
  const need = chatNeed(ctx,"visit"); if(need) return need;
  const c = ctx.c, p = pt(c);
  if(!planOf(c) && !cashHeld(c).length) return `${vlink(c)} is <b>self-pay</b> — nothing needs an approval.`;
  const pend = [ ...(isPending(c.consult) && !c.consult.paid ? [c.consult] : []), ...c.orders.filter(o=>isPending(o) && !o.paid) ];
  const held = cashHeld(c);
  /* when each line was asked for (history is newest first), and the checks made since then */
  const reqIdx = (l)=>c.history.findIndex(h=>(l===c.consult && /Approval requested/.test(h.tx))
    || (h.type==="ORDERS" && (h.lines||[]).some(x=>x.code===l.code)));
  const reqAt = (l)=>{ const i = reqIdx(l); return i>=0 ? c.history[i].at : (l.ordered || c.arrived); };
  const since = Math.max(-1, ...pend.map(reqIdx));
  const checks = c.history.filter((h,i)=>h.type==="CHECK" && /Approval checked/.test(h.tx) && (since<0 || i<since));
  const lastChk = checks[0];
  if(!pend.length && !held.length){
    const statuses = [c.consult, ...c.orders].filter(l=>l.ins && l.ins!=="notinsured" && l.ins!=="notcovered");
    return `Nothing on ${vlink(c)} is waiting for an approval.${statuses.length?`<ul>${statuses.map(l=>`<li>${l.name} — ${(insStatuses[l.ins]||{}).label||l.ins}</li>`).join("")}</ul>`:""}`;
  }
  let out = pend.length ? `<b>${payerName(c)} has not answered yet</b> on ${pend.length} line(s):<ul>${pend.map(l=>
      `<li>${l.name} — requested at ${reqAt(l)}</li>`).join("")}</ul>`
    + (lastChk ? `It has been checked <b>${checks.length} time(s)</b>, last at ${lastChk.at}, with no answer yet.` : `It has not been checked since it was requested.`)
    + ` Until ${payerName(c)} answers, these lines cannot be billed to it.`
    + (pend.some(l=>l!==c.consult) ? ` If an order cannot wait, it can be <b>billed as cash now</b> from Orders invoicing and moved onto the policy later.` : "")
    : "";
  if(held.length) out += `${out?"<br>":""}${held.length} order(s) were <b>billed as cash</b> while the approval was outstanding (${held.map(o=>o.name).join(", ")}). When ${payerName(c)} approves, move them onto the policy from the <b>Replace</b> story.`;
  return out;
}
