<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)];
  S.screen='invoices'; w.eval('render')();
  const btn=qa('[data-refund]').find(b=>{
    const [mrn,vid,iid]=b.dataset.refund.split('|');
    const inv=w.eval('patientsDB')[mrn].visits.find(x=>x.id===parseInt(vid)).invoices.find(i=>i.id===iid);
    return inv.items && inv.items.filter(it=>!it.refunded).length>=3;
  });
  btn.click();
  if(new URLSearchParams(location.search).get('s')==='2'){ qa('.rfChk')[0].click(); }
  document.title='SHOT-READY';};
f.src='billing-ui-revamp-mockup-v4.html';document.body.appendChild(f);
</script></body></html>
