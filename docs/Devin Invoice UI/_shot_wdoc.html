<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)];
  w.eval('openVisit')(2);
  q('#wOpen').click(); q('#wAdd').click(); q('[data-pot="Clinic"]').click(); const a=q('#waAmt'); a.value='250'; a.dispatchEvent(new w.Event('input')); q('#waGo').click(); q('#aGo').click(); q('#wDone').click();
  q('#wRefund').click(); q('[data-pot="Clinic"]').click(); const b=q('#wrAmt'); b.value='50'; b.dispatchEvent(new w.Event('input')); const r=q('#wrReason'); r.value='Not continuing'; r.dispatchEvent(new w.Event('input')); q('#wrGo').click(); q('#dGo').click(); q('#wDone').click();
  w.eval('state').walletOpen=false; w.eval('render')();
  w.document.getElementById('toasts').innerHTML='';
  if(n==='1'){ qa('.stories [data-story]').find(b=>b.dataset.story==='refund').click(); w.scrollTo(0,160); }
  if(n==='2'){ w.eval('openPatient')('7000667'); w.eval('state').pinvOpen=true; w.eval('state').profPendOpen=false; w.eval('state').profVisitsOpen=false; w.eval('render')(); w.scrollTo(0,250); }
  if(n==='3'){ const d=w.eval('patients')['7000667'].walletDocs.find(x=>x.wtype==='ADV_REFUND'); w.eval('openInvoice')(d.id); }
  document.title='SHOT-READY';};
f.src='journey-opd-v3.html';document.body.appendChild(f);
</script></body></html>
