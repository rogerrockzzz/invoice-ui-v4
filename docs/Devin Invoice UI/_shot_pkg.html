<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow;
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)];
  w.eval('openPatient')('7000667');
  if(n==='2'){ q('[data-book]').click(); }
  if(n==='3'){ q('[data-book]').click(); q('#pbGo').click(); }
  if(n==='4'){ w.eval('openVisit')(4);
    const c=w.eval('cases').find(x=>x.id===4);
    qa('.step .acts .btn').find(b=>/Refund a payment/.test(b.textContent)).click();
    qa('.step [data-refund]')[0].click();
    const rs=q('#rfReason'); rs.value='procedure cancelled'; rs.dispatchEvent(new w.Event('input'));
    w.eval('render')();                       /* the button enables once a reason is typed */
    q('#rfGo').click(); }
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
