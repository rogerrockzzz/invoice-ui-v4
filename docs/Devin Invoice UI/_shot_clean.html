<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow;
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  if(n==='1'){ w.eval('openVisit')(1); }                                   // consultation step
  if(n==='2'){ w.eval('openVisit')(1); qa('.step .acts .btn')[0].click(); } // collect
  if(n==='3'){ w.eval('openVisit')(1); qa('.step .acts .btn')[0].click();
               qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click(); }  // drawer
  if(n==='4'){ w.eval('openVisit')(1); qa('.step .acts .btn')[0].click();
               qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click(); q('#dGo').click(); } // with doctor
  if(n==='5'){ w.eval('openPatient')('7000667'); q('#piHead').click(); }   // profile invoices
  if(n==='6'){ w.eval('openVisit')(1); qa('.step .acts .btn')[0].click();
               qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click(); q('#dGo').click();
               qa('.step .acts .btn').find(b=>/Replace with cash/.test(b.textContent)).click(); }
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
