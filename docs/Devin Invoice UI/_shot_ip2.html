<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:1560px;height:1000px;border:0;display:block}</style></head><body>
<script>
const step=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow,S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  w.eval('openPatientTab')('7000667'); S.screen='ip'; S.ipAdmissionId=5; S.ipStatus='TODO'; R();
  if(step==='1'){ qa('.ipChk').slice(0,3).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); }
  if(step==='2'){ qa('.ipChk').slice(0,5).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); q('#acceptGo').click();
                  S.ipSel={}; S.ipStatus='ACCEPTED'; R(); q('#surgBtn').click(); }
  if(step==='3'){ qa('.ipChk').slice(0,3).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); q('#acceptGo').click();
                  S.ipSel={}; R(); q('#railPayerInfo').click();
                  const d=w.document.querySelector('.ap-audit'); if(d) d.open=true; }
  document.title='SHOT-READY';};
f.src='billing-ui-revamp-mockup-v4.html';document.body.appendChild(f);
</script></body></html>
