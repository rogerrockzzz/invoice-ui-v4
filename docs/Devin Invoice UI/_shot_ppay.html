<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const q=s=>w.document.querySelector(s);
  w.eval('openPatient')('7000203'); w.eval('state').walletOpen=false; w.eval('render')();
  q('#profPayerBtn').click(); w.eval('finishEligibility')(w.eval('state').profPayer.pctx);
  if(n==='2'){ q('[data-choose="MEDGULF-B"]').click(); q('#pySave').click(); }
  w.scrollTo(0,60);
  document.title='SHOT-READY';};
f.src='journey-opd-v3.html';document.body.appendChild(f);
</script></body></html>
