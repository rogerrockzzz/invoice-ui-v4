<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=parseInt(new URLSearchParams(location.search).get('s')||'0');
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const S=w.eval('state');
  const qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')(),C=()=>w.eval('cases');
  S.screen='profile'; S.caseId=2; R();
  const c=C().find(x=>x.id===2);
  // bill + pay the approved ones so the visit sits on the waiting step
  qa('.step .acts .btn')[0].click();
  qa('.step .acts .btn')[0].click();            // send link
  w.eval('simPaid')(c); R();
  for(let i=0;i<n;i++) qa('.step .acts .btn')[0].click();
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
