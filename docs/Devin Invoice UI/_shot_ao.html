<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)];
  if(n==='1'||n==='2'){
    w.eval('openVisit')(1);
    qa('.stories [data-story]').find(b=>b.dataset.story==='addorders').click();
    q('[data-oc="PKG-EXEC"]').click();
    if(n==='2') q('#aoNext').click();
    w.scrollTo(0,150);
  } else {
    const i=q('#q'); i.value='rasangika'; i.dispatchEvent(new w.Event('input'));
    q('.pcard .prow').click(); qa('[data-hp]').find(b=>b.dataset.hp==='walkin').click();
    q('#wkNext').click(); q('[data-oc="PKG-DIAB"]').click();
  }
  document.title='SHOT-READY';};
f.src='journey-opd-v3.html';document.body.appendChild(f);
</script></body></html>
