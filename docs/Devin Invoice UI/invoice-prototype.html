this <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIDA · Billing Workspace (Prototype)</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#fbfcfd;
  --line:#e4e7ec;
  --line-strong:#d0d5dd;
  --ink:#101828;
  --ink-2:#475467;
  --ink-3:#98a2b3;
  --accent:#0f766e;
  --accent-ink:#ffffff;
  --accent-soft:#e6f4f1;
  --accent-line:#99d5cd;
  --blue:#1a56db;
  --blue-soft:#e8effc;
  --amber:#b54708;
  --amber-soft:#fef6ee;
  --red:#b42318;
  --red-soft:#fef3f2;
  --green:#027a48;
  --green-soft:#ecfdf3;
  --purple:#5925dc;
  --purple-soft:#f4f3ff;
  --r:10px;
  --r-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px -2px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.06);
  --shadow-lg:0 18px 40px -12px rgba(16,24,40,.28);
  --rail:262px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.5 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd4dc;border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ============================================================
   APP FRAME
   ============================================================ */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

.topbar{
  height:52px;flex:0 0 52px;background:var(--surface);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 16px;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:-.2px}
.brand-mark{
  width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:-.5px;
}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-3);letter-spacing:0}
.topbar-sep{width:1px;height:24px;background:var(--line)}
.spacer{flex:1}
.chip-user{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:99px}
.chip-user:hover{background:var(--surface-2)}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--purple-soft);color:var(--purple);
  display:grid;place-items:center;font-size:10.5px;font-weight:700}
.u-name{font-weight:600;font-size:12px;line-height:1.25}
.u-role{font-size:10.5px;color:var(--ink-3);line-height:1.25}

/* form controls */
.field{display:flex;flex-direction:column;gap:5px}
.label{font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.ctl{
  height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);outline:none;transition:border-color .12s,box-shadow .12s;
}
select.ctl{padding-right:26px;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2398a2b3' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center;cursor:pointer}
.ctl:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ctl:disabled{background:#f2f4f7;color:var(--ink-3);cursor:not-allowed}
textarea.ctl{height:auto;padding:8px 10px;resize:vertical;min-height:62px;line-height:1.5}
.ctl-sm{height:28px;font-size:12px;padding:0 7px}
.hint{font-size:10.5px;color:var(--ink-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;
  border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);
  font-weight:600;font-size:12.5px;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
.btn:hover{background:var(--surface-2);border-color:#b9c0cc}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#0d6a62;border-color:#0d6a62}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-blue:hover{background:#1749c0;border-color:#1749c0}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#9c1c13}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#eff1f4;border-color:transparent}
.btn-sm{height:28px;padding:0 9px;font-size:11.5px;border-radius:6px}
.btn-xs{height:24px;padding:0 7px;font-size:11px;border-radius:5px;font-weight:600}
.btn-block{width:100%}
.btn-lg{height:40px;padding:0 18px;font-size:13.5px}
.ico{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:13px;height:13px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:5px;
  font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;
  background:#f2f4f7;color:var(--ink-2);border:1px solid transparent}
.b-green{background:var(--green-soft);color:var(--green)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.b-teal{background:var(--accent-soft);color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* ============================================================
   SESSION TAB STRIP
   ============================================================ */
.tabstrip{
  flex:0 0 40px;height:40px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;padding:0 8px;gap:2px;overflow-x:auto;overflow-y:hidden;z-index:20;
}
.tabstrip::-webkit-scrollbar{height:0}
.stab{
  display:flex;align-items:center;gap:7px;padding:0 9px 0 11px;margin:4px 0 0;height:32px;
  border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;
  max-width:236px;flex:0 0 auto;color:var(--ink-2);position:relative;
}
.stab:hover{background:var(--surface-2)}
.stab.on{background:var(--bg);border-color:var(--line);color:var(--ink)}
.stab.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--bg)}
.stab-t{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stab-s{font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.stab-x{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;color:var(--ink-3);flex:0 0 auto}
.stab-x:hover{background:#e4e7ec;color:var(--ink)}
.stab-home{padding:0 11px}
.stab-badge{position:absolute;top:2px;right:20px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.tab-add{align-self:center;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--ink-2);flex:0 0 auto;margin-left:2px}
.tab-add:hover{background:var(--accent-soft);color:var(--accent)}

/* ============================================================
   MAIN / SCROLL BODY
   ============================================================ */
.body{flex:1;min-height:0;display:flex;overflow:hidden}

/* ---------- LANDING ---------- */
.landing{flex:1;overflow-y:auto}
.landing-in{max-width:1080px;margin:0 auto;padding:40px 24px 64px}
.hero{text-align:center;margin-bottom:26px}
.hero h1{font-size:25px;font-weight:700;letter-spacing:-.5px;margin:0 0 5px}
.hero p{margin:0;color:var(--ink-2);font-size:13px}
.searchcard{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-md);padding:18px}
.searchrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.searchrow .f-hosp{width:210px}
.searchrow .f-q{flex:1;min-width:260px}
.keygroup{display:flex}
.keygroup select.ctl{width:104px;border-radius:var(--r-sm) 0 0 var(--r-sm);border-right:none;
  background-color:var(--surface-2);font-weight:600;font-size:12px}
.keygroup .wrapq{position:relative;flex:1}
.keygroup .wrapq input{width:100%;border-radius:0 var(--r-sm) var(--r-sm) 0;padding-right:34px}
.keygroup .wrapq .mag{position:absolute;right:0;top:0;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-3)}
.quickrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.qbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;
  border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:12px;color:var(--ink-2)}
.qbtn:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}

.results{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.rescard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rescard.open{border-color:var(--accent-line);box-shadow:var(--shadow-md)}
.reshead{display:flex;align-items:center;gap:13px;padding:11px 14px;width:100%;text-align:left}
.reshead:hover{background:var(--surface-2)}
.pav{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.res-main{flex:1;min-width:0}
.res-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px}
.res-meta{font-size:11.5px;color:var(--ink-2);display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.res-meta b{color:var(--ink);font-weight:600}
.res-right{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.res-kpi{text-align:right;line-height:1.25}
.res-kpi .k{font-size:10px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.res-kpi .v{font-size:12.5px;font-weight:700}
.resbody{border-top:1px solid var(--line);background:var(--surface-2);padding:11px 14px 13px}
.empty{text-align:center;padding:44px 18px;color:var(--ink-3)}
.empty h4{margin:10px 0 3px;color:var(--ink-2);font-size:13.5px}
.empty p{margin:0;font-size:12px}

/* visit list rows */
.vrow{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);margin-bottom:6px;width:100%;text-align:left}
.vrow:last-child{margin-bottom:0}
.vrow:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.vtag{width:44px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800;flex:0 0 auto;letter-spacing:.03em}
.vrow-main{flex:1;min-width:0}
.vrow-t{font-weight:600;font-size:12.5px}
.vrow-s{font-size:11px;color:var(--ink-2);margin-top:1px}

/* ---------- SESSION LAYOUT ---------- */
.session{flex:1;display:flex;min-width:0}
.rail{
  flex:0 0 var(--rail);width:var(--rail);background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;display:flex;flex-direction:column}
.rail-head{padding:14px 13px 12px;border-bottom:1px solid var(--line)}
.rail-pt{display:flex;gap:10px;align-items:flex-start}
.rail-nm{font-weight:700;font-size:13.5px;letter-spacing:-.1px;line-height:1.3}
.rail-mrn{font-size:11px;color:var(--ink-2);margin-top:2px}
.rail-sec{padding:11px 13px;border-bottom:1px solid var(--line)}
.rail-sec:last-child{border-bottom:none}
.sec-t{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:600;text-align:right}
.meter{height:5px;border-radius:99px;background:#eaecf0;overflow:hidden;margin:6px 0 3px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter i.warn{background:var(--amber)}
.meter i.crit{background:var(--red)}
.moneycard{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 9px;background:var(--surface-2);margin-bottom:6px}
.moneycard:last-child{margin-bottom:0}
.moneycard .mc-k{font-size:10.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:5px}
.moneycard .mc-v{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-top:1px}
.vpick{display:flex;flex-direction:column;gap:4px}
.vpick-i{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;text-align:left;width:100%;border:1px solid transparent}
.vpick-i:hover{background:var(--surface-2);border-color:var(--line)}
.vpick-i.on{background:var(--accent-soft);border-color:var(--accent-line)}
.vpick-t{font-size:11.5px;font-weight:600;flex:1;min-width:0}
.vpick-d{font-size:10.5px;color:var(--ink-3)}

/* work area */
.work{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.worktabs{flex:0 0 42px;height:42px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;gap:2px;padding:0 12px;overflow-x:auto}
.worktabs::-webkit-scrollbar{height:0}
.wtab{display:flex;align-items:center;gap:6px;padding:0 11px;font-weight:600;font-size:12.5px;color:var(--ink-2);
  border-bottom:2px solid transparent;flex:0 0 auto}
.wtab:hover{color:var(--ink)}
.wtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.wtab .cnt{height:17px;min-width:17px;padding:0 4px;border-radius:99px;background:#eaecf0;color:var(--ink-2);
  font-size:10px;font-weight:700;display:grid;place-items:center}
.wtab.on .cnt{background:var(--accent);color:#fff}
.workbody{flex:1;min-height:0;display:flex;overflow:hidden}
.pane{flex:1;min-width:0;overflow-y:auto;padding:14px}

/* cards + tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:13px}
.card:last-child{margin-bottom:0}
.card-h{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:-.1px}
.card-h .sub{font-size:11px;color:var(--ink-3);font-weight:500}
.card-b{padding:13px}
.card-b.p0{padding:0}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f1f3f6;font-size:12px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.hov:hover{background:var(--surface-2)}
.r{text-align:right}.c{text-align:center}
.t-strong{font-weight:600}
.t-mut{color:var(--ink-2)}
.t-xs{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.row{display:flex;gap:9px;align-items:center}
.row-b{display:flex;gap:9px;align-items:flex-end}
.wrap{flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;background:var(--surface)}
.stat .s-k{font-size:10.5px;color:var(--ink-2);font-weight:600}
.stat .s-v{font-size:17px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
.stat .s-x{font-size:10.5px;color:var(--ink-3);margin-top:1px}

/* catalogue */
.catbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.cattab{height:27px;padding:0 11px;border-radius:99px;border:1px solid var(--line-strong);
  font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.cattab:hover{background:var(--surface-2)}
.cattab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;background:var(--surface);text-align:left;
  display:flex;flex-direction:column;gap:3px;transition:border-color .12s,box-shadow .12s}
.item:hover{border-color:var(--accent-line);box-shadow:var(--shadow-md)}
.item .i-n{font-weight:600;font-size:12px;line-height:1.35}
.item .i-m{font-size:10.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px;align-items:center}
.item .i-p{font-weight:700;font-size:12.5px}

/* basket / right panel */
.sidepanel{flex:0 0 322px;width:322px;border-left:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden}
.sp-h{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sp-h h3{margin:0;font-size:12.5px;font-weight:700}
.sp-b{flex:1;overflow-y:auto;padding:12px 13px}
.sp-f{border-top:1px solid var(--line);padding:12px 13px;background:var(--surface-2)}
.sumline{display:flex;justify-content:space-between;font-size:12px;padding:3.5px 0}
.sumline .sk{color:var(--ink-2)}
.sumline .sv{font-weight:600}
.sumline.big{border-top:1px solid var(--line-strong);margin-top:6px;padding-top:8px}
.sumline.big .sk{font-weight:700;color:var(--ink);font-size:12.5px}
.sumline.big .sv{font-weight:800;font-size:17px;letter-spacing:-.3px}
.paymode{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);
  border-radius:var(--r-sm);margin-bottom:6px;background:var(--surface)}
.paymode.on{border-color:var(--accent-line);background:var(--accent-soft)}
.paymode .pm-n{flex:1;font-size:11.5px;font-weight:600}
.paymode input[type=number]{width:82px;text-align:right}
.pmchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.pmchip{height:27px;padding:0 10px;border-radius:99px;border:1px solid var(--line-strong);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.pmchip:hover{background:var(--surface-2)}
.pmchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pmchip:disabled{opacity:.4;cursor:not-allowed}

/* alerts */
.alert{display:flex;gap:9px;padding:9px 11px;border-radius:var(--r-sm);font-size:11.5px;line-height:1.45;margin-bottom:11px;border:1px solid}
.alert b{font-weight:700}
.a-amber{background:var(--amber-soft);border-color:#fcd9a8;color:#7a3c05}
.a-red{background:var(--red-soft);border-color:#fdcdc7;color:#8e1b12}
.a-blue{background:var(--blue-soft);border-color:#c6d7f9;color:#173f9e}
.a-green{background:var(--green-soft);border-color:#b7ebc9;color:#026034}
.alert .ico{margin-top:1px}

/* ============================================================
   MODAL / DRAWER / TOAST
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:24px;animation:fade .12s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal{background:var(--surface);border-radius:13px;box-shadow:var(--shadow-lg);width:560px;max-width:100%;
  max-height:100%;display:flex;flex-direction:column;animation:pop .14s ease}
.modal.w-sm{width:430px}
.modal.w-lg{width:800px}
.modal.w-xl{width:1000px}
.m-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.m-h h2{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.2px;flex:1}
.m-h .m-s{font-size:11.5px;color:var(--ink-3);font-weight:500}
.m-b{padding:16px;overflow-y:auto;flex:1}
.m-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;
  background:var(--surface-2);border-radius:0 0 13px 13px;align-items:center}
.x-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.x-btn:hover{background:#eff1f4;color:var(--ink)}

#toastRoot{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;padding:9px 14px;
  border-radius:99px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:pop .14s ease}
.toast .ico{stroke:#6ee7b7}
.toast.err .ico{stroke:#fda29b}

/* segmented */
.seg{display:inline-flex;background:#f2f4f7;border-radius:8px;padding:2px;gap:2px}
.seg button{height:27px;padding:0 12px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* checkbox */
.cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
label.cbl{display:inline-flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;user-select:none}

/* type picker (visit types) */
.tpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tp{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px;text-align:left;background:var(--surface)}
.tp:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.tp.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.tp .tp-n{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px}
.tp .tp-d{font-size:10.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}

/* ============================================================
   STEPPER  (visit charge -> orders)
   ============================================================ */
.pane-scroll{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pane-body{flex:1;overflow-y:auto;padding:16px 18px 18px}

.stepper{display:flex;align-items:stretch;gap:0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:15px;overflow:hidden}
.step{flex:1;display:flex;align-items:center;gap:11px;padding:12px 15px;position:relative;min-width:0}
.step + .step{border-left:1px solid var(--line)}
.step.done{background:linear-gradient(90deg,var(--green-soft),transparent)}
.step.active{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.step.locked{opacity:.62}
.step-n{width:27px;height:27px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;background:#eaecf0;color:var(--ink-3);border:2px solid transparent}
.step.active .step-n{background:var(--accent);color:#fff}
.step.done .step-n{background:var(--green);color:#fff}
.step-x{min-width:0;flex:1}
.step-t{font-size:12.5px;font-weight:700;letter-spacing:-.1px;display:flex;align-items:center;gap:7px}
.step-d{font-size:10.5px;color:var(--ink-2);margin-top:1px;line-height:1.4}
.step-go{flex:0 0 auto}

/* full-width charge table */
.chg-t td{padding:9px 10px}
.chg-t .cell-n{font-weight:600;font-size:12.5px;line-height:1.35}
.chg-t .cell-c{font-size:10.5px;color:var(--ink-3)}
.qi{width:54px;text-align:center}
.di{width:66px;text-align:right;padding-right:19px}
.di-wrap{position:relative;display:inline-block}
.di-wrap span{position:absolute;right:7px;top:5px;font-size:10px;color:var(--ink-3);pointer-events:none}
tfoot th{background:var(--surface-2);border-top:1px solid var(--line-strong);
  border-bottom:none;color:var(--ink);font-size:11px;text-transform:none;letter-spacing:0;padding:9px 10px}

/* sticky totals bar */
.totbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -3px 12px -6px rgba(16,24,40,.16);padding:11px 18px;display:flex;align-items:center;gap:20px}
.tb-i{line-height:1.25}
.tb-i .tb-k{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.tb-i .tb-v{font-size:13.5px;font-weight:700;margin-top:1px}
.tb-due .tb-k{color:var(--accent)}
.tb-due .tb-v{font-size:22px;letter-spacing:-.5px}
.tb-sep{width:1px;align-self:stretch;background:var(--line)}

/* ============================================================
   SLIDE-OVER PAYMENT DRAWER
   ============================================================ */
.dwr-scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:90;animation:fade .14s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:432px;max-width:100%;background:var(--surface);
  z-index:95;display:flex;flex-direction:column;box-shadow:-12px 0 40px -12px rgba(16,24,40,.34);
  animation:slidein .2s cubic-bezier(.32,.72,.35,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
.dwr-h{padding:15px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.dwr-h .dh-k{font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.dwr-h .dh-v{font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.15;margin-top:2px}
.dwr-h .dh-s{font-size:11px;color:var(--ink-3);margin-top:3px}
.dwr-tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.dwr-tab{padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);border-bottom:2px solid transparent}
.dwr-tab:hover{color:var(--ink)}
.dwr-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.dwr-tab:disabled{opacity:.4;cursor:not-allowed}
.dwr-b{flex:1;overflow-y:auto;padding:15px 18px}
.dwr-f{border-top:1px solid var(--line);background:var(--surface-2);padding:0}
.dwr-tot{display:flex;justify-content:space-between;align-items:baseline;padding:13px 18px}
.dwr-tot .dt-k{font-size:12.5px;font-weight:700}
.dwr-tot .dt-v{font-size:23px;font-weight:800;letter-spacing:-.6px}
.dwr-btns{display:flex;border-top:1px solid var(--line)}
.dwr-btns button{flex:1;height:48px;font-size:13.5px;font-weight:700;border-radius:0}
.dwr-btns .b-clear{background:var(--surface);color:var(--ink-2)}
.dwr-btns .b-clear:hover{background:#eff1f4}
.dwr-btns .b-done{background:var(--accent);color:#fff}
.dwr-btns .b-done:hover{background:#0d6a62}
.dwr-btns .b-done:disabled{background:#cfd4dc;color:#fff;cursor:not-allowed}

.modechips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:13px;border-bottom:1px dashed var(--line)}
.mchip{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.mchip:hover{border-color:var(--accent-line);color:var(--accent)}
.mchip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.mchip:disabled{opacity:.4;cursor:not-allowed}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fgrid .full{grid-column:1/-1}
.fgrid .field{min-width:0}          /* stop intrinsic input width blowing the columns out */
.fgrid .ctl{width:100%}
.drawer *{max-width:100%}
.req:after{content:" *";color:var(--red)}
.tender{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);margin-bottom:7px;background:var(--surface-2)}
.tender .tn-i{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent)}
.tender .tn-m{flex:1;min-width:0}
.tender .tn-n{font-size:11.5px;font-weight:700}
.tender .tn-r{font-size:10.5px;color:var(--ink-3)}
.tender .tn-a{font-size:13.5px;font-weight:700}
.remcard{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-sm);
  padding:9px 11px;display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.remcard .rc-k{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.remcard .rc-v{font-size:17px;font-weight:800;letter-spacing:-.3px}
.remcard.ok{border-color:#b7ebc9;background:var(--green-soft)}
.remcard.ok .rc-k{color:var(--green)}
.remcard.over{border-color:#fdcdc7;background:var(--red-soft)}
.remcard.over .rc-k{color:var(--red)}

/* ============================================================
   PRINT
   ============================================================ */
#printArea{display:none}
@media print{
  body{background:#fff}
  #app,#modalRoot,#toastRoot{display:none !important}
  #printArea{display:block !important}
}
.doc{width:190mm;margin:0 auto;padding:12mm 10mm;color:#000;font-size:11px}
.doc-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:9px}
.doc-h .dh-l h1{margin:0;font-size:19px;letter-spacing:-.3px}
.doc-h .dh-l p{margin:2px 0 0;font-size:10.5px;color:#333}
.doc-h .dh-r{text-align:right}
.doc-h .dh-r .t{font-size:15px;font-weight:800;letter-spacing:.04em}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.doc-grid .dg-t{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#444;margin-bottom:4px}
.doc-grid .dg-r{display:flex;justify-content:space-between;padding:1.5px 0;border-bottom:1px dotted #ccc}
table.doc-t{width:100%;border-collapse:collapse;margin-top:6px}
table.doc-t th{background:#f0f0f0;border:1px solid #999;font-size:9px;padding:5px 6px;color:#000}
table.doc-t td{border:1px solid #ccc;font-size:10px;padding:5px 6px}
.doc-tot{margin-top:10px;margin-left:auto;width:62%}
.doc-tot .dt-r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eee}
.doc-tot .dt-r.b{border-top:2px solid #000;border-bottom:2px solid #000;font-weight:800;font-size:13px;padding:6px 0;margin-top:3px}
.doc-f{margin-top:22px;display:flex;justify-content:space-between;gap:20px;font-size:9.5px;color:#333}
.doc-sign{border-top:1px solid #000;padding-top:4px;width:44%;text-align:center}
.doc-note{margin-top:14px;font-size:9px;color:#555;line-height:1.5;border-top:1px dashed #bbb;padding-top:7px}
.preview-wrap{background:#eceff3;padding:16px;border-radius:var(--r-sm);max-height:56vh;overflow:auto}
.preview-wrap .doc{background:#fff;box-shadow:var(--shadow-md);width:100%;max-width:190mm}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>
<script>
"use strict";

/* ================================================================
   1. ICONS + UTILITIES
   ================================================================ */
const ICONS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  chevR:'<path d="M9 18l6-6-6-6"/>',
  chevD:'<path d="M6 9l6 6 6-6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20v-1a6 6 0 0111 -3.2"/><circle cx="17.5" cy="10" r="3"/><path d="M13 20v-.5a5 5 0 019 -2.5"/>',
  file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  print:'<path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 16h10v5H7z"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="17" cy="14.5" r="1.3"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/>',
  credit:'<path d="M12 2v20"/><path d="M17 6.5A4 4 0 0013 4h-2a3.5 3.5 0 000 7h2.5a3.5 3.5 0 010 7H11a4 4 0 01-4-2.5"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.4 8.2-8 9.5C7.4 20.2 4 17 4 12V6z"/>',
  undo:'<path d="M3 8h11a5 5 0 010 10H9"/><path d="M7 4L3 8l4 4"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  checkC:'<circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  alert:'<path d="M12 3l9.5 17H2.5z"/><path d="M12 9v5M12 17.2v.1"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.1"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 2"/>',
  bed:'<path d="M3 18V7"/><path d="M3 12h11a4 4 0 014 4v2"/><path d="M21 18v-3"/><circle cx="8" cy="9.5" r="2"/>',
  amb:'<path d="M3 16V8h11l4 4h3v4"/><circle cx="7.5" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M8.5 10.5h3M10 9v3"/>',
  steth:'<path d="M5 3v5a4 4 0 008 0V3"/><path d="M9 12v3a5 5 0 0010 0v-2"/><circle cx="19" cy="11" r="2"/>',
  flask:'<path d="M9 3h6v5l4.5 9A2 2 0 0117.7 20H6.3a2 2 0 01-1.8-3L9 8z"/><path d="M7.5 14h9"/>',
  scan:'<path d="M4 8V6a2 2 0 012-2h2M20 8V6a2 2 0 00-2-2h-2M4 16v2a2 2 0 002 2h2M20 16v2a2 2 0 01-2 2h-2"/><path d="M4 12h16"/>',
  pill:'<rect x="3" y="8.5" width="18" height="7" rx="3.5" transform="rotate(-40 12 12)"/><path d="M9 9l6 6"/>',
  cart:'<circle cx="9" cy="20" r="1.6"/><circle cx="18" cy="20" r="1.6"/><path d="M2 3h3l2.6 12h11L21 7H6"/>',
  trash:'<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/>',
  refresh:'<path d="M20 11a8 8 0 10-2.6 6.3"/><path d="M20 4v7h-7"/>',
  home:'<path d="M4 11l8-7 8 7v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.1M3.5 12h.1M3.5 18h.1"/>',
  tag:'<path d="M12 2l9 9-9 9-9-9V4a2 2 0 012-2z"/><circle cx="8.5" cy="8.5" r="1.4"/>',
  arrowR:'<path d="M4 12h15"/><path d="M13 6l6 6-6 6"/>',
  link:'<path d="M10 13a5 5 0 007.5.5l2-2a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7.5-.5l-2 2a5 5 0 007 7l1-1"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/>',
  building:'<path d="M4 21V5a2 2 0 012-2h8a2 2 0 012 2v16"/><path d="M16 9h3a2 2 0 012 2v10"/><path d="M8 7h4M8 11h4M8 15h4"/>',
  percent:'<path d="M19 5L5 19"/><circle cx="7.5" cy="7.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>',
  lock:'<rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>',
};
const ic = (n, cls) => `<svg class="ico ${cls||''}" viewBox="0 0 24 24">${ICONS[n]||''}</svg>`;

const $  = s => document.querySelector(s);
const money = n => (Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
const initials = n => n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const TODAY = new Date('2026-08-25T10:20:00');
const dstr  = d => new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const dtstr = d => new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const ago = d => { const h=Math.round((TODAY-new Date(d))/36e5);
  if(h<1) return 'just now'; if(h<24) return h+'h ago';
  const dd=Math.round(h/24); return dd<30? dd+'d ago' : Math.round(dd/30)+'mo ago'; };
const age = dob => Math.floor((TODAY-new Date(dob))/(365.25*864e5));
const PAL = ['#1a56db','#0f766e','#5925dc','#b54708','#b42318','#026034','#0e7490','#a21caf'];
const tint = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return PAL[h%PAL.length]; };
const soft = hex => hex+'14';

/* ================================================================
   2. CONFIGURATION  (all of this is meant to be back-office driven)
   ================================================================ */
const HOSPITALS = [
  {id:'ALH', name:'Al Hamra Hospital',      city:'Jeddah'},
  {id:'OLY', name:'Olaya Medical Center',   city:'Riyadh'},
  {id:'KHB', name:'Khobar Specialist',      city:'Al Khobar'},
];

const SEARCH_KEYS = [
  {id:'mrn',   label:'MRN',        ph:'e.g. 10024871'},
  {id:'nid',   label:'National ID',ph:'e.g. 1098xxxxxx'},
  {id:'phone', label:'Mobile',     ph:'e.g. 0555 000 000'},
  {id:'name',  label:'Name',       ph:'Patient name (EN / AR)'},
  {id:'file',  label:'Visit / Inv',ph:'Visit no or invoice no'},
];

/* Payment modes — "configurable" list. `kind` drives behaviour:
   settle = money in now | advance = draw from patient wallet
   credit = creates receivable | payer = billed to insurance   */
const PAYMENT_MODES = [
  {id:'cash',    label:'Cash',            icon:'cash',   kind:'settle', enabled:true},
  {id:'card',    label:'Card / POS',      icon:'card',   kind:'settle', enabled:true, ref:'Approval code'},
  {id:'transfer',label:'Bank Transfer',   icon:'link',   kind:'settle', enabled:true, ref:'Transfer ref'},
  {id:'advance', label:'Patient Advance', icon:'wallet', kind:'advance',enabled:true},
  {id:'credit',  label:'Credit (A/R)',    icon:'credit', kind:'credit', enabled:true, ref:'Guarantor / PO'},
  {id:'voucher', label:'Voucher',         icon:'tag',    kind:'settle', enabled:true, ref:'Voucher no'},
];

/* Visit types. THIS is the extension point: IPD and ER get their own
   `tabs` / `flags` here and the shell picks them up automatically —
   the OPD workflow, session tabs, rail, basket and payment panel are
   all shared, so the user's muscle memory carries across. */
const TABS_STD = ['charge','visits','invoices','advance','credit'];
const VISIT_TYPES = {
  OPD:      {label:'Outpatient',   short:'OPD', icon:'steth', color:'#1a56db',
             desc:'Clinic consultation with billable services & orders.',
             tabs:TABS_STD, needsClinic:true,
             chargeLabel:'Consultation', chargeCodes:['CON-001','CON-002','CON-004','CON-011']},
  FOLLOWUP: {label:'Follow-up',    short:'F/U', icon:'refresh', color:'#0e7490',
             desc:'Revisit inside the free follow-up window.',
             tabs:TABS_STD, needsClinic:true, freeConsult:true,
             chargeLabel:'Follow-up consultation', chargeCodes:['CON-003','CON-001']},
  ER:       {label:'Emergency',    short:'ER',  icon:'amb', color:'#b42318',
             desc:'Triage-first. Bill after stabilisation, deposit optional.',
             tabs:TABS_STD, needsClinic:false,
             chargeLabel:'ER assessment', chargeCodes:['CON-010'],
             stub:'ER specifics (triage level, ER package, treat-first/bill-later deferral) plug in here.'},
  IP:       {label:'Inpatient',    short:'IP',  icon:'bed', color:'#5925dc',
             desc:'Admission with running bill and discharge settlement.',
             tabs:TABS_STD, needsClinic:false,
             chargeLabel:'Admission / bed charge', chargeCodes:['ROM-601','ROM-602','ROM-603','ROM-604'],
             stub:'IP specifics (bed/board charges, interim bills, discharge clearance) plug in here.'},
  REFERRAL: {label:'Referral',     short:'REF', icon:'arrowR', color:'#b54708',
             desc:'Visit created from an in/out-bound referral.',
             tabs:TABS_STD, needsClinic:true, needsReferral:true,
             chargeLabel:'Referral consultation', chargeCodes:['CON-004','CON-002','CON-001']},
  WALKIN:   {label:'Walk-in',      short:'WLK', icon:'users', color:'#027a48',

/* ================================================================
   3. PRICING / INSURANCE SPLIT ENGINE
   Single source of truth used by the basket, the invoice preview,
   the printed document and the refund screen.
   ================================================================ */
const VAT_ON = false;   /* healthcare largely VAT-exempt in KSA — toggle to show tax lines */

function payerOf(pt){ return PAYERS[pt.payerId] || PAYERS.CASH; }
function insActive(pt){
  const p = payerOf(pt);
  return p.id !== 'CASH' && !!pt.plan && pt.plan.status === 'Active';
}
function limitLeft(pt){
  if(!pt.plan) return 0;
  return Math.max(0, pt.plan.annualLimit - pt.plan.consumed);
}
/* policy deductible is an annual pool; each visit can draw up to the payer's per-visit cap */
function dedInfo(pt){
  if(!pt.plan) return {total:0, used:0, left:0, perVisit:0};
  const total = pt.plan.deductibleTotal || 0;
  const used  = Math.min(total, pt.plan.deductibleUsed || 0);
  return {total, used, left:Math.max(0, total-used), perVisit:(payerOf(pt).visitDeductible || 0)};
}
/* a line only bills to the payer when its pre-approval is in place */
const apBills = st => !!(APPROVALS[st] && APPROVALS[st].bills);
function approvalFor(pt, code, qty){
  if(!insActive(pt)) return 'Self-pay';
  const it = catItem(code); if(!it) return 'Self-pay';
  const co = payerOf(pt).coverage[it.c];
  if(co == null) return 'Not covered';
  return (it.p * (qty||1)) >= PREAPPROVAL_LIMIT ? 'Pending' : 'Not required';
}

/* lines: [{code, qty, disc, price?, useIns?, name?, cat?}] */
function compute(lines, pt, visit){
  const payer = payerOf(pt);
  const live  = insActive(pt);
  let capLeft = live ? limitLeft(pt) : 0;
  const ded   = dedInfo(pt);
  let dedLeft = (live && ded.perVisit && !(visit && visit.deductibleApplied))
                  ? Math.min(ded.perVisit, ded.left) : 0;

  const rows = [];
  const T = {gross:0, disc:0, net:0, company:0, patient:0, deduct:0, vat:0, due:0};

  for(const L of lines){
    const it    = catItem(L.code) || {n:L.name||L.code, c:L.cat||'proc', p:L.price||0};
    const price = (L.price != null) ? L.price : it.p;
    const qty   = L.qty || 1;
    const gross = price * qty;
    const dAmt  = gross * ((L.disc||0)/100);
    const net   = gross - dAmt;

    let company = 0, patient = net, dedAmt = 0, covered = false, note = '';
    const ap = L.approval || approvalFor(pt, L.code, qty);
    const useIns = L.useIns !== false && apBills(ap);

    if(!live){
      note = payer.id === 'CASH' ? 'Self-pay' : 'Policy ' + (pt.plan ? pt.plan.status.toLowerCase() : 'n/a');
    } else if(L.useIns === false){
      note = 'Insurance waived';
    } else if(!apBills(ap)){
      note = ap === 'Pending' ? 'Pre-approval pending' : ap;
    } else {
      const co = payer.coverage ? payer.coverage[it.c] : null;
      if(co == null){
        note = 'Excluded from plan';
      } else {
        covered = true;
        patient = net * co;
        company = net - patient;
        if(dedLeft > 0 && company > 0){                 /* deductible shifts payer→patient */
          dedAmt = Math.min(dedLeft, company);
          company -= dedAmt; patient += dedAmt; dedLeft -= dedAmt;
        }
        if(company > capLeft){                          /* annual limit cap */
          patient += company - capLeft; company = capLeft;
          note = 'Annual limit reached';
        }
        capLeft -= company;
        if(!note) note = co === 0 ? 'Fully covered' : Math.round(co*100) + '% co-pay';
        if(dedAmt > 0) note += ' · deductible ' + money(dedAmt);
      }
    }
    const vat = VAT_ON ? patient * VAT_RATE : 0;
    rows.push({...L, qty, price, name:it.n, cat:it.c, code:L.code, gross, discAmt:dAmt,
               net, company, patient, deduct:dedAmt, vat, covered, note, approval:ap});
    T.gross+=gross; T.disc+=dAmt; T.net+=net; T.company+=company;
    T.patient+=patient; T.deduct+=dedAmt; T.vat+=vat;
  }
  T.due = T.patient + T.vat;
  T.limitAfter = live ? capLeft : 0;
  return {rows, T, live, payer};
}

/* build an already-issued invoice (uses the same engine as the live basket) */
function mkInvoice(pt, visitId, lines, payments, days, h, opts={}){
  const r = compute(lines, pt, null);
  const paid = payments.filter(p => PAYMENT_MODES.find(m=>m.id===p.mode).kind !== 'credit')
                       .reduce((s,p)=>s+p.amount, 0);
  const cred = payments.filter(p => PAYMENT_MODES.find(m=>m.id===p.mode).kind === 'credit')
                       .reduce((s,p)=>s+p.amount, 0);
  return {
    id:uid('INV'), no:nextNo('inv','INV-'), visitId, date:dAgo(days,h||11),
    hospital:opts.hospital||'ALH', cashier:opts.cashier||'S. Saafan',
    lines:r.rows.map(x=>({code:x.code, name:x.name, cat:x.cat, qty:x.qty, price:x.price,
                          disc:x.disc||0, net:x.net, company:x.company, patient:x.patient,
                          deduct:x.deduct, note:x.note, refunded:0})),
    T:{...r.T}, payerId:pt.payerId, payerName:payerOf(pt).name,
    payments:payments.map(p=>({...p, at:dAgo(days,h||11)})),
    paid, creditAmt:cred, creditSettled:0,
    status: cred>0 ? 'Credit open' : 'Paid',
    refunds:[]
  };
}

/* ================================================================
   5. APP STATE + SESSION ENGINE
   Every open patient/visit is an independent session with its own
   basket, payment split and scroll position. Nothing is global.
   ================================================================ */
const S = {
  hospital:'ALH',
  user:{name:'Saadan Saafan', role:'Receptionist'},
  searchKey:'mrn', q:'',
  expanded:null,           /* patient id expanded in the result list */
  allBranches:false,       /* include inter-branch / referred-in visits from other facilities */
  land:'search',           /* search | today | invoices | credit */
  sessions:[], active:'home',
  modal:null,
  toasts:[],
};
const MAX_SESSIONS = 8;

function newSession(ptId, visitId){
  return {id:uid('S'), ptId, visitId:visitId||null, tab:'charge',
          vLine:null,             /* the consultation / visit-charge line */
          extras:[],              /* services added from the catalogue */
          ordEdit:{},             /* qty / disc overrides on doctor's orders, keyed by order id */
          sel:{}, selInit:false,  /* which rows are ticked for this invoice */
          catOpen:false, catGroup:'lab', catQ:'',
          drawer:null,            /* {tab, mode, f:{}, tenders:[]} when the pay-drawer is open */
          note:'', invScope:'all'};
}
function sess(){ return S.sessions.find(x=>x.id===S.active) || null; }
function openSession(ptId, visitId, tab){
  let s = S.sessions.find(x => x.ptId===ptId && x.visitId===visitId);
  if(!s){
    if(S.sessions.length >= MAX_SESSIONS){
      return toast('Maximum '+MAX_SESSIONS+' sessions open — close one first.', true);
    }
    s = newSession(ptId, visitId);
    S.sessions.push(s);
  }
  if(tab) s.tab = tab;
  S.active = s.id;
  paint();
}
function closeSession(id){
  const i = S.sessions.findIndex(x=>x.id===id);
  if(i < 0) return;
  const dirty = S.sessions[i].extras.length > 0;
  if(dirty && !confirm('This session has un-invoiced charges in the basket. Close anyway?')) return;
  S.sessions.splice(i,1);
  if(S.active === id) S.active = S.sessions.length ? S.sessions[Math.max(0,i-1)].id : 'home';
  paint();
}
function toast(msg, err){
  const t = {id:uid('T'), msg, err:!!err};
  S.toasts.push(t);
  paintToasts();
  setTimeout(()=>{ S.toasts = S.toasts.filter(x=>x.id!==t.id); paintToasts(); }, 3200);
}
function paintToasts(){
  $('#toastRoot').innerHTML = S.toasts.map(t =>
    `<div class="toast ${t.err?'err':''}">${ic(t.err?'alert':'checkC')}<span>${esc(t.msg)}</span></div>`).join('');
}

/* ---- delegated events ---- */
const ACT = {};
function bind(){
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if(!el) return;
    const f = ACT[el.dataset.act]; if(!f) return;
    e.preventDefault(); e.stopPropagation();
    f(el.dataset, el, e);
  });
  const h = e => {
    const el = e.target.closest('[data-inp]'); if(!el) return;
    const f = ACT[el.dataset.inp]; if(f) f(el.dataset, el, e);
  };
  document.addEventListener('input', h);
  document.addEventListener('change', h);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && S.modal){ S.modal = null; paint(); }
    if(e.key === 'Enter'){
      const el = e.target.closest('[data-enter]');
      if(el && ACT[el.dataset.enter]){ e.preventDefault(); ACT[el.dataset.enter](el.dataset, el, e); }
    }
  });
}

/* ---- paint with focus preservation (single re-render pass) ---- */
function paint(){
  const a  = document.activeElement;
  const fk = a && a.dataset ? a.dataset.fk : null;
  let cs = null; try{ cs = a ? a.selectionStart : null; }catch(_){}
  $('#app').innerHTML       = viewApp();
  $('#modalRoot').innerHTML = viewModal();
  if(fk){
    const n = document.querySelector('[data-fk="'+fk+'"]');
    if(n){ n.focus(); try{ n.setSelectionRange(cs, cs); }catch(_){} }
  }
}

function matchPatient(p, key, q){
  const n = s => String(s||'').toLowerCase().replace(/\s+/g,'');
  q = n(q);
  if(key==='mrn')   return n(p.mrn).includes(q);
  if(key==='nid')   return n(p.nid).includes(q);
  if(key==='phone') return n(p.phone).includes(q);
  if(key==='name')  return n(p.name).includes(q) || String(p.nameAr||'').includes(q);
  if(key==='file')  return p.visits.some(v=>n(v.no).includes(q)) || p.invoices.some(i=>n(i.no).includes(q));
  return false;
}
function results(){
  const q = S.q.trim();
  const pool = PATIENTS.filter(p => S.hospital==='ALL' || p.hospital===S.hospital);
  if(S.land==='today'){
    return pool.filter(p => visitsOf(p).some(v => new Date(v.date).toDateString()===TODAY.toDateString()));
  }
  if(S.land==='credit')   return pool.filter(p => creditOut(p) > 0.005);
  if(S.land==='invoices') return pool.filter(p => p.invoices.length > 0);
  if(q.length < 2) return null;
  return pool.filter(p => matchPatient(p, S.searchKey, q));
}

function viewSession(){
  const s  = sess(); if(!s){ S.active='home'; return viewLanding(); }
  const pt = findPt(s.ptId);
  const v  = s.visitId ? findVis(pt, s.visitId) : null;
  const tabs = v ? VISIT_TYPES[v.type].tabs : ['visits','invoices','advance','credit'];
  if(!tabs.includes(s.tab)) s.tab = tabs[0];

  const pane = {
    charge:   () => paneCharge(s, pt, v),
    visits:   () => paneVisits(s, pt, v),
    invoices: () => paneInvoices(s, pt, v),
    advance:  () => paneAdvance(s, pt),
    credit:   () => paneCredit(s, pt),
  }[s.tab]();

  return `<div class="session">
    ${railView(s, pt, v)}
    <div class="work">
      <div class="worktabs">${tabs.map(t=>{
        const cfg = WORK_TABS[t];
        let n = 0;
        if(t==='visits')   n = pt.visits.length;
        if(t==='invoices') n = pt.invoices.length;
        if(t==='credit')   n = openCredit(pt).length;
        if(t==='charge')   n = chargeLines(s, pt, v).length;
        return `<button class="wtab ${s.tab===t?'on':''}" data-act="wtab" data-t="${t}">
          ${ic(cfg.icon,'ico-sm')} ${cfg.label}${n?`<span class="cnt">${n}</span>`:''}</button>`;
      }).join('')}</div>
      <div class="workbody">${pane}</div>
    </div>
    ${s.drawer ? payDrawer(s, pt, v) : ''}

/* ================================================================
   9. CHARGE & INVOICE  —  one selectable list
   Consultation sits on top as just another line. Orders stay
   un-tickable until the consultation has been invoiced, so the desk
   still knows the visit itself is settled first.
   ================================================================ */
const visitNeedsCharge = v => !!VISIT_TYPES[v.type].chargeCodes;
const visitInvoiceOf   = (pt,v) => pt.invoices.find(i => i.visitId===v.id && i.kind==='visit' && i.status!=='Refunded');
const ordersUnlocked   = (pt,v) => !visitNeedsCharge(v) || !!visitInvoiceOf(pt,v);
const stageOf          = (pt,v) => ordersUnlocked(pt,v) ? 2 : 1;

function defaultVLine(v){
  const cfg = VISIT_TYPES[v.type];
  return {lid:uid('L'), code:cfg.chargeCodes[0], qty:1, disc: cfg.freeConsult ? 100 : 0, useIns:true};
}

/* ---- build the single list of chargeable rows ---- */
function allRows(s, pt, v){
  const cfg  = VISIT_TYPES[v.type];
  const vi   = visitInvoiceOf(pt, v);
  const open = ordersUnlocked(pt, v);
  const rows = [];

  if(visitNeedsCharge(v)){
    if(!s.vLine) s.vLine = defaultVLine(v);
    rows.push({key:'CONS', group:'consult', ...s.vLine,
               approval: approvalFor(pt, s.vLine.code, s.vLine.qty),
               invoiced: !!vi, invNo: vi ? vi.no : null,
               selectable: !vi, editable: !vi});
  }
  (v.orders||[]).forEach(o=>{
    const ed = s.ordEdit[o.id] || {};
    rows.push({key:o.id, group:'order', orderId:o.id, code:o.code,
               qty: ed.qty != null ? ed.qty : o.qty,
               disc: ed.disc != null ? ed.disc : 0,
               useIns: ed.useIns !== false,
               approval: o.approval, raisedBy:o.by, raisedAt:o.at,
               invoiced: o.status !== 'Pending',
               selectable: open && o.status === 'Pending', editable: open && o.status === 'Pending'});
  });
  s.extras.forEach(x=>{
    rows.push({key:x.lid, group:'extra', ...x,
               approval: x.approval || approvalFor(pt, x.code, x.qty),
               invoiced:false, selectable:open, editable:open, removable:true});
  });
  return rows;
}
/* only the ticked rows are being invoiced */
function chargeLines(s, pt, v){
  if(!v) return [];
  return allRows(s, pt, v).filter(r => r.selectable && s.sel[r.key]);
}
function chargeCalc(s, pt, v){ return compute(chargeLines(s,pt,v), pt, v); }

/* ---- pane ---- */
function paneCharge(s, pt, v){
  if(!v) return `<div class="pane">${noVisitBlock(pt)}</div>`;
  const cfg  = VISIT_TYPES[v.type];
  const rows = allRows(s, pt, v);
  const vi   = visitInvoiceOf(pt, v);
  const open = ordersUnlocked(pt, v);

  /* the gate auto-ticks the consultation and nothing else */
  if(!open && !s.selInit){ s.sel = {CONS:true}; s.selInit = true; }

  const sel     = rows.filter(r=>r.selectable && s.sel[r.key]);
  const pendAp  = sel.filter(r=>r.approval === 'Pending');
  const groups  = [
    {id:'consult', t: cfg.chargeLabel || 'Consultation', ico:'steth', rows:rows.filter(r=>r.group==='consult')},
    {id:'order',   t:'Doctor\u2019s orders',              ico:'list',  rows:rows.filter(r=>r.group==='order')},
    {id:'extra',   t:'Other services added',              ico:'cart',  rows:rows.filter(r=>r.group==='extra')},
  ].filter(g=>g.rows.length);

  return `<div class="pane-scroll">
    <div class="pane-body">
      ${cfg.stub?`<div class="alert a-blue">${ic('info')}<div><b>${esc(cfg.label)} flow — placeholder.</b>
        ${esc(cfg.stub)} The charge → settle mechanics below stay identical.</div></div>`:''}
      ${!insActive(pt) && pt.plan?`<div class="alert a-red">${ic('alert')}<div><b>Policy ${esc(pt.plan.status.toLowerCase())}.</b>
        Every line is priced as self-pay until eligibility is verified.</div></div>`:''}
      ${!open?`<div class="alert a-amber">${ic('lock')}<div><b>Invoice the ${esc((cfg.chargeLabel||'visit charge').toLowerCase())} first.</b>
        The doctor's orders below stay locked until the visit itself is billed — that way the desk always knows the
        visit is settled before any service goes out.</div></div>`:''}
      ${cfg.freeConsult && !vi?`<div class="alert a-green">${ic('checkC')}<div><b>Free follow-up window.</b>
        The consultation is pre-set to a 100% waiver — invoice it at zero to open the visit.</div></div>`:''}
      ${pendAp.length?`<div class="alert a-amber">${ic('clock')}<div><b>${pendAp.length} selected line(s) awaiting pre-approval.</b>
        Billing them now charges the patient in full. Record the approval on the line to shift it back to the payer.</div></div>`:''}

      <div class="card"><div class="card-h">${ic('file')}<h3>Services on this visit</h3>
        <span class="badge">${sel.length} of ${rows.filter(r=>r.selectable).length} selected</span>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-act="selAll">${ic('check','ico-sm')} Select all billable</button>
        ${sel.length?`<button class="btn btn-sm btn-ghost" data-act="selNone">Clear</button>`:''}</div>
        <div class="card-b p0"><table class="chg-t">
          <thead><tr><th style="width:34px"></th><th>Service</th>
            <th class="c" style="width:70px">Qty</th><th class="r" style="width:78px">Rate</th>
            <th class="c" style="width:80px">Disc %</th><th class="r" style="width:84px">Net</th>
            <th style="width:186px">Insurance status</th>
            <th class="r" style="width:92px">Payer</th><th class="r" style="width:98px">Patient</th>
            <th style="width:40px"></th></tr></thead>
          ${groups.map(g=>`<tbody>
            <tr><td colspan="10" style="background:var(--surface-2);padding:6px 10px">
              <span class="sec-t" style="margin:0">${ic(g.ico,'ico-sm')} ${esc(g.t)}</span></td></tr>
            ${g.rows.map(r=>chargeRow(s, pt, v, r)).join('')}
          </tbody>`).join('')}
        </table></div>
      </div>

      ${otherServicesCard(s, pt, open)}
    </div>
    ${totBar(s, pt, v, open)}
  </div>`;
}

/* what a line was actually billed at, so invoiced rows don't drift as the pools move */
function billedLine(pt, v, code){
  for(const iv of pt.invoices){
    if(iv.visitId !== v.id) continue;
    const l = iv.lines.find(x=>x.code === code);
    if(l) return {...l, invNo:iv.no};
  }
  return null;
}
function chargeRow(s, pt, v, r){
  const it = catItem(r.code) || {n:r.code, c:'proc', p:0};
  /* invoiced rows show the historical split; live rows are priced on the fly */
  const hist = r.invoiced ? billedLine(pt, v, r.code) : null;
  const one  = hist || compute([r], pt, (r.group==='consult' ? v : {deductibleApplied:true})).rows[0];
  if(hist && r.group==='consult' && !r.invNo) r.invNo = hist.invNo;
  const ap  = APPROVALS[r.approval] || APPROVALS['Self-pay'];
  const on  = r.selectable && !!s.sel[r.key];
  const dim = r.invoiced || !r.selectable;
  return `<tr class="hov" style="${dim?'opacity:.55':''}">
    <td>${r.invoiced ? ic('check','ico-sm')
        : r.selectable ? `<input type="checkbox" class="cb" ${on?'checked':''} data-inp="selRow" data-k="${r.key}">`
        : ic('lock','ico-sm')}</td>
    <td><div class="cell-n">${esc(it.n)}</div>
      <div class="cell-c mono">${esc(r.code)}${r.group==='order'?' · '+esc(r.raisedBy):''}${
        r.invoiced && r.invNo?' · '+esc(r.invNo):r.invoiced?' · billed':''}</div>
      ${r.group==='consult' && r.editable?`<select class="ctl ctl-sm" style="margin-top:5px;max-width:236px"
         data-inp="setVLineSel">${VISIT_TYPES[v.type].chargeCodes.map(c=>{
           const ci=catItem(c); return `<option value="${c}" ${r.code===c?'selected':''}>${esc(ci.n)} — ${money(ci.p)}</option>`;
         }).join('')}</select>`:''}</td>
    <td class="c">${r.editable?`<input class="ctl ctl-sm qi" type="number" min="1" value="${r.qty}"
         data-fk="q${r.key}" data-inp="rowQty" data-k="${r.key}">`:`<span class="num">${r.qty}</span>`}</td>
    <td class="r num">${money(one.price)}</td>
    <td class="c">${r.editable?`<span class="di-wrap"><input class="ctl ctl-sm di" type="number" min="0" max="100"
         value="${r.disc||0}" data-fk="d${r.key}" data-inp="rowDisc" data-k="${r.key}"><span>%</span></span>`
         :`<span class="num">${r.disc||0}%</span>`}</td>
    <td class="r num t-strong">${money(one.net)}</td>
    <td><span class="badge ${ap.cls}" title="${esc(ap.hint)}">${ic(ap.ico,'ico-sm')} ${esc(r.approval)}</span>
      ${r.approval==='Pending' && r.selectable?`<button class="btn btn-xs" style="margin-top:4px"
         data-act="markAppr" data-k="${r.key}">Approval received</button>`:''}
      ${r.approval==='Rejected' && r.selectable?`<div class="hint" style="margin-top:3px">Patient pays in full</div>`:''}</td>
    <td class="r num" style="color:var(--blue)">${money(one.company)}</td>
    <td class="r num t-strong">${money(one.patient)}</td>
    <td class="r">${r.removable?`<button class="btn btn-xs btn-ghost" data-act="delExtra" data-k="${r.key}"
         title="Remove">${ic('trash','ico-sm')}</button>`:''}</td>
  </tr>`;
}

function otherServicesCard(s, pt, open){
  const q = s.catQ.trim().toLowerCase();

  return `<div class="card"><div class="card-h">${ic('cart')}<h3>Other services</h3>
    <div class="spacer"></div>
    ${s.catOpen?`<input class="ctl ctl-sm" style="width:230px" placeholder="Search all services / code…"
        data-fk="catq" data-inp="catq" value="${esc(s.catQ)}">`:''}
    <button class="btn btn-sm ${s.catOpen?'':'btn-primary'}" data-act="toggleCat" ${open?'':'disabled title="Invoice the visit charge first"'}>
      ${s.catOpen?ic('x','ico-sm')+' Close':ic('plus','ico-sm')+' Add service'}</button></div>
    ${s.catOpen && open?`<div class="card-b">
      ${q?'':`<div class="catbar">${CAT_GROUPS.map(g=>
        `<button class="cattab ${s.catGroup===g.id?'on':''}" data-act="catg" data-g="${g.id}">${esc(g.label)}</button>`).join('')}</div>`}
      ${items.length?`<div class="itemgrid">${items.map(x=>{

          <span class="i-m"><span class="badge ${ap.cls}" style="height:17px;font-size:9.5px">${esc(st)}</span>
            <span>${ic('plus','ico-sm')}</span></span></button>`;

/* ---------- sticky totals bar ---------- */
function totBar(s, pt, v, open){

function noVisitBlock(pt){
  return `<div class="card"><div class="card-h">${ic('info')}<h3>Pick a visit to start charging</h3></div>
    <div class="card-b">
      <p class="t-mut" style="margin:0 0 11px">Charges always attach to a visit. Choose an existing one or create a new visit — you stay on this screen either way.</p>
      ${visitsOf(pt).map(v=>visitRow(pt,v)).join('')}
      <button class="btn btn-primary" style="margin-top:9px" data-act="newVisit" data-p="${pt.id}">${ic('plus','ico-sm')} Add visit</button>
    </div></div>`;

/* ---------- row actions ---------- */
function rowRef(s, k){
  if(k === 'CONS') return s.vLine;
  const ex = s.extras.find(x=>x.lid === k);
  if(ex) return ex;
  s.ordEdit[k] = s.ordEdit[k] || {};
  return s.ordEdit[k];
}
ACT.selRow  = (d,el) => { const s=sess(); s.sel[d.k] = el.checked; paint(); };
ACT.selAll  = () => {
  const s = sess(), pt = findPt(s.ptId), v = findVis(pt, s.visitId);
  allRows(s, pt, v).filter(r=>r.selectable).forEach(r=>{ s.sel[r.key] = true; });
  paint();
};
ACT.selNone = () => { const s=sess(); s.sel = {}; paint(); };
ACT.setVLineSel = (d,el) => {
  const s = sess(), cfg = VISIT_TYPES[findVis(findPt(s.ptId), s.visitId).type];
  s.vLine = {lid:uid('L'), code:el.value, qty:1, disc: cfg.freeConsult?100:0, useIns:true};
  s.sel.CONS = true; paint();
};
ACT.rowQty  = (d,el) => { rowRef(sess(),d.k).qty  = Math.max(1, +el.value||1); paint(); };
ACT.rowDisc = (d,el) => { rowRef(sess(),d.k).disc = Math.min(100, Math.max(0, +el.value||0)); paint(); };
ACT.markAppr = d => {
  const s = sess(), pt = findPt(s.ptId), v = findVis(pt, s.visitId);
  if(d.k === 'CONS'){ toast('Consultation needs no approval.', true); return; }
  const o = (v.orders||[]).find(x=>x.id === d.k);
  if(o){ o.approval = 'Approved'; toast('Pre-approval recorded — payer share restored.'); }
  const ex = s.extras.find(x=>x.lid === d.k);
  if(ex){ ex.approval = 'Approved'; toast('Pre-approval recorded — payer share restored.'); }
  paint();
};
ACT.delExtra = d => { const s=sess(); s.extras = s.extras.filter(x=>x.lid !== d.k); delete s.sel[d.k]; paint(); };
ACT.toggleCat = () => { const s=sess(); s.catOpen=!s.catOpen; if(!s.catOpen) s.catQ=''; paint(); };
ACT.catg  = d => { const s=sess(); s.catGroup=d.g; paint(); };
ACT.catq  = (d,el) => { const s=sess(); s.catQ=el.value; paint(); };
ACT.addItem = d => {
  const s = sess(), pt = findPt(s.ptId);
  const ex = s.extras.find(x=>x.code === d.c);
  if(ex){ ex.qty++; }
  else {
    const lid = uid('L');
    s.extras.push({lid, code:d.c, qty:1, disc:0, useIns:true, approval:approvalFor(pt, d.c, 1)});
    s.sel[lid] = true;
  }
  paint();
};

   9b. PAYMENT SLIDE-OVER DRAWER
   ================================================================ */
const BANKS = ['Al Rajhi Bank','Saudi National Bank','Riyad Bank','Bank Albilad','Alinma Bank','SABB','Bank Aljazira'];
const MODE_FIELDS = {
  cash:     [],
  card:     [{k:'auth', l:'Approval code', req:true, ph:'e.g. 448120'},
             {k:'last4',l:'Card last 4',  req:false, ph:'1234'}],
  transfer: [{k:'chq',  l:'Cheque / transfer no', req:true, ph:'Enter number'},
             {k:'date', l:'Date', req:true, type:'date'},
             {k:'bank', l:'Bank', req:true, type:'select', opts:BANKS},
             {k:'hijri',l:'Hijri date', req:false, ph:'1448-02-11'}],
  voucher:  [{k:'vno',  l:'Voucher no', req:true, ph:'Enter voucher number'}],
  advance:  [],
  credit:   [{k:'po',   l:'Guarantor / PO no', req:true, ph:'e.g. PO-AR-88455'},
             {k:'due',  l:'Due date', req:false, type:'date'}],
};
const DWR_TABS = [
  {id:'payment', label:'Payment', modes:['cash','card','transfer','voucher']},
  {id:'advance', label:'Advance', modes:['advance']},
  {id:'credit',  label:'Credit',  modes:['credit']},
];
const tenderTotal = s => (s.drawer.tenders||[]).reduce((a,t)=>a+t.amount, 0);
const tenderOf    = (s,kind) => s.drawer.tenders.filter(t=>kindOf(t.mode)===kind).reduce((a,t)=>a+t.amount,0);
const refString   = t => {
  const f = t.f||{};
  return [f.auth&&('auth '+f.auth), f.last4&&('••'+f.last4), f.chq, f.bank, f.vno, f.po,
          f.date, f.due&&('due '+f.due)].filter(Boolean).join(' · ');
};

ACT.openDrawer = () => {
  const s = sess(), pt = findPt(s.ptId), v = findVis(pt, s.visitId);
  const due = chargeCalc(s, pt, v).T.due;
  s.drawer = {tab:'payment', mode:'cash', f:{amount:due>0?String(Math.round(due*100)/100):''}, tenders:[]};
  paint();
};
ACT.closeDrawer = () => { const s=sess(); s.drawer=null; paint(); };
ACT.dwrTab = d => {
  const s = sess(), t = DWR_TABS.find(x=>x.id===d.t);
  s.drawer.tab = d.t; s.drawer.mode = t.modes[0];
  s.drawer.f = {amount:s.drawer.f.amount};
  paint();
};
ACT.dwrMode = d => { const s=sess(); s.drawer.mode=d.m; s.drawer.f={amount:s.drawer.f.amount}; paint(); };
ACT.dwrField = (d,el) => { const s=sess(); s.drawer.f[d.k]=el.value; if(d.repaint) paint(); };
ACT.dwrClear = () => { const s=sess(); s.drawer.tenders=[]; paint(); };
ACT.delTender = d => { const s=sess(); s.drawer.tenders.splice(+d.i,1); paint(); };
ACT.addTender = () => {
  const s = sess(), pt = findPt(s.ptId), v = findVis(pt, s.visitId);
  const D = s.drawer, m = PAYMENT_MODES.find(x=>x.id===D.mode);
  const due = chargeCalc(s, pt, v).T.due;
  let amt = Math.round((+D.f.amount||0)*100)/100;
  if(amt <= 0) return toast('Enter an amount.', true);
  const missing = (MODE_FIELDS[D.mode]||[]).filter(f=>f.req && !String(D.f[f.k]||'').trim());
  if(missing.length) return toast(missing[0].l+' is required for '+m.label+'.', true);
  const rem = Math.round((due - tenderTotal(s))*100)/100;
  if(amt > rem + 0.005) return toast('That exceeds the '+money(rem)+' still outstanding.', true);
  if(m.kind === 'advance'){
    const cap = Math.round((pt.advance.balance - tenderOf(s,'advance'))*100)/100;
    if(amt > cap + 0.005) return toast('Only '+money(cap)+' advance available.', true);
  }
  D.tenders.push({id:uid('T'), mode:D.mode, amount:amt, f:{...D.f}});
  const left = Math.round((due - tenderTotal(s))*100)/100;
  D.f = {amount: left > 0 ? String(left) : ''};
  paint();
};

function payDrawer(s, pt, v){
  const D    = s.drawer;
  const r    = chargeCalc(s, pt, v);
  const due  = r.T.due;
  const got  = Math.round(tenderTotal(s)*100)/100;
  const rem  = Math.round((due - got)*100)/100;
  const done = Math.abs(rem) < 0.005;
  const stage = stageOf(pt, v);
  const tab  = DWR_TABS.find(x=>x.id===D.tab);
  const m    = PAYMENT_MODES.find(x=>x.id===D.mode);
  const advLeft = Math.round((pt.advance.balance - tenderOf(s,'advance'))*100)/100;

  return `<div class="dwr-scrim" data-act="closeDrawer"></div>
  <div class="drawer">
    <div class="dwr-h">
      <div style="flex:1">
        <div class="dh-k">${stage===1 ? 'Visit charge — invoice total' : 'Orders &amp; services — invoice total'}</div>
        <div class="dh-v">SAR ${money(due)}</div>
        <div class="dh-s">${esc(pt.name)} · MRN ${esc(pt.mrn)} · ${esc(VISIT_TYPES[v.type].label)} ${esc(v.no)}</div>
      </div>
      <button class="x-btn" data-act="closeDrawer">${ic('x')}</button>
    </div>

    <div class="dwr-tabs">${DWR_TABS.map(t=>{
      const dis = t.id==='advance' && pt.advance.balance <= 0;
      return `<button class="dwr-tab ${D.tab===t.id?'on':''}" data-act="dwrTab" data-t="${t.id}" ${dis?'disabled title="No advance balance"':''}>
        ${esc(t.label)}${t.id==='advance'?` <span class="hint">${money(pt.advance.balance)}</span>`:''}</button>`;
    }).join('')}</div>

    <div class="dwr-b">
      <div class="remcard ${done?'ok':(rem<0?'over':'')}">
        <div><div class="rc-k">${done?'Fully tendered':(rem>0?'Still to collect':'Over-tendered')}</div>
          <div class="rc-v">SAR ${money(Math.abs(rem))}</div></div>
        <div style="text-align:right"><div class="rc-k">Insurance covers</div>
          <div class="rc-v" style="font-size:14px;color:var(--blue)">${money(r.T.company)}</div></div>
      </div>

      ${due === 0 ? `<div class="alert a-green">${ic('checkC')}<div><b>Nothing payable by the patient.</b>
        ${r.T.company>0?`The payer covers all ${money(r.T.net)}.`:'This charge is fully waived.'}
        Press <b>Complete</b> to issue a zero-value invoice.</div></div>` : `

      ${tab.modes.length>1?`<div class="modechips">${tab.modes.map(id=>{
        const mm = PAYMENT_MODES.find(x=>x.id===id);
        return `<button class="mchip ${D.mode===id?'on':''}" data-act="dwrMode" data-m="${id}">${esc(mm.label)}</button>`;
      }).join('')}</div>`:''}

      ${D.tab==='advance'?`<div class="alert a-blue">${ic('wallet')}<div>Wallet balance
        <b>${money(pt.advance.balance)}</b> — ${money(advLeft)} still usable on this invoice.</div></div>`:''}
      ${D.tab==='credit'?`<div class="alert a-amber">${ic('credit')}<div>Credit creates a receivable against
        <b>${esc(pt.plan&&pt.plan.guarantor?pt.plan.guarantor:pt.name)}</b>, settled later from the Credit tab.</div></div>`:''}

      <div class="fgrid">
        ${(MODE_FIELDS[D.mode]||[]).map(f=>`
          <div class="field ${f.type==='select'||(MODE_FIELDS[D.mode].length%2&&f===MODE_FIELDS[D.mode][MODE_FIELDS[D.mode].length-1])?'':''}">
            <span class="label ${f.req?'req':''}">${esc(f.l)}</span>
            ${f.type==='select'
              ? `<select class="ctl" data-inp="dwrField" data-k="${f.k}">
                   <option value="">Select a bank</option>
                   ${f.opts.map(o=>`<option ${D.f[f.k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
              : `<input class="ctl" type="${f.type||'text'}" placeholder="${esc(f.ph||'')}"
                   data-fk="df${f.k}" data-inp="dwrField" data-k="${f.k}" value="${esc(D.f[f.k]||'')}">`}
          </div>`).join('')}
        <div class="field ${(MODE_FIELDS[D.mode]||[]).length%2===0?'':''}">
          <span class="label req">Amount</span>
          <input class="ctl" type="number" min="0" step="0.01" placeholder="0.00"
            data-fk="dfamount" data-inp="dwrField" data-k="amount" value="${esc(D.f.amount||'')}"></div>
        <div class="full row" style="justify-content:space-between">
          <div class="row" style="gap:5px">
            <button class="btn btn-xs" data-act="dwrFill" data-v="rem">Outstanding</button>
            ${D.tab==='payment'?[50,100,500].map(x=>
              `<button class="btn btn-xs" data-act="dwrFill" data-v="${x}">${x}</button>`).join(''):''}
            ${D.tab==='advance'?`<button class="btn btn-xs" data-act="dwrFill" data-v="adv">Max advance</button>`:''}
          </div>
          <button class="btn btn-primary" data-act="addTender">Add ${ic('plus','ico-sm')}</button>
        </div>
      </div>`}

      ${D.tenders.length?`<div style="margin-top:16px">
        <div class="sec-t">Tendered
          <button class="btn btn-xs btn-ghost" data-act="dwrClear">Clear</button></div>
        ${D.tenders.map((t,i)=>{
          const mm = PAYMENT_MODES.find(x=>x.id===t.mode);
          const rs = refString(t);
          return `<div class="tender"><div class="tn-i">${ic(mm.icon,'ico-sm')}</div>
            <div class="tn-m"><div class="tn-n">${esc(mm.label)}</div>
              ${rs?`<div class="tn-r">${esc(rs)}</div>`:''}</div>
            <div class="tn-a num">${money(t.amount)}</div>
            <button class="btn btn-xs btn-ghost" data-act="delTender" data-i="${i}">${ic('x','ico-sm')}</button></div>`;
        }).join('')}</div>`:''}
    </div>

    <div class="dwr-f">
      <div class="dwr-tot"><span class="dt-k">Total Amount</span>
        <span class="dt-v num">SAR ${money(got)}</span></div>
      <div class="dwr-btns">
        <button class="b-clear" data-act="dwrClear">Clear</button>
        <button class="b-done" data-act="doInvoice" ${done?'':'disabled'}>
          ${done?ic('checkC'):''} Complete</button>
      </div>
    </div>
  </div>`;
}
ACT.dwrFill = d => {
  const s = sess(), pt = findPt(s.ptId), v = findVis(pt, s.visitId);
  const due = chargeCalc(s, pt, v).T.due;
  const rem = Math.round((due - tenderTotal(s))*100)/100;
  if(d.v === 'rem')      s.drawer.f.amount = String(Math.max(0, rem));
  else if(d.v === 'adv') s.drawer.f.amount = String(Math.max(0,
      Math.min(rem, Math.round((pt.advance.balance - tenderOf(s,'advance'))*100)/100)));
  else s.drawer.f.amount = String((+s.drawer.f.amount||0) + (+d.v));
  paint();
};

function paneVisits(s, pt, cur){
  const list = pt.visits.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const here  = list.filter(v=>visHosp(pt,v)===pt.hospital).length;
  const other = list.length - here;
  const inter = list.filter(v=>v.interBranch).length;
  return `<div class="pane">
    <div class="grid4" style="margin-bottom:13px">
      <div class="stat"><div class="s-k">Total visits</div><div class="s-v">${list.length}</div>
        <div class="s-x">lifetime, all branches</div></div>
      <div class="stat"><div class="s-k">This branch</div><div class="s-v">${here}</div>
        <div class="s-x">${esc(hospName(pt.hospital))}</div></div>
      <div class="stat"><div class="s-k">Other branches</div>
        <div class="s-v" style="color:${other?'var(--purple)':'inherit'}">${other}</div>
        <div class="s-x">registered elsewhere</div></div>
      <div class="stat"><div class="s-k">Inter-branch / referral</div>
        <div class="s-v" style="color:${inter?'var(--amber)':'inherit'}">${inter}</div>
        <div class="s-x">in or out-bound</div></div>
    </div>
    ${other?`<div class="alert a-blue">${ic('building')}<div>${other} visit(s) belong to another facility.
      They are billable from here only if the patient was referred in — inter-branch visits are tagged below.</div></div>`:''}
    <div class="card"><div class="card-h">${ic('building')}<h3>All visits</h3>
      <span class="badge">${list.length}</span><div class="spacer"></div>
      <button class="btn btn-sm btn-primary" data-act="newVisit" data-p="${pt.id}">${ic('plus','ico-sm')} Add visit</button></div>
      <div class="card-b p0"><table>
        <thead><tr><th>Visit</th><th>Type</th><th>Branch</th><th>Clinic / Doctor</th><th>Date</th>
          <th>Referral</th><th class="c">Orders</th><th class="c">Invoices</th><th class="r">Billed</th>
          <th>Status</th><th class="r"></th></tr></thead>
        <tbody>${list.map(v=>{
          const t = VISIT_TYPES[v.type];
          const h = visHosp(pt, v);
          const invs = pt.invoices.filter(i=>i.visitId===v.id);
          const billed = invs.reduce((a,i)=>a+i.T.due, 0);
          const pend = (v.orders||[]).filter(o=>o.status==='Pending').length;

            <td class="t-xs">${h===pt.hospital?esc(hospName(h))
              :`<span class="badge b-purple">${ic('building','ico-sm')} ${esc(hospName(h))}</span>`}</td>
            <td class="t-xs">${esc(v.clinic)}<div class="hint">${esc(v.doctor)}</div></td>
            <td class="t-xs">${dstr(v.date)}<div class="hint">${ago(v.date)}</div></td>
            <td class="t-xs">${v.interBranch
              ? `<span class="badge b-amber">${esc(v.interBranch.dir)}</span>

                 <div class="hint">${esc(v.referral.from)}</div>` : '—'}</td>

            <td class="r num t-strong">${billed?money(billed):'—'}</td>
            <td><span class="badge ${v.status==='Open'||v.status==='Admitted'?'b-green':''}">${esc(v.status)}</span>
              ${visitNeedsCharge(v)?(visitInvoiceOf(pt,v)

/* ================================================================
   11. INVOICES PANE
   ================================================================ */
function invStatusBadge(iv){
  const openCr = iv.creditAmt - iv.creditSettled;
  if(iv.refunds.length && iv.refunds.some(r=>r.status==='Pending approval')) return `<span class="badge b-amber">Refund pending</span>`;
  if(iv.status==='Refunded')      return `<span class="badge b-red">Refunded</span>`;
  if(iv.status==='Part refunded') return `<span class="badge b-purple">Part refunded</span>`;
  if(openCr > 0.005)              return `<span class="badge b-amber">Credit ${money(openCr)}</span>`;
  return `<span class="badge b-green">${ic('check','ico-sm')} Paid</span>`;
}

function paneInvoices(s, pt, v){
  const list = allInv(pt);
  const scoped = s.invScope==='visit' && v ? list.filter(i=>i.visitId===v.id) : list;
  const tot = scoped.reduce((a,i)=>a+i.T.due,0);
  const rfd = scoped.reduce((a,i)=>a+i.refunds.filter(r=>r.status!=='Rejected').reduce((x,r)=>x+r.amount,0),0);
  return `<div class="pane">
    <div class="grid4" style="margin-bottom:13px">
      <div class="stat"><div class="s-k">Invoices</div><div class="s-v">${scoped.length}</div>

      <div class="stat"><div class="s-k">Refunded</div><div class="s-v" style="color:${rfd>0?'var(--red)':'inherit'}">${money(rfd)}</div><div class="s-x">lifetime</div></div>
    </div>
    <div class="card"><div class="card-h">${ic('file')}<h3>Invoices</h3><div class="spacer"></div>
      ${v?`<div class="seg">
        <button class="${s.invScope==='visit'?'on':''}" data-act="invScope" data-v="visit">This visit</button>
        <button class="${s.invScope!=='visit'?'on':''}" data-act="invScope" data-v="all">All visits</button></div>`:''}
    </div>
    <div class="card-b p0">${scoped.length?`<table>
      <thead><tr><th>Invoice</th><th>For</th><th>Visit</th><th>Date</th><th>Payer</th><th class="r">Net</th>
        <th class="r">Payer share</th><th class="r">Patient</th><th>Settled via</th><th>Status</th><th class="r">Actions</th></tr></thead>
      <tbody>${scoped.map(iv=>{
        const vv = pt.visits.find(x=>x.id===iv.visitId);

          <td class="mono t-strong t-xs">${esc(iv.no)}</td>
          <td><span class="badge ${iv.kind==='visit'?'b-purple':'b-teal'}">${esc(iv.kindLabel||(iv.kind==='visit'?'Visit charge':'Orders'))}</span></td>
          <td>${t?`<span class="vtag" style="background:${soft(t.color)};color:${t.color};width:36px;height:19px;font-size:9px">${t.short}</span>`:'—'}
              <div class="hint">${vv?esc(vv.clinic):''}</div></td>
          <td class="t-xs">${dstr(iv.date)}<div class="hint">${ago(iv.date)}</div></td>
          <td class="t-xs">${esc(PAYERS[iv.payerId].short)}</td>
          <td class="r num">${money(iv.T.net)}</td>
          <td class="r num" style="color:var(--blue)">${money(iv.T.company)}</td>
          <td class="r num t-strong">${money(iv.T.due)}</td>
          <td class="t-xs">${iv.payments.map(p=>{
              const m = PAYMENT_MODES.find(x=>x.id===p.mode);

    </div></div>
    ${pt.refunds && pt.refunds.length?`<div class="card"><div class="card-h">${ic('undo')}<h3>Refund history</h3>
      <span class="badge">${pt.refunds.length}</span></div>
      <div class="card-b p0"><table><thead><tr><th>Credit note</th><th>Against</th><th>Date</th>
        <th>Reason</th><th>Mode</th><th class="r">Amount</th><th>Status</th><th class="r"></th></tr></thead>
      <tbody>${pt.refunds.slice().reverse().map(r=>`<tr class="hov">
        <td class="mono t-strong t-xs">${esc(r.no)}</td><td class="mono t-xs">${esc(r.invNo)}</td>
