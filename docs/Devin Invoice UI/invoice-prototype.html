        <td class="r num t-strong">${money(r.amount)}</td>
        <td><span class="badge ${r.status==='Approved'?'b-green':r.status==='Rejected'?'b-red':'b-amber'}">${esc(r.status)}</span></td>
        <td class="r">${r.status==='Pending approval'
          ? `<button class="btn btn-xs btn-primary" data-act="approveRfd" data-r="${r.id}">Approve</button>`
          : `<button class="btn btn-xs" data-act="printRfd" data-r="${r.id}">${ic('print','ico-sm')}</button>`}</td>
      </tr>`).join('')}</tbody></table></div></div>`:''}
  </div>`;
}
ACT.invScope = d => { const s=sess(); s.invScope=d.v; paint(); };

/* ================================================================
   12. ADVANCE PANE
   ================================================================ */
function paneAdvance(s, pt){
  const dep = pt.advance.txns.filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0);
  const use = pt.advance.txns.filter(t=>t.amount<0).reduce((a,t)=>a-t.amount,0);
  return `<div class="pane">
    <div class="grid3" style="margin-bottom:13px">
      <div class="stat"><div class="s-k">Available balance</div>
        <div class="s-v" style="color:${pt.advance.balance>0?'var(--green)':'inherit'}">${money(pt.advance.balance)}</div>
        <div class="s-x">usable as a payment mode</div></div>
      <div class="stat"><div class="s-k">Total deposited</div><div class="s-v">${money(dep)}</div><div class="s-x">lifetime</div></div>
      <div class="stat"><div class="s-k">Applied to invoices</div><div class="s-v">${money(use)}</div><div class="s-x">lifetime</div></div>

const NOW = () => { const d = new Date(TODAY); return d.toISOString(); };
const kindOf = id => (PAYMENT_MODES.find(m=>m.id===id)||{}).kind;

ACT.doInvoice = () => {
  const s = sess(), pt = findPt(s.ptId), v = findVis(pt, s.visitId);
  const stage = stageOf(pt, v);
  const lines = chargeLines(s, pt, v);
  const r = chargeCalc(s, pt, v);
  if(!lines.length) return toast('Nothing to invoice.', true);

  const payments = (s.drawer ? s.drawer.tenders : []).map(t => ({
    mode:t.mode, amount:t.amount, ref:refString(t), f:t.f, at:NOW()
  })).filter(p=>p.amount > 0);

  const cred   = payments.filter(p=>kindOf(p.mode)==='credit').reduce((a,p)=>a+p.amount,0);
  const advUse = payments.filter(p=>kindOf(p.mode)==='advance').reduce((a,p)=>a+p.amount,0);
  const paid   = payments.filter(p=>kindOf(p.mode)==='settle').reduce((a,p)=>a+p.amount,0) + advUse;

  const tendered = Math.round((paid + cred)*100)/100;
  if(Math.abs(tendered - r.T.due) > 0.005)
    return toast('Payment '+money(tendered)+' does not match the '+money(r.T.due)+' payable.', true);
  if(advUse > pt.advance.balance + 0.005)
    return toast('Advance drawdown exceeds the wallet balance.', true);

  const iv = {
    id:uid('INV'), no:nextNo('inv','INV-'), visitId:v.id, date:NOW(),
    kind: stage===1 ? 'visit' : 'orders',
    kindLabel: stage===1 ? (VISIT_TYPES[v.type].chargeLabel || 'Visit charge') : 'Orders & services',
    hospital:pt.hospital, cashier:S.user.name,
    lines:r.rows.map(x=>({code:x.code, name:x.name, cat:x.cat, qty:x.qty, price:x.price, disc:x.disc||0,
                          net:x.net, company:x.company, patient:x.patient, deduct:x.deduct,
                          note:x.note, refunded:0})),
    T:{...r.T}, payerId:pt.payerId, payerName:payerOf(pt).name,
    payments, paid, creditAmt:cred, creditSettled:0, creditLog:[],
    status: cred>0 ? 'Credit open' : 'Paid', refunds:[], note:s.note
  };
  pt.invoices.push(iv);

  if(advUse > 0){
    pt.advance.balance = Math.round((pt.advance.balance - advUse)*100)/100;
    pt.advance.txns.push({id:uid('ADV'), no:nextNo('rct','RCT-'), type:'Applied', amount:-advUse,
      mode:'advance', ref:iv.no, at:NOW(), by:S.user.name, note:'Applied to '+iv.no});
  }
  if(r.T.company > 0 && pt.plan) pt.plan.consumed = Math.round((pt.plan.consumed + r.T.company)*100)/100;
  if(r.T.deduct > 0){
    v.deductibleApplied = true;
    if(pt.plan) pt.plan.deductibleUsed = Math.round(((pt.plan.deductibleUsed||0) + r.T.deduct)*100)/100;
  }
  lines.forEach(b=>{ if(b.orderId){ const o=(v.orders||[]).find(x=>x.id===b.orderId); if(o) o.status='Billed'; } });

  /* clear only what was just billed */
  const billed = {}; lines.forEach(l=>{ billed[l.key] = true; });
  s.extras = s.extras.filter(x=>!billed[x.lid]);
  if(billed.CONS) s.vLine = null;
  s.sel = {}; s.selInit = false;
  s.drawer = null; s.catOpen = false; s.catQ = ''; s.note = '';
  S.modal = {type:'invoice', ptId:pt.id, invId:iv.id, fresh:true, unlocked:stage===1};
  toast('Invoice '+iv.no+' created'+(iv.T.due>0?' · '+money(iv.T.due)+' collected':' · no patient charge'));
  paint();
};

ACT.refundInv = d => {

  const sel = {};
  iv.lines.forEach((l,i)=>{ sel[i] = false; });
  S.modal = {type:'refund', invId:iv.id, sel, reason:REFUND_REASONS[0], note:'', mode:'cash', ref:''};
  paint();
};
ACT.rfLine  = (d,el) => { S.modal.sel[d.i] = el.checked; paint(); };
ACT.rfAll   = () => {
  const {iv} = locateInv(S.modal.invId);
  const all = iv.lines.every((l,i)=>S.modal.sel[i] || (l.patient - l.refunded) <= 0.005);
  iv.lines.forEach((l,i)=>{ S.modal.sel[i] = all ? false : (l.patient - l.refunded) > 0.005; });
  paint();
};

function refundCalc(iv, sel){
  let patient = 0, company = 0;
  const lines = [];
  iv.lines.forEach((l,i)=>{
    if(!sel[i]) return;
    const avail = Math.round((l.patient - l.refunded)*100)/100;
    if(avail <= 0.005) return;
    patient += avail; company += l.company;
    lines.push({idx:i, code:l.code, name:l.name, qty:l.qty, patient:avail, company:l.company});
  });
  return {lines, patient:Math.round(patient*100)/100, company:Math.round(company*100)/100};
}

          return `<tr class="hov" style="${avail<=0.005?'opacity:.5':''}">

        }).join('')}</tbody></table></div></div>

          <div class="field" style="margin-bottom:11px"><span class="label">Reason</span>

              ${PAYMENT_MODES.filter(x=>x.kind==='settle'||x.kind==='advance').map(x=>
                `<option value="${x.id}" ${m.mode===x.id?'selected':''}>${esc(x.label)}${x.kind==='advance'?' (back to wallet)':''}</option>`).join('')}</select>

               :r.patient>0?`<div class="alert a-green" style="margin:11px 0 0">${ic('checkC')}<div>

ACT.saveRefund = () => {
  const m = S.modal, {pt, iv} = locateInv(m.invId);
  const r = refundCalc(iv, m.sel);
  const needsApproval = r.patient > APPROVAL_THRESHOLD;
  const rf = {
    id:uid('RFD'), no:nextNo('rfd','CRN-'), invId:iv.id, invNo:iv.no, at:NOW(), by:S.user.name,
    reason:m.reason, note:m.note, mode:m.mode, ref:m.ref, amount:r.patient, company:r.company,
    lines:r.lines, status: needsApproval ? 'Pending approval' : 'Approved'
  };
  iv.refunds.push(rf); pt.refunds.push(rf);
  if(!needsApproval) applyRefund(pt, iv, rf);
  S.modal = needsApproval
    ? {type:'doc', title:'Refund request raised', html:docRefund(pt, iv, rf)}
    : {type:'doc', title:'Credit note', html:docRefund(pt, iv, rf)};
  toast(needsApproval ? 'Refund '+rf.no+' awaiting approval.' : 'Refunded '+money(rf.amount)+' · '+rf.no);
  paint();
};

function applyRefund(pt, iv, rf){
  rf.lines.forEach(l=>{ iv.lines[l.idx].refunded = Math.round((iv.lines[l.idx].refunded + l.patient)*100)/100; });
  if(rf.company > 0 && pt.plan) pt.plan.consumed = Math.max(0, Math.round((pt.plan.consumed - rf.company)*100)/100);
  if(kindOf(rf.mode) === 'advance'){
    pt.advance.balance = Math.round((pt.advance.balance + rf.amount)*100)/100;
    pt.advance.txns.push({id:uid('ADV'), no:nextNo('rct','RCT-'), type:'Deposit', amount:rf.amount,
      mode:'advance', ref:rf.no, at:NOW(), by:S.user.name, note:'Refund of '+iv.no+' credited to wallet'});
  }
  const fully = iv.lines.every(l => (l.patient - l.refunded) <= 0.005);
  iv.status = fully ? 'Refunded' : 'Part refunded';
}
ACT.approveRfd = d => {
  for(const pt of PATIENTS){
    const rf = pt.refunds.find(x=>x.id===d.r);
    if(!rf) continue;
    const {iv} = locateInv(rf.invId);
    rf.status = 'Approved'; rf.approvedBy = 'Supervisor · F. Qassim'; rf.approvedAt = NOW();
    applyRefund(pt, iv, rf);
    S.modal = {type:'doc', title:'Credit note', html:docRefund(pt, iv, rf)};
    toast('Refund '+rf.no+' approved · '+money(rf.amount));
    paint(); return;
  }
};
ACT.printRfd = d => {
  for(const pt of PATIENTS){
    const rf = pt.refunds.find(x=>x.id===d.r);
    if(rf){ const {iv}=locateInv(rf.invId); printDoc(docRefund(pt, iv, rf)); return; }
  }
};

function mSettle(m){
  const ids = (m.invIds||[]).filter(id=>locateInv(id));
  if(!ids.length) return `<div class="modal w-sm"><div class="m-h">${ic('info')}<h2>Nothing to settle</h2>

    <span class="m-s">${esc(pt.name)} · MRN ${esc(pt.mrn)}</span>
    <button class="x-btn" data-act="mClose">${ic('x')}</button></div>

        <span class="badge">${invs.length}</span></div>
        <div class="card-b p0"><table><thead><tr><th>Invoice</th><th>Date</th><th>Guarantor / PO</th>
          <th class="r">Credit</th><th class="r">Already settled</th><th class="r">Balance</th></tr></thead>
        <tbody>${invs.map(iv=>{
          const ref = (iv.payments.find(p=>p.mode==='credit')||{}).ref || '—';
          return `<tr><td class="mono t-strong t-xs">${esc(iv.no)}</td><td class="t-xs">${dstr(iv.date)}</td>
            <td class="t-xs mono">${esc(ref)}</td><td class="r num">${money(iv.creditAmt)}</td>
            <td class="r num">${money(iv.creditSettled)}</td>
            <td class="r num t-strong">${money(iv.creditAmt-iv.creditSettled)}</td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><th colspan="5" class="r">Total outstanding</th><th class="r num">${money(outstanding)}</th></tr></tfoot>
        </table></div></div>
      <div class="grid2">
        <div class="field"><span class="label">Amount received</span>
          <input class="ctl" type="number" min="0" step="0.01" data-fk="sa" data-inp="mField" data-k="amount" data-repaint="1" value="${esc(m.amount)}">
          ${over?`<span class="hint" style="color:var(--red)">More than the outstanding balance.</span>`
                :`<span class="hint">Part payments are allowed — the rest stays open.</span>`}</div>
        <div class="field"><span class="label">Received via</span>
          <select class="ctl" data-inp="mField" data-k="mode" data-repaint="1">
            ${modes.map(x=>`<option value="${x.id}" ${m.mode===x.id?'selected':''}
              ${x.kind==='advance'&&advCap<=0?'disabled':''}>${esc(x.label)}${x.kind==='advance'?' ('+money(advCap)+' available)':''}</option>`).join('')}</select></div>
      </div>

}

ACT.saveSettle = () => {
  const m = S.modal, first = locateInv(m.invIds[0]), pt = first.pt;
  let left = Math.round((+m.amount||0)*100)/100;
  const total = left;
  const invs = m.invIds.map(id=>locateInv(id).iv).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const touched = [];
  for(const iv of invs){
    if(left <= 0.005) break;
    const bal = Math.round((iv.creditAmt - iv.creditSettled)*100)/100;
    const take = Math.min(bal, left);
    iv.creditSettled = Math.round((iv.creditSettled + take)*100)/100;
    iv.paid = Math.round((iv.paid + take)*100)/100;
    iv.creditLog = iv.creditLog || [];
    const log = {id:uid('CRS'), no:nextNo('cr','SET-'), amount:take, mode:m.mode, ref:m.ref||'',
                 at:NOW(), by:S.user.name};
    iv.creditLog.push(log);
    if(iv.creditAmt - iv.creditSettled <= 0.005 && iv.status==='Credit open') iv.status = 'Paid';
    touched.push([iv.no, take]);
    left = Math.round((left - take)*100)/100;
  }
  if(kindOf(m.mode) === 'advance'){
    pt.advance.balance = Math.round((pt.advance.balance - total)*100)/100;
    pt.advance.txns.push({id:uid('ADV'), no:nextNo('rct','RCT-'), type:'Applied', amount:-total,
      mode:'advance', ref:touched.map(t=>t[0]).join(', '), at:NOW(), by:S.user.name, note:'Credit settlement'});
  }
  S.modal = {type:'doc', title:'Credit settlement receipt', html:docReceipt(pt, {
    no:nextNo('cr','SET-'), kind:'CREDIT SETTLEMENT', date:NOW(),
    rows:touched.map(t=>['Invoice '+t[0], t[1]]), total, mode:m.mode, ref:m.ref,
    foot:'Remaining credit outstanding: SAR '+money(creditOut(pt))})};
  toast('Settled '+money(total)+' across '+touched.length+' invoice(s).');
  paint();
};

/* ================================================================
   19. PRINTABLE DOCUMENTS
   ================================================================ */
function docHead(pt, title, no, date){
  const h = HOSPITALS.find(x=>x.id===(pt.hospital||'ALH')) || HOSPITALS[0];
  return `<div class="doc-h">
    <div class="dh-l"><h1>VÍDA · ${esc(h.name)}</h1>
      <p>${esc(h.city)}, Kingdom of Saudi Arabia · VAT 3001234567800003 · +966 12 000 0000</p></div>
    <div class="dh-r"><div class="t">${esc(title)}</div>
      <div style="margin-top:3px">No. <b>${esc(no)}</b></div>
      <div>${dtstr(date)}</div></div></div>`;
}
function docParty(pt, extra){
  return `<div class="doc-grid">
    <div><div class="dg-t">Patient</div>
      <div class="dg-r"><span>Name</span><b>${esc(pt.name)}</b></div>
      <div class="dg-r"><span>MRN</span><b>${esc(pt.mrn)}</b></div>
      <div class="dg-r"><span>National ID</span><span>${esc(pt.nid)}</span></div>
      <div class="dg-r"><span>Age / Sex</span><span>${age(pt.dob)}y · ${esc(pt.gender)}</span></div>
      <div class="dg-r"><span>Mobile</span><span>${esc(pt.phone)}</span></div></div>
    <div><div class="dg-t">Payer</div>
      <div class="dg-r"><span>Payer</span><b>${esc(payerOf(pt).name)}</b></div>
      ${pt.plan?`<div class="dg-r"><span>Policy</span><span>${esc(pt.plan.no)}</span></div>
      <div class="dg-r"><span>Class</span><span>${esc(pt.plan.class)}</span></div>
      <div class="dg-r"><span>Status</span><b>${esc(pt.plan.status)}</b></div>
      <div class="dg-r"><span>Limit remaining</span><span>SAR ${money(limitLeft(pt))}</span></div>`
      :`<div class="dg-r"><span>Coverage</span><span>Self-pay</span></div>`}
      ${(extra||[]).map(r=>`<div class="dg-r"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}
    </div></div>`;
}
function docSign(a, b){
  return `<div class="doc-f"><div class="doc-sign">${esc(a)}</div><div class="doc-sign">${esc(b)}</div></div>`;
}

function docInvoice(pt, iv){
  const v = pt.visits.find(x=>x.id===iv.visitId);
  const t = v ? VISIT_TYPES[v.type] : null;
  const refunded = iv.refunds.filter(r=>r.status==='Approved').reduce((a,r)=>a+r.amount,0);
  const openCr = iv.creditAmt - iv.creditSettled;
  return `<div class="doc">
    ${docHead(pt, 'TAX INVOICE', iv.no, iv.date)}
    ${docParty(pt, [['Invoice for', iv.kindLabel || (iv.kind==='visit' ? 'Visit charge' : 'Orders & services')],
                    ['Visit', v ? v.no+' · '+t.label : '—'], ['Clinic', v?v.clinic:'—'], ['Doctor', v?v.doctor:'—']])}
    <table class="doc-t"><thead><tr><th style="width:26px">#</th><th>Code</th><th>Description</th>
      <th style="width:34px">Qty</th><th style="width:60px">Rate</th><th style="width:44px">Disc</th>
      <th style="width:64px">Net</th><th style="width:70px">Payer</th><th style="width:70px">Patient</th></tr></thead>
      <tbody>${iv.lines.map((l,i)=>`<tr>
        <td>${i+1}</td><td>${esc(l.code)}</td>
        <td>${esc(l.name)}<div style="font-size:8.5px;color:#666">${esc(l.note)}${l.refunded?' · refunded '+money(l.refunded):''}</div></td>
        <td style="text-align:center">${l.qty}</td>
        <td style="text-align:right">${money(l.price)}</td>
        <td style="text-align:right">${l.disc?l.disc+'%':'—'}</td>
        <td style="text-align:right">${money(l.net)}</td>
        <td style="text-align:right">${money(l.company)}</td>
        <td style="text-align:right"><b>${money(l.patient)}</b></td></tr>`).join('')}</tbody></table>
    <div class="doc-tot">
      <div class="dt-r"><span>Gross charges</span><span>${money(iv.T.gross)}</span></div>
      ${iv.T.disc>0?`<div class="dt-r"><span>Discount</span><span>−${money(iv.T.disc)}</span></div>`:''}
      <div class="dt-r"><span>Net charges</span><span>${money(iv.T.net)}</span></div>
      <div class="dt-r"><span>${esc(PAYERS[iv.payerId].short)} share</span><span>−${money(iv.T.company)}</span></div>
      ${iv.T.deduct>0?`<div class="dt-r"><span>Deductible charged to patient</span><span>${money(iv.T.deduct)}</span></div>`:''}
      ${VAT_ON&&iv.T.vat>0?`<div class="dt-r"><span>VAT ${Math.round(VAT_RATE*100)}%</span><span>${money(iv.T.vat)}</span></div>`
        :`<div class="dt-r"><span>VAT</span><span>Exempt — medical services</span></div>`}
      <div class="dt-r b"><span>PATIENT PAYABLE (SAR)</span><span>${money(iv.T.due)}</span></div>
      ${iv.payments.map(p=>`<div class="dt-r"><span>${esc(PAYMENT_MODES.find(m=>m.id===p.mode).label)}${p.ref?' · '+esc(p.ref):''}</span>
        <span>${money(p.amount)}</span></div>`).join('')}
      ${openCr>0.005?`<div class="dt-r"><span><b>Balance on credit</b></span><span><b>${money(openCr)}</b></span></div>`:''}
      ${refunded>0?`<div class="dt-r"><span>Refunded to date</span><span>−${money(refunded)}</span></div>`:''}
    </div>
    ${docSign('Cashier — '+iv.cashier, 'Patient / Guarantor signature')}
    <div class="doc-note">Insurance shares are provisional and subject to payer adjudication. Deductibles and
      co-insurance follow the policy in force on the date of service. Keep this invoice for any reimbursement claim.
      Refunds are subject to hospital policy and require this original document.</div>
  </div>`;
}

function docReceipt(pt, o){
  return `<div class="doc">
    ${docHead(pt, o.kind, o.no, o.date)}
    ${docParty(pt, [])}
    <table class="doc-t"><thead><tr><th>Description</th><th style="width:110px">Amount (SAR)</th></tr></thead>
      <tbody>${o.rows.map(r=>`<tr><td>${esc(r[0])}</td>
        <td style="text-align:right">${money(r[1])}</td></tr>`).join('')}</tbody></table>
    <div class="doc-tot">
      <div class="dt-r"><span>Mode</span><span>${esc(PAYMENT_MODES.find(m=>m.id===o.mode).label)}${o.ref?' · '+esc(o.ref):''}</span></div>
      <div class="dt-r b"><span>TOTAL (SAR)</span><span>${money(o.total)}</span></div>
    </div>
    ${o.foot?`<div class="doc-note" style="border:none;margin-top:9px"><b>${esc(o.foot)}</b></div>`:''}
    ${docSign('Cashier — '+S.user.name, 'Received by')}
    <div class="doc-note">This receipt is valid only with the hospital stamp. Advance balances are refundable
      against this receipt subject to hospital policy.</div>
  </div>`;
}

function docRefund(pt, iv, rf){
  return `<div class="doc">
    ${docHead(pt, rf.status==='Approved' ? 'CREDIT NOTE' : 'REFUND REQUEST', rf.no, rf.at)}
    ${docParty(pt, [['Against invoice', iv.no], ['Invoice date', dstr(iv.date)], ['Status', rf.status]])}
    <table class="doc-t"><thead><tr><th style="width:26px">#</th><th>Code</th><th>Description</th>
      <th style="width:34px">Qty</th><th style="width:78px">Payer reversed</th><th style="width:82px">Patient refund</th></tr></thead>
      <tbody>${rf.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.code)}</td><td>${esc(l.name)}</td>
        <td style="text-align:center">${l.qty}</td>
        <td style="text-align:right">${money(l.company)}</td>
        <td style="text-align:right"><b>${money(l.patient)}</b></td></tr>`).join('')}</tbody></table>
    <div class="doc-tot">
      <div class="dt-r"><span>Reason</span><span>${esc(rf.reason)}</span></div>
      ${rf.note?`<div class="dt-r"><span>Note</span><span>${esc(rf.note)}</span></div>`:''}
      <div class="dt-r"><span>Refund mode</span><span>${esc(PAYMENT_MODES.find(m=>m.id===rf.mode).label)}</span></div>
      <div class="dt-r"><span>Payer share reversed</span><span>${money(rf.company)}</span></div>
      <div class="dt-r b"><span>REFUND TO PATIENT (SAR)</span><span>${money(rf.amount)}</span></div>
    </div>
    ${rf.status!=='Approved'?`<div class="doc-note" style="border:none"><b>Pending supervisor approval —
      amount exceeds the SAR ${APPROVAL_THRESHOLD} counter limit. No money has moved yet.</b></div>`:''}
    ${docSign(rf.status==='Approved' ? ('Approved — '+(rf.approvedBy||rf.by)) : ('Raised by — '+rf.by),
              'Patient signature')}
    <div class="doc-note">A credit note reverses the selected lines only. The payer share is credited back to the
      insurer and the patient's annual limit is restored.</div>
  </div>`;
}

ACT.printAdv = d => {
  const pt = findPt(d.p), t = pt.advance.txns.find(x=>x.id===d.t);
  printDoc(docReceipt(pt, {no:t.no, kind:t.amount>0?'ADVANCE DEPOSIT':'ADVANCE APPLIED', date:t.at,
    rows:[[t.note||t.type, Math.abs(t.amount)]], total:Math.abs(t.amount), mode:t.mode, ref:t.ref,
    foot:'Advance balance: SAR '+money(pt.advance.balance)}));
};
ACT.printCr = d => {
  for(const pt of PATIENTS) for(const iv of pt.invoices){
    const l = (iv.creditLog||[]).find(x=>x.id===d.l);
    if(l){ printDoc(docReceipt(pt, {no:l.no, kind:'CREDIT SETTLEMENT', date:l.at,
      rows:[['Invoice '+iv.no, l.amount]], total:l.amount, mode:l.mode, ref:l.ref,
      foot:'Remaining credit outstanding: SAR '+money(creditOut(pt))})); return; }
  }
};

/* ================================================================
   20. BOOT
   ================================================================ */
bind();
S.land = 'today';       /* open on the day's worklist rather than an empty search box */
S.expanded = 'P1';
paint();

</script>
