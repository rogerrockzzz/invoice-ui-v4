<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')(),C=()=>w.eval('cases');
  const open=(id)=>{S.screen='profile';S.caseId=id;R();return C().find(c=>c.id===id);};
  const yes=()=>qa('.step .acts .btn')[0].click();
  if(n==='2'){ open(3); }                                   // waiting for approval
  if(n==='3'){ const c=open(3); w.eval('simApproveConsult')(c); q('details.ext').open=true; }
  if(n==='4'){ const c=open(2); q('details.ext').open=true; }   // mixed orders
  if(n==='5'){ const c=open(2); yes(); w.eval('simPaid')(c); q('details.ext').open=true; }
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
