<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow;
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  const c=w.eval('cases').find(x=>x.id===1);
  c.consult={ name:"Paediatric Consultation", code:"CON-101", price:200, ins:"approved", paid:false };
  c.orders=[]; c.invoices=[]; c.bill=null; c.link=null; c.closed=false; c.prefs={};
  c.orderRounds=0; c.orderChecks=0; c.lastOrderCheck=null; c.dedUsed=0;
  w.eval('openVisit')(1);
  qa('.step .acts .btn')[0].click();
  qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click(); q('#dGo').click();
  w.eval('simOrders')(c);
  c.orders=c.orders.filter(o=>o.ins!=='pending'); R();
  qa('.step .acts .btn')[0].click();
  qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click(); q('#dGo').click();
  if(n==='2'){ qa('.step .acts .btn')[0].click(); qa('.step .acts .btn')[0].click(); }
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
