      <div class="sub">${s.sub||""}</div>
      ${s.amt!==undefined&&s.amt!==null?`<div class="amt">${fmt(s.amt)}<small>${s.amtLabel||""}</small></div>`:""}
      ${s.amts?`<div class="amtrow">${s.amts.map(a=>
        `<div class="amt ${a.tone==="soft"?"soft":""}">${fmt(a.v)}<small>${a.label}</small></div>`).join("")}</div>`:""}
      <div class="acts"></div>
    </div>`);
  const sb = box.querySelector("#stBack");
  if(sb) sb.onclick = s.back;
  const acts = box.querySelector(".acts");
  const add = (label, cls, fn)=>{ const b = el(`<button class="btn ${cls}">${label}</button>`); b.onclick = fn||(()=>render()); acts.appendChild(b); };
  if(s.yes) add(s.yes.label, "yes", s.yes.fn);
  if(s.no)  add(s.no.label, "", s.no.fn);
  (s.acts||[]).forEach(a=>add(a.label, a.primary?"blue":a.danger?"danger":a.ghost?"link":"", a.fn));
  box.querySelectorAll(".sub .invlink").forEach(a=>a.onclick = ()=>openInvoice(a.dataset.inv));
  if(s.ext) box.appendChild(orderTable(c, s.ext));
  return box;
}

function orderTable(c, ext){
  const plan = planOf(c);
  const pick = !!ext.selectable;
  let left = dedPool(c).left;
  const rows = ext.lines.map(l=>{
    const on = !pick || c.sel?.[l.code] !== false;
    const calc = calcLine(l, (isPending(l)||!on)?0:left, plan);
    if(!isPending(l) && on) left = +(left-calc.deductible).toFixed(2);
    return { l, calc, on };
  });
  /* an order already on an invoice is history — it is never part of what is being charged now */
  const tot = rows.filter(r=>!isPending(r.l) && !r.l.invoiceId && r.on)
    .reduce((a,r)=>({p:a.p+r.calc.patientWithTax, co:a.co+r.calc.companyWithTax}), {p:0,co:0});
  const box = el(`
    <details class="ext" ${ext.open?"open":""}>
      <summary>${ext.title}</summary>
      <table class="ord">
        <thead><tr>${pick?`<th class="tick"></th>`:""}<th>Procedure</th><th>Approval</th><th class="num">Price</th>
          <th class="num">Patient + VAT</th><th class="num">Payer + VAT</th></tr></thead>
        <tbody>${rows.map(({l,calc,on})=>`<tr class="${isPending(l)?"pend":l.invoiceId?"done":!on?"off":""}">
          ${pick?`<td class="tick">${(isPending(l)||l.invoiceId)?""
            :`<input type="checkbox" class="lnChk" data-code="${l.code}" ${on?"checked":""}>`}</td>`:""}
          <td><b>${l.name}</b><div style="font-size:10px;color:var(--muted)">${l.code}${l.ordered?` · ordered ${l.ordered}`:""}${l.branch?` · <span class="ibtag">⇄ ${l.branch}</span>`:""}${l.fromPackage?` · <span class="pkgtag">from ${l.fromPackage.parent}</span>`:""}</div>
            ${l.package&&l.children?`<div class="kids">${l.children.map(k=>`<span>${k.name}</span>`).join("")}</div>`:""}</td>
          <td>${l.urgentCash
              ? `<span class="badge warn">${l.approvalPending?"Cash · approval outstanding":l.approvalGranted?"Cash · approval received":"Billed as cash"}</span>`
              : `<span class="badge ${l.invoiceId?"cash":l.ins==="approved"?"ok":l.ins==="partial"?"blue":isPending(l)?"warn":"cash"}">${l.invoiceId?"Already billed":insStatuses[l.ins].label}</span>`}</td>
          <td class="num">${fmt(l.price)}</td>
          <td class="num"><b>${l.invoiceId?`<span class="muted">${l.invoiceId}</span>`:isPending(l)?"—":!on?"—":fmt(calc.patientWithTax)}</b></td>
          <td class="num">${(l.invoiceId||isPending(l)||!on)?"—":fmt(calc.companyWithTax)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="${pick?4:3}">Charged now${pick?`
          <span class="sm">${rows.filter(r=>r.on&&!isPending(r.l)&&!r.l.invoiceId).length} of
            ${rows.filter(r=>!isPending(r.l)&&!r.l.invoiceId).length} line(s) ticked</span>`:""}</td>
          <td class="num">${fmt(tot.p)}</td><td class="num">${fmt(tot.co)}</td></tr></tfoot>
      </table>
      ${ext.note?`<div class="extnote">${ext.note}</div>`:""}
    </details>`);
  if(pick) box.querySelectorAll(".lnChk").forEach(chk=>chk.onchange = ()=>toggleLine(c, chk.dataset.code, ext.lines));
  return box;
}

  pop.querySelector("#nvDoctor").onchange = (e)=>{ d.doctor = e.target.value; render(); };

      payerId:d.payerId, dedUsed:0,
      date:"Today", sortKey:9001,
      consult:{ name:`${d.clinic.charAt(0)+d.clinic.slice(1).toLowerCase()} ${d.type==="Follow-up"?"Follow-up":"Consultation"}`,
        code:"CON-"+Math.floor(100+Math.random()*899), price:fee,
        ins: d.type==="Procedure only" ? "notcovered" : (insured?"pending":"notinsured"),

/* Settling credit: pick which unsettled invoices are being paid, then carry on
   through the usual link / desk choice. */
function renderCreditStep(){
  const c = state.credit.c, sel = state.credit.sel;
  const who = patients[c.mrn];
  const list = creditInvoices(c.mrn);
  const chosen = list.filter(x=>sel[x.inv.id]);
  const amt = +chosen.reduce((a,x)=>a+x.inv.patient,0).toFixed(2);
  const box = el(`
    <div class="step ${amt?"":"wait"}">
      <span class="tag warn">Credit settlement</span>
      <h2>Which invoices is ${who.name.split(" ")[0]} settling?</h2>
      <div class="sub">${list.length} invoice(s) were left on credit${list.length>1?" across earlier visits":""}.
        Tick what is being paid now — the rest stays on the account.</div>
      <div class="crlist">${list.map(x=>{
        const on = !!sel[x.inv.id];
        return `<label class="crrow ${on?"on":""}">
          <input type="checkbox" class="crChk" data-id="${x.inv.id}" ${on?"checked":""}>
          <div class="d"><b>${x.inv.id}</b>
            <span>${x.inv.at} · ${x.c.clinic} · ${x.inv.scope==="consult"?"Consultation":"Doctor's orders"}
              · ${x.inv.rows.map(r=>r.name).join(", ")}</span></div>
          <div class="a">${fmt(x.inv.patient)}</div>
          <a class="invlink" data-inv="${x.inv.id}">view</a>
        </label>`;
      }).join("")}</div>
      <div class="amt">${fmt(amt)}<small>${chosen.length} of ${list.length} invoice(s) selected</small></div>
      <div class="acts">
        <button class="btn yes" id="ccLink" ${amt?"":"disabled"}>Send payment link</button>
        <button class="btn" id="ccDesk" ${amt?"":"disabled"}>Take payment at the desk</button>
        <button class="btn link" id="ccBack">Back</button>
      </div>
    </div>`);
  box.querySelectorAll(".crChk").forEach(chk=>chk.onchange = (e)=>{
    e.stopPropagation();
    if(chk.checked) sel[chk.dataset.id] = true; else delete sel[chk.dataset.id];
    render();
  });
  box.querySelectorAll(".invlink").forEach(a=>a.onclick = (e)=>{ e.preventDefault(); e.stopPropagation(); openInvoice(a.dataset.inv); });
  if(amt){
    box.querySelector("#ccLink").onclick = ()=>{
      const target = cases.find(v=>v.id===state.caseId && v.mrn===c.mrn) || chosen[0].c;
      record(target,"i", `<b>Credit payment link sent</b> — ${fmt(amt)}`,
        `To ${who.mobile} · ${chosen.length} invoice(s) · ${chosen.map(x=>x.inv.id).join(", ")}`,
        { type:"CREDIT", amount:amt, mode:"Payment link", invoiceId:chosen[0].inv.id,
          invoiceIds:chosen.map(x=>x.inv.id),
          settled:chosen.map(x=>({ id:x.inv.id, amount:x.inv.patient, visit:`${x.c.visitType} · ${x.c.clinic} · ${x.c.date||""}` })) });
      toast("", "Link sent", `${who.name} · ${fmt(amt)} credit`);
      state.credit = null; render();
    };
    box.querySelector("#ccDesk").onclick = ()=>{
      state.drawer = { c, mode:"Cash", amount:amt, credit:true, ids:chosen.map(x=>x.inv.id) };
      state.credit = null; render();
    };
  }
  box.querySelector("#ccBack").onclick = ()=>{ state.credit=null; render(); };
  return box;
}

function renderHistory(c){
  /* open unless the receptionist folded it away — the choice sticks across visits */
  const open = state.histOpen !== false;
  const last = c.history[0];
  const box = el(`<div class="hist ${open?"open":"shut"}">
    <h3 id="hiHead"><span class="tg">${open?"▾":"▸"}</span> What has happened on this visit
      <span class="r">${open?"click any line for the detail"
        :`${c.history.length} event(s)${last?` · last: ${last.tx.replace(/<[^>]+>/g,"")} · ${last.at}`:""}`}</span></h3></div>`);
  box.querySelector("#hiHead").onclick = ()=>{ state.histOpen = !open; render(); };
  if(!open) return box;
  if(!c.history.length) box.appendChild(el(`<div class="empty">Nothing recorded yet.</div>`));
  c.history.forEach((h, i)=>{
    /* any invoice number in the line becomes its own link to the preview */
    const sub = (h.sub||"").replace(/(INV-\d+)/g, `<a class="invlink" data-inv="$1">$1</a>`);
    const row = el(`
      <div class="hev click">
        <div class="ic ${h.ic||""}">${h.ic==="i"?"i":h.ic==="w"?"!":"✓"}</div>
        <div class="tx">${h.tx}${sub?`<span>${sub}</span>`:""}</div>
        <div class="tm">${h.at}<span class="more">detail ›</span></div>
      </div>`);
    row.onclick = ()=>{ state.eventPop = { c, i }; render(); };

      e.stopPropagation();                         /* the number opens the invoice, not the event */
      openInvoice(a.dataset.inv);

    box.appendChild(row);
  });
  return box;
}

/* ---------------- an invoice, wherever it lives ---------------- */
function findInvoice(id){
  for(const c of cases){ const inv = c.invoices.find(i=>i.id===id); if(inv) return { c, inv }; }
  return null;
}
function openInvoice(id){ const hit = findInvoice(id); if(hit) { state.invPop = { id }; render(); } }

/* ---------------- what happened, in detail ---------------- */
const EV_TITLES = { PAYMENT:"Payment", LINK:"Payment link", APPROVAL:"Payer approval", ORDERS:"Doctor's orders",
  PAYER:"Payer changed", ADVANCE:"Advance received", CREDIT:"Credit settled", VISIT:"Visit created",
  REPRINT:"Invoice reprinted", PKGBOOK:"Package procedure booked", PKGPRINT:"Package procedure printed",
  PKGREADY:"Package procedures ready to book", VOID:"Print undone", REPLACE:"Invoice replaced",
  LINKCANCEL:"Payment link cancelled",
  REPLACE_START:"Replacement started", REPLACE_CANCEL:"Replacement cancelled",
  CASH_URGENT:"Billed as cash, approval outstanding", CHECK:"Approval checked" };
function renderEventPop(){
  const { c, i } = state.eventPop;
  const h = c.history[i];
  const plain = h.tx.replace(/<[^>]+>/g,"");
  const frag = document.createDocumentFragment();
  const scrim = el(`<div class="scrim"></div>`);

  add("When", `${h.at} today`);
  add("Recorded by", h.by || USER);
  add("Patient", `${pt(c).name} · MRN ${pt(c).mrn}`);
  add("Visit", `${c.visitType} · ${c.clinic} · Dr ${c.doctor}`);
  if(h.amount!==undefined) add(h.type==="ADVANCE"?"Amount received":h.type==="CREDIT"?"Amount settled":"Patient share", fmt(h.amount));
  if(h.company) add(`${payerName(c)} share`, fmt(h.company));
  if(h.deductible) add("Deductible consumed", fmt(h.deductible));
  add("Payment mode", h.mode);
  add("Reference", h.ref);
  add("Advance type", h.cat ? h.cat+" advance" : "");
  add("Scope", h.scope==="consult" ? "Consultation" : h.scope==="orders" ? "Doctor's orders" : "");
  if(h.type==="PAYER"){ add("Was", h.from); add("Now", h.to); }
  if(h.invoiceIds && h.invoiceIds.length>1)
    add("Invoices settled", h.invoiceIds.map(id=>`<a class="invlink" data-inv="${id}">${id}</a>`).join(" · "));
  else add("Invoice", h.invoiceId ? `<a class="invlink" data-inv="${h.invoiceId}">${h.invoiceId}</a>` : (h.type==="PAYMENT"?"—":""));

  const pop = el(`
    <div class="pop">
      <span class="x" id="evX">✕</span>
      <h3>${EV_TITLES[h.type] || "Event"}</h3>
      <div class="psub">${plain}</div>
      <div class="evrows">${rows.join("")}</div>
      ${h.settled && h.settled.length ? `
        <div class="sub-h">Invoices settled</div>
        <table class="ord">
          <thead><tr><th>Invoice</th><th>Raised on</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody>${h.settled.map(x=>`<tr>
            <td><a class="invlink" data-inv="${x.id}">${x.id}</a></td>
            <td class="s">${x.visit}</td>
            <td class="num"><b>${fmt(x.amount)}</b></td>
            <td><button class="btn sm" data-view="${x.id}">View</button></td></tr>`).join("")}</tbody>
        </table>`:""}
      ${h.lines && h.lines.length ? `
        <div class="sub-h">Lines involved</div>
        <table class="ord">

/* ---------------- invoices screen ---------------- */
function allInvoices(){
  const out = [];
  cases.forEach(c=>c.invoices.forEach(inv=>out.push({ c, inv })));
  return out.sort((a,b)=>(b.inv.at||"").localeCompare(a.inv.at||""));
}
function renderInvoices(){
  const wrap = document.createElement("div");
  const q = (state.invQ||"").trim().toLowerCase();
  const list = allInvoices().filter(({c,inv})=>{
    if(!q) return true;
    const p = pt(c);
    return inv.id.toLowerCase().includes(q) || p.name.toLowerCase().includes(q) || p.mrn.includes(q);
  });
  const total = +list.reduce((a,x)=>a+x.inv.patient,0).toFixed(2);

  wrap.appendChild(el(`<div class="crumb"><a id="back">← Back</a> &nbsp;/&nbsp; Invoices</div>`));
  const box = el(`
    <div class="hsearch">
      <div class="grow"><div class="lbl">Find an invoice</div>
        <div class="box"><input id="iq" placeholder="Invoice number, patient name or MRN" value="${state.invQ||""}"><button class="go" id="igo">🔍</button></div>
      </div>
    </div>`);
  box.querySelector("#iq").oninput = (e)=>{ state.invQ = e.target.value; render(); };
  box.querySelector("#igo").onclick = ()=>render();
  wrap.appendChild(box);

  wrap.appendChild(el(`<div class="hhead"><h1>Invoices</h1>
    <span>${list.length} invoice(s) · ${fmt(total)} collected from patients</span></div>`));

  const table = invoiceTable(list, { showPatient:true, emptyNote:`No invoice matches “${state.invQ}”.` });

    if(state.caseId) state.screen = "visit"; else if(state.activeMrn) state.screen = "patient"; else state.screen = "home";

/* The package was paid once; performing a child procedure only produces its own
   printed invoice, at nil value, linked to this visit. */
function printPackageOrders(c, lines){
  const t = priceLines(c, lines);
  const src = lines[0].fromPackage || {};
  const inv = { id:"INV-"+Math.floor(100000+Math.random()*899999), scope:"orders", at:now(),
    patient:0, company:0, deductible:0, paid:true, via:"Package", viaDetail:"",
    payer:payerOf(c).label, packagePrint:{ parent:src.parent, invoiceId:src.invoiceId },
    rows:t.rows.map(x=>({ name:x.line.name, code:x.line.code,
      calc:{ gross:0, discount:0, net:0, deductible:0, patient:0, company:0, patientWithTax:0, companyWithTax:0 } })) };
  c.invoices.unshift(inv);
  lines.forEach(l=>{ l.paid = true; l.via = "Package"; l.invoiceId = inv.id; });
  c.bill = null; c.link = null;
  record(c, "", `<b>Package procedure invoice printed</b> — ${inv.id}`,
    `${lines.map(l=>l.name).join(", ")} · no charge · already paid inside ${src.parent||"the package"} on ${src.invoiceId}`,
    { type:"PKGPRINT", invoiceId:inv.id, amount:0, mode:"Package", scope:"orders",
      lines:lines.map(l=>({ name:l.name, code:l.code, ins:"notcovered", price:0 })) });
  toast("ok", `Invoice ${inv.id} printed`, `${pt(c).name} · no charge · paid inside the package`);
  render();
}

/* Undoing a printed package invoice: nothing was charged, so this voids the print
   and hands the procedure back to be printed again. */
function renderVoidPop(){
  const { c, invId } = state.voidPop;
  const inv = c.invoices.find(i=>i.id===invId);

  const frag = document.createDocumentFragment();

      <div class="advbox short">
        <b>No money was charged on this invoice.</b>
        <div class="hint" style="margin-top:6px">${inv.id} is marked void and the procedure goes back to
          <b>not yet printed</b>.</div>

        <div class="crrow"><span></span>
          <div class="d"><b>${r.name}</b><span>${r.code} · no charge</span></div>

      <div class="fld" style="margin-top:14px"><label>Reason <span style="color:var(--red)">*</span></label>
        <input id="vdReason" value="${d.reason}" placeholder="e.g. printed on the wrong visit">
</div>
      <div class="foot">
        <button class="btn" id="vdCancel">Keep it</button>
        <button class="btn danger" id="vdGo" ${d.reason.trim().length>2?"":"disabled"}>Undo the print</button>

  const close = ()=>{ state.voidPop=null; render(); };
  scrim.onclick = close; pop.querySelector("#vdX").onclick = close; pop.querySelector("#vdCancel").onclick = close;
  if(d.reason.trim().length>2) pop.querySelector("#vdGo").onclick = ()=>voidPrint(c, invId, d.reason.trim());

}
function voidPrint(c, invId, reason){
  const inv = c.invoices.find(i=>i.id===invId);
  inv.voided = { at:now(), by:USER, reason };
  inv.paid = false;
  /* the procedure returns to this visit as not yet printed */
  c.orders.filter(o=>o.invoiceId===invId).forEach(o=>{ o.invoiceId = null; o.paid = false; o.via = null; });
  record(c, "w", `<b>Package procedure print undone</b> — ${invId} voided`,
    `${inv.rows.map(r=>r.name).join(", ")} · ${reason} · no money was involved · can be printed again`,
    { type:"VOID", invoiceId:invId, amount:0, reason,
      lines:inv.rows.map(r=>({ name:r.name, code:r.code, ins:"notcovered", price:0 })) });
  toast("warn", `Print undone · ${invId}`, `${pt(c).name} · the procedure can be printed again`);
  state.voidPop = null;
  render();
}

      note:`Refund credited to the wallet · ${reason}` });

  record(c, "w", `<b>Refunded ${fmt(amt)}</b> — ${inv.id}`,
    `${chosen.map(r=>r.name).join(", ")} · ${mode}${detail?" · "+detail:""} · ${reason}`,

}

/* The payment pop-up: pick the mode and complete the payment here. */
/* A payment is built up one mode at a time: what has been taken already is fixed,
   and the mode chips at the top always drive the part being entered now. */
function payTaken(d){ return d.parts || (d.parts = []); }
const payAllocated = (d)=>+payTaken(d).reduce((a,p)=>a+p.amount,0).toFixed(2);
const payRemaining = (d)=>+(d.amount - payAllocated(d)).toFixed(2);
/* the cash in hand is what the notes add up to; other modes take whatever is typed */
function payTendered(d){
  if(d.mode!=="Cash") return null;
  const left = payRemaining(d);
  if(d.notesFor !== left){ d.notes = suggestNotes(left); d.notesFor = left; d.tenderManual = null; }
  return d.tenderManual!=null ? (parseFloat(d.tenderManual)||0) : notesTotal(d.notes);
}
function payActive(d){
  const left = payRemaining(d);
  if(left <= 0.004) return null;                       /* everything is already allocated */
  const amount = d.mode==="Cash"
    ? Math.min(left, payTendered(d))                   /* cash covers only what was handed over */
    : (d.partAmt!=null ? Math.max(0, Math.min(left, d.partAmt)) : left);
  return { mode:d.mode, amount:+amount.toFixed(2), ref:d.ref||"", ref2:d.ref2||"" };
}
function payParts(d){
  const act = payActive(d);
  return [...payTaken(d), ...(act && act.amount>0.004 ? [act] : [])];
}
const partsLabel = (parts)=>parts.map(p=>modeLabel(p.mode)).join(" + ");
/* how much of a pot a split is trying to draw, so it can be checked against the wallet */
function advShortfall(c, parts){
  const w = walletOf(c);
  const want = {};
  parts.forEach(p=>{ const m = payMode(p.mode); if(m.advance) want[m.advance] = +( (want[m.advance]||0) + p.amount ).toFixed(2); });
  return Object.entries(want).filter(([k,v])=>v > w.advance[k] + 0.004)
    .map(([k,v])=>({ cat:k, want:v, has:w.advance[k] }));
}

function renderDrawer(){
  const d = state.drawer, c = d.c, w = walletOf(c);
  const adv = advTotal(c);
  const isMoneyBack = !!(d.refund || d.refundDiff);
  const simple = isMoneyBack || d.credit;
  const parts = simple ? [{ mode:d.mode, amount:d.amount, ref:d.ref, ref2:d.ref2 }] : payParts(d);
  const taken = simple ? [] : payTaken(d);
  const left  = simple ? d.amount : payRemaining(d);
  const active = simple ? null : payActive(d);
  const activeAmt = active ? active.amount : 0;
  const unallocated = simple ? 0 : +(left - activeAmt).toFixed(2);
  const short = isMoneyBack ? [] : advShortfall(c, parts);
  const shortAdv = short.length > 0;
  const tenderedAmt = simple ? 0 : (d.mode==="Cash" ? payTendered(d) : 0);
  const changeBack = (!simple && d.mode==="Cash") ? +(tenderedAmt - activeAmt).toFixed(2) : 0;
  const frag = document.createDocumentFragment();
  const scrim = el(`<div class="scrim"></div>`);

  /* what the advance draw would look like, category by category */
  let rem = d.amount;
  const draw = ADV_CATS.map(k=>{ const take = Math.min(w.advance[k], rem); rem = +(rem-take).toFixed(2); return { k, take }; })
                       .filter(x=>x.take>0);

  const head = (d.refund||d.refundDiff) ? "Refund" : d.credit ? "Credit settlement" : "Payment";
  const dw = el(`
    <div class="drawer">
      <div class="dw-head" style="background:${(d.refund||d.refundDiff)?"var(--red-bg)":d.mode==="Credit"?"var(--amber-bg)":"var(--green-bg)"}">
        <div><div class="k">${head} · ${pt(c).name}</div><div class="v">${fmt(d.amount)}</div></div>
        <div class="x" id="dx">✕</div>
      </div>
      <div class="dw-body">
        ${taken.length?`<div class="taken">
          <div class="sphead">Taken so far<span>${fmt(payAllocated(d))} of ${fmt(d.amount)}</span></div>
          ${taken.map((tp,i)=>`<div class="tk click" data-edit="${i}" title="Click to change this payment">
            <span class="ok">✓</span><span class="mi">${payMode(tp.mode).icon}</span>
            <div class="nm"><b>${modeLabel(tp.mode)}</b>
              <span>${[tp.ref2,tp.ref].filter(Boolean).join(" · ") || "click to change"}</span></div>
            <span class="amt">${fmt(tp.amount)}</span>
            <button class="spX" data-undo="${i}" title="Remove this payment">✕</button>
          </div>`).join("")}
          <div class="tkleft">${left>0.004?`<b>${fmt(left)}</b> still to pay`:`<b>Fully allocated</b>`}</div>
        </div>`:""}
        <span class="lbl">${isMoneyBack?"Refund mode"
          :d.editing?`Changing the ${modeLabel(d.editing).toLowerCase()} payment`
          :taken.length?`How is the remaining ${fmt(left)} being paid?`:"Payment mode"}</span>
        ${isMoneyBack?`
          <div class="modes">${REFUND_MODES.map(m=>`<div class="m ${d.mode===m?"on":""}" data-m="${m}">
            ${m==="Cash"?"💵":m==="Advance wallet"?"👛":"💳"} ${m}
            ${m==="Advance wallet"?`<span class="sm">credit it back</span>`:""}</div>`).join("")}</div>`
        :(()=>{
          /* an advance mode is offered up front only when that pot actually holds money */
          const shown = PAY_MODES.filter(m=>(m.top || (m.advance && w.advance[m.advance]>0)) && !(d.credit && m.id==="Credit"));
          const rest  = PAY_MODES.filter(m=>!shown.includes(m) && !(d.credit && m.id==="Credit"));
          return `
          <div class="modes">${shown.map(m=>`<div class="m ${d.mode===m.id?"on":""}" data-m="${m.id}">
            ${m.icon} ${modeLabel(m.id)}
            ${m.advance?`<span class="sm">${fmt(w.advance[m.advance])} available</span>`
              :m.note?`<span class="sm">${m.note}</span>`:""}</div>`).join("")}
            ${rest.length?`<div class="m more ${rest.some(m=>m.id===d.mode)?"on":""}" id="dMore">
              ⋯ ${rest.some(m=>m.id===d.mode)?modeLabel(d.mode):"More modes"}
              <span class="sm">${rest.length} more</span></div>`:""}</div>
          ${d.moreOpen?`<div class="modemenu">${rest.map(m=>`<div class="mm ${d.mode===m.id?"on":""}" data-m="${m.id}">
            <span>${m.icon} ${modeLabel(m.id)}</span>
            ${m.advance?`<b>${fmt(w.advance[m.advance])}</b>`:""}</div>`).join("")}</div>`:""}`;
        })()}



        ${d.refundDiff?`<div class="advbox short">
            <b>${fmt(d.amount)} goes back to the patient.</b>
            <div class="r"><span>Why</span><b>${d.refundDiff.reason}</b></div>
            <div class="r"><span>New invoice</span><b>raised as this is confirmed</b></div>
            ${d.mode==="Advance wallet"?`<div class="r tot"><span>Credited to the advance wallet</span><b>${fmt(d.amount)}</b></div>`:""}
          </div>`:""}
        ${d.refund?`<div class="advbox short">
            <b>${fmt(d.amount)} goes back to the patient.</b>
            <div class="r"><span>Reason</span><b>${d.refund.reason}</b></div>
            <div class="r"><span>Against</span><b>${d.refund.id}</b></div>
            ${d.mode==="Advance wallet"?`<div class="r tot"><span>Credited to the advance wallet</span><b>${fmt(d.amount)}</b></div>`:""}
          </div>`:""}
        ${(!simple && d.mode==="Cash")?(()=>{
          const notes = d.notes;
          const tendered = tenderedAmt, change = changeBack;
          return `
          <div class="fgrid3">
            <div class="fld"><label>${taken.length?"Still to pay":"Amount to pay"}</label>
              <input class="ro" value="${left.toFixed(2)}" readonly></div>
            <div class="fld"><label>Cash handed over</label>
              <input id="dTend" type="number" step="0.5" value="${tendered.toFixed(2)}"></div>
            <div class="fld"><label>${unallocated>0.004?"Still to allocate":"Change to give back"}</label>
              <input class="ro ${unallocated>0.004?"bad":change>0.004?"good":""}"
                value="${(unallocated>0.004?unallocated:change).toFixed(2)}" readonly></div>
          </div>
          <div class="fld"><label>Notes handed over</label>
            <div class="notes">${NOTES.map(n=>{
              const k = notes[n]||0;
              return `<div class="note ${k?"on":""}" data-note="${n}">
                <span class="v">${noteLabel(n)}</span>
                <span class="k">${k?`× ${k}`:"–"}</span>
                <span class="minus" data-less="${n}" ${k?"":"hidden"}>−</span></div>`;
            }).join("")}</div>
            <div class="tendrow">
              <button class="btn sm" id="dExact">The usual notes for ${fmt(left)}</button>
              <button class="btn sm" id="dClear">Clear</button>
            </div>
            ${d.tenderManual!=null?`<div class="hint"><b>Typed in by hand</b> — the notes are not counted.</div>`:""}
          </div>`;})()
        : ``}
        ${(!simple && d.mode==="Credit")?`
          <div class="advbox warn">
            <b>Left unsettled</b>
            <div class="r"><span>Put on credit now</span><b>${fmt(activeAmt)}</b></div>
            <div class="r tot"><span>Credit after this</span><b>${fmt(creditTotal(c.mrn) + activeAmt)}</b></div>
          </div>`:""}
        ${(!simple && d.mode!=="Cash")?`
          <div class="fld"><label>${d.mode==="Credit"?"Amount to leave on credit"
            :taken.length?`Amount on ${modeLabel(d.mode).toLowerCase()}`:"Amount for this payment"}</label>
            <input id="dPart" type="number" step="0.05" value="${activeAmt.toFixed(2)}">
            <div class="hint">${unallocated>0.004
              ? `<span class="shortpay"><b>${fmt(unallocated)}</b> would still be unpaid — add another payment for the rest.</span>`
              : `Covers the whole of what is left.`}</div></div>`:""}
        ${(!simple && unallocated>0.004)?`
          <button class="btn sm blue" id="dAdd">＋ Add this ${fmt(activeAmt)} and pay the rest another way</button>`:""}
        ${(!isMoneyBack && payMode(d.mode).ref==="card")?`
          <div class="fgrid">
            <div class="fld"><label>Approval no.</label><input id="dRef" value="${d.ref||""}" placeholder="e.g. 884120"></div>
            <div class="fld"><label>Card last 4</label><input id="dRef2" value="${d.ref2||""}" placeholder="4417"></div>
          </div>`:""}
        ${(!isMoneyBack && payMode(d.mode).ref==="referral")?`
          <div class="fgrid">
            <div class="fld"><label>Referring company</label><input id="dRef2" value="${d.ref2||""}" placeholder="e.g. AL TAKHASSUSI"></div>
            <div class="fld"><label>Referral no.</label><input id="dRef" value="${d.ref||""}" placeholder="ICR-40182"></div>
          </div>`:""}
        ${(!isMoneyBack && payMode(d.mode).ref==="finance")?`
          <div class="fld"><label>Finance voucher no.</label><input id="dRef" value="${d.ref||""}" placeholder="FIN-2291"></div>`:""}
        ${(!isMoneyBack && parts.some(p=>payMode(p.mode).advance))?`
          <div class="advbox ${shortAdv?"short":""}">
            ${shortAdv
              ? `<b>Not enough advance.</b> ${short.map(x=>`${x.cat.toLowerCase()} holds ${fmt(x.has)} against ${fmt(x.want)}`).join(" · ")}
                 — take another mode, or top the wallet up first.`
              : `<b>Drawn from the wallet</b>
                 ${parts.filter(p=>payMode(p.mode).advance).map(p=>`<div class="r"><span>${payMode(p.mode).advance} advance</span><b>${fmt(p.amount)}</b></div>`).join("")}
                 <div class="r tot"><span>Wallet after this</span><b>${fmt(adv - parts.filter(p=>payMode(p.mode).advance).reduce((a,p)=>a+p.amount,0))}</b></div>`}
          </div>`:""}
        ${(simple && d.mode==="Credit")?`
          <div class="advbox warn">
            <b>Left unsettled</b>
            <div class="r"><span>Added to outstanding credit</span><b>${fmt(d.amount)}</b></div>
            <div class="r tot"><span>Credit after this</span><b>${fmt(creditTotal(c.mrn) + d.amount)}</b></div>
          </div>`:``}


      </div>
      <div class="dw-tot"><div class="k">${isMoneyBack?"To refund"
        :parts.every(p=>p.mode==="Credit")?"To put on credit"
        :parts.some(p=>p.mode==="Credit")?"To collect and put on credit":"To collect"}
        ${parts.length>1?`<span class="sm">${parts.map(p=>`${modeLabel(p.mode)} ${fmt(p.amount)}`).join(" + ")}</span>`:""}</div>
        <div class="v">${fmt(d.amount)}</div></div>
      <div class="dw-foot">
        <button class="cancel" id="dCancel">Cancel</button>
        <button class="go" id="dGo" ${(shortAdv||unallocated>0.004)&&!isMoneyBack?"disabled":""}
          style="${isMoneyBack?"background:var(--red)":d.mode==="Credit"?"background:var(--amber)":""}">
          ${isMoneyBack?`Refund by ${modeLabel(d.mode).toLowerCase()}`
            :(parts.length===1 && parts[0].mode==="Credit")?"Put on credit"
            :parts.length>1?`Confirm ${parts.length} payments`
            :payMode(d.mode).advance?`Apply ${payMode(d.mode).advance.toLowerCase()} advance`
            :`Confirm ${modeLabel(d.mode).toLowerCase()} payment`}</button>
      </div>
    </div>`);

  dw.querySelectorAll("[data-m]").forEach(m=>m.onclick = ()=>{
    const id = m.dataset.m, meta = payMode(id);
    if(meta.advance && w.advance[meta.advance] <= 0 && !isMoneyBack){
      toast("warn", `No ${meta.advance.toLowerCase()} advance on the wallet`, "Add advance first, or take another mode."); return;
    }
    d.mode = id; d.moreOpen = false;

    d.notesFor = null;
    render();
  });
  const more = dw.querySelector("#dMore");
  if(more) more.onclick = ()=>{ d.moreOpen = !d.moreOpen; render(); };
  /* the amount on the part being entered */
  const partIn = dw.querySelector("#dPart");
  if(partIn) partIn.onchange = (e)=>{
    const want = Math.max(0, parseFloat(e.target.value)||0);
    if(want > left + 0.004) toast("warn", `Only ${fmt(left)} left to pay`, "The rest is already taken.");
    d.partAmt = +Math.min(want, left).toFixed(2);
    render();
  };
  /* take this part and move on to the next mode — the commonest partner is pre-selected */
  const addP = dw.querySelector("#dAdd");
  if(addP) addP.onclick = ()=>{
    const act = payActive(d);
    if(!act || act.amount <= 0.004){ toast("warn", "Nothing to add", "Enter an amount for this mode first."); return; }
    const sh = advShortfall(c, [...payTaken(d), act]);
    if(sh.length){ toast("warn", `Not enough ${sh[0].cat.toLowerCase()} advance`, `${fmt(sh[0].has)} on the wallet.`); return; }
    payTaken(d).push({ ...act, tendered: d.mode==="Cash" ? tenderedAmt : null,
      notes: d.mode==="Cash" ? { ...(d.notes||{}) } : null, manual: d.tenderManual!=null });
    d.editing = null;
    /* set up for what is left */
    d.mode = secondMode(act.mode);
    d.partAmt = null; d.ref = ""; d.ref2 = ""; d.notes = null; d.notesFor = null; d.tenderManual = null;
    d.moreOpen = false;
    toast("", `${modeLabel(act.mode)} ${fmt(act.amount)} added`, `${fmt(payRemaining(d))} left to pay.`);
    render();
  };
  /* clicking a taken payment pulls it back into the editor, exactly as it was */
  dw.querySelectorAll("[data-edit]").forEach(row=>row.onclick = (e)=>{
    if(e.target.dataset.undo !== undefined) return;            /* the ✕ removes instead */
    const i = +row.dataset.edit;
    const tp = payTaken(d).splice(i, 1)[0];
    if(!tp) return;
    d.mode = tp.mode; d.ref = tp.ref||""; d.ref2 = tp.ref2||"";
    d.partAmt = tp.mode==="Cash" ? null : tp.amount;
    d.notes = tp.notes ? { ...tp.notes } : null;
    d.notesFor = tp.notes ? payRemaining(d) : null;
    d.tenderManual = tp.manual ? String(tp.tendered) : null;
    d.editing = tp.mode;
    render();
  });
  dw.querySelectorAll("[data-undo]").forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    const gone = payTaken(d).splice(+b.dataset.undo, 1)[0];
    d.partAmt = null; d.notesFor = null; d.tenderManual = null; d.editing = null;
    if(gone) d.mode = gone.mode;                       /* back to the mode that was removed */
    render();
  });
  dw.querySelectorAll("[data-note]").forEach(b=>b.onclick = (e)=>{
    if(e.target.dataset.less) return;                        /* the minus handles itself */
    const n = b.dataset.note;
    d.notes = d.notes || {};
    d.notes[n] = (d.notes[n]||0) + 1;
    d.notesFor = left;
    d.tenderManual = null;                                   /* back to counting notes */
    render();
  });
  dw.querySelectorAll("[data-less]").forEach(b=>b.onclick = (e)=>{
    e.stopPropagation();
    const n = b.dataset.less;
    if(!d.notes || !d.notes[n]) return;
    d.notes[n] -= 1;
    if(!d.notes[n]) delete d.notes[n];
    d.notesFor = left;
    d.tenderManual = null;
    render();
  });
  const exact = dw.querySelector("#dExact");
  if(exact) exact.onclick = ()=>{ d.notes = suggestNotes(left); d.notesFor = left; d.tenderManual = null; render(); };
  const clr = dw.querySelector("#dClear");
  if(clr) clr.onclick = ()=>{ d.notes = {}; d.notesFor = left; d.tenderManual = null; render(); };
  const tend = dw.querySelector("#dTend");
  if(tend) tend.onchange = (e)=>{ d.tenderManual = e.target.value; render(); };
  const r1 = dw.querySelector("#dRef"); if(r1) r1.oninput = (e)=>{ d.ref = e.target.value; };
  const r2 = dw.querySelector("#dRef2"); if(r2) r2.oninput = (e)=>{ d.ref2 = e.target.value; };

  /* walking away from the refund of a replacement abandons the replacement too */
  const close = ()=>{ const rd = d.refundDiff; state.drawer=null; if(rd) undoReplace(d.c); else render(); };
  scrim.onclick = close; dw.querySelector("#dx").onclick = close; dw.querySelector("#dCancel").onclick = close;
  const go = dw.querySelector("#dGo");
  if((!shortAdv && unallocated<=0.004) || d.refund || d.refundDiff) go.onclick = ()=>{
    const cc = d.c;
    const mode = isMoneyBack || d.credit ? d.mode : partsLabel(parts);
    let detail = [d.ref2,d.ref].filter(Boolean).join(" · ");
    if(!simple && d.mode==="Cash" && tenderedAmt > 0){
      const counted = Object.entries(d.notes||{}).filter(([,k])=>k>0)
        .sort((a,b)=>b[0]-a[0]).map(([n,k])=>`${k}×${noteLabel(+n)}`).join(" + ");
      detail = `tendered ${fmt(tenderedAmt)}${counted&&d.tenderManual==null?` (${counted})`:""}${changeBack>0.004?` · change ${fmt(changeBack)}`:""}`;
    }
    if(!simple && parts.length>1)
      detail = [parts.map(p=>`${modeLabel(p.mode)} ${fmt(p.amount)}`).join(" + "), detail].filter(Boolean).join(" · ");
    state.drawer = null;
    if(d.refundDiff){                               /* the replacement left the patient in credit */
      payAll(cc, "Replaced");
      const inv = cc.invoices[0];
      inv.refunds = inv.refunds || [];
      inv.refunds.push({ at:now(), amount:d.amount, mode, reason:d.refundDiff.reason, by:USER, detail, codes:[] });
      if(mode==="Advance wallet"){
        const w = patients[cc.mrn].wallet;
        w.advance.Open = +(w.advance.Open + d.amount).toFixed(2);
        logLedger(cc.mrn, { type:"REFUND_IN", amount:d.amount, cat:"Open", invoiceId:inv.id, visitId:cc.id,
          note:`Overpayment returned to the wallet · ${d.refundDiff.reason}` });
      }
      record(cc, "w", `<b>Refunded ${fmt(d.amount)}</b> — overpaid before the replacement`,
        `${mode}${detail?" · "+detail:""} · ${d.refundDiff.reason} · against ${inv.id}`,
        { type:"REFUND", invoiceId:inv.id, amount:d.amount, mode, ref:detail||"", reason:d.refundDiff.reason,
          lines:inv.rows.map(r=>({ name:r.name, code:r.code, ins:"notcovered", price:r.calc.gross })) });
      toast("warn", `Refunded ${fmt(d.amount)}`, `${pt(cc).name} · ${mode}`);
      render();
      return;
    }
    if(d.refund){                                   /* giving money back */
      const hit = findInvoice(d.refund.id);
      const chosen = hit.inv.rows.filter(r=>d.refund.codes.includes(r.code));
      completeRefund(hit, chosen, d.amount, d.refund.dedBack, mode, d.refund.reason, detail);
      return;
    }
    if(d.credit){                                   /* settling the invoices picked earlier */
      const ww = patients[cc.mrn].wallet;
      if(mode==="Advance"){
        let r = d.amount;
        ADV_CATS.forEach(k=>{ const take=Math.min(ww.advance[k],r); ww.advance[k]=+(ww.advance[k]-take).toFixed(2); r=+(r-take).toFixed(2); });
      }
      const ids = d.ids || creditInvoices(cc.mrn).map(x=>x.inv.id);
      const hits = creditInvoices(cc.mrn).filter(x=>ids.includes(x.inv.id));
      hits.forEach(x=>{ x.inv.settled = true; x.inv.paid = true; x.inv.settledVia = mode; x.inv.settledAt = now(); });
      /* record it where the receptionist is standing, not on some other open visit */
      const cc2 = cases.find(v=>v.id===state.caseId && v.mrn===cc.mrn)
                || visitsOf(cc.mrn).find(v=>!v.closed) || hits[0].c;
      hits.forEach(x=>logLedger(cc.mrn, { type:"CREDIT_SETTLED", amount:x.inv.patient, invoiceId:x.inv.id,
        visitId:x.c.id, mode, note:`Settled by ${mode.toLowerCase()}${detail?" · "+detail:""}` }));
      if(mode==="Advance") logLedger(cc.mrn, { type:"ADV_USED", amount:d.amount,
        invoiceId:ids[0], visitId:cc2.id, note:`Used to settle credit · ${ids.join(", ")}` });
      record(cc2, "", `<b>Credit settled</b> — ${fmt(d.amount)}`,
        `${mode}${detail?" · "+detail:""} · ${ids.length} invoice(s) settled · ${ids.join(", ")}`,
        { type:"CREDIT", amount:d.amount, mode, ref:detail||"", invoiceId:ids[0], invoiceIds:ids,
          settled:hits.map(x=>({ id:x.inv.id, amount:x.inv.patient, visit:`${x.c.visitType} · ${x.c.clinic} · ${x.c.date||""}` })) });
      toast("ok", `Credit settled · ${fmt(d.amount)}`, `${patients[cc.mrn].name} · ${ids.length} invoice(s)`);
      render(); return;
    }
    payAll(cc, mode, detail, parts);
  };
  frag.appendChild(scrim); frag.appendChild(dw);
  return frag;
}

function renderSettings(){
  const frag = document.createDocumentFragment();
  const scrim = el(`<div class="scrim"></div>`);
  const box = el(`
    <div class="setbox">
      <h3>Branch settings <span>${settings.branch}</span></h3>
      <div class="row">
        <div><b>Send links automatically for unattended invoices</b>
          <p>When an approval comes back and the system invoices on its own, the payment link goes
             out without asking. Charges taken at the desk always ask for the payment mode.</p></div>
        <div class="sw ${settings.autoSend?"on":""}" id="swAuto"></div>
      </div>
      <div class="note">Set by the branch supervisor · affects everyone at this desk.<br>Build: ${BUILD}</div>
    </div>`);
  box.querySelector("#swAuto").onclick = ()=>{ settings.autoSend = !settings.autoSend; render(); };
  scrim.onclick = ()=>{ state.settingsOpen=false; render(); };
  frag.appendChild(scrim); frag.appendChild(box);
  return frag;
}

function renderSim(){
  const host = document.getElementById("sim");
  host.innerHTML = "";
  if(!state.simOpen){
    const b = el(`<button class="tgl">▶ Simulate</button>`);
    b.onclick = ()=>{ state.simOpen=true; render(); };
    host.appendChild(b); return;
  }
  const c = cases.find(x=>x.id===state.caseId) || cases[0];
  const p = el(`
    <div class="panel">
      <h4>World events · ${pt(c).name.split(" ")[0]}</h4>
      <button id="e1">🛡 Consultation approval arrives</button>
      <button id="e2">🩺 Doctor places 3 orders</button>
      <button id="e3">🛡 Remaining approvals arrive</button>
      <button id="e4">📱 Patient pays the open link</button>
      <button id="e5">⏱ Link goes unpaid for 14 minutes</button>
      <button id="e6">↺ Reset</button>
      <button class="tgl" id="e7" style="width:100%">Hide</button>
    </div>`);
  p.querySelector("#e1").onclick = ()=>simApproveConsult(c);
  p.querySelector("#e2").onclick = ()=>simOrders(c);
  p.querySelector("#e3").onclick = ()=>simApproval(c);
  p.querySelector("#e4").onclick = ()=>simPaid(c);
  p.querySelector("#e5").onclick = ()=>simStale(c);
  p.querySelector("#e6").onclick = ()=>location.reload();
  p.querySelector("#e7").onclick = ()=>{ state.simOpen=false; render(); };
  host.appendChild(p);
}

console.log("VIDA guided OPD billing — build:", BUILD);
render();
</script>
</body>
</html>
