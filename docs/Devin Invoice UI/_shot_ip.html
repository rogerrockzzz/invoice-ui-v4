<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:1560px;height:1020px;border:0;display:block}</style></head><body>
<script>
const step=new URLSearchParams(location.search).get('s')||'A';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow,S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  w.eval('openPatientTab')('7000667'); S.screen='ip'; S.ipAdmissionId=5; S.ipStatus='TODO'; R();
  if(step==='A2'){ qa('.ipChk').slice(0,3).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); }
  if(step==='A3'){ S.hdrOpen=true; R(); }
  if(step==='A4'){ qa('.ipChk').slice(0,4).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); q('#acceptGo').click(); q('#railInvBtn').click(); }
  if(step==='A6'){ qa('.ipChk').slice(0,4).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); q('#acceptGo').click(); S.ipSel={}; R(); }
  if(step==='A5'){ qa('.ipChk').slice(0,3).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); q('#acceptGo').click();
                   qa('.ip-tabs2 .t')[1].click(); }
  document.title='SHOT-READY';};
f.src='billing-ui-revamp-mockup-v4.html';document.body.appendChild(f);
</script></body></html>
