<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const step=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  if(step==='2'){ S.screen='journey'; S.caseId=2; R(); }
  if(step==='3'){ S.screen='journey'; S.caseId=1; R();
    qa('.next .btn').find(b=>/Send payment link/.test(b.textContent)).click(); }
  if(step==='4'){ S.screen='journey'; S.caseId=2; R(); w.document.querySelector('details.more').open=true; }
  document.title='SHOT-READY';};
f.src='journey-opd-v1.html';document.body.appendChild(f);
</script></body></html>
