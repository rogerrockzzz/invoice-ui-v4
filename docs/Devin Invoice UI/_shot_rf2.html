<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  S.screen='invoices'; S.invQ=''; R();
  if(n==='2'){ const t=w.eval('allInvoices')().filter(x=>w.eval('refundable')(x.inv))
                 .sort((a,b)=>b.inv.rows.length-a.inv.rows.length)[0];
    w.eval('openRefund')(t.inv.id);
    const rs=q('#rfReason'); rs.value='procedure cancelled by the doctor'; rs.dispatchEvent(new w.Event('input')); R(); }
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
