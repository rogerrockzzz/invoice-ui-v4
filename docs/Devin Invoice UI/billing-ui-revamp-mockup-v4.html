<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VIDA — Billing (Revamp Concept v4)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --navy:#0f3a5f; --blue:#1f6fb2; --blue-dark:#155a94; --red:#e2231a;
    --bg:#f3f5f7; --card:#ffffff; --line:#e3e7ec; --text:#1f2733; --muted:#6b7684;
    --green:#1c8a4b; --green-bg:#e9f7ef; --amber:#b6710a; --amber-bg:#fdf3e0;
    --red-bg:#fdecec; --purple:#6b46a8; --purple-bg:#f1ebfa; --radius:8px;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-size:13.5px;}

  header.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:9px 20px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:28px;height:28px;background:var(--red);border-radius:6px;position:relative;flex:none;}
  .brand .mark:after{content:"";position:absolute;inset:8px;background:#fff;clip-path:polygon(40% 0,60% 0,60% 40%,100% 40%,100% 60%,60% 60%,60% 100%,40% 100%,40% 60%,0 60%,0 40%,40% 40%);}
  .brand .name{font-size:11.5px;line-height:1.2;color:#5b6470;}
  .brand .name b{display:block;color:var(--navy);font-size:12.5px;}
  .brand .product{font-size:18px;font-weight:700;color:var(--red);margin-left:8px;}
  .hdr-right{display:flex;align-items:center;gap:14px;}
  .hosp-select{border:1px solid var(--line);border-radius:6px;padding:7px 12px;background:#f8fafc;color:#3a4350;font-size:12.5px;min-width:160px;}
  .user{display:flex;align-items:center;gap:8px;}
  .avatar{width:30px;height:30px;border-radius:50%;background:#d7dde3;display:flex;align-items:center;justify-content:center;color:#67707c;font-weight:600;font-size:12px;}
  .user .u b{display:block;font-size:12.5px;}
  .user .u span{font-size:10.5px;color:var(--muted);}

  .shell{display:flex;min-height:calc(100vh - 50px);}
  .rail{width:50px;background:#fff;border-right:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .rail .ic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#8b95a1;cursor:pointer;font-size:14px;}
  .rail .ic.active{background:var(--blue);color:#fff;}
  main{flex:1;padding:16px 22px 50px;max-width:1480px;width:100%;display:flex;flex-direction:column;}

  .crumb{font-size:11.5px;color:var(--muted);margin-bottom:12px;display:flex;gap:6px;align-items:center;}
  .crumb a{color:var(--blue);text-decoration:none;cursor:pointer;}
  .crumb .sep{color:#c3cad2;}

  .ptabs{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap;align-items:center;position:relative;}
  .ptab{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:7px 7px 0 0;border-bottom:2px solid transparent;padding:7px 11px;font-size:12px;cursor:pointer;color:#4b5563;}
  .ptab.active{border-bottom-color:var(--blue);color:var(--navy);font-weight:700;}
  .ptab.home{background:#eef6fd;border-color:#cfe3f5;color:var(--blue);font-weight:700;}
  .ptab.home:hover{background:#e2effb;}
  .ptab .x{color:#aab2bc;font-size:11px;padding:0 2px;}
  .ptab .x:hover{color:var(--red);}
  .ptab-add{padding:7px 11px;font-size:12px;color:var(--blue);cursor:pointer;font-weight:600;position:relative;}
  .add-suggest{position:absolute;top:34px;left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.1);z-index:30;width:260px;overflow:hidden;}
  .add-suggest .hd{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 12px 5px;}
  .add-suggest .opt{padding:9px 12px;font-size:12.5px;cursor:pointer;border-top:1px solid #f0f2f5;}
  .add-suggest .opt:hover{background:#f8fbfe;}
  .add-suggest .opt b{display:block;color:#28323d;}
  .add-suggest .opt span{color:var(--muted);font-size:11px;}
  .add-suggest .none{padding:12px;font-size:12px;color:var(--muted);}

  .btn{border:1px solid var(--blue);color:var(--blue);background:#fff;padding:7px 15px;border-radius:6px;font-size:12.5px;cursor:pointer;font-weight:600;}
  .btn:hover{background:#f1f7fd;}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.primary:hover{background:var(--blue-dark);}
  .btn.ghost{border-color:var(--line);color:#4b5563;}
  .btn.danger{border-color:var(--red);color:var(--red);}
  .btn.danger:hover{background:var(--red-bg);}
  .btn.green{border-color:var(--green);background:var(--green);color:#fff;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
  /* the landing surface fills the viewport rather than floating in a half-height card */
  main.full{max-width:none;padding:0;}
  main.full .card{border-radius:0;border-left:none;border-right:none;border-bottom:none;}
  /* offset the 50px icon rail and the 50px header so the block sits in the middle of the window */
  main.full .search-card{padding:32px 80px 82px 30px;}
  .search-wrap{display:flex;flex-direction:column;flex:1;min-height:calc(100vh - 50px);}
  .search-card{padding:32px 30px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;}
  .search-card .logo{font-size:28px;font-weight:700;color:var(--red);margin-bottom:6px;}
  .search-card h2{font-weight:400;color:#3a4350;margin:0 0 24px;font-size:20px;}
  .search-row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;text-align:left;margin-bottom:20px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  .field select{height:36px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:12.5px;background:#fff;}
  .searchbox{display:flex;align-items:center;width:340px;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:36px;}
  .searchbox .mrn-toggle{background:var(--blue);color:#fff;padding:0 12px;height:100%;display:flex;align-items:center;font-size:11.5px;font-weight:700;}
  .searchbox .search-by{border:none;background:var(--blue);color:#fff;height:100%;padding:0 9px;font-size:11.5px;font-weight:700;cursor:pointer;outline:none;}
  .searchbox .search-by option{color:#1f2733;background:#fff;font-weight:400;}
  /* inline search results on the landing page */
  .sr-panel{margin:18px auto 0;max-width:1080px;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;text-align:left;}
  .sr-head{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:#f7f9fb;border-bottom:1px solid var(--line);font-size:12px;color:#5b6470;}
  .sr-head b{color:var(--navy);}
  .sr-head a{font-size:11.5px;color:var(--blue);cursor:pointer;}
  .sr-head a:hover{text-decoration:underline;}
  .sr-list{max-height:320px;overflow:auto;}
  table.sr{width:100%;border-collapse:collapse;font-size:12px;}
  table.sr th{position:sticky;top:0;background:#fff;text-align:left;padding:8px 12px;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.35px;color:var(--muted);border-bottom:1px solid var(--line);}
  table.sr td{padding:10px 12px;border-bottom:1px solid #f0f2f5;color:#5b6470;vertical-align:middle;}
  table.sr tbody tr{cursor:pointer;}
  table.sr tbody tr:hover td{background:#eef6fd;}
  table.sr tbody tr:hover .sr-nm b{color:var(--blue-dark);}
  table.sr .sr-nm b{display:block;color:#28323d;font-size:13px;}
  table.sr .sr-nm span{font-size:10.5px;color:var(--muted);}
  table.sr .sr-go{width:26px;text-align:center;color:transparent;font-size:16px;font-weight:700;}
  table.sr tbody tr:hover .sr-go{color:var(--blue);}
  .searchbox input{border:none;outline:none;flex:1;padding:0 10px;font-size:12.5px;}
  .searchbox .go-ic{width:34px;text-align:center;color:#8b95a1;cursor:pointer;}
  .searchbox .go-ic:hover{color:var(--blue);}
  .quick-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
  .qa{border:1px solid var(--blue);color:var(--blue);border-radius:6px;padding:9px 16px;font-size:12.5px;cursor:pointer;font-weight:600;background:#fff;}
  .qa:hover{background:#f1f7fd;}
  .hint{font-size:11px;color:var(--muted);margin-top:12px;}

  .overlay{position:fixed;inset:0;background:rgba(20,25,32,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:10px;width:560px;max-width:94vw;max-height:88vh;overflow:auto;padding:24px 26px;}
  .modal.wide{width:660px;}
  .modal.xwide{width:780px;}
  .modal h3{margin:0 0 4px;font-size:19px;color:#28323d;font-weight:600;}
  .modal .sub{color:var(--muted);font-size:12px;margin-bottom:16px;}
  .modal-close{float:right;cursor:pointer;color:#8b95a1;font-size:18px;}

  .visit-opt{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:9px;cursor:pointer;}
  .visit-opt:hover{border-color:var(--blue);background:#f8fbfe;}
  .visit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .visit-top .ttl{color:var(--blue);font-weight:700;font-size:14px;}
  .visit-top .tags{display:flex;gap:6px;}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
  .badge.unpaid{background:var(--red-bg);color:var(--red);}
  .badge.paid{background:var(--green-bg);color:var(--green);}
  .badge.credit{background:var(--amber-bg);color:var(--amber);}
  .badge.opd{background:#e8f1fb;color:var(--blue-dark);}
  .badge.ipd{background:var(--purple-bg);color:var(--purple);}
  .badge.er{background:var(--red-bg);color:var(--red);}
  .badge.branch{background:#eef0f3;color:#4b5563;}
  .badge.locked{background:#eef0f3;color:#9aa3ad;}
  .visit-meta{font-size:12px;color:#4b5563;line-height:1.65;}
  .visit-meta b{color:#28323d;}
  .visit-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .add-walkin{border:1px dashed #c3cad2;border-radius:8px;padding:11px 15px;text-align:center;color:var(--blue);font-weight:600;font-size:12.5px;cursor:pointer;margin-top:6px;}
  .add-walkin:hover{background:#f8fbfe;}

  .seg{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px;width:fit-content;}
  .seg div{padding:6px 15px;font-size:12px;font-weight:600;color:#5b6470;cursor:pointer;}
  .seg div.on{background:var(--blue);color:#fff;}

  .workspace{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start;}

  .tabbar{display:flex;gap:6px;margin-bottom:12px;grid-column:1 / -1;}
  .tab{padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:600;color:#5b6470;cursor:pointer;}
  .tab.active{background:#fff;color:var(--blue);border:1px solid var(--line);border-bottom:2px solid var(--blue);}

  /* Redesigned wallet */
  .wallet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .wallet .whead{background:linear-gradient(120deg,#155a94,#1f6fb2);color:#fff;padding:12px 16px;}
  .wallet .whead .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;}
  .wallet .whead .big{font-size:22px;font-weight:700;margin-top:2px;}
  .wallet .wbody{padding:12px 16px;}
  .wcat{margin-bottom:9px;}
  .wcat .top{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;}
  .wcat .top b{color:#28323d;}
  .wcat .bar{height:6px;background:#eef1f4;border-radius:4px;overflow:hidden;}
  .wcat .bar div{height:100%;background:var(--blue);border-radius:4px;}
  .wallet .credit-card{margin:12px 16px 0;background:linear-gradient(120deg,#fdf3e0,#fce9c9);border:1px solid #f0d99a;border-radius:8px;padding:11px 13px;}
  .wallet .credit-card .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8a6106;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .wallet .credit-card .amt{font-size:19px;font-weight:700;color:#7a4e05;margin-top:2px;}
  .wallet .wactions{display:flex;gap:8px;padding:12px 16px 14px;}
  .wallet .wactions .btn{flex:1;}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;}
  .panel h4{margin:0 0 4px;font-size:13.5px;color:#28323d;display:flex;justify-content:space-between;align-items:center;}
  .panel .ph-sub{font-size:11px;color:var(--muted);margin-bottom:11px;}
  .locked-panel{opacity:.55;}
  .locked-msg{font-size:12px;color:var(--muted);background:#f7f8fa;border:1px dashed var(--line);border-radius:6px;padding:9px 11px;}

  table.svc{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.svc th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);padding:0 8px 8px;}
  table.svc td{padding:8px;border-bottom:1px solid #f0f2f5;vertical-align:middle;font-size:12.5px;}
  table.svc td.num{text-align:right;}
  .svc-code{color:var(--muted);font-size:11px;}

  .inv-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin-bottom:7px;font-size:12px;}
  .inv-row .left b{display:block;font-size:12.5px;color:#28323d;}
  .inv-row .left span{color:var(--muted);}
  .inv-row .right{display:flex;align-items:center;gap:7px;}

  /* Payment mode chips (replaces dropdown) */
  .mode-row{display:flex;flex-wrap:wrap;gap:6px;}
  .mode-chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:11.5px;cursor:pointer;color:#4b5563;background:#fff;}
  .mode-chip.sel{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;}
  .cat-row{display:flex;gap:5px;margin-top:6px;}
  .cat-chip{border:1px solid var(--line);border-radius:14px;padding:3px 9px;font-size:10.5px;cursor:pointer;color:#4b5563;}
  .cat-chip.sel{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:600;}
  .split-row{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:9px;}
  .split-row .amtline{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .split-row input{border:1px solid var(--line);border-radius:6px;height:32px;padding:0 8px;font-size:12.5px;flex:1;text-align:right;}
  .split-row .rm{color:var(--red);cursor:pointer;font-size:12px;}
  .sum-row{display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;}
  .sum-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;color:var(--navy);font-size:14.5px;}
  .sum-row.rem{color:var(--red);font-weight:600;}
  .sum-row.rem.ok{color:var(--green);}

  .print-sheet{border:1px solid var(--line);border-radius:6px;padding:20px;font-size:12px;}
  .print-sheet .ph{display:flex;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:9px;margin-bottom:13px;}
  .print-sheet .ph b{color:var(--red);font-size:17px;}
  .print-sheet table{width:100%;border-collapse:collapse;margin:11px 0;}
  .print-sheet th,.print-sheet td{padding:6px 4px;border-bottom:1px solid #eee;text-align:left;font-size:11.5px;}
  .print-sheet td.num, .print-sheet th.num{text-align:right;}

  .cb{display:flex;align-items:center;gap:8px;font-size:12px;}
  select.small, input.small{border:1px solid var(--line);border-radius:6px;height:32px;padding:0 8px;font-size:12px;}

  .wk-info{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:14px 18px;}
  .wk-info .lbl{font-size:11.5px;font-weight:700;color:#28323d;margin-bottom:4px;}
  .wk-info .val{color:#8b95a1;font-size:13px;}
  .wk-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 18px;margin-bottom:6px;}
  .wk-grid .f label{font-size:12px;font-weight:600;color:#28323d;display:block;margin-bottom:6px;}
  .wk-grid .f label .req{color:var(--red);}
  .wk-grid .f select{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:12.5px;background:#fff;}
  /* registration form */
  .reg-set{border:1px solid var(--line);border-radius:8px;padding:10px 14px 14px;margin:0 0 12px;}
  .reg-set legend{font-size:12.5px;font-weight:700;color:var(--navy);padding:0 6px;}
  .reg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px 16px;}
  .reg-grid .f label{display:block;font-size:11.5px;font-weight:600;color:#3f4a57;margin-bottom:5px;}
  .reg-grid .f label .req{color:var(--red);}
  .reg-grid .f input,.reg-grid .f select{width:100%;height:36px;border:1px solid #ccd4dd;border-radius:5px;padding:0 9px;font-size:12.5px;background:#fff;}
  .reg-grid .f input[readonly],.reg-grid .f select[disabled],.reg-grid .f input[disabled]{background:#e9edf2;color:#7c8794;}

  .lookup-row{display:flex;gap:8px;margin-bottom:14px;}
  .lookup-row input{flex:1;border:1px solid var(--line);border-radius:6px;height:38px;padding:0 10px;font-size:13px;}
  .lookup-results .opt{border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:7px;cursor:pointer;font-size:12.5px;}
  .lookup-results .opt:hover{border-color:var(--blue);background:#f8fbfe;}
  .lookup-results .opt b{display:block;color:#28323d;}
  .lookup-results .opt span{color:var(--muted);font-size:11px;}

  /* Dense enterprise-style register (matches provided reference) */
  .action-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .seg2{display:flex;border-radius:6px;overflow:hidden;}
  .seg2 div{padding:8px 14px;font-size:12px;font-weight:700;color:#fff;background:#8fce9a;cursor:pointer;}
  .seg2 div.on{background:#1c8a4b;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .filters .f label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;}
  .filters .f select, .filters .f input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 9px;font-size:12px;min-width:150px;background:#fff;}
  .cat-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
  .cat-tabs div{padding:6px 13px;border-radius:5px;font-size:11.5px;font-weight:600;color:#4b5563;cursor:pointer;border:1px solid var(--line);background:#fff;}
  .cat-tabs div.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  table.reg{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  table.reg th{background:#f7f8fa;text-align:left;padding:8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);border-bottom:1px solid var(--line);}
  table.reg td{padding:8px 10px;border-bottom:1px solid #f0f2f5;}
  table.reg tr:hover td{background:#fafcfe;}
  .reg-foot{display:flex;justify-content:flex-end;font-size:11.5px;color:var(--muted);padding:9px 4px;}

  /* ===== Inpatient ===== */
  .ip-row{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;margin-bottom:10px;display:flex;justify-content:space-between;gap:16px;align-items:center;}
  .ip-row:hover{border-color:#bcd4ea;}
  .ip-pt .nm{font-size:14px;font-weight:700;color:var(--navy);}
  .ip-pt .mt{font-size:11.5px;color:#5b6470;margin-top:3px;}
  .ip-pt .payers{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .pill-payer{background:#eef2f6;border-radius:12px;padding:3px 10px;font-size:10.5px;color:#3f4a57;}
  .pill-payer b{color:var(--navy);}
  .ip-kpis{display:flex;align-items:center;gap:8px;flex:none;}
  .ip-kpis .kpi{border-radius:6px;padding:7px 12px;text-align:center;color:#fff;min-width:74px;}
  .ip-kpis .kpi span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.4px;opacity:.9;}
  .ip-kpis .kpi b{font-size:15px;}
  .ip-kpis .ord{background:#c0392b;} .ip-kpis .acc{background:#1f6fb2;} .ip-kpis .inv{background:#1c8a4b;} .ip-kpis .pend{background:#c99700;}

  /* one-line admission header */
  .ip-line{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:9px 14px;margin-bottom:10px;flex-wrap:wrap;}
  .ip-line .l{display:flex;align-items:center;gap:12px;font-size:11.5px;color:#5b6470;flex-wrap:wrap;}

  .ip-line .r{display:flex;align-items:center;gap:8px;}
  .ip-line .lay{font-size:10.5px;color:var(--muted);} .ip-line .lay b{color:var(--navy);}

  /* layout A: work surface + rail */
  /* minmax(0,1fr) lets the order grid scroll inside its column instead of widening the page */
  .ip-a{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:14px;align-items:start;}
  .ip-a.wide{grid-template-columns:minmax(0,1fr);}
  .grid-exp{margin-left:auto;align-self:center;background:#fff;border:1px solid var(--line);border-radius:6px;
    padding:7px 13px;font-size:11.5px;font-weight:600;color:var(--blue);cursor:pointer;}
  .grid-exp:hover{background:#eef6fd;border-color:#cfe3f5;}
  .ip-a > *{min-width:0;}
  .rail-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .rail-card .rc-head{background:#f5f7f9;border-bottom:1px solid var(--line);padding:8px 13px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#5b6470;font-weight:700;}
  .rail-card .rc-body{padding:11px 13px;}
  .rail-card.ready .rc-head{background:var(--green-bg);border-bottom-color:#bfe4cd;color:#14603a;}
  .rc-payer{border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:6px;cursor:pointer;}
  .rc-payer.on{border-color:var(--blue);background:#f2f8fd;}
  .rc-payer .n{font-size:11.5px;font-weight:700;color:#28323d;}
  .rc-payer .s{font-size:10px;color:var(--muted);margin-top:1px;}
  .rc-pkg{margin-bottom:10px;}
  .rc-pkg .t{display:flex;justify-content:space-between;font-size:11px;color:#5b6470;}
  .rc-pkg .t b{color:#28323d;}
  .rc-pkg .bar{height:6px;background:#eef1f4;border-radius:4px;overflow:hidden;margin:5px 0 3px;}
  .rc-pkg .bar div{height:100%;background:var(--blue);}
  .rc-pkg .s{font-size:10px;color:var(--muted);}
  .rc-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:#5b6470;}
  .rc-row b{color:#28323d;} .rc-row.big{border-top:1px solid var(--line);margin-top:5px;padding-top:7px;font-weight:700;}
  .rc-row.big b{font-size:15px;color:var(--navy);}
  .rc-inv{border-left:3px solid var(--blue);background:#f8fbfe;border-radius:5px;padding:7px 9px;margin-bottom:6px;cursor:pointer;}
  .rc-inv .n{font-size:11.5px;font-weight:700;color:var(--navy);}
  .rc-inv .s{font-size:10px;color:var(--muted);margin-top:1px;}
  .rc-inv .a{font-size:12.5px;font-weight:700;margin-top:2px;}

  /* payer selector (layout B) */
  .payer-bar{display:flex;align-items:center;gap:12px;background:#f7f9fb;border:1px solid var(--line);border-radius:var(--radius);padding:9px 13px;margin-bottom:10px;flex-wrap:wrap;}
  .payer-bar .pb-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;}
  .payer-bar .pb-chips{display:flex;gap:7px;flex:1;flex-wrap:wrap;}
  .pb-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:11.5px;cursor:pointer;color:#3f4a57;display:flex;align-items:center;gap:7px;}
  .pb-chip.on{border-color:var(--blue);background:#eef6fd;color:var(--blue-dark);font-weight:700;}
  .pb-chip.cash.on{border-color:var(--green);background:var(--green-bg);color:var(--green);}
  .pb-chip .ap{font-size:9.5px;background:#eef2f6;border-radius:10px;padding:1px 7px;color:#5b6470;}

  /* dense inpatient tables + inline editable cells */
  table.chg.ip th{font-size:9.5px;}
  table.chg.ip td{padding:6px 8px;font-size:11.5px;}
  table.chg.ip td.ord-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#5b6470;white-space:nowrap;}
  table.chg.ip td.ord-nm b{font-size:12px;color:#28323d;font-weight:600;}
  table.chg.ip td.ord-nm .flags{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap;}
  table.chg.ip td.ord-nm{white-space:normal;min-width:180px;}
  .cell-inp{border:1px solid transparent;border-radius:4px;background:#f4f7fa;height:26px;font-size:11px;padding:0 6px;max-width:130px;}
  .cell-inp:hover{border-color:#cbd5e0;background:#fff;} .cell-inp:focus{border-color:var(--blue);background:#fff;outline:none;}
  .cell-inp.num{width:58px;text-align:right;}
  .cell-inp.ok{background:var(--green-bg);color:var(--green);font-weight:700;}
  .cell-inp.warn{background:#f4f6f8;color:#6b7684;}
  /* wide inpatient tables scroll sideways inside their own panel */
  .tbl-scroll{overflow-x:auto;max-width:100%;}
  .tbl-scroll table.chg.ip{min-width:100%;white-space:nowrap;}
  .tbl-scroll .chg-name{white-space:normal;min-width:190px;}

  /* layout B: two tabs */
  .ip-tabs2{display:flex;gap:6px;margin-bottom:12px;align-items:stretch;}
  .ip-tabs2 .t{padding:8px 18px;border-radius:7px 7px 0 0;border:1px solid var(--line);border-bottom:2px solid transparent;background:#f7f8fa;font-size:12.5px;font-weight:600;color:#5b6470;cursor:pointer;display:flex;gap:8px;align-items:center;}
  .ip-tabs2 .t b{color:var(--navy);}
  .ip-tabs2 .t .tb-due{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:1px 7px;font-size:9.5px;font-weight:700;}
  .ip-tabs2 .t.on{background:#fff;border-bottom-color:var(--blue);color:var(--navy);}

  /* status + category chip rows */
  .chip-rows{margin-bottom:8px;}
  .cat-tabs.sub div{font-size:10.5px;padding:4px 10px;}

  /* contextual action bar */
  /* bottom money snapshot — light, but with a clear highlight edge */
  .tot-strip{position:sticky;bottom:0;z-index:5;display:flex;align-items:stretch;background:linear-gradient(180deg,#fbfdff,#eef4fa);
    border-top:2px solid var(--blue);margin:0 -18px -16px;padding:0 6px;border-radius:0 0 var(--radius) var(--radius);
    overflow-x:auto;box-shadow:0 -3px 10px rgba(15,58,95,.06);}
  .tot-strip .ts-scope{display:flex;align-items:center;margin:7px 4px 7px 6px;padding:3px 9px;background:var(--blue);color:#fff;
    border-radius:11px;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;white-space:nowrap;align-self:center;}
  .tot-strip .ts{padding:8px 14px;border-left:1px solid #dde6ef;white-space:nowrap;}
  .tot-strip .ts span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.35px;color:#7c8794;}
  .tot-strip .ts b{font-size:13.5px;color:var(--navy);}
  .tot-strip .ts.inv{background:#e5f0fa;border-left-color:#cfe1f2;}
  .tot-strip .ts.inv b{font-size:15.5px;}
  .tot-strip .ts.due{background:#fdeceb;border:1px solid #f6cfcc;margin:5px 2px 5px 7px;border-radius:6px;cursor:pointer;
    text-align:left;font-family:inherit;position:relative;}
  .tot-strip .ts.due:hover{background:#fbdedb;border-color:#eeb3ae;}
  .tot-strip .ts.due em{display:block;font-style:normal;font-size:8.5px;color:#b3453e;letter-spacing:.3px;margin-top:2px;}
  .tot-strip .ts.due span{color:#b3453e;}
  .tot-strip .ts.due b{color:var(--red);font-size:15.5px;}
  .tot-strip .ts.due i{display:block;font-size:9.5px;font-style:normal;color:var(--green);font-weight:600;margin-top:1px;}

  .act-bar{position:sticky;bottom:52px;background:#fff;border-top:2px solid var(--blue);margin:12px -18px 0;padding:0 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 12px rgba(15,58,95,.07);}
  .act-bar.idle{border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;text-align:center;box-shadow:none;padding:9px 18px;position:static;margin:12px -18px 0;}
  .act-bar .ab-main{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:9px 18px;justify-content:flex-end;}
  .ab-suggest{background:#eef6fd;border-bottom:1px solid #d7e7f5;padding:8px 18px;font-size:11.5px;color:#2c4a63;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ab-suggest.warn{background:#fdf3e0;border-bottom-color:#f0d99a;color:#7a5a06;}
  /* cross-payer comparison sits in line with the accept button */
  .ab-alt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f7f3fc;border:1px solid #e4d9f3;
    border-radius:7px;padding:5px 9px;font-size:10.5px;color:#4a3566;}
  .ab-alt .hd{font-weight:600;}
  .ab-alt .cmp{display:flex;gap:6px;flex-wrap:wrap;}
  .ab-alt .cmp .c{background:#fff;border:1px solid #e0d6ee;border-radius:5px;padding:2px 8px;font-size:10px;}
  .ab-alt .cmp .c.on{border-color:var(--blue);background:#eef6fd;}
  .ab-alt .cmp .c i{font-style:normal;display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.3px;color:#7c8794;}
  .ab-alt .cmp .c em{font-style:normal;color:var(--amber);}
  .ab-suggest b{color:var(--navy);}
  /* the lines waiting to be invoiced */
  table.inv-review{margin-top:2px;}
  table.inv-review td{font-size:11.5px;}
  table.inv-review tr.in-pkg td{color:#7c8794;}
  table.inv-review .ord-id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:#5b6470;}
  table.inv-review tfoot td{background:#f7f9fb;border-top:2px solid var(--line);padding-top:9px;}

  /* today's visits */
  .tv-modal{width:min(1120px,94vw);}
  .tv-stats{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap;}
  .tv-stats .s{border:1px solid var(--line);border-radius:7px;padding:7px 13px;min-width:82px;background:#fafbfc;}
  .tv-stats .s span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.35px;color:#7c8794;}
  .tv-stats .s b{font-size:18px;color:var(--navy);}
  .tv-stats .s.all{background:#eef6fd;border-color:#cfe3f5;}
  .tv-stats .s.pend{background:#fdf3e0;border-color:#f0d99a;} .tv-stats .s.pend b{color:var(--amber);}
  .tv-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .tv-search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;flex:1;min-width:210px;}
  .tv-search span{color:#9aa3ad;font-size:12px;}
  .tv-search input{border:none;outline:none;flex:1;font-size:12.5px;}
  .tv-controls select{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 9px;font-size:12px;background:#fff;}
  .tv-types{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .tv-types div{padding:0 12px;height:34px;display:flex;align-items:center;font-size:11.5px;font-weight:600;color:#5b6470;cursor:pointer;border-left:1px solid var(--line);}
  .tv-types div:first-child{border-left:none;}
  .tv-types div.on{background:var(--navy);color:#fff;}
  .tv-body{max-height:60vh;overflow:auto;}
  table.tv{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.tv th{position:sticky;top:0;background:#f7f8fa;text-align:left;padding:8px 10px;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.35px;color:var(--muted);border-bottom:1px solid var(--line);z-index:1;}
  table.tv th.num,table.tv td.num{text-align:right;}
  table.tv td{padding:11px 12px;border-bottom:1px solid #f0f2f5;vertical-align:middle;}
  table.tv tbody tr{cursor:pointer;}
  table.tv tbody tr:hover td{background:#eef6fd;}
  table.tv tbody tr:hover .tv-pt b{color:var(--blue-dark);}
  table.tv .tv-go{width:26px;text-align:center;color:transparent;font-size:16px;font-weight:700;}
  table.tv tbody tr:hover .tv-go{color:var(--blue);}
  table.tv .tv-time{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#3f4a57;white-space:nowrap;}
  table.tv .tv-pt b,table.tv .tv-cl b{display:block;color:#28323d;font-size:13px;}
  table.tv .tv-pt span,table.tv .tv-cl span{font-size:10.5px;color:var(--muted);}
  table.tv .tv-py{font-size:11.5px;color:#5b6470;white-space:nowrap;}
  table.tv .tv-pt{min-width:210px;} table.tv .tv-cl{min-width:150px;}
  table.tv td .btn{white-space:nowrap;}
  .tv-chip{display:inline-block;background:var(--amber-bg);color:var(--amber);border-radius:11px;padding:2px 9px;font-size:11px;font-weight:700;}
  .tv-foot{display:flex;justify-content:flex-end;font-size:11px;color:var(--muted);padding:9px 4px 0;}
  .tv-empty{padding:34px;text-align:center;color:var(--muted);font-size:12.5px;}

  /* payer cards inside the approval popup */
  .pay-card{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:10px;background:#fff;}
  .pay-card.on{border-color:var(--blue);background:#f8fbfe;}
  .pay-card .pc-head .nm{font-size:13.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .pay-card .pc-sub{font-size:11px;color:#5b6470;margin-top:3px;}
  .pay-card .pc-sub b{color:#28323d;}
  .pay-card .pc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px;}
  .pay-card .pc-stats .s{background:#f7f9fb;border-radius:6px;padding:6px 9px;}
  .pay-card .pc-stats .s span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.35px;color:#7c8794;}
  .pay-card .pc-stats .s b{font-size:13px;color:#28323d;}
  .pay-card .pc-stats .s.ok{background:var(--green-bg);} .pay-card .pc-stats .s.ok b{color:var(--green);}
  .pay-card .pc-stats .s.warn{background:#fdf3e0;} .pay-card .pc-stats .s.warn b{color:var(--amber);}
  .pay-card .pc-note{margin-top:9px;font-size:11px;color:#5b6470;background:#f7f9fb;border-radius:6px;padding:7px 9px;}
  .pay-card .pc-note.warn{background:#fdecec;color:#a3312a;}
  .pay-card .ap-audit{margin-top:9px;}

  /* reconcile prompt: spill warning */
  .rec-note{margin-top:12px;background:#fdf3e0;border:1px solid #f0d99a;border-radius:7px;padding:9px 11px;font-size:11.5px;color:#7a5a06;}
  .rec-note b{color:#5f4604;}
  table.reg tr.spill td{background:#fffaf0;}

  /* package choice cards inside the accept / replace prompt */
  .pkg-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .pkg-opt{flex:1;min-width:190px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;cursor:pointer;background:#fff;}
  .pkg-opt:hover{border-color:#bcd4ea;background:#f8fbfe;}
  .pkg-opt.on{border-color:var(--blue);background:#eef6fd;box-shadow:inset 0 0 0 1px var(--blue);}

  .pkg-opt .t b{color:var(--navy);} .pkg-opt .t span{font-weight:700;color:#28323d;}
  .pkg-opt .s{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .pkg-opt .cb{font-size:10.5px;}

  /* expandable open-coverage audit inside the payer popup */
  .ap-audit{margin-top:8px;border-top:1px dashed #dbe2e9;padding-top:7px;}
  .ap-audit summary{cursor:pointer;font-size:11px;font-weight:700;color:var(--blue-dark);}
  .ap-audit summary:hover{text-decoration:underline;}
  .ap-audit table.reg{font-size:11px;}
  .ap-audit .svc-code{font-weight:400;}

  /* package cards in the rail */
  .rc-pkgcard{border:1px solid var(--line);border-radius:6px;padding:8px 9px;margin-bottom:8px;background:#fafbfc;}
  .rc-pkgcard.on{border-color:#bcd4ea;background:#f6fbff;}
  .rc-pkgcard .ph{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;}
  .rc-pkgcard .ph b{color:var(--navy);} .rc-pkgcard .ph span{font-weight:700;color:#28323d;}
  .rc-pkgcard .s{font-size:10px;color:var(--muted);margin-top:2px;}
  .rc-kids{margin-top:6px;border-top:1px dashed #dbe2e9;padding-top:5px;}
  .rc-kids .k{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#5b6470;padding:2px 0;}
  .rc-kids .k b{color:#28323d;}
  .rc-kids .k.bkt{border-top:1px dashed #e3e9ef;margin-top:3px;padding-top:4px;font-weight:600;color:#3f4a57;}
  .rc-kids .k.sub{padding-left:10px;color:#8b95a1;font-size:10px;}
  .rc-bulk{border-top:1px dashed #dbe2e9;padding-top:7px;margin-top:2px;}
  .rc-bulk .t{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-bottom:4px;}
  .rc-bulk .k{display:flex;justify-content:space-between;font-size:11px;color:#5b6470;padding:2px 0;}
  .rc-bulk .k b{color:var(--amber);}
  /* expandable group rows */

  table.chg.ip tr.kid td.ord-nm b{font-size:11px;color:#4a5560;font-weight:500;}
  table.chg.ip tr.kid td.ord-id{font-size:9.5px;color:#95a0ab;}
  table.chg.ip tr.kid .badge{font-size:8.5px;padding:1px 5px;}
  table.chg.ip tr.kid .st{font-size:9px;}
  table.chg.ip tr.kid .flags{margin-top:1px;}
  table.chg.ip tr.kid.bucket td{background:#f7fbff;font-size:11px;}
  table.chg.ip tr.kid.bucket .chg-name b{color:var(--blue-dark);}
  table.chg.ip tr.kid2 td{background:#fff;font-size:10px;}
  table.chg.ip tr.kid2 td.ord-nm b{font-size:10.5px;}
  .mini-bar{height:4px;background:#e6eaee;border-radius:3px;overflow:hidden;max-width:220px;margin-top:4px;}
  .mini-bar div{height:100%;background:var(--blue);}
  .chg-name.kid b{font-weight:600;color:#3f4a57;font-size:11.5px;}
  .caret{display:inline-block;color:var(--blue);font-size:9px;margin-right:5px;cursor:pointer;transition:transform .15s;}
  .caret.open{transform:rotate(90deg);}
  .kid-count{display:inline-block;background:#e4ecf4;color:#3f4a57;border-radius:9px;font-size:9px;font-weight:700;padding:1px 6px;margin-right:5px;}

  .rc-payer .apbar{height:5px;background:#e6eaee;border-radius:3px;overflow:hidden;margin:5px 0 3px;}
  .rc-payer .apbar div{height:100%;background:var(--green);}
  .rc-payer .s.open{color:var(--amber);font-weight:600;}
  .rc-payer .n .badge{margin-left:5px;}
  .ip-line.slim{padding:5px 12px;background:#f7f9fb;}
  .ip-line.slim .lay{font-size:10.5px;color:var(--muted);}
  .act-bar .ab-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn.lg{padding:9px 22px;font-size:13.5px;}
  .more-wrap{position:relative;}

  .ip-inv-card.on{border-left-color:var(--blue);background:#f8fbfe;}
  .ip-inv-card .no{font-size:12px;font-weight:700;color:var(--navy);}
  .ip-inv-card .mt{font-size:10.5px;color:var(--muted);margin-top:2px;}

function fmt(n){ return "SAR " + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function el(html){ const d=document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function initials(name){ return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function cp(){ return patientsDB[state.activeMrn]; }
function cWallet(){ return cp().wallet; }
function cVisits(){ return cp().visits; }
function getVisit(id){ return cVisits().find(v=>v.id===id); }
function totalAdvance(w){ return w.advance.open + w.advance.doctor + w.advance.clinic; }
/* ============================ PRICING / INSURANCE ENGINE ============================ */
/* A patient can hold several active policies — the receptionist picks which one bills this visit.
   The selected insurance doubles as the pricing plan (deductible %, caps, discount). */
function insuranceOf(p){ return (p.insurances||[]).find(x=>x.id===p.activeInsId) || null; }
function cPlan(){ return insuranceOf(cp()); }
function cIns(){ return insuranceOf(cp()); }

/* Deductible remaining for a visit = min(per-visit cap, annual pool left) minus what this visit already consumed */
function visitDeductible(v){
  const plan = cPlan();
  if(!plan) return { cap:0, used:0, remaining:0, annualLeft:0 };
  const annualLeft = Math.max(0, plan.annualDeductibleTotal - plan.annualDeductibleUsed);
  const cap = Math.min(plan.visitDeductibleCap, annualLeft);
  const used = v.dedUsed || 0;
  return { cap, used, remaining: Math.max(0, cap - used), annualLeft };
}

/* One charge line -> shares. dedLeft is consumed line by line so the cap is respected. */
function calcLine(line, dedLeft, planOverride){
  const plan = planOverride !== undefined ? planOverride : cPlan();
  const meta = insStatuses[line.ins || "notinsured"];
  const gross = line.price;
  const discount = +(gross * ((plan && plan.discountPct) || 0)).toFixed(2);
  const net = +(gross - discount).toFixed(2);
  let company = 0, deductible = 0, patient = net;
  if(plan && meta.insured){
    const covered = +(net * meta.cov).toFixed(2);
    const uncovered = +(net - covered).toFixed(2);
    deductible = +Math.min(covered * plan.deductiblePct, Math.max(0, dedLeft)).toFixed(2);
    patient = +(deductible + uncovered).toFixed(2);
    company = +(covered - deductible).toFixed(2);
  }
  return { gross, discount, net, deductible, patient, company,
    patientTax:+(patient*VAT).toFixed(2), companyTax:+(company*VAT).toFixed(2),
    patientWithTax:+(patient*(1+VAT)).toFixed(2), companyWithTax:+(company*(1+VAT)).toFixed(2) };
}

/* Lines still awaiting payer approval must not be invoiced */
function isApprovalPending(line){ return (line.ins || "") === "pending"; }

function selKey(v, code){ return v.id + "|" + code; }
function isSel(v, code){ return !!state.sel[selKey(v,code)]; }

/* All billable (not yet invoiced) lines of a visit, consultation first */
function billableLines(v){
  const rows = [];
  if(!v.consult.invoiced) rows.push({ ...v.consult, kind:"consult" });
  v.orderedServices.forEach((s,i)=>{ if(!s.invoiced) rows.push({ ...s, kind:"order", idx:i }); });
  return rows;
}

/* Rolls up every ticked line of a visit into the live invoice-details grid numbers */
function invoiceTotals(v){
  const ded = visitDeductible(v);
  let dedLeft = ded.remaining;
  const t = { count:0, gross:0, discount:0, deductible:0, patient:0, company:0, patientTax:0, companyTax:0, lines:[] };
  billableLines(v).forEach(line=>{
    const c = calcLine(line, dedLeft);
    if(isSel(v, line.code) && !isApprovalPending(line)){
      dedLeft = +(dedLeft - c.deductible).toFixed(2);
      t.count++; t.gross+=c.gross; t.discount+=c.discount; t.deductible+=c.deductible;
      t.patient+=c.patient; t.company+=c.company; t.patientTax+=c.patientTax; t.companyTax+=c.companyTax;
      t.lines.push({ line, calc:c });
    } else {
      t.lines.push({ line, calc:c, unselected:true });
    }
  });
  t.patientWithTax = +(t.patient + t.patientTax).toFixed(2);
  t.companyWithTax = +(t.company + t.companyTax).toFixed(2);
  t.taxAmount = +(t.patientTax + t.companyTax).toFixed(2);
  t.invoiceTotal = +(t.patientWithTax + t.companyWithTax).toFixed(2);
  t.dedRemainingAfter = Math.max(0, dedLeft);
  ["gross","discount","deductible","patient","company","patientTax","companyTax"].forEach(k=>t[k]=+t[k].toFixed(2));
  return t;
}

/* Historical invoices are seeded with bare line items — run them through the same engine
   so their shares, tax and the visit deductible consumed all tie up. */
function priceInvoiceItems(inv, plan, dedLeft){
  const t = { gross:0, discount:0, deductible:0, patient:0, company:0, patientTax:0, companyTax:0 };
  inv.items.forEach(it=>{
    const c = calcLine(it, dedLeft, plan);
    dedLeft = +(dedLeft - c.deductible).toFixed(2);
    Object.assign(it, { calc:c, refunded: it.refunded || false });
    ["gross","discount","deductible","patient","company","patientTax","companyTax"].forEach(k=>t[k]+=c[k]);
  });
  inv.discount = +t.discount.toFixed(2);
  inv.deductible = +t.deductible.toFixed(2);
  inv.tax = +(t.patientTax + t.companyTax).toFixed(2);
  inv.patientShare = +(t.patient + t.patientTax).toFixed(2);
  inv.companyShare = +(t.company + t.companyTax).toFixed(2);
  inv.amount = +(inv.patientShare + inv.companyShare).toFixed(2);
  inv.modes.forEach(m=>{ if(m.amount===undefined) m.amount = inv.patientShare; });
  return t.deductible;
}
function seedInvoices(){
  Object.values(patientsDB).forEach(p=>{
    p.visits.forEach(v=>{
      let consumed = 0;
      v.invoices.forEach(inv=>{
        if(!inv.items) return;
        const plan = insuranceOf(p);
        const cap = plan ? plan.visitDeductibleCap : 0;
        consumed += priceInvoiceItems(inv, plan, Math.max(0, cap - consumed));
      });
      v.dedUsed = +consumed.toFixed(2);
    });
  });
}

/* ---- Sessions: one tab per open encounter, so several visits of the same
   patient can be worked on side by side. A session with no visit is the
   patient's file itself (opened from search). ---- */
function sessionKey(s){ return s.mrn + "|" + (s.visitId==null ? "file" : s.visitId); }
/* visit ids are scoped to a patient, so a session must resolve against its own MRN */
function visitOf(mrn, id){
  const p = patientsDB[mrn];
  return p ? p.visits.find(v=>v.id===id) : null;
}
function activeSession(){ return state.sessions.find(x=>sessionKey(x)===state.activeSession) || null; }
function focusSession(sess){
  state.activeSession = sessionKey(sess);
  state.activeMrn = sess.mrn;
  if(sess.visitId==null){ state.screen="workspace"; state.activeTab="visits"; return; }
  const v = visitOf(sess.mrn, sess.visitId);
  if(v && v.admType==="IP"){
    state.ipAdmissionId = sess.visitId; state.screen="ip";
    state.ipTab = state.ipTab || "orders"; state.ipStatus="TODO"; state.ipSel={};
  } else {
    state.activeVisitId = sess.visitId; state.screen="workspace"; state.activeTab="visit"; state.invoiceView=null;
  }
}
function openSession(mrn, visitId){
  if(!patientsDB[mrn]) return false;
  const vid = (visitId===undefined ? null : visitId);
  let sess = state.sessions.find(x=>x.mrn===mrn && x.visitId===vid);
  if(!sess && vid!=null){
    /* a file tab opened from search becomes the visit tab rather than leaving a stray */
    sess = state.sessions.find(x=>x.mrn===mrn && x.visitId==null);
    if(sess) sess.visitId = vid;
  }
  if(!sess){ sess = { mrn, visitId:vid }; state.sessions.push(sess); }
  focusSession(sess);
  return true;
}
function closeSession(sess){
  state.sessions = state.sessions.filter(x=>x!==sess);
  if(!state.sessions.some(x=>x.mrn===sess.mrn))
    state.recentClosed = [sess.mrn, ...state.recentClosed.filter(m=>m!==sess.mrn)].slice(0,6);
  if(state.activeSession===sessionKey(sess)){
    const next = state.sessions[state.sessions.length-1];
    if(next) focusSession(next);
    else { state.activeSession=null; state.activeMrn=null; state.screen="search"; }
  }
}
/* kept for every existing caller: opens (or focuses) the patient's file tab */
function openPatientTab(mrn){
  if(!patientsDB[mrn]) return false;
  const existing = state.sessions.find(x=>x.mrn===mrn);
  if(existing){ state.activeSession = sessionKey(existing); state.activeMrn = mrn; return true; }
  state.sessions.push({ mrn, visitId:null });
  state.activeSession = mrn + "|file";
  state.activeMrn = mrn;
  return true;
}
function openMrns(){ return [...new Set(state.sessions.map(s=>s.mrn))]; }

  { key:"mrn",   label:"MRN",         ph:"e.g. 7000203" },
  { key:"name",  label:"Name",        ph:"any part of the patient's name" },
  { key:"nid",   label:"National ID", ph:"e.g. 1271545707" },
  { key:"mobile",label:"Mobile No",   ph:"e.g. 0555 401 220" }

function searchPatients(term, by){
  const t = (term||"").trim().toLowerCase();
  if(!t) return [];
  const digits = (v)=>String(v||"").replace(/\D/g,"");
  return Object.values(patientsDB).filter(p=>{
    const i = p.info;
    if(by==="name")   return i.name.toLowerCase().includes(t);
    if(by==="nid")    return digits(i.nationalId).includes(digits(t));
    if(by==="mobile") return digits(i.mobile).includes(digits(t)) || digits(i.mobileAlt).includes(digits(t));
    return String(i.mrn).includes(t) || String(i.clusterMrn||"").includes(t) || String(i.hospitalMrn||"").includes(t);
  });
}

      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:14px">
        <button class="btn ghost" id="qrCancel">Close</button>
        <button class="btn primary" id="qrSaveOnly">Create</button>
        <button class="btn primary green" id="qrSaveWalkin">Create &amp; Add Walk-in</button>
      </div>
    </div>`);

  const v = (id)=>{ const x = modal.querySelector("#"+id); return x ? x.value.trim() : ""; };
  /* age is derived, exactly as in the source system */
  const dob = modal.querySelector("#qrDob");
  dob.onchange = ()=>{
    if(!dob.value) return;
    const d = new Date(dob.value), now = new Date();
    let y = now.getFullYear()-d.getFullYear(), m = now.getMonth()-d.getMonth();
    if(m<0){ y--; m += 12; }
    modal.querySelector("#qrAge").value = y>0 ? `${y}Y ${m}M` : `${m}M`;
    modal.querySelector("#qrDobHijri").value = modal.querySelector("#qrDobHijri").value
      || d.toLocaleDateString('en-GB').split('/').join('/');
  };

  function build(){
    const required = [["qrFirst","First Name"],["qrSecond","Second Name"],["qrFamily","Family Name"],
      ["qrFirstAr","First Name Arabic"],["qrSecondAr","Second Name Arabic"],["qrFourthAr","Fourth Name Arabic"],
      ["qrGender","Gender"],["qrMarital","Marital Status"],["qrDob","Date Of Birth"],
      ["qrIdType","Id Type"],["qrIdNo","Id Number"],["qrOcc","Occupation"],["qrMobile","Mobile Number"],["qrCity","City"]];
    const missing = required.filter(([id])=>!v(id)).map(([,label])=>label);
    if(missing.length){ alert("Please complete:\n\n• " + missing.join("\n• ")); return null; }

    const name = [v("qrFirst"), v("qrSecond"), v("qrFamily")].join(" ").toUpperCase();
    const d = new Date(v("qrDob")), now = new Date();
    let y = now.getFullYear()-d.getFullYear(), m = now.getMonth()-d.getMonth();
    if(m<0){ y--; m += 12; }
    const gender = v("qrGender");
    patientsDB[nextMrn] = {
      info:{ name, nameAr:[v("qrFirstAr"), v("qrSecondAr"), v("qrFourthAr")].join(" "),
        mrn:nextMrn, clusterMrn:nextMrn, hospitalMrn:nextMrn,
        nationalId:v("qrIdNo"), idType:v("qrIdType"), cardId:"—", accountNo:"ACC-"+nextMrn,
        dob:d.toLocaleDateString('en-GB'), hijri:v("qrDobHijri")||"—",
        fullAge:`${y}Y ${m}M`, age:y>0?y:`${m}M`, gender, genderShort:gender.toUpperCase(),
        maritalStatus:v("qrMarital"), nationality:v("qrNat").toUpperCase(), occupation:v("qrOcc"),
        patientType:"Permanent", fileStatus:"Active", expiring:"03/09/2028",
        mobile:v("qrMobile"), mobileAlt:"—", country:v("qrCountry"), city:v("qrCity"),
        paymentType:v("qrPayType") },
      insurances:[], activeInsId:null,
      wallet:{ advance:{open:0,doctor:0,clinic:0}, creditOutstanding:0, advanceHistory:[], creditHistory:[] },
      visits:[], quickReg:true
    };
    openPatientTab(nextMrn);
    return nextMrn;
  }
  overlay.appendChild(modal);
  const close = ()=>{ state.quickRegOpen=false; render(); };
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  modal.querySelector(".modal-close").onclick = close;
  modal.querySelector("#qrCancel").onclick = close;
  modal.querySelector("#qrSaveOnly").onclick = ()=>{
    if(!build()) return;
    state.quickRegOpen=false; state.screen="workspace"; state.activeTab="visits"; render();
  };
  modal.querySelector("#qrSaveWalkin").onclick = ()=>{
    if(!build()) return;
    state.quickRegOpen=false; state.walkinModal={}; render();
  };
  return overlay;
}

/* ============================ PATIENT TABS ============================ */
function renderPatientTabs(){
  const bar = document.createElement("div");
  bar.className = "ptabs";

  /* permanent first tab — one click back to the search / home screen */
  const home = el(`<div class="ptab home ${state.screen==="search"?"active":""}"><span>🔎 Search</span></div>`);
  home.onclick = ()=>{ state.screen="search"; state.addPatientOpen=false; render(); };
  bar.appendChild(home);

  state.sessions.forEach(sess=>{
    const p = patientsDB[sess.mrn];
    const v = sess.visitId==null ? null : visitOf(sess.mrn, sess.visitId);
    const ip = v && v.admType==="IP";
    const sub = !v ? "Patient file"
      : ip ? `IP · ${v.ward}`
      : `${v.admType} · ${(v.date||"").split(" ")[1] || v.date}`;
    const on = sessionKey(sess)===state.activeSession && state.screen!=="search";
    const t = el(`<div class="ptab ${on?'active':''} ${ip?'isip':''}">
        <span class="lbl"><b>${p.info.name.split(" ").slice(0,2).join(" ")}</b><i>${sub}</i></span>
        <span class="x">✕</span></div>`);
    t.querySelector(".lbl").onclick = ()=>{ focusSession(sess); render(); };
    t.querySelector(".x").onclick = (e)=>{ e.stopPropagation(); closeSession(sess); render(); };
    bar.appendChild(t);
  });
  /* Add Patient just takes you home, where search / recents / quick-reg all live */
  const addWrap = el(`<div class="ptab-add">＋ Add Patient</div>`);
  addWrap.onclick = ()=>{ state.screen="search"; render(); };
  bar.appendChild(addWrap);
  return bar;
}

/* ============================ SELECT VISIT MODAL ============================ */
function renderSelectVisitModal(){
  const p = cp();
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal">
      <span class="modal-close">✕</span>
      <h3>Select Visit</h3>
      <div class="sub">${p.info.name} &nbsp;•&nbsp; MRN ${p.info.mrn} &nbsp;•&nbsp; ${p.info.age} / ${p.info.gender}</div>
      <div class="seg" id="hospSeg">
        <div class="${!state.otherHospitalsFilter?'on':''}" data-v="0">This Hospital</div>
        <div class="${state.otherHospitalsFilter?'on':''}" data-v="1">Other Hospitals</div>
      </div>
      <div id="visitList"></div>
      <div class="add-walkin" id="walkinOpt">＋ Add Walk-in Visit (no prior appointment)</div>
    </div>
  `);
  function drawList(){
    const list = modal.querySelector("#visitList");
    list.innerHTML = "";
    /* inpatient admissions sit at the top — they are the live encounters */
    const filtered = cVisits().filter(v => state.otherHospitalsFilter ? v.interbranch : !v.interbranch)
      .sort((a,b)=>(b.admType==="IP") - (a.admType==="IP"));
    if(filtered.length===0) list.appendChild(el(`<div style="color:var(--muted);font-size:12px;padding:8px 0">No ${state.otherHospitalsFilter?"interbranch":""} visits found.</div>`));
    filtered.forEach(v=>{
      const ip = v.admType==="IP";
      const c = ip ? ipCounts(v) : null;
      const badge = ip
        ? `<span class="badge ${v.status==="Admitted"?"credit":"paid"}">${v.status||"Admitted"}</span>`
        : (v.consult.invoiced && v.orderedServices.every(s=>s.invoiced))
          ? `<span class="badge paid">Invoiced</span>` : `<span class="badge unpaid">Action Needed</span>`;
      const admBadge = v.interbranch ? `<span class="badge branch">${v.hospital}</span>`
        : `<span class="badge ${v.admType==='OPD'?'opd':(v.admType==='IP'||v.admType==='IPD')?'ipd':v.admType==='ER'?'er':'opd'}">${v.admType}</span>`;
      const meta = v.interbranch
        ? `Received From: <b>${v.hospital}</b><br>Visit Date: <b>${v.date}</b>`
        : ip
          ? `Admission No: <b>${v.admissionNo}</b> &nbsp;&nbsp; Ward: <b>${v.ward} · ${v.room}/${v.bed}</b><br>
             Consultant: <b>${v.doctor}</b> &nbsp;&nbsp; Admitted: <b>${v.admitDate}</b><br>
             Orders: <b>${c.total}</b> · accepted <b>${c.acc}</b> · invoiced <b>${c.inv}</b> ·
             payers <b>${v.payers.length}</b> · invoices <b>${v.ipInvoices.length}</b>`
          : `Clinic: <b>${v.clinic}</b> &nbsp;&nbsp; Doctor: <b>${v.doctor}</b><br>Visit Date: <b>${v.date}</b>`;
      const opt = el(`<div class="visit-opt"><div class="visit-top"><span class="ttl">${v.type}</span><span class="tags">${admBadge}${badge}</span></div><div class="visit-meta">${meta}</div></div>`);
      opt.onclick = ()=>{
        state.modalOpen = false;
        openSession(state.activeMrn, v.id);      /* each visit gets its own session tab */
        render();
      };
      list.appendChild(opt);
    });
  }
  drawList();
  modal.querySelectorAll("#hospSeg div").forEach(d=>{ d.onclick = ()=>{ state.otherHospitalsFilter = d.dataset.v==="1"; render(); }; });
  overlay.appendChild(modal);
  overlay.onclick=(e)=>{ if(e.target===overlay){ state.modalOpen=false; render(); } };
  modal.querySelector(".modal-close").onclick = ()=>{ state.modalOpen=false; render(); };
  modal.querySelector("#walkinOpt").onclick = ()=>{ state.modalOpen=false; state.walkinModal={}; render(); };
  return overlay;
}

/* ============================ ADD TO WALK-IN LIST ============================ */
function renderWalkinModal(){
  const wm = state.walkinModal;
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`<div class="modal xwide"><span class="modal-close">✕</span><h3>Add to Walk-in List</h3><div id="wkBody"></div></div>`);

  function drawPatientForm(){
    const p = cp();
    const today = new Date();
    const dateStr = today.toLocaleDateString('en-GB').split('/').join('-');
    body.innerHTML = `
      <div class="sub" style="margin-top:-6px">Patient identified — complete the visit details below.</div>
      <div class="wk-info">
        <div><div class="lbl">Patient Name</div><div class="val">${p.info.name}</div></div>
        <div><div class="lbl">Cluster MRN</div><div class="val">${p.info.mrn}</div></div>

        <div class="f"><label>Select Department:</label><select id="wkDept"><option value="">-- Please Select --</option>${departments.map(d=>`<option>${d}</option>`).join("")}</select></div>
        <div class="f"><label>Clinic <span class="req">*</span></label><select id="wkClinic"><option value="">-- Please Select --</option>${clinics.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div class="f"><label>Doctor <span class="req">*</span></label><select id="wkDoctor"><option value="">-- Please Select --</option>${doctors.map(d=>`<option>${d}</option>`).join("")}</select></div>
      </div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:14px">
        <button class="btn primary green" id="wkConfirm">Confirm</button>
        <button class="btn ghost" id="wkClose">Close</button>
      </div>
    `;
    body.querySelector("#wkClose").onclick = ()=>{ state.walkinModal=null; render(); };
    body.querySelector("#wkConfirm").onclick = ()=>{
      const type = body.querySelector("#wkType").value, clinic = body.querySelector("#wkClinic").value, doctor = body.querySelector("#wkDoctor").value;
      if(!type || !clinic || !doctor){ alert("Please complete all required fields (*)."); return; }
      const visits = cVisits();
      const id = Math.max(0,...visits.map(v=>v.id),0) + 1;
      const now = new Date();
      const stamp = now.toLocaleDateString('en-GB').split('/').join('-') + " " + now.toTimeString().slice(0,5);
      visits.unshift({ id, admType:"OPD", type:"Walk-in — "+type, clinic, doctor, date:stamp, dedUsed:0,
        consult:{ name:type+" - "+clinic, code:"CON-"+(900+id), price:150, invoiced:false,
          ins: cIns() ? "approved" : "notinsured", orderedDate:stamp },
        orderedServices:[], invoices:[] });
      state.walkinModal=null;
      openSession(state.activeMrn, id);        /* the new visit opens as its own session */
      render();
    };
  }

  function drawLookup(){
    body.innerHTML = `
      <div class="sub" style="margin-top:-6px">No patient selected yet — search by MRN or name to continue.</div>
      <div class="lookup-row"><input id="wkLookup" placeholder="Search by MRN or name..." autofocus></div>
      <div class="lookup-results" id="wkResults"></div>
    `;
    const input = body.querySelector("#wkLookup");
    const results = body.querySelector("#wkResults");
    function draw(filter){
      results.innerHTML = "";
      const list = Object.values(patientsDB).filter(p=> !filter || p.info.mrn.includes(filter) || p.info.name.toLowerCase().includes(filter.toLowerCase()));
      if(list.length===0){ results.appendChild(el(`<div style="font-size:12px;color:var(--muted)">No matching patient.</div>`)); return; }
      list.forEach(p=>{
        const o = el(`<div class="opt"><b>${p.info.name}</b><span>MRN ${p.info.mrn} · ${p.info.age}/${p.info.gender} · ${p.info.mobile}</span></div>`);
        o.onclick = ()=>{ openPatientTab(p.info.mrn); drawPatientForm(); };
        results.appendChild(o);
      });
    }
    draw("");
    input.oninput = (e)=>draw(e.target.value);
  }

  if(wm.pending && !state.activeMrn) drawLookup(); else drawPatientForm();

  overlay.appendChild(modal);
  overlay.onclick=(e)=>{ if(e.target===overlay){ state.walkinModal=null; render(); } };
  modal.querySelector(".modal-close").onclick = ()=>{ state.walkinModal=null; render(); };
  return overlay;
}

/* ============================ WORKSPACE ============================ */
function renderWorkspace(){
  const wrap = document.createElement("div");
  wrap.appendChild(renderPatientTabs());
  const p = cp();
  const visit = getVisit(state.activeVisitId);
  const tabName = state.activeTab==="visits" ? "All Visits" : state.activeTab==="credit" ? "Credit Settlement"
                : state.activeTab==="printed" ? (state.invoiceView ? "Printed Invoices / "+state.invoiceView.invoiceId : "Printed Invoices") : "Visit Detail";
  wrap.appendChild(el(`
    <div class="crumb">
      <a id="crumbHome">🏠 Billing Home</a><span class="sep">/</span>
      <a id="crumbPatient">${p.info.name} (MRN ${p.info.mrn})</a><span class="sep">/</span>
      ${state.activeTab==="visit" && visit
        ? `<a id="crumbVisits">All Visits</a><span class="sep">/</span><span>${visit.type} · ${visit.date}</span>`
        : `<span>${tabName}</span>`}
    </div>`));

  const grid = document.createElement("div");
  grid.className = "workspace";

  grid.appendChild(renderPatientBanner(p));

  const printedCount = cVisits().reduce((a,v)=>a+v.invoices.length,0);
  grid.appendChild(el(`
    <div class="tabbar">
      <div class="tab ${state.activeTab==='visits'?'active':''}" data-tab="visits">All Visits</div>
      <div class="tab ${state.activeTab==='visit'?'active':''}" data-tab="visit" style="${visit?'':'display:none'}">Visit Detail</div>
      <div class="tab ${state.activeTab==='printed'?'active':''}" data-tab="printed">Printed Invoices (${printedCount})</div>
      <div class="tab ${state.activeTab==='advance'?'active':''}" data-tab="advance">Advances</div>
      <div class="tab ${state.activeTab==='credit'?'active':''}" data-tab="credit">Credit Settlement</div>
    </div>
  `));

  const main = document.createElement("div");
  if(state.activeTab==="visits") main.appendChild(renderVisitsList());
  else if(state.activeTab==="visit" && visit) main.appendChild(renderVisitDetail(visit));
  else if(state.activeTab==="printed") main.appendChild(renderPrintedInvoices());
  else if(state.activeTab==="advance") main.appendChild(renderAdvanceTab());
  else if(state.activeTab==="credit") main.appendChild(renderCreditTab());
  grid.appendChild(main);

  const rail = document.createElement("div");
  rail.className = "rail-col";
  rail.appendChild(renderWallet());
  if(state.activeTab==="visit" && visit) rail.appendChild(renderDeductibleCard(visit));
  grid.appendChild(rail);
  wrap.appendChild(grid);

  wrap.querySelector("#crumbHome").onclick = ()=>{ state.screen="search"; render(); };
  wrap.querySelector("#crumbPatient").onclick = ()=>{ state.activeTab="visits"; render(); };
  const cv = wrap.querySelector("#crumbVisits");
  if(cv) cv.onclick = ()=>{ state.activeTab="visits"; render(); };
  wrap.querySelectorAll(".tab").forEach(t=>{ t.onclick = ()=>{ state.activeTab = t.dataset.tab; state.invoiceView = null; render(); }; });
  return wrap;
}

          <span class="ttl">${x.payer}</span>
          <span class="tags">${x.primary?`<span class="badge opd">Primary</span>`:`<span class="badge branch">Secondary</span>`}
            <span class="badge paid">Active till ${x.validTill}</span>${on?`<span class="badge ipd">Selected</span>`:""}</span>
        </div>
        <div class="visit-meta">
          Policy: <b>${x.policyName}</b> · No: <b>${x.policyNo}</b><br>
          Contract: <b>${x.contract}</b><br>
          Deductible <b>${(x.deductiblePct*100).toFixed(0)}%</b> (cap ${fmt(x.visitDeductibleCap)}/visit) ·
          Discount <b>${(x.discountPct*100).toFixed(0)}%</b> ·
          Annual pool left <b>${fmt(Math.max(0, x.annualDeductibleTotal - x.annualDeductibleUsed))}</b>
        </div>
      </div>`);
    opt.onclick = ()=>{ p.activeInsId = x.id; state.insModal=false; state.sel={}; render(); };
    listEl.appendChild(opt);
  });
  modal.querySelector("#selfPay").onclick = ()=>{ p.activeInsId = null; state.insModal=false; state.sel={}; render(); };
  overlay.appendChild(modal);
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.insModal=false; render(); } };
  modal.querySelector(".modal-close").onclick = ()=>{ state.insModal=false; render(); };
  modal.querySelector("#insClose").onclick = ()=>{ state.insModal=false; render(); };
  return overlay;
}

function renderWallet(){
  const w = cWallet();
  const total = totalAdvance(w);
  const icons = { open:"🔓", doctor:"🩺", clinic:"🏥" };
  /* only advance buckets the patient actually has money in */
  const advRows = advanceCategories.map(c=>{
    const key = c.toLowerCase(), amt = w.advance[key];
    if(amt<=0) return "";
    const pct = total>0 ? Math.round((amt/total)*100) : 0;
    return `<div class="wcat"><div class="top"><span>${icons[key]} ${c} Advance</span><b>${fmt(amt)}</b></div>
      <div class="bar"><div style="width:${pct}%"></div></div></div>`;
  }).filter(Boolean).join("");
  const box = el(`
    <div class="wallet">
      <div class="whead"><div class="lbl">Patient Wallet — Universal</div><div class="big">${fmt(total)}</div></div>
      <div class="wbody">${advRows || `<div style="font-size:11.5px;color:var(--muted)">No advance on file for this patient.</div>`}</div>
      ${w.creditOutstanding>0 ? `<div class="credit-card">
        <div class="top"><span>⚠ Outstanding Credit</span></div>
        <div class="amt">${fmt(w.creditOutstanding)}</div>
      </div>` : ""}
      <div class="wactions">
        <button class="btn sm" id="walletAddAdv">＋ Add Advance</button>
        ${w.creditOutstanding>0?`<button class="btn sm ghost" id="goCredit">Settle Credit</button>`:""}
      </div>
    </div>
  `);
  const gc = box.querySelector("#goCredit");
  if(gc) gc.onclick = ()=>{
    if(state.screen==="ip") state.ipTab = "credit"; else state.activeTab = "credit";
    render();
  };
  box.querySelector("#walletAddAdv").onclick = ()=>{ state.advDrawer = { kind:"add", mrn:state.activeMrn||"", cat:"Open", mode:"CASH", amount:"", reason:"" }; render(); };
  return box;
}

function renderVisitsList(){
  const wrap = document.createElement("div");
  const vs = cVisits();
  if(vs.length===0){ wrap.appendChild(el(`<div class="panel"><div class="ph-sub">No visits on file for this patient yet.</div></div>`)); return wrap; }
  vs.forEach(v=>{
    const fullyInvoiced = v.consult.invoiced && v.orderedServices.every(s=>s.invoiced);
    const hasCredit = v.invoices.some(i=>i.credit && !i.settled && !i.refunded);
    const admBadge = v.interbranch ? `<span class="badge branch">${v.hospital}</span>` : `<span class="badge ${v.admType==='OPD'?'opd':v.admType==='IPD'?'ipd':'er'}">${v.admType}</span>`;
    const statusBadge = fullyInvoiced ? `<span class="badge paid">Invoiced</span>` : `<span class="badge unpaid">Action Needed</span>`;
    const meta = v.interbranch ? `Received From: <b>${v.hospital}</b><br>Visit Date: <b>${v.date}</b>` : `Clinic: <b>${v.clinic}</b> &nbsp;&nbsp; Doctor: <b>${v.doctor}</b><br>Visit Date: <b>${v.date}</b>`;
    const row = el(`
      <div class="visit-opt">
        <div class="visit-top"><span class="ttl">${v.type}</span><span class="tags">${admBadge}${statusBadge}${hasCredit?'<span class="badge credit">Credit Pending</span>':''}</span></div>
        <div class="visit-meta">${meta}</div>
        <div class="visit-bottom"><span style="color:#8b95a1;font-size:11.5px">${v.invoices.length} invoice(s) on file &nbsp;·&nbsp; ${billableLines(v).length} charge(s) pending</span><button class="btn sm">Open</button></div>
      </div>
    `);
    row.onclick = ()=>{
      openSession(state.activeMrn, v.id);      /* OPD visits open as their own tab too */
      render();
    };
    wrap.appendChild(row);
  });
  return wrap;
}

/* Shared row + table builders so the consultation and the orders look identical */
function chargeRowHtml(v, line, calc, locked){
  const st = line.ins || "notinsured";
  const on = isSel(v, line.code);
  const blocked = isApprovalPending(line);
  const chk = blocked ? `<span title="Approval pending — cannot be invoiced">⏳</span>`
            : locked ? `<span title="Locked until the consultation is invoiced">🔒</span>`
                     : `<input type="checkbox" class="lineChk" data-code="${line.code}" ${on?"checked":""}>`;
  return `<tr class="${on?'on':''} ${locked||blocked?'disabled':''}">
    <td>${chk}</td>
    <td class="chg-name"><b>${line.name}</b><span>${line.code}${line.available===false?" · unavailable locally":""}${blocked?` · <b class="st pending">Approval pending</b>`:""}</span></td>
    <td>${line.orderedDate || "—"}</td>
    <td><span class="st ${st}">${insStatuses[st].label}</span></td>
    <td class="num">${fmt(calc.gross)}</td>
    <td class="num">${calc.discount?fmt(calc.discount):"—"}</td>
    <td class="num"><b>${(VAT*100).toFixed(0)}%</b><div class="sub-amt">${fmt(calc.patientTax+calc.companyTax)}</div></td>
    <td class="num"><b>${fmt(calc.patient)}</b></td>
    <td class="num">${fmt(calc.company)}</td>
  </tr>`;
}
function chargeTableHtml(rows, selAllId, allOn){
  return `<table class="chg">
    <thead><tr>
      <th style="width:26px">${selAllId?`<input type="checkbox" class="selAll" data-id="${selAllId}" ${allOn?"checked":""}>`:""}</th>
      <th>Description</th><th>Ordered Date</th><th>Insurance Status</th>
      <th class="num">Gross</th><th class="num">Disc.</th><th class="num">Tax</th>
      <th class="num">Patient Share</th><th class="num">Company Share</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ===== Consultation panel (must be invoiced first) ===== */
function renderConsultPanel(v){
  const panel = document.createElement("div");
  panel.className = "panel";
  const done = v.consult.invoiced;
  if(done){
    panel.innerHTML = `
      <h4>Consultation / Procedure <span class="badge ${v.consult.isCredit?'credit':'paid'}">${v.consult.isCredit?'Credit — Pending':'Invoiced'}</span></h4>
      <div class="ph-sub">${v.consult.name} · ${v.consult.code} · ${fmt(v.consult.price)} — settled, ordered services are unlocked below.</div>`;
    return panel;
  }
  const t = invoiceTotals(v);
  const entry = t.lines.find(l=>l.line.kind==="consult");
  panel.innerHTML = `
    <h4>Consultation / Procedure <span class="badge unpaid">Not Invoiced</span></h4>
    <div class="ph-sub">This charge is billed first — ordered services unlock once it is invoiced.</div>
    ${chargeTableHtml(chargeRowHtml(v, entry.line, entry.calc, false), "consult", isSel(v, entry.line.code))}`;
  return panel;
}

/* ===== Ordered services panel ===== */
function renderOrdersPanel(v){
  const panel = document.createElement("div");
  const consultDone = v.consult.invoiced;
  panel.className = "panel" + (consultDone ? "" : " locked-panel");
  const t = invoiceTotals(v);
  const entries = t.lines.filter(l=>l.line.kind==="order");
  const billable = entries.filter(e=>!isApprovalPending(e.line));
  const pendingCount = entries.length - billable.length;
  const allOn = billable.length>0 && billable.every(e=>isSel(v, e.line.code));

  panel.innerHTML = `
    <h4>Ordered Services ${consultDone?"":"🔒"}
      <span style="display:flex;gap:8px">${consultDone?`<button class="btn sm ghost" id="addOrderBtn">＋ Add Order</button>`:""}</span>
    </h4>
    <div class="ph-sub">${consultDone
      ? `Services ordered by the doctor under this visit. Tick the ones to bill.`
      : `🔒 Locked until the consultation above is invoiced.`}</div>
    ${pendingCount>0 ? `<div class="locked-msg" style="margin-bottom:10px">⏳ <b>Approval pending</b> — ${pendingCount} service(s) are awaiting payer approval and cannot be invoiced yet.</div>` : ""}
    ${entries.length===0
      ? `<div class="ph-sub">No ordered services pending on this visit.</div>`
      : chargeTableHtml(entries.map(e=>chargeRowHtml(v, e.line, e.calc, !consultDone)).join(""), consultDone?"orders":"", allOn)}`;
  const addBtn = panel.querySelector("#addOrderBtn");
  if(addBtn) addBtn.onclick = ()=>{ state.addOrderOpen = v.id; render(); };
  return panel;
}

/* ===== Live invoice summary for whatever is ticked across both panels ===== */
function renderInvoiceSummary(v){
  const t = invoiceTotals(v);
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `

    <div class="inv-grid">

      <div class="g disc"><div class="k">Total Discount</div><div class="v">${fmt(t.discount)}</div></div>
      <div class="g tot"><div class="k">Invoice Total</div><div class="v">${fmt(t.invoiceTotal)}</div><div class="k" style="margin-top:2px">${t.count} item(s) selected</div></div>
