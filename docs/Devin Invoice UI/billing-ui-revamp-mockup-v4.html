/* Deductible card for the right rail — reflects the current selection live */
function renderDeductibleCard(v){
  const plan = cPlan();
  if(!plan) return el(`
    <div class="ded-card">
      <div class="dhead" style="background:#f2f4f7;border-bottom-color:var(--line)">
        <div class="lbl" style="color:#6b7684">Deductible</div><div class="big" style="color:#4b5563">N/A</div>
      </div>
      <div class="dbody"><div class="note">Self-pay patient — no payer deductible applies. The full charge is patient share.</div></div>
    </div>`);

  const ded = visitDeductible(v);
  const t = invoiceTotals(v);
  const usedNow = +(ded.used + t.deductible).toFixed(2);
  const pct = ded.cap>0 ? Math.min(100, Math.round((usedNow/ded.cap)*100)) : 0;
  return el(`
    <div class="ded-card">
      <div class="dhead">
        <div class="lbl">Deductible Remaining — This Visit</div>
        <div class="big">${fmt(t.dedRemainingAfter)}</div>
      </div>
      <div class="dbody">
        <div class="dr"><span>Visit cap</span><b>${fmt(ded.cap)}</b></div>
        <div class="dr"><span>Already used</span><b>${fmt(ded.used)}</b></div>
        <div class="dr live"><span>This selection</span><b>${fmt(t.deductible)}</b></div>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <div class="dr"><span>Annual pool left</span><b>${fmt(ded.annualLeft)}</b></div>
        <div class="note">${plan.deductiblePct*100}% of the covered amount, capped at ${fmt(plan.visitDeductibleCap)} per visit.</div>
      </div>
    </div>`);
}

function renderVisitDetail(v){
  const wrap = document.createElement("div");
  const consultDone = v.consult.invoiced;

  let nudge;
  if(!consultDone) nudge = `<div class="panel" style="border-left:4px solid var(--blue)"><b style="color:var(--navy)">Suggested next step:</b> Invoice the ${v.consult.name.toLowerCase()} first. Ordered services unlock once this is settled.</div>`;
  else if(v.orderedServices.some(s=>!s.invoiced)) nudge = `<div class="panel" style="border-left:4px solid var(--amber)"><b style="color:var(--amber)">Suggested next step:</b> ${v.orderedServices.filter(s=>!s.invoiced).length} ordered service(s) are ready to invoice.</div>`;
  else nudge = `<div class="panel" style="border-left:4px solid var(--green)"><b style="color:var(--green)">All caught up:</b> Consultation and ordered services are fully invoiced.</div>`;
  wrap.appendChild(el(nudge));

  const pending = billableLines(v);
  if(pending.length===0){
    wrap.appendChild(el(`<div class="panel"><h4>Charges</h4><div class="ph-sub">Nothing pending — every charge on this visit has been invoiced.</div></div>`));
  } else {
    wrap.appendChild(renderConsultPanel(v));
    wrap.appendChild(renderOrdersPanel(v));
    wrap.appendChild(renderInvoiceSummary(v));
  }

  /* selection handlers are shared across the consultation + orders tables */
  wrap.querySelectorAll(".lineChk").forEach(c=>c.onchange = ()=>{
    const k = selKey(v, c.dataset.code);
    if(c.checked) state.sel[k] = true; else delete state.sel[k];
    render();
  });
  wrap.querySelectorAll(".selAll").forEach(sa=>sa.onchange = ()=>{
    const group = (sa.dataset.id==="consult" ? [v.consult] : v.orderedServices.filter(s=>!s.invoiced))
      .filter(l=>!isApprovalPending(l));
    group.forEach(l=>{ const k=selKey(v,l.code); if(sa.checked) state.sel[k]=true; else delete state.sel[k]; });
    render();
  });

  /* Invoiced services that are unavailable locally can be referred out to a sister hospital */
  const referable = v.orderedServices.map((s,i)=>({s,i})).filter(({s})=>s.invoiced && s.available===false);
  if(referable.length){
    const refPanel = document.createElement("div");
    refPanel.className = "panel";
    refPanel.innerHTML = `
      <h4>Invoiced &amp; Unavailable Locally <button class="btn sm danger" id="referBtn">Refer Out Selected</button></h4>
      <div class="ph-sub">Referral to a sister hospital is only available once a procedure has been invoiced and is unavailable at ${CURRENT_HOSPITAL}.</div>
      <table class="svc"><thead><tr><th></th><th>Description</th><th>Code</th><th class="num">Amount</th><th class="num">Status</th></tr></thead>
      <tbody>${referable.map(({s,i})=>`
        <tr><td>${s.referred?"":`<input type="checkbox" class="referChk" data-i="${i}">`}</td>
          <td>${s.name}</td><td class="svc-code">${s.code}</td><td class="num">${fmt(s.price)}</td>
          <td class="num">${s.referred?`<span class="badge credit">Referred → ${s.referred.hospital}</span>`:`<span class="badge paid">Invoiced</span>`}</td></tr>`).join("")}
      </tbody></table>`;
    refPanel.querySelector("#referBtn").onclick = ()=>{
      const checked = [...refPanel.querySelectorAll(".referChk:checked")].map(c=>parseInt(c.dataset.i));
      if(checked.length===0){ alert("Select at least one invoiced procedure to refer out."); return; }
      state.referModal = { visitId:v.id, indices:checked }; render();
    };
    wrap.appendChild(refPanel);
  }

  if(v.invoices.length){
    const link = el(`<div class="panel"><div class="ph-sub" style="margin:0">${v.invoices.length} invoice(s) raised on this visit — <a style="color:var(--blue);cursor:pointer" id="toPrinted">open Printed Invoices</a> to view or refund them.</div></div>`);
    link.querySelector("#toPrinted").onclick = ()=>{ state.activeTab="printed"; state.invoiceView=null; render(); };
    wrap.appendChild(link);
  }
  return wrap;
}

/* ===== PRINTED INVOICES TAB — high level list, drill in for procedures ===== */
function invoiceStatus(inv){
  const items = inv.items || [];
  const refundedAll = inv.refunded || (items.length>0 && items.every(i=>i.refunded));
  if(refundedAll) return { label:"Refunded", cls:"unpaid" };
  if(items.some(i=>i.refunded)) return { label:"Partially Refunded", cls:"credit" };
  if(inv.credit && !inv.settled) return { label:"Credit Pending", cls:"credit" };
  return { label:"Paid", cls:"paid" };
}
function renderPrintedInvoices(){
  if(state.invoiceView) return renderInvoiceDetail();
  const wrap = document.createElement("div");
  const rows = [];
  cVisits().forEach(v=>v.invoices.forEach(inv=>rows.push({v, inv})));
  const panel = document.createElement("div");
  panel.className = "panel";
  if(rows.length===0){
    panel.innerHTML = `<h4>Printed Invoices</h4><div class="ph-sub">No invoices have been raised for this patient yet.</div>`;
    wrap.appendChild(panel); return wrap;
  }
  panel.innerHTML = `
    <h4>Printed Invoices</h4>
    <div class="ph-sub">All invoices raised for this patient. Open an invoice to see the procedures billed, or to refund part of it.</div>
    <table class="reg">
      <thead><tr><th>Invoice</th><th>Date</th><th>Visit</th><th class="num">Items</th><th class="num">Invoice Total</th><th class="num">Patient Paid</th><th class="num">Refunded</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows.map(({v,inv})=>{
        const st = invoiceStatus(inv);
        const items = inv.items || [];
        const refunded = +items.filter(it=>it.refunded).reduce((a,it)=>a+it.calc.patientWithTax,0).toFixed(2);
        return `<tr>
          <td><b>${inv.id}</b></td><td>${inv.date}</td>
          <td>${v.interbranch?v.hospital:v.type} <span class="svc-code">· ${v.date.split(" ")[0]}</span></td>
          <td class="num">${items.length}${refunded>0?` <span class="svc-code">(${items.filter(it=>it.refunded).length} refunded)</span>`:""}</td>
          <td class="num">${fmt(inv.amount)}</td>
          <td class="num">${fmt(inv.patientShare!==undefined?inv.patientShare:inv.amount)}</td>
          <td class="num">${refunded>0?`<b style="color:var(--red)">− ${fmt(refunded)}</b>`:"—"}</td>
          <td><span class="badge ${st.cls}">${st.label}</span></td>
          <td><button class="btn sm ghost" data-open="${v.id}|${inv.id}">View</button></td>
        </tr>`;
      }).join("")}</tbody>
    </table>`;
  panel.querySelectorAll("[data-open]").forEach(b=>b.onclick = ()=>{
    const [visitId, invoiceId] = b.dataset.open.split("|");
    state.invoiceView = { visitId:parseInt(visitId), invoiceId };
    render();
  });
  wrap.appendChild(panel);
  return wrap;
}

/* Drill-down: the procedures inside one invoice, with print + refund */
function renderInvoiceDetail(){
  const { visitId, invoiceId } = state.invoiceView;
  const v = getVisit(visitId);
  const inv = v.invoices.find(i=>i.id===invoiceId);
  const st = invoiceStatus(inv);
  const items = inv.items || [];
  const open = items.filter(it=>!it.refunded);
  const rk = (code)=>inv.id+"|"+code;
  const selCount = open.filter(it=>state.refundSel[rk(it.code)]).length;
  const selPatient = +open.filter(it=>state.refundSel[rk(it.code)]).reduce((a,it)=>a+it.calc.patientWithTax,0).toFixed(2);
  const refundedTotal = +items.filter(it=>it.refunded).reduce((a,it)=>a+it.calc.patientWithTax,0).toFixed(2);

  const wrap = document.createElement("div");
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `
    <h4>Invoice ${inv.id} <span class="badge ${st.cls}">${st.label}</span></h4>
    <div class="ph-sub">${v.interbranch?v.hospital:v.type} · ${v.date} · raised ${inv.date} · paid via ${inv.modes.map(m=>m.mode+" "+fmt(m.amount)).join(" + ")}
      ${open.length?` — tick the procedures below to refund them.`:``}</div>
    <table class="chg">
      <thead><tr>
        <th style="width:26px">${open.length?`<input type="checkbox" id="rfAllGrid" ${selCount===open.length&&selCount>0?"checked":""}>`:""}</th>
        <th>Procedure / Service</th><th>Insurance Status</th><th class="num">Gross</th><th class="num">Disc.</th>
        <th class="num">Tax</th><th class="num">Patient Share</th><th class="num">Company Share</th><th class="num">Status</th></tr></thead>
      <tbody>${items.map(it=>{
        const on = !!state.refundSel[rk(it.code)];
        return `<tr class="${it.refunded?'disabled':(on?'on':'')}">
          <td>${it.refunded?"—":`<input type="checkbox" class="rfGrid" data-code="${it.code}" ${on?"checked":""}>`}</td>
          <td class="chg-name"><b>${it.name}</b><span>${it.code}${it.refunded?` · refunded via ${it.refundMode}`:""}</span></td>
          <td><span class="st ${it.ins}">${insStatuses[it.ins].label}</span></td>
          <td class="num">${fmt(it.calc.gross)}</td>
          <td class="num">${it.calc.discount?fmt(it.calc.discount):"—"}</td>
          <td class="num">${fmt(it.calc.patientTax+it.calc.companyTax)}</td>
          <td class="num"><b>${fmt(it.calc.patientWithTax)}</b></td>
          <td class="num">${fmt(it.calc.companyWithTax)}</td>
          <td class="num">${it.refunded?`<span class="badge unpaid">Refunded</span>`:`<span class="badge paid">Billed</span>`}</td>
        </tr>`;
      }).join("")}
      </tbody>
    </table>
    <div class="inv-grid" style="margin-top:12px">
      <div class="g pat"><div class="k">Patient Paid (with TAX)</div><div class="v">${fmt(inv.patientShare)}</div></div>
      <div class="g co"><div class="k">Company Share (with TAX)</div><div class="v">${fmt(inv.companyShare)}</div></div>
      <div class="g tax"><div class="k">Tax Amount</div><div class="v">${fmt(inv.tax||0)}</div></div>
      ${refundedTotal>0 ? `<div class="g" style="border-left-color:var(--red)"><div class="k">Refunded to Patient</div><div class="v" style="color:var(--red)">${fmt(refundedTotal)}</div></div>`
                        : `<div class="g disc"><div class="k">Total Discount</div><div class="v">${fmt(inv.discount||0)}</div></div>`}
      <div class="g tot"><div class="k">Invoice Total</div><div class="v">${fmt(inv.amount)}</div>
        ${selCount?`<div class="k" style="margin-top:2px;color:var(--red)">${selCount} selected · refund ${fmt(selPatient)}</div>`:""}</div>
      <div class="pay-cta" style="display:flex;gap:8px">
        <button class="btn ghost" id="invPrint">🖨 Print</button>
        ${open.length ? `<button class="btn danger" id="invRefund" ${selCount===0?"disabled":""}>Refund Selected →</button>` : ""}
      </div>
    </div>`;
  const back = el(`<div class="crumb"><a id="backList">← Back to Printed Invoices</a></div>`);

  panel.querySelectorAll(".rfGrid").forEach(c=>c.onchange = ()=>{

/* ===== ADVANCES TAB — balances, full history, refund and inter-hospital transfer ===== */
function advHistory(){ const w = cWallet(); w.advanceHistory = w.advanceHistory || []; return w.advanceHistory; }
function creditHistory(w){ w = w || cWallet(); w.creditHistory = w.creditHistory || []; return w.creditHistory; }
/* every movement of the credit balance is written to its own audit trail */
function logCredit(w, entry){
  creditHistory(w).unshift(Object.assign({
    id:"CRD-"+Math.floor(1000+Math.random()*9000),
    date:new Date().toLocaleDateString('en-GB').split('/').join('-'),
    hospital:CURRENT_HOSPITAL
  }, entry, { balanceAfter:+w.creditOutstanding.toFixed(2) }));
}
function logAdvance(entry){
  const w = cWallet();
  advHistory().unshift(Object.assign({
    id:"ADV-"+Math.floor(1000+Math.random()*9000),
    date:new Date().toLocaleDateString('en-GB').split('/').join('-'),
    hospital:CURRENT_HOSPITAL
  }, entry, { balanceAfter: totalAdvance(w) }));
}

    kind:"invoice", visitId:v.id,
    payable:t.patientWithTax, totals:t,

  };

function renderPayDrawer(){
  const d = state.payDrawer;
  const p = cp(), w = cWallet();
  const paid = d.lines.reduce((a,l)=>a+l.amount,0);
  const balance = +(d.payable - paid).toFixed(2);

  const scrim = el(`<div class="drawer-scrim"></div>`);

        <button class="complete" id="dwComplete" ${balance!==0?"disabled":""}>Complete</button>
      </div>
    </div>
  `);

  const body = dw.querySelector("#dwBody");

  function linesHtml(){
    return `<div class="dw-lines">${d.lines.length===0
      ? `<div class="empty">No payment lines added yet — pick a mode, enter the details and press Add.</div>`
      : d.lines.map((l,i)=>`<div class="ln"><div><b>${l.mode}</b>${l.meta?`<div class="meta">${l.meta}</div>`:""}</div>
          <div><b>${fmt(l.amount)}</b><span class="rm" data-rm="${i}">✕</span></div></div>`).join("")}</div>`;
  }

  function drawPaymentTab(){
    const modes = drawerModes.filter(m=>d.kind==="credit-settle" ? m.key!=="INSURANCE" : true);
    const active = modes.find(m=>m.key===d.mode) || modes[0];
    d.mode = active.key;
    const fields = active.fields.map(f=>{
      const def = fieldDefs[f];
      const val = f==="amount" ? (d.draft.amount!==undefined ? d.draft.amount : Math.max(0, balance).toFixed(2))
                : f==="hijri" ? p.info.hijri : (d.draft[f]||"");
      const input = def.select
        ? `<select data-f="${f}"><option value="">${def.ph}</option>${def.select.map(o=>`<option ${val===o?"selected":""}>${o}</option>`).join("")}</select>`
        : `<input data-f="${f}" type="${def.type||"text"}" placeholder="${def.ph||""}" value="${val}" ${def.readonly?"readonly":""}>`;
      return `<div class="f ${f==="amount"?"":""}"><label>${def.label} ${def.req?`<span class="req">*</span>`:""}</label>${input}</div>`;
    }).join("");
    body.innerHTML = `
      <div class="dw-modes">${modes.map(m=>`<div class="m ${m.key===d.mode?'on':''}" data-m="${m.key}">${m.key}</div>`).join("")}</div>

      <div class="dw-addrow"><button class="dw-add" id="dwAdd">Add ＋</button></div>

    `;
    body.querySelectorAll(".dw-modes .m").forEach(c=>c.onclick = ()=>{ d.mode=c.dataset.m; d.draft={}; render(); });
    body.querySelectorAll("[data-f]").forEach(inp=>inp.oninput = inp.onchange = (e)=>{ d.draft[e.target.dataset.f]=e.target.value; });
    body.querySelector("#dwAdd").onclick = ()=>{
      const missing = active.fields.filter(f=>fieldDefs[f].req && f!=="hijri" && !(f==="amount"?(d.draft.amount||balance):d.draft[f]));
      if(missing.length){ alert("Please complete: " + missing.map(f=>fieldDefs[f].label).join(", ")); return; }
      const amt = parseFloat(d.draft.amount!==undefined ? d.draft.amount : balance)||0;
      if(amt<=0){ alert("Enter an amount greater than zero."); return; }
      const metaBits = active.fields.filter(f=>f!=="amount" && d.draft[f]).map(f=>`${fieldDefs[f].label}: ${d.draft[f]}`);
      d.lines.push({ mode:d.mode, amount:+amt.toFixed(2), meta:metaBits.join(" · ") });
      d.draft = {}; render();
    };
    wireRemove();
  }

  function drawAdvanceTab(){
    const avail = w.advance[d.advCat.toLowerCase()];
    body.innerHTML = `
      <div class="dw-modes">${advanceCategories.map(c=>`<div class="m ${c===d.advCat?'on':''}" data-c="${c}">${c.toUpperCase()} · ${fmt(w.advance[c.toLowerCase()])}</div>`).join("")}</div>
      <div class="dw-fields">
        <div class="f"><label>Available in ${d.advCat} Advance</label><input value="${fmt(avail)}" readonly></div>
        <div class="f"><label>Amount to Apply <span class="req">*</span></label><input id="advApply" type="number" value="${Math.min(avail, Math.max(0,balance)).toFixed(2)}"></div>
      </div>
      <div class="dw-addrow"><button class="dw-add" id="dwAdd">Add ＋</button></div>
      ${linesHtml()}
    `;
    body.querySelectorAll(".dw-modes .m").forEach(c=>c.onclick = ()=>{ d.advCat=c.dataset.c; render(); });
    body.querySelector("#dwAdd").onclick = ()=>{
      const amt = parseFloat(body.querySelector("#advApply").value)||0;
      if(amt<=0) return;
      if(amt>avail){ alert(`Only ${fmt(avail)} available in ${d.advCat} advance.`); return; }
      d.lines.push({ mode:"ADVANCE", amount:+amt.toFixed(2), meta:`${d.advCat} advance` });
      render();
    };
    wireRemove();
  }

  function drawCreditTab(){
    if(d.kind==="credit-settle"){
      body.innerHTML = `<div class="locked-msg">Credit cannot be used to settle an existing credit invoice. Use Payment or Advance.</div>${linesHtml()}`;
      wireRemove(); return;
    }
    body.innerHTML = `
      <div class="dw-fields">
        <div class="f full"><label>Credit Account</label><input value="${cIns() ? cIns().payerGroup+" · "+cIns().contract : "Self-pay · "+p.info.mrn}" readonly></div>
        <div class="f"><label>Current Outstanding</label><input value="${fmt(w.creditOutstanding)}" readonly></div>
        <div class="f"><label>Amount on Credit <span class="req">*</span></label><input id="credAmt" type="number" value="${Math.max(0,balance).toFixed(2)}"></div>
      </div>
      <div class="dw-addrow"><button class="dw-add" id="dwAdd">Add ＋</button></div>
      ${linesHtml()}
    `;
    body.querySelector("#dwAdd").onclick = ()=>{
      const amt = parseFloat(body.querySelector("#credAmt").value)||0;
      if(amt<=0) return;
      d.lines.push({ mode:"CREDIT", amount:+amt.toFixed(2), meta:"Posted to patient credit account" });
      render();
    };
    wireRemove();
  }

  function wireRemove(){
    body.querySelectorAll("[data-rm]").forEach(x=>x.onclick = ()=>{ d.lines.splice(parseInt(x.dataset.rm),1); render(); });
  }

  if(d.tab==="payment") drawPaymentTab();
  else if(d.tab==="advance") drawAdvanceTab();
  else drawCreditTab();

  dw.querySelectorAll(".dw-tabs div").forEach(t=>t.onclick = ()=>{ d.tab=t.dataset.t; d.draft={}; render(); });
  const close = ()=>{ state.payDrawer=null; render(); };
  scrim.onclick = close;
  dw.querySelector("#dwClose").onclick = close;
  dw.querySelector("#dwClear").onclick = ()=>{ d.lines=[]; d.draft={}; render(); };
  dw.querySelector("#dwComplete").onclick = ()=>completePayment(d);

  const frag = document.createDocumentFragment();
  frag.appendChild(scrim); frag.appendChild(dw);
  return frag;
}

function completePayment(d){
  const w = cWallet();
  d.lines.forEach(l=>{
    if(l.mode!=="ADVANCE") return;
    const cat = (l.meta.split(" ")[0]||"Open");
    const key = cat.toLowerCase();
    w.advance[key] = Math.max(0, +(w.advance[key]-l.amount).toFixed(2));
    logAdvance({ type:"APPLIED", category:cat, mode:"INVOICE", amount:l.amount, reason:"applied to invoice" });
  });

  if(d.kind==="credit-settle"){
    d.creditRefs.forEach(r=>{
      const v=getVisit(r.visitId); const inv=v.invoices.find(i=>i.id===r.invoiceId);
      inv.settled=true;
      w.creditOutstanding = +(w.creditOutstanding - inv.amount).toFixed(2);
      logCredit(w, { type:"SETTLED", amount:inv.amount, ref:inv.id,
        mode:d.lines.map(l=>l.mode).join(" + ") || "—", note:v.type+" · "+v.date });
    });
    state.payDrawer=null; render(); return;
  }

  const v = getVisit(d.visitId), t = d.totals;
  const creditAmt = d.lines.filter(l=>l.mode==="CREDIT").reduce((a,l)=>a+l.amount,0);
  if(creditAmt>0){
    w.creditOutstanding = +(w.creditOutstanding + creditAmt).toFixed(2);
    logCredit(w, { type:"ADDED", amount:creditAmt, ref:"pending invoice", mode:"CREDIT", note:"outpatient invoice raised on credit" });
  }

  /* consume the visit deductible so the next invoice on this visit sees the reduced pool */
  v.dedUsed = +((v.dedUsed||0) + t.deductible).toFixed(2);
  const plan = cPlan();
  if(plan) plan.annualDeductibleUsed = +(plan.annualDeductibleUsed + t.deductible).toFixed(2);

  const invId = "INV-"+Math.floor(1000+Math.random()*9000);
  const invoice = { id:invId, label:d.items.map(i=>i.name).join(", "), amount:t.invoiceTotal,
    patientShare:t.patientWithTax, companyShare:t.companyWithTax, tax:t.taxAmount, discount:t.discount, deductible:t.deductible,
    items:d.items.map(it=>({ name:it.name, code:it.code, price:it.price, ins:it.ins, calc:it.calc, refunded:false })),
    modes:d.lines.map(l=>({mode:l.mode, amount:l.amount, category:l.meta})),
    date:new Date().toLocaleDateString('en-GB').split('/').join('-'), refunded:false, credit:creditAmt>0, settled:false };
  v.invoices.unshift(invoice);

  d.items.forEach(it=>{
    if(it.kind==="consult"){ v.consult.invoiced=true; v.consult.isCredit=creditAmt>0; }
    else { const target = v.orderedServices.find(s=>s.code===it.code); if(target) target.invoiced=true; }
    delete state.sel[selKey(v, it.code)];
  });

  state.payDrawer=null; state.printModal={ visitId:v.id, invoiceId:invId };
  render();
}

/* ============================ REFUND DRAWER (per-procedure) ============================ */
const refundModes = ["CASH","CARD","BANK TRANSFER","ADVANCE WALLET"];

function openRefundDrawer(visitId, invoiceId, returnScreen){
  const inv = getVisit(visitId).invoices.find(i=>i.id===invoiceId);
  const openItems = (inv.items||[]).filter(it=>!it.refunded);
  /* the grid drives which procedures are refunded; fall back to all open lines
     when the drawer is opened straight from the global register */
  const picked = openItems.filter(it=>state.refundSel[inv.id+"|"+it.code]);
  const sel = {};
  (picked.length ? picked : openItems).forEach(it=>{ sel[it.code] = true; });
  if(!picked.length) Object.keys(sel).forEach(code=>{ state.refundSel[inv.id+"|"+code] = true; });
  state.refundDrawer = { visitId, invoiceId, sel, mode:refundModes.includes(inv.modes[0].mode)?inv.modes[0].mode:"CASH",
    reason:"", returnScreen: returnScreen || state.screen };
  render();
}

function refundTotals(inv, sel){
  const t = { count:0, patient:0, company:0, deductible:0, gross:0 };
  (inv.items||[]).forEach(it=>{
    if(it.refunded || !sel[it.code]) return;
    t.count++; t.patient += it.calc.patientWithTax; t.company += it.calc.companyWithTax;
    t.deductible += it.calc.deductible; t.gross += it.calc.gross;
  });
  ["patient","company","deductible","gross"].forEach(k=>t[k]=+t[k].toFixed(2));
  return t;
}

  const syncGrid = ()=>{

function completeRefund(d){
  const v = getVisit(d.visitId);
  const inv = v.invoices.find(i=>i.id===d.invoiceId);
  const t = refundTotals(inv, d.sel);
  const w = cWallet(), plan = cPlan();

  (inv.items||[]).forEach(it=>{ if(!it.refunded && d.sel[it.code]) Object.assign(it, { refunded:true, refundMode:d.mode, refundReason:d.reason }); });
  inv.refunds = inv.refunds || [];
  inv.refunds.push({ mode:d.mode, amount:t.patient, reason:d.reason, date:new Date().toLocaleDateString('en-GB').split('/').join('-'),
    items:(inv.items||[]).filter(it=>it.refundReason===d.reason).map(it=>it.code) });

  /* refunding releases the deductible those lines consumed */
  v.dedUsed = Math.max(0, +((v.dedUsed||0) - t.deductible).toFixed(2));
  if(plan) plan.annualDeductibleUsed = Math.max(0, +(plan.annualDeductibleUsed - t.deductible).toFixed(2));

  if(d.mode==="ADVANCE WALLET"){
    w.advance.open = +(w.advance.open + t.patient).toFixed(2);
    logAdvance({ type:"ADD", category:"Open", mode:"INVOICE REFUND", amount:t.patient, reason:"refund of "+inv.id });
  }
  if(inv.credit && !inv.settled){
    w.creditOutstanding = Math.max(0, +(w.creditOutstanding - t.patient).toFixed(2));
    logCredit(w, { type:"ADJUSTED", amount:t.patient, ref:inv.id, mode:d.mode, note:"refund reversed off credit" });
  }

  const allRefunded = (inv.items||[]).every(it=>it.refunded);
  if(allRefunded){ inv.refunded = true; inv.refundMode = d.mode; }

  /* un-invoice the refunded services so they can be re-billed if needed */
  (inv.items||[]).filter(it=>it.refunded).forEach(it=>{
    const svc = v.orderedServices.find(s=>s.code===it.code);
    if(svc) svc.invoiced = false;
    if(v.consult.code===it.code) v.consult.invoiced = false;
  });

  Object.keys(state.refundSel).filter(k=>k.startsWith(inv.id+"|")).forEach(k=>delete state.refundSel[k]);
  state.refundDrawer = null;
  render();
}

/* ================================================================================
   INPATIENT MODULE — multi-payer admission billing
   ================================================================================ */
function ipAdm(){ return getVisit(state.ipAdmissionId); }
function ipPayer(adm, id){ return adm.payers.find(x=>x.id===(id||adm.activePayerId)); }
function ipPayerPlan(adm, payer){
  if(!payer || payer.kind!=="INSURANCE") return null;
  return (cp().insurances||[]).find(x=>x.id===payer.insId) || null;
}
function ipOrders(adm, filter){
  return adm.ipOrders.filter(o=>{
    if(filter.state && o.state!==filter.state) return false;
    if(filter.cat && o.cat!==filter.cat) return false;
    if(filter.payerId && o.payerId!==filter.payerId) return false;
    return true;
  });
}
/* value of an order line (qty * unit price), discount aware */
function ipLineCalc(adm, o, payer){
  const plan = ipPayerPlan(adm, payer || ipPayer(adm, o.payerId));
  /* zero reconciliation: the item is recorded but billed at nil to everyone */
  if(o.zeroPriced) return { gross:0, discount:0, net:0, patient:0, company:0, patientTax:0, companyTax:0,
    patientWithTax:0, companyWithTax:0, deductible:0, inPackage:o.pkg==="RECONCILED", zero:true };
  const gross = +(o.price * o.qty).toFixed(2);
  const disc  = +(gross * ((o.discountPct||0)/100)).toFixed(2);
  /* package-reconciled meds/consumables carry no separate charge */
  if(o.pkg==="RECONCILED") return { gross, discount:gross, net:0, patient:0, company:0, patientTax:0, companyTax:0,
    patientWithTax:0, companyWithTax:0, deductible:0, inPackage:true };
  /* Inpatient carries no deductible — the patient share is what the payer does not cover.
     (Passing 0 here keeps calcLine shared with OPD, where the deductible does apply.) */
  const c = calcLine({ price:+(gross-disc).toFixed(2), ins:o.ins }, 0, plan);
  return Object.assign(c, { gross, discount:disc, inPackage:false });
}
/* kept for the OPD-style plan summary only — inpatient billing applies no deductible */
function ipDeductibleLeft(adm){
  const payer = ipPayer(adm);
  const plan = ipPayerPlan(adm, payer);
  if(!plan) return 0;
  return Math.max(0, plan.visitDeductibleCap - (adm.dedUsed||0));
}
/* ---- Packages ----
   A package bundles named services plus a spend limit for medications and consumables.
   It has to be accepted first; only then can meds / consumables reconcile into it.
   Anything that does not fit is billed as the standalone Inpatient Medication /
   Inpatient Consumable service. */
function ipPackages(adm){ return adm.packages || []; }
function ipAcceptedPackages(adm){
  /* dearest package first — that is the one meds and consumables fill up first */
  return ipPackages(adm).filter(pk=>pk.accepted && pk.payerId===adm.activePayerId)
    .sort((a,b)=>b.price-a.price);
}
function ipPackagesForService(adm, code){ return ipPackages(adm).filter(pk=>pk.services.some(x=>x.code===code)); }
function ipPackageForService(adm, code){ return ipPackagesForService(adm, code)[0] || null; }
/* the two in-package buckets that medications and consumables accumulate into */
function ipPkgBuckets(adm, pk){
  const u = ipPkgUsage(adm, pk);
  return [
    { key:"MED",  code:"IP-MED-INPKG",  name:"Inpatient Medications",  limit:pk.medLimit,  used:u.medUsed,
      lines:u.kids.filter(o=>o.cat==="MED") },
    { key:"CONS", code:"IP-CONS-INPKG", name:"Inpatient Consumables", limit:pk.consLimit, used:u.consUsed,
      lines:u.kids.filter(o=>o.cat==="CONS") }
  ];
}
function ipPkgUsage(adm, pk){
  const kids = adm.ipOrders.filter(o=>o.packageId===pk.id && o.state!=="NEW" && o.state!=="CANCELLED");
  const sum = (cat)=> +kids.filter(o=>o.cat===cat && !o.zeroPriced).reduce((a,o)=>a+o.price*o.qty,0).toFixed(2);
  const medUsed = sum("MED"), consUsed = sum("CONS");
  return { kids, medUsed, consUsed,
    medLeft:+Math.max(0, pk.medLimit-medUsed).toFixed(2),
    consLeft:+Math.max(0, pk.consLimit-consUsed).toFixed(2),
    services:kids.filter(o=>o.cat==="SERVICE") };
}
/* what is billed outside every package for the active payer */
function ipBulk(adm, cat){
  const lines = adm.ipOrders.filter(o=>o.cat===cat && o.pkg==="BULK" && o.payerId===adm.activePayerId
    && o.state!=="NEW" && o.state!=="CANCELLED");
  return { lines, total:+lines.filter(o=>!o.zeroPriced).reduce((a,o)=>a+o.price*o.qty,0).toFixed(2) };
}
/* every package is itself an order line — it has to be accepted like any other service */
function ipPackageOrder(adm, pk){ return adm.ipOrders.find(o=>o.cat==="PACKAGE" && o.packageOf===pk.id); }
function seedIpPackageOrders(){
  Object.values(patientsDB).forEach(p=>p.visits.filter(v=>v.admType==="IP").forEach(adm=>{
    (adm.packages||[]).forEach(pk=>{
      if(ipPackageOrder(adm, pk)) return;
      adm.ipOrders.unshift({ id:"PKG-"+pk.id, cat:"PACKAGE", packageOf:pk.id, code:pk.code, name:pk.name,
        qty:1, price:pk.price, ins:"approved", orderedOn:adm.admitDate, state:"NEW" });
    });
  }));
}
/* shortcut used by the rail and the accept prompt — accepts the package's own order line */
function ipAcceptPackage(adm, pk, form){
  if(pk.accepted) return null;
  const line = ipPackageOrder(adm, pk);
  if(!line || line.state!=="NEW") return null;
  ipAcceptSelected(adm, [line.id], form || state.ipAcceptForm);
  return line;
}
/* Revoking the package line sends everything it carried back to New Orders —
   the reconciled items and the bulk Inpatient Medication / Consumable overflow with them. */
function ipDetachPackage(adm, pk){
  const payerId = pk.payerId;
  pk.accepted = false; pk.payerId = null; pk.acceptedOn = null;
  const reset = (o)=>Object.assign(o, { state:"NEW", payerId:null, packageId:null, pkg:null, acceptMode:null, zeroPriced:false,
    performedOn:null, performClinic:null, performedBy:null, acceptedBy:null, acceptedOn:null,
    performedStatus:null, openApproval:false, discountPct:0, surgeryRole:null, surgeryManaged:false,
    replacedNote:"released from "+pk.name });
  adm.ipOrders.filter(o=>o.packageId===pk.id).forEach(reset);
  /* the bulk lines only exist because the package was full — revoke them too */
  adm.ipOrders.filter(o=>o.pkg==="BULK" && (o.cat==="MED"||o.cat==="CONS")
    && o.state==="ACCEPTED" && (!payerId || o.payerId===payerId)).forEach(reset);
  ipMergeSplitLines(adm);
}
/* Put split quantities back together once every part is back in New Orders.
   The original row is parked as SPLIT while its parts are live, so it is revived here. */
function ipMergeSplitLines(adm){
  const byId = {};
  adm.ipOrders.forEach(o=>{ byId[o.id] = o; });
  const groups = {};
  adm.ipOrders.filter(o=>o.state==="NEW" && o.splitFrom).forEach(o=>{
    (groups[o.splitFrom] = groups[o.splitFrom] || []).push(o);
  });
  const drop = new Set();
  Object.keys(groups).forEach(pid=>{
    const parent = byId[pid];
    const parts = groups[pid];
    if(!parent || !["NEW","SPLIT"].includes(parent.state)) return;
    /* only merge when nothing from this order is still accepted elsewhere */
    const stillOut = adm.ipOrders.some(o=>o.splitFrom===pid && o.state!=="NEW");
    if(stillOut) return;
    parent.qty = (parent.state==="SPLIT" ? 0 : parent.qty) + parts.reduce((a,o)=>a+o.qty,0);
    Object.assign(parent, { state:"NEW", pkg:null, packageId:null, payerId:null, acceptMode:null });
    parts.forEach(o=>drop.add(o.id));
  });
  adm.ipOrders = adm.ipOrders.filter(o=>!drop.has(o.id));
}
/* Approval position per payer: what is approved, what this admission has consumed,
   and how many lines are riding on an open (not yet confirmed) approval. */
function ipApproval(adm, py){
  const mine = adm.ipOrders.filter(o=>o.payerId===py.id && o.state!=="NEW" && o.state!=="CANCELLED");
  const used = +mine.reduce((a,o)=>a+ipLineCalc(adm,o,py).companyWithTax,0).toFixed(2);
  const openLines = mine.filter(o=>o.openApproval);
  const openValue = +openLines.reduce((a,o)=>a+ipLineCalc(adm,o,py).companyWithTax,0).toFixed(2);

  /* totals are the sum of the individual approval requests raised from the approval module */
  const requests = (py.approvals && py.approvals.requests) || [];
  const openReqs = requests.filter(r=>r.kind==="OPEN");
  const approved  = +openReqs.reduce((a,r)=>a+r.approved,0).toFixed(2);
  const requested = +openReqs.reduce((a,r)=>a+r.requested,0).toFixed(2);
  const reqConsumed = +openReqs.reduce((a,r)=>a+r.consumed,0).toFixed(2);
  /* consumed = what the approval module already recorded plus what this session has accepted */
  const consumed = +(reqConsumed + used).toFixed(2);

  return { approved, requested, requests, openReqs, reqConsumed, used, consumed,
    left:+Math.max(0, approved-consumed).toFixed(2),
    openCount: openLines.length, openValue, hasApproval: approved>0 };
}
/* payers that still have approval headroom — used to suggest alternatives while accepting */
function ipPayersWithApproval(adm){
  return adm.payers.filter(py=>py.approvals && ipApproval(adm,py).left>0);
}

function ipCounts(adm){
  const total = adm.ipOrders.length;
  const nw = adm.ipOrders.filter(o=>o.state==="NEW").length;
  const acc = adm.ipOrders.filter(o=>o.state==="ACCEPTED").length;
  const inv = adm.ipOrders.filter(o=>o.state==="INVOICED").length;
  const pend = adm.ipOrders.filter(o=>o.state==="NEW" && o.ins==="pending").length;
  return { total, nw, acc, inv, pend };
}

/* ---- Accept: assigns payer, performing team, and reconciles meds/consumables into the package ---- */
function ipAcceptSelected(adm, ids, form, choices, opts){
  const payer = ipPayer(adm);
  const stamp = form.performedOn || new Date().toLocaleDateString('en-GB').split('/').join('-');
  const added = [];
  const orderOf = (id)=>adm.ipOrders.find(x=>x.id===id);

  /* packages go through first: accepting the package line is what opens it for reconciliation */
  ids.filter(id=>{ const o=orderOf(id); return o && o.cat==="PACKAGE" && o.state==="NEW"; }).forEach(id=>{
    const o = orderOf(id);
    const pk = ipPackages(adm).find(x=>x.id===o.packageOf);
    const stampP = form.performedOn || new Date().toLocaleDateString('en-GB').split('/').join('-');
    Object.assign(o, { state:"ACCEPTED", payerId:payer.id, acceptMode:form.mode, performedOn:o.performedOn || stampP,
      performClinic:o.performClinic || form.clinic, performedBy:o.performedBy || form.doctor,
      acceptedBy:"SAADAN SAAFAN", acceptedOn:stampP, performedStatus:"NOT_PERFORMED", pkg:null, packageId:null });
    if(pk){ pk.accepted = true; pk.payerId = payer.id; pk.acceptedOn = stampP; }
    added.push(o);
  });

  /* remaining head-room per accepted package, dearest package first */
  const pool = ipAcceptedPackages(adm).map(pk=>{
    const u = ipPkgUsage(adm, pk);
    return { pk, medLeft:u.medLeft, consLeft:u.consLeft };
  });

  /* orders still awaiting the payer's word are accepted against an open approval;
     a per-procedure clinic / doctor beats the form default */
  const commonOf = (o)=>({ state:"ACCEPTED", payerId:payer.id, acceptMode:form.mode, performedOn:o.performedOn || stamp,
    performClinic:o.performClinic || form.clinic, performedBy:o.performedBy || form.doctor,
    acceptedBy:"SAADAN SAAFAN", acceptedOn:stamp, openApproval: isApprovalPending(o),
    performedStatus:"NOT_PERFORMED" });

  const stock = [];
  ids.forEach(id=>{
    const o = adm.ipOrders.find(x=>x.id===id);
    if(!o || o.state!=="NEW" || o.cat==="PACKAGE") return;
    const common = commonOf(o);

    if(o.cat==="SERVICE"){
      /* the caller decides whether a package service goes inside the package or stands alone */
      const choice = choices && choices[o.id];
      const pk = (choice && choice!=="STANDALONE") ? ipPackages(adm).find(x=>x.id===choice) : null;
      if(pk && pk.accepted) Object.assign(o, common, { pkg:"RECONCILED", packageId:pk.id });
      else Object.assign(o, common, { pkg:null, packageId:null });
      added.push(o); return;
    }

    /* zero reconciliation — recorded against the package (or the bulk service) at nil value */
    if(opts && opts.zero){
      const host = pool[0];
      Object.assign(o, common, { zeroPriced:true,
        pkg: host ? "RECONCILED" : "BULK", packageId: host ? host.pk.id : null });
      added.push(o); return;
    }

    stock.push(o);        /* medications and consumables are packed together, below */
  });

  /* Medications and consumables follow the plan the prompt previewed: whole lines into
     the package that leaves the smallest balance, the rest onto the bulk service. */
  if(stock.length){
    stock.forEach(o=>{ o.zeroPriced = false; });   /* value reconciliation clears an earlier zero */
    const plan = ipPlanReconcile(adm, stock);
    stock.forEach(o=>{
      const where = plan.assign[o.id];
      if(where && where!=="BULK") Object.assign(o, commonOf(o), { pkg:"RECONCILED", packageId:where });
      else Object.assign(o, commonOf(o), { pkg:"BULK", packageId:null });
      added.push(o);
    });
  }

  return added.length;
}

/* Plan where each medication / consumable would land: a package (whole line, best fit)
   or the standalone bulk service. Pure — used by the reconcile prompt and by acceptance. */
function ipPlanReconcile(adm, lines){
  const pool = ipAcceptedPackages(adm).map(pk=>{
    const u = ipPkgUsage(adm, pk);
    return { pk, medLeft:u.medLeft, consLeft:u.consLeft };
  });
  const plan = { assign:{}, spill:[], intoPkg:[], pool };
  ["MED","CONS"].forEach(cat=>{
    let pending = lines.filter(o=>o.cat===cat);
    pool.forEach(slot=>{
      if(pending.length===0) return;
      const room = cat==="MED" ? slot.medLeft : slot.consLeft;
      const take = ipBestFill(pending, room);
      if(take.length===0) return;
      const used = +take.reduce((a,o)=>a+o.price*o.qty,0).toFixed(2);
      if(cat==="MED") slot.medLeft = +(slot.medLeft - used).toFixed(2);
      else            slot.consLeft = +(slot.consLeft - used).toFixed(2);
      take.forEach(o=>{ plan.assign[o.id] = slot.pk.id; plan.intoPkg.push(o); });
      pending = pending.filter(o=>!take.includes(o));
    });
    pending.forEach(o=>{ plan.assign[o.id] = "BULK"; plan.spill.push(o); });
  });
  return plan;
}

/* Which of these lines should go into a package amount?
   Whole lines only, and the combination that leaves the smallest balance.
   Exhaustive while the selection is small (exact), greedy beyond that. */
function ipBestFill(lines, room){
  const cap = Math.round(room*100);
  if(cap<=0 || lines.length===0) return [];
  const cents = lines.map(o=>Math.round(o.price*o.qty*100));
  const idx = cents.map((c,i)=>i).filter(i=>cents[i]>0 && cents[i]<=cap);
  if(idx.length===0) return [];
  if(idx.length<=18){
    let bestSum=-1, bestMask=0;
    for(let mask=1; mask<(1<<idx.length); mask++){
      let sum=0;
      for(let b=0;b<idx.length;b++) if(mask & (1<<b)){ sum+=cents[idx[b]]; if(sum>cap) break; }
      if(sum<=cap && sum>bestSum){ bestSum=sum; bestMask=mask; }
    }
    return idx.filter((_,b)=>bestMask & (1<<b)).map(i=>lines[i]);
  }
  /* fall back to a descending greedy pass for very large selections */
  let left = cap; const out = [];
  idx.map(i=>({i,c:cents[i]})).sort((a,b)=>b.c-a.c).forEach(({i,c})=>{ if(c<=left){ out.push(lines[i]); left-=c; } });
  return out;
}

/* services in a selection that belong to one or more packages — drives the prompt */
function ipPackageMatches(adm, ids, wanted){
  const out = [];
  ids.forEach(id=>{
    const o = adm.ipOrders.find(x=>x.id===id);
    if(!o || o.cat!=="SERVICE") return;
    if(wanted && o.state!==wanted) return;
    const pks = ipPackagesForService(adm, o.code);
    if(pks.length) out.push({ order:o, pks });
  });
  return out;
}

/* ---- Surgery discount: recomputed from scratch every time it is clicked ----
   The dearest procedure accepted for this payer keeps its full price; the rest are reduced.
   Re-clicking re-elects the primary, so a newly accepted or revoked procedure is handled. */
/* the eventual surgical set for the active payer: what is accepted plus what is still to accept */
function ipSurgeryScope(adm){
  const payer = ipPayer(adm);
  return adm.ipOrders.filter(o=>o.cat==="SERVICE" && o.pkg!=="RECONCILED"
    && (o.state==="NEW" || (o.state==="ACCEPTED" && o.payerId===payer.id)));
}
/* Recomputed on every render and whenever an order is added, so the column is always
   right — the dearest procedure keeps its full price, the rest carry the reduction. */
function ipAutoSurgery(adm){
  const lines = ipSurgeryScope(adm);
  adm.ipOrders.forEach(o=>{
    if(o.surgeryManaged){ o.discountPct = 0; o.surgeryManaged = false; }
    if(!lines.includes(o)) o.surgeryRole = null;
  });
  if(lines.length<2){ lines.forEach(o=>o.surgeryRole=null); return { applied:0, primary:null }; }
  const ranked = [...lines].sort((a,b)=>(b.price*b.qty)-(a.price*a.qty) || a.code.localeCompare(b.code));
  ranked[0].surgeryRole = "PRIMARY";
  ranked.slice(1).forEach(o=>{ o.surgeryRole="REDUCED"; o.discountPct=SURGERY_RULE.pct; o.surgeryManaged=true; });
  return { applied:ranked.length-1, primary:ranked[0], pct:SURGERY_RULE.pct };
}

/* what the same selection would cost under each payer that has an approval */
function ipCompareAcrossPayers(adm, orders){
  return adm.payers.map(py=>{
    const t = orders.reduce((a,o)=>{
      const c = ipLineCalc(adm, o, py);
      return { patient:a.patient+c.patientWithTax, company:a.company+c.companyWithTax };
    }, {patient:0,company:0});
    const raised = orders.filter(o=>(o.approvals||[]).some(a=>a.payerId===py.id));
    return { py, patient:+t.patient.toFixed(2), company:+t.company.toFixed(2),
      raised, left: ipApproval(adm, py).left, active: py.id===adm.activePayerId };
  });
}

function ipApplySurgeryDiscount(adm){
  const payer = ipPayer(adm);
  const lines = adm.ipOrders.filter(o=>o.state==="ACCEPTED" && o.payerId===payer.id
    && o.cat==="SERVICE" && o.pkg!=="RECONCILED");
  /* clear anything the rule set previously so the recalculation starts clean */
  adm.ipOrders.forEach(o=>{ if(o.surgeryRole){ o.surgeryRole=null; if(o.surgeryManaged){ o.discountPct=0; o.surgeryManaged=false; } } });
  if(lines.length<2) return { applied:0, primary:null, reason:"needs at least 2 accepted procedures" };

  const ranked = [...lines].sort((a,b)=>(b.price*b.qty)-(a.price*a.qty) || a.code.localeCompare(b.code));
  const primary = ranked[0];
  primary.surgeryRole = "PRIMARY";
  ranked.slice(1).forEach(o=>{ o.surgeryRole="REDUCED"; o.discountPct=SURGERY_RULE.pct; o.surgeryManaged=true; });
  return { applied:ranked.length-1, primary, pct:SURGERY_RULE.pct };
}

/* ---- Finalize: one invoice per payer, bulk lines rolled up ---- */
/* The lines an invoice for this payer would carry — used by the review panel and
   by finalization itself, so what you see is exactly what gets billed. */
function ipInvoiceItems(adm, payerId){
  const payer = ipPayer(adm, payerId);
  const orders = adm.ipOrders.filter(o=>o.state==="ACCEPTED" && o.payerId===payer.id);
  const items = [];
  const push = (name, code, qty, calc, meta)=>items.push(Object.assign({ name, code, qty, calc }, meta||{}));
  orders.filter(o=>o.cat==="SERVICE" || o.cat==="PACKAGE" || o.pkg==="RECONCILED").forEach(o=>{
    push(o.name, o.code, o.qty, ipLineCalc(adm, o, payer),
      { inPackage:o.pkg==="RECONCILED", packageId:o.packageId||null, zero:!!o.zeroPriced,
        orderId:o.id, discountPct:o.discountPct||0, cat:o.cat });
  });
  ["MED","CONS"].forEach(cat=>{
    const bulk = orders.filter(o=>o.cat===cat && o.pkg==="BULK");
    if(bulk.length===0) return;
    const gross = +bulk.filter(o=>!o.zeroPriced).reduce((a,o)=>a+o.price*o.qty,0).toFixed(2);
    const calc = calcLine({ price:gross, ins:"approved" }, 0, ipPayerPlan(adm,payer));
    push(BULK_LINES[cat].name, BULK_LINES[cat].code, bulk.reduce((a,o)=>a+o.qty,0),
      Object.assign(calc, { gross, discount:0 }), { bulk:true, cat, rolledUp:bulk.map(o=>o.id),
        children:bulk.map(o=>({ name:o.name, code:o.code, qty:o.qty, amount:o.zeroPriced?0:+(o.price*o.qty).toFixed(2), zero:!!o.zeroPriced })) });
  });
  return { payer, orders, items };
}

function ipFinalize(adm, payerId){
  const { payer, orders, items } = ipInvoiceItems(adm, payerId);
  if(orders.length===0) return null;

  const t = items.reduce((a,it)=>({
    patient:a.patient+it.calc.patient, company:a.company+it.calc.company,
    patientTax:a.patientTax+it.calc.patientTax, companyTax:a.companyTax+it.calc.companyTax,
    discount:a.discount+(it.calc.discount||0), deductible:a.deductible+(it.calc.deductible||0)
  }), {patient:0,company:0,patientTax:0,companyTax:0,discount:0,deductible:0});

  const patientWithTax = +(t.patient+t.patientTax).toFixed(2);
  const companyWithTax = +(t.company+t.companyTax).toFixed(2);
  const w = cWallet();
  const mode = orders[0].acceptMode || "CREDIT";
  let advanceUsed = 0, credit = 0;
  if(mode==="ADVANCE" || mode==="ADVANCE_CREDIT"){
    advanceUsed = Math.min(totalAdvance(w), patientWithTax);
    let rem = advanceUsed;
    advanceCategories.forEach(c=>{ const k=c.toLowerCase(); const take=Math.min(w.advance[k], rem); w.advance[k]=+(w.advance[k]-take).toFixed(2); rem-=take; });
    if(advanceUsed>0) logAdvance({ type:"APPLIED", category:"Open", mode:"IP INVOICE", amount:+advanceUsed.toFixed(2), reason:"inpatient finalization" });
  }
  credit = +(patientWithTax - advanceUsed).toFixed(2);
  if(mode==="ADVANCE" && credit>0) credit = credit;   /* shortfall still lands on credit */
  if(credit>0) w.creditOutstanding = +(w.creditOutstanding + credit).toFixed(2);

  const inv = {
    id:"INV-IP-"+Math.floor(100000+Math.random()*899999),
    payerId:payer.id, payerLabel:payer.label, kind:payer.kind,
    date:new Date().toLocaleDateString('en-GB').split('/').join('-'),
    items, status:"ACTIVE", mode,
    patientShare:patientWithTax, companyShare:companyWithTax,
    tax:+(t.patientTax+t.companyTax).toFixed(2), discount:+t.discount.toFixed(2),
    advanceAdjusted:+advanceUsed.toFixed(2), credit,
    amount:+(patientWithTax+companyWithTax).toFixed(2)
  };
  adm.ipInvoices.unshift(inv);
  if(credit>0) logCredit(w, { type:"ADDED", amount:credit, ref:inv.id, mode:"CREDIT",
    note:"inpatient invoice · "+payer.label });
  adm.dedUsed = +((adm.dedUsed||0) + t.deductible).toFixed(2);
  orders.forEach(o=>{ o.state="INVOICED"; o.invoiceId=inv.id; });
  return inv;
}

/* ============================ INPATIENT LIST SCREEN ============================ */
function allAdmissions(){
  const rows = [];
  Object.keys(patientsDB).forEach(mrn=>{
    patientsDB[mrn].visits.filter(v=>v.admType==="IP").forEach(v=>rows.push({ mrn, p:patientsDB[mrn], adm:v }));
  });
  return rows;
}
function renderInpatientList(){

  wrap.appendChild(el(`<div class="crumb"><a id="backHome">Billing</a><span class="sep">/</span><span>Current Inpatients</span></div>`));
  const rows = allAdmissions();
  const clinics = [...new Set(rows.map(r=>r.adm.clinic))];
  const docs = [...new Set(rows.map(r=>r.adm.doctor))];
  const f = state.ipFilters;

  const filters = el(`
    <div class="filters">

      <div class="f"><label>Doctor</label><select id="ipfDoctor"><option value="">All doctors</option>${docs.map(d=>`<option ${d===f.doctor?"selected":""}>${d}</option>`).join("")}</select></div>
      <div class="f"><label>Patient MRN</label><input id="ipfMrn" placeholder="e.g. 7000667" value="${f.mrn}"></div>
      <div class="f"><button class="btn" id="ipfClear">Clear</button></div>
    </div>`);
  wrap.appendChild(filters);

  const list = document.createElement("div");
  function draw(){
    const shown = rows.filter(r=>(!f.clinic||r.adm.clinic===f.clinic) && (!f.doctor||r.adm.doctor===f.doctor) && (!f.mrn||r.mrn.includes(f.mrn)));
    list.innerHTML = "";
    if(shown.length===0){ list.appendChild(el(`<div class="panel"><div class="ph-sub">No current inpatients match the filters.</div></div>`)); return; }
    shown.forEach(({mrn, p, adm})=>{
      const c = ipCounts(adm);
      /* per-payer accepted / invoiced breakdown */
      const perPayer = adm.payers.filter(py=>adm.ipOrders.some(o=>o.payerId===py.id)).map(py=>{
        const acc = adm.ipOrders.filter(o=>o.payerId===py.id && o.state==="ACCEPTED").length;
        const inv = adm.ipOrders.filter(o=>o.payerId===py.id && o.state==="INVOICED").length;
        return `<span class="pill-payer">${py.label.split("·")[0].trim()} <b>${acc}</b> accepted · <b>${inv}</b> invoiced</span>`;
      }).join("");
      const row = el(`
        <div class="ip-row">
          <div class="ip-pt">
            <div class="nm">${p.info.name} <span class="svc-code">— ${mrn}</span></div>
            <div class="mt">${p.info.age} · ${p.info.gender} &nbsp;|&nbsp; Adm ${adm.admissionNo} &nbsp;|&nbsp; ${adm.admitDate}</div>
            <div class="mt">${adm.ward} · ${adm.room}/${adm.bed} &nbsp;|&nbsp; ${adm.doctor} <span class="badge ipd">${adm.status}</span></div>
            <div class="mt payers">${perPayer || `<span class="svc-code">No orders accepted yet</span>`}</div>
          </div>
          <div class="ip-kpis">
            <div class="kpi ord"><span>Ordered</span><b>${c.total}</b></div>
            <div class="kpi acc"><span>Accepted</span><b>${c.acc}/${c.total}</b></div>
            <div class="kpi inv"><span>Invoiced</span><b>${c.inv}</b></div>
            <div class="kpi pend"><span>Pending</span><b>${c.pend}</b></div>
            <button class="btn primary" data-open="${mrn}|${adm.id}">Open Admission →</button>
          </div>
        </div>`);
      list.appendChild(row);
    });
    list.querySelectorAll("[data-open]").forEach(b=>b.onclick = ()=>{
      const [mrn, id] = b.dataset.open.split("|");
      openSession(mrn, parseInt(id));
      render();
    });
  }
  draw();
  wrap.appendChild(list);
  filters.querySelector("#ipfClinic").onchange = (e)=>{ f.clinic=e.target.value; draw(); };
  filters.querySelector("#ipfDoctor").onchange = (e)=>{ f.doctor=e.target.value; draw(); };
  filters.querySelector("#ipfMrn").oninput = (e)=>{ f.mrn=e.target.value; draw(); };
  filters.querySelector("#ipfClear").onclick = ()=>{ state.ipFilters={clinic:"",doctor:"",mrn:""}; render(); };
  wrap.querySelector("#backHome").onclick = ()=>{ state.screen = state.activeMrn ? "workspace" : "search"; render(); };
  return wrap;
}
