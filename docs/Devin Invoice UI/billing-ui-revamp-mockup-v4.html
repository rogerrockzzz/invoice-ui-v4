/* ---------------- the order surface ---------------- */
const IP_STATUS = [
  { key:"TODO",     label:"To accept" },
  { key:"ACCEPTED", label:"Accepted" },
  { key:"INVOICED", label:"Invoiced" },
  { key:"ALL",      label:"All" }
];
function ipStatusPool(adm, key){
  const o = adm.ipOrders;
  /* pending-approval orders stay in the To accept list — they can go through on an open approval */
  if(key==="TODO")     return o.filter(x=>x.state==="NEW");
  if(key==="ACCEPTED") return o.filter(x=>x.state==="ACCEPTED");
  if(key==="SPLITHIDE") return [];
  if(key==="INVOICED") return o.filter(x=>x.state==="INVOICED");
  return o;
}
/* One cell builder for every row — parents and package children alike, so the
   columns line up whatever the row is. `child` renders read-only, indented. */
function ipColumns(status){
  if(status==="ACCEPTED") return ["Order ID","Order","Qty","Package","Disc %","Surgery Disc",
    "Patient","Patient + Tax","Company","Company + Tax","Performed On","Clinic","Doctor","Performed","Accepted By","Settle"];
  if(status==="INVOICED") return ["Order ID","Order","Qty","Invoice","Patient + Tax","Company + Tax","Package"];
  if(status==="ALL")      return ["Order ID","Order","Qty","State","Payer","Amount","Invoice"];
  return ["Order ID","Order","Qty","Ordered On","Insurance","Amount","Disc %","Surgery Disc",
    "Patient","Patient + Tax","Company","Company + Tax","Clinic","Doctor"];
}
function ipHeadHtml(status){
  const num = new Set(["Qty","Amount","Disc %","Surgery Disc","Patient","Patient + Tax","Company","Company + Tax"]);
  return ipColumns(status).map(h=>`<th class="${num.has(h)?'num':''}">${h}</th>`).join("");
}
/* One cell builder for every row — parents and package children alike, so the
   columns line up whatever the row is. `child` renders read-only, indented. */
function ipRowCells(adm, o, status, child){
  const cl = ipLineCalc(adm, o, ipPayer(adm, o.payerId));
  const pkOf = o.cat==="PACKAGE" ? ipPackages(adm).find(x=>x.id===o.packageOf) : null;
  const ro = !!child;
  const host = o.packageId ? ipPackages(adm).find(x=>x.id===o.packageId) : null;
  const pkgCell = host ? `<span class="badge paid" title="${host.name}">${host.name}</span>`
                : o.pkg==="RECONCILED" ? `<span class="badge paid">In package</span>`
                : o.pkg==="BULK" ? `<span class="badge credit">${(BULK_LINES[o.cat]||{name:"Bulk"}).name}</span>`
                : `<span class="svc-code">—</span>`;
  const surg = o.surgeryRole==="PRIMARY" ? `<span class="badge paid">Full price</span>`
             : o.surgeryRole==="REDUCED" ? `<b class="st partial">${SURGERY_RULE.pct}%</b>`
             : `<span class="svc-code">—</span>`;
  const flags = `${o.urgent?`<span class="badge er">URGENT</span>`:""}${pkOf?`<span class="badge ipd">PACKAGE</span>`:""}` +
                `${o.zeroPriced?`<span class="badge locked" title="Reconciled at nil value">ZERO</span>`:""}` +
                `${o.openApproval?`<span class="badge credit">OPEN APPR</span>`:""}` +
                `${(o.approvals||[]).some(a=>a.payerId!==adm.activePayerId)?`<span class="badge branch" title="Approval raised under another payer">ALT APPR</span>`:""}`;
  const idCell = `<td class="ord-id ${child?"kid":""}" ${child?'style="padding-left:'+(child===2?24:12)+'px"':""}>${child?"↳ ":""}${o.code}</td>`;
  const nameCell = `<td class="ord-nm">${pkOf?ipCaret("PKG-"+o.packageOf, pkOf.services.length+2):""}<b>${o.name}</b>
      ${flags?`<div class="flags">${flags}</div>`:""}</td>`;
  const qtyCell = `<td class="num">${o.qty}</td>`;
  const head = idCell + nameCell + qtyCell;

  if(status==="ACCEPTED"){
    const done = o.performedStatus==="PERFORMED";
    return `${head}
      <td>${pkgCell}</td>
      <td class="num">${o.discountPct?`<b>${o.discountPct}%</b>`:`<span class="svc-code">—</span>`}</td>
      <td class="num">${surg}</td>
      <td class="num">${fmt(cl.patient)}</td><td class="num"><b>${fmt(cl.patientWithTax)}</b></td>
      <td class="num">${fmt(cl.company)}</td><td class="num"><b>${fmt(cl.companyWithTax)}</b></td>
      <td>${ro?`<span class="svc-code">${o.performedOn||"—"}</span>`:`<input class="cell-inp" data-edit="performedOn" data-id="${o.id}" value="${o.performedOn||""}">`}</td>
      <td>${ro?`<span class="svc-code">${o.performClinic||"—"}</span>`:`<select class="cell-inp" data-edit="performClinic" data-id="${o.id}">${clinics.map(x=>`<option ${x===o.performClinic?"selected":""}>${x}</option>`).join("")}</select>`}</td>
      <td>${ro?`<span class="svc-code">${o.performedBy||"—"}</span>`:`<select class="cell-inp" data-edit="performedBy" data-id="${o.id}">${doctors.map(x=>`<option ${x===o.performedBy?"selected":""}>${x}</option>`).join("")}</select>`}</td>
      <td>${ro?`<span class="svc-code">${done?"Performed":"Not performed"}</span>`
        :`<select class="cell-inp ${done?"ok":"warn"}" data-edit="performedStatus" data-id="${o.id}">
            <option value="NOT_PERFORMED" ${done?"":"selected"}>Not performed</option>
            <option value="PERFORMED" ${done?"selected":""}>Performed</option></select>`}</td>
      <td><span class="svc-code">${(o.acceptedBy||"—").replace(" (system)","")}</span></td>
      <td><span class="badge ${o.acceptMode==="CREDIT"?"credit":"opd"}">${(IP_ACCEPT_MODES.find(m=>m.key===o.acceptMode)||{label:o.acceptMode||"—"}).label}</span></td>`;
  }
  if(status==="INVOICED"){
    return `${head}<td>${o.invoiceId||"—"}</td>
      <td class="num"><b>${fmt(cl.patientWithTax)}</b></td><td class="num">${fmt(cl.companyWithTax)}</td>
      <td>${pkgCell}</td>`;
  }
  if(status==="ALL"){
    const py = o.payerId ? ipPayer(adm, o.payerId) : null;
    const stCls = o.state==="INVOICED"?"paid":o.state==="ACCEPTED"?"opd":o.state==="CANCELLED"?"unpaid":"locked";
    return `${head}<td><span class="badge ${stCls}">${o.state}</span></td><td>${py?py.label.split("·")[0]:"—"}</td>
      <td class="num">${fmt(o.price*o.qty)}</td><td>${o.invoiceId||"—"}</td>`;
  }
  /* To accept */
  const rc = o.performClinic || state.ipAcceptForm.clinic;
  const rd = o.performedBy || state.ipAcceptForm.doctor;
  return `${head}<td>${o.orderedOn||"—"}</td>
    <td>${o.ins?`<span class="st ${o.ins}">${insStatuses[o.ins].label}</span>`:"—"}</td>
    <td class="num">${fmt(cl.gross)}</td>
    <td class="num">${o.discountPct?`<b>${o.discountPct}%</b>`:`<span class="svc-code">—</span>`}</td>
    <td class="num">${surg}</td>
    <td class="num">${fmt(cl.patient)}</td><td class="num"><b>${fmt(cl.patientWithTax)}</b></td>
    <td class="num">${fmt(cl.company)}</td><td class="num"><b>${fmt(cl.companyWithTax)}</b></td>
    <td>${ro?`<span class="svc-code">${rc}</span>`:`<select class="cell-inp" data-edit="performClinic" data-id="${o.id}">${clinics.map(x=>`<option ${x===rc?"selected":""}>${x}</option>`).join("")}</select>`}</td>
    <td>${ro?`<span class="svc-code">${rd}</span>`:`<select class="cell-inp" data-edit="performedBy" data-id="${o.id}">${doctors.map(x=>`<option ${x===rd?"selected":""}>${x}</option>`).join("")}</select>`}</td>`;
}

/* expandable group helpers — package contents and the bulk inpatient med/consumable lines */
function ipKidRow(adm, o, status, depth){
  return `<tr class="kid ${depth===2?"kid2":""}"><td></td>${ipRowCells(adm, o, status, depth||1)}</tr>`;
}
/* what sits inside a package: its child services, then the two accumulating buckets */
function ipPkgContentRows(adm, pk, status){
  const u = ipPkgUsage(adm, pk);
  const cols = ipColumns(status).length - 3;   /* minus the id, name and qty cells */

  /* child services: the accepted order when there is one, otherwise the bundle definition */
  const svcRows = pk.services.map(def=>{
    const taken = u.services.find(o=>o.code===def.code);
    if(taken) return ipKidRow(adm, taken, status, 1);
    /* not accepted yet — show the pending order's own figures so the columns still line up */
    const pending = adm.ipOrders.find(o=>o.code===def.code && o.state==="NEW");
    const stub = pending || { name:def.name, code:def.code, qty:1, price:0, ins:"approved", orderedOn:"—" };
    return ipKidRow(adm, Object.assign({}, stub, { replacedNote:"in bundle · not accepted yet" }), status, 1);
  }).join("");

  const bucketRows = ipPkgBuckets(adm, pk).map(b=>{
    const key = "PKGB-"+pk.id+"-"+b.key;
    const left = +Math.max(0, b.limit-b.used).toFixed(2);
    const head = `<tr class="kid bucket">
      <td></td>
      <td class="ord-id kid" style="padding-left:12px">↳ ${b.code}</td>
      <td class="ord-nm">${b.lines.length?ipCaret(key, b.lines.length):""}<b>${b.name}</b></td>
      <td class="num">${b.lines.reduce((a,o)=>a+o.qty,0)||"—"}</td>
      <td colspan="${cols}"><span class="svc-code">Amount in package <b>${fmt(b.limit)}</b> ·
        accumulated <b>${fmt(b.used)}</b> · <b>${fmt(left)}</b> left${left<=0?` · anything further bills as ${BULK_LINES[b.key].name}`:""}</span></td>
    </tr>`;
    return head + (state.ipExpand[key] ? b.lines.map(o=>ipKidRow(adm, o, status, 2)).join("") : "");
  }).join("");

  return svcRows + bucketRows;
}
function ipCaret(key, n){
  return `<span class="caret ${state.ipExpand[key]?"open":""}" data-exp="${key}">▶</span>
    <span class="kid-count">${n}</span>`;
}
/* the two standalone services that carry everything which did not fit a package */
function ipBulkGroupRows(adm, status){
  return ["MED","CONS"].map(cat=>{
    const b = ipBulk(adm, cat);
    if(b.lines.length===0) return "";
    const key = "BULK-"+cat;
    const label = BULK_LINES[cat].name, code = BULK_LINES[cat].code;
    const c = calcLine({ price:b.total, ins:"approved" }, ipDeductibleLeft(adm), ipPayerPlan(adm, ipPayer(adm)));
    const head = `<tr class="grp">
      <td></td>
      <td class="ord-id">${code}</td>
      <td class="ord-nm">${ipCaret(key, b.lines.length)}<b>${label}</b>
        <div class="flags"><span class="badge credit">Bulk · ${b.lines.length} item(s)</span></div></td>
      <td class="num">${b.lines.reduce((a,o)=>a+o.qty,0)}</td>
      <td><span class="badge credit">Bulk</span></td>
      <td class="num">—</td><td class="num"><span class="svc-code">—</span></td>
      <td class="num">${fmt(c.patient)}</td><td class="num"><b>${fmt(c.patientWithTax)}</b></td>
      <td class="num">${fmt(c.company)}</td><td class="num"><b>${fmt(c.companyWithTax)}</b></td>
      <td colspan="${ipColumns(status).length-10}"><span class="svc-code">Gross ${fmt(b.total)} — over the package limits</span></td>
    </tr>`;
    return head + (state.ipExpand[key] ? b.lines.map(o=>ipKidRow(adm, o, status, 1)).join("") : "");
  }).join("");
}

function renderIpOrders(adm){
  ipAutoSurgery(adm);          /* keep the surgery column right as orders come and go */
  const payer = ipPayer(adm);
  const status = state.ipStatus || "TODO";
  const cat = state.ipCat || "ALL";
  let pool = ipStatusPool(adm, status);
  if(status==="ACCEPTED" || status==="INVOICED") pool = pool.filter(o=>o.payerId===adm.activePayerId);
  /* Grouped by default: package and bulk children are seen by expanding the parent.
     Filtering to Medications / Consumables lists those reconciled lines directly instead. */
  const flatCat = (cat==="MED" || cat==="CONS");
  if(status==="ACCEPTED" && !flatCat) pool = pool.filter(o=>!o.packageId && o.pkg!=="BULK");
  const rows = pool.filter(o=>cat==="ALL" || o.cat===cat || (cat==="SERVICE" && o.cat==="PACKAGE"));
  const sel = rows.filter(o=>state.ipSel[o.id]);
  const canTick = status==="TODO" || status==="ACCEPTED";
  const allOn = canTick && rows.length>0 && rows.every(o=>state.ipSel[o.id]);
  const openApprovalCount = rows.filter(o=>isApprovalPending(o)).length;

  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `<h4>Orders
      <span style="display:flex;gap:8px;align-items:center">
        <span class="svc-code">Billing to <b>${payer.label}</b></span>
        ${status==="ACCEPTED"?`<button class="btn sm" id="surgBtn">⚕ Surgery discount</button>`:""}
      </span>
    </h4>`;

  /* status + category chips replace the old tab strip */
  const chips = el(`<div class="chip-rows">
    <div class="cat-tabs">${IP_STATUS.map(s=>{
      const n = ipStatusPool(adm, s.key).filter(o=>(s.key!=="ACCEPTED"&&s.key!=="INVOICED")||o.payerId===adm.activePayerId).length;
      return `<div class="${status===s.key?'on':''}" data-s="${s.key}">${s.label} (${n})</div>`;
    }).join("")}</div>
    <div class="cat-tabs sub">
      <div class="${cat==="ALL"?'on':''}" data-c="ALL">All</div>
      ${IP_CATS.map(x=>`<div class="${cat===x.key?'on':''}" data-c="${x.key}">${x.icon} ${x.label} (${pool.filter(o=>o.cat===x.key || (x.key==="SERVICE" && o.cat==="PACKAGE")).length})</div>`).join("")}
    </div>
  </div>`);
  chips.querySelectorAll("[data-s]").forEach(d=>d.onclick = ()=>{ state.ipStatus=d.dataset.s; state.ipSel={}; render(); });
  chips.querySelectorAll("[data-c]").forEach(d=>d.onclick = ()=>{ state.ipCat=d.dataset.c; render(); });
  panel.appendChild(chips);

  /* columns adapt to the status being viewed, so each view stays narrow */
  const head = ipHeadHtml(status);

  const rowsHtml = rows.map(o=>{
        const on = !!state.ipSel[o.id];
        const pkOf = o.cat==="PACKAGE" ? ipPackages(adm).find(x=>x.id===o.packageOf) : null;
        const tick = canTick ? `<input type="checkbox" class="ipChk" data-id="${o.id}" ${on?"checked":""}>` : "";
        const row = `<tr class="${on?'on':''} ${o.cat==="PACKAGE"?'grp':''}"><td>${tick}</td>${ipRowCells(adm, o, status)}</tr>`;
        /* expanding a package shows its child services and the two accumulating buckets */
        const open = pkOf && state.ipExpand["PKG-"+o.packageOf];
        return row + (open ? ipPkgContentRows(adm, pkOf, status) : "");
      }).join("");
  const groupsHtml = (status==="ACCEPTED" && !flatCat) ? ipBulkGroupRows(adm, status) : "";
  const body = (rowsHtml + groupsHtml) ||
    `<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:20px">Nothing here right now.</td></tr>`;

  panel.appendChild(el(`
    <div class="tbl-scroll">
      <table class="chg ip">
        <thead><tr><th style="width:26px">${canTick?`<input type="checkbox" id="ipAll" ${allOn?"checked":""}>`:""}</th>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>`));

  if(status==="TODO" && openApprovalCount>0)
    panel.appendChild(el(`<div class="locked-msg" style="margin-top:10px">⏳ <b>${openApprovalCount} order(s) awaiting payer approval</b> — they can still be accepted against an <b>open approval</b> and reconciled when the payer responds.</div>`));

  panel.appendChild(renderIpActionBar(adm, sel, status));
  if(status==="TODO" || status==="ACCEPTED") panel.appendChild(renderIpTotalsStrip(adm, rows, sel, status));
  panel.querySelectorAll(".ipChk").forEach(ch=>ch.onchange = ()=>{
    if(ch.checked) state.ipSel[ch.dataset.id]=true; else delete state.ipSel[ch.dataset.id];
    render();
  });
  const all = panel.querySelector("#ipAll");
  if(all) all.onchange = ()=>{ rows.forEach(o=>{ if(all.checked) state.ipSel[o.id]=true; else delete state.ipSel[o.id]; }); render(); };
  panel.querySelectorAll("[data-exp]").forEach(c=>c.onclick = ()=>{
    const k = c.dataset.exp;
    if(state.ipExpand[k]) delete state.ipExpand[k]; else state.ipExpand[k] = true;
    render();
  });
  const sb = panel.querySelector("#surgBtn");
  if(sb) sb.onclick = ()=>{
    const r = ipApplySurgeryDiscount(adm);
    if(!r.applied) alert("Surgery discount " + (r.reason || "could not be applied") + ".");
    render();
  };
  panel.querySelectorAll("[data-edit]").forEach(inp=>inp.onchange = (e)=>{
    const o = adm.ipOrders.find(x=>x.id===e.target.dataset.id);
    const field = e.target.dataset.edit;
    o[field] = field==="discountPct" ? Math.max(0, Math.min(100, parseFloat(e.target.value)||0)) : e.target.value;
    render();
  });

  /* On the Invoiced view, accepted work waiting to be billed is shown here too —
     the same in-progress panel as the Invoices tab, so it can be finalized from either place. */
  if(status==="INVOICED"){
    const progress = ipProgressPanels(adm);
    if(progress.length){
      const holder = document.createElement("div");
      holder.appendChild(el(`<div class="ph-sub" style="margin:16px 0 8px">
        <b>${progress.length} payer(s) with accepted orders waiting to be invoiced</b> — finalize here or from the Invoices tab.</div>`));
      progress.forEach(p=>holder.appendChild(p));
      const both = document.createElement("div");
      both.appendChild(panel); both.appendChild(holder);
      return both;
    }
  }
  return panel;
}

/* Bottom totals strip — snapshot of the money for whatever is on screen / ticked */
function renderIpTotalsStrip(adm, rows, sel, status){
  const scope = sel.length ? sel : rows;
  const t = scope.reduce((a,o)=>{
    const c = ipLineCalc(adm, o, ipPayer(adm, o.payerId));
    a.gross += c.gross; a.discount += c.discount;
    a.patient += c.patientWithTax; a.company += c.companyWithTax;
    if(o.cat==="MED")  a.med  += c.gross;
    if(o.cat==="CONS") a.cons += c.gross;
    return a;
  }, {gross:0, discount:0, patient:0, company:0, med:0, cons:0});
  const totalInvoice = +(t.patient + t.company).toFixed(2);
  /* how the patient share will settle — folded in here rather than a separate row */
  const w = cWallet();
  const fromAdv = Math.min(totalAdvance(w), t.patient);
  const toCredit = +(t.patient - fromAdv).toFixed(2);
  const settle = status==="TODO" && t.patient>0
    ? `${fromAdv>0?`advance ${fmt(fromAdv)}`:""}${fromAdv>0&&toCredit>0?" + ":""}${toCredit>0?`credit ${fmt(toCredit)}`:""}`
    : "";

  const strip = el(`
    <div class="tot-strip">
      <div class="ts-scope">${sel.length ? `${sel.length} selected` : `${rows.length} shown`}</div>
      <div class="ts"><span>Price</span><b>${fmt(t.gross)}</b></div>
      <div class="ts"><span>Patient Share + Tax</span><b>${fmt(t.patient)}</b></div>
      <div class="ts"><span>Company Share + Tax</span><b>${fmt(t.company)}</b></div>
      <div class="ts"><span>Discount</span><b>${fmt(t.discount)}</b></div>
      <div class="ts"><span>Medications</span><b>${fmt(t.med)}</b></div>
      <div class="ts"><span>Consumables</span><b>${fmt(t.cons)}</b></div>
      <div class="ts inv"><span>Total Invoice</span><b>${fmt(totalInvoice)}</b></div>
      <button class="ts due" id="dueBtn" title="Print the patient's due statement">
        <span>Total Due (Patient)</span><b>${fmt(t.patient)}</b>${settle?`<i>${settle}</i>`:""}
        <em>🖨 statement</em></button>
    </div>`);
  strip.querySelector("#dueBtn").onclick = ()=>{ state.dueReport = { admissionId:adm.id }; render(); };
  return strip;
}

/* Patient due statement — what is owed before accepting anything, and what is
   left once part of the orders have been accepted. */
function renderDueReportModal(){
  const adm = getVisit(state.dueReport.admissionId);
  const p = cp(), w = cWallet();
  const payer = ipPayer(adm);
  const rowsFor = (list)=>list.map(o=>{
    const c = ipLineCalc(adm, o, ipPayer(adm, o.payerId));
    return `<tr><td>${o.code}</td><td>${o.name}${o.surgeryRole==="REDUCED"?` <span style="color:var(--amber)">(surgery ${SURGERY_RULE.pct}%)</span>`
      :o.surgeryRole==="PRIMARY"?` <span style="color:var(--green)">(full price)</span>`:""}</td>
      <td class="num">${o.qty}</td><td class="num">${fmt(c.gross)}</td>
      <td class="num">${c.discount?fmt(c.discount):"—"}</td>
      <td class="num">${fmt(c.patientWithTax)}</td><td class="num">${fmt(c.companyWithTax)}</td></tr>`;
  }).join("");
  const sumOf = (list)=>list.reduce((a,o)=>{
    const c = ipLineCalc(adm, o, ipPayer(adm, o.payerId));
    return { patient:a.patient+c.patientWithTax, company:a.company+c.companyWithTax, gross:a.gross+c.gross };
  }, {patient:0,company:0,gross:0});

  const toAccept = adm.ipOrders.filter(o=>o.state==="NEW");
  const accepted = adm.ipOrders.filter(o=>o.state==="ACCEPTED");
  const tA = sumOf(toAccept), tB = sumOf(accepted);
  const creditNow = w.creditOutstanding;
  const advance = totalAdvance(w);
  const grand = +(tA.patient + tB.patient + creditNow).toFixed(2);
  const afterAdvance = +Math.max(0, grand - advance).toFixed(2);

  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal xwide">
      <span class="modal-close">✕</span>
      <h3>Patient Due Statement</h3>
      <div class="sub">${p.info.name} · MRN ${p.info.mrn} · Adm ${adm.admissionNo} — indicative, nothing has to be accepted first.</div>
      <div class="print-sheet">
        <div class="ph"><div><b>VIDA</b><div style="font-size:11px;color:var(--muted)">${CURRENT_HOSPITAL} — Inpatient due statement</div></div>
          <div style="text-align:right;font-size:11px;color:var(--muted)">${new Date().toLocaleDateString('en-GB')}<br>Payer: ${payer.label}</div></div>

        <div style="font-weight:700;margin:10px 0 4px">Already accepted, awaiting invoice (${accepted.length})</div>
        ${accepted.length?`<table><thead><tr><th>Code</th><th>Order</th><th class="num">Qty</th><th class="num">Gross</th>
          <th class="num">Discount</th><th class="num">Patient</th><th class="num">Company</th></tr></thead>
          <tbody>${rowsFor(accepted)}</tbody></table>
          <div style="text-align:right">Patient share <b>${fmt(tB.patient)}</b></div>`
          :`<div style="font-size:11px;color:var(--muted)">Nothing accepted yet.</div>`}

        <div style="font-weight:700;margin:14px 0 4px">Still to be accepted (${toAccept.length}) — discounts already applied</div>
        ${toAccept.length?`<table><thead><tr><th>Code</th><th>Order</th><th class="num">Qty</th><th class="num">Gross</th>
          <th class="num">Discount</th><th class="num">Patient</th><th class="num">Company</th></tr></thead>
          <tbody>${rowsFor(toAccept)}</tbody></table>
          <div style="text-align:right">Patient share <b>${fmt(tA.patient)}</b></div>`
          :`<div style="font-size:11px;color:var(--muted)">No pending orders.</div>`}

        <table style="margin-top:14px"><tbody>
          <tr><td>Patient share — accepted orders</td><td class="num">${fmt(tB.patient)}</td></tr>
          <tr><td>Patient share — orders still to accept</td><td class="num">${fmt(tA.patient)}</td></tr>
          <tr><td>Credit outstanding to settle</td><td class="num">${fmt(creditNow)}</td></tr>
          <tr><td><b>Total due if everything is accepted</b></td><td class="num"><b>${fmt(grand)}</b></td></tr>
          <tr><td>Less advance on the wallet</td><td class="num">− ${fmt(advance)}</td></tr>
          <tr><td><b>Net payable now</b></td><td class="num"><b>${fmt(afterAdvance)}</b></td></tr>
          <tr><td>Remaining due if only the accepted orders are settled</td><td class="num">${fmt(+Math.max(0,(tB.patient+creditNow)-advance).toFixed(2))}</td></tr>
        </tbody></table>
        <div style="margin-top:10px;font-size:11px;color:var(--muted)">Company share (billed to ${payer.label}): ${fmt(tA.company+tB.company)}</div>
      </div>
      <div style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px">
        <button class="btn ghost" id="dueClose">Close</button>
        <button class="btn primary" id="duePrint">🖨 Print statement</button>
      </div>
    </div>`);
  overlay.appendChild(modal);
  const close = ()=>{ state.dueReport=null; render(); };
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  modal.querySelector(".modal-close").onclick = close;
  modal.querySelector("#dueClose").onclick = close;
  modal.querySelector("#duePrint").onclick = ()=>window.print();
  return overlay;
}

/* contextual bar: one primary action + a single More menu */
function renderIpActionBar(adm, sel, status){
  const payer = ipPayer(adm);
  const f = state.ipAcceptForm;
  const w = cWallet();
  const tot = sel.reduce((a,o)=>{ const c=ipLineCalc(adm,o,payer); return { patient:a.patient+c.patientWithTax, company:a.company+c.companyWithTax }; }, {patient:0,company:0});
  const advAvail = totalAdvance(w);
  const fromAdv = Math.min(advAvail, tot.patient);
  const toCredit = +(tot.patient - fromAdv).toFixed(2);

  /* nothing selected — still tell the biller what the sensible next move is */
  if(sel.length===0){
    const pendingPkg = ipPackages(adm).filter(pk=>!pk.accepted);
    const bulkWaiting = ipBulk(adm,"MED").lines.length + ipBulk(adm,"CONS").lines.length;
    const readyToBill = adm.ipOrders.filter(o=>o.state==="ACCEPTED" && o.payerId===adm.activePayerId).length;
    let hint;
    if(status==="TODO" && pendingPkg.length)
      hint = `💡 <b>${pendingPkg.length} package(s) not accepted</b> — accept the package service first so medications and consumables reconcile into it instead of billing as ${BULK_LINES.MED.name}.`;
    else if(status==="TODO")
      hint = `💡 Tick the orders to bill. Shares, discounts and the surgery reduction are already calculated in the grid.`;
    else if(status==="ACCEPTED" && readyToBill)
      hint = `💡 <b>${readyToBill} order(s) ready to bill</b> for ${payer.label.split("·")[0].trim()} — open <b>Invoices</b> to review and finalize${bulkWaiting?`, including ${bulkWaiting} bulk item(s)`:""}.`;
    else hint = `Select orders to accept, edit or replace them.`;
    return el(`<div class="act-bar idle">${hint}</div>`);
  }

  const selOpen = sel.filter(o=>isApprovalPending(o)).length;
  /* approvals already raised for this selection under a payer that is not billing now */
  const compare = ipCompareAcrossPayers(adm, sel);
  const elsewhere = compare.filter(c=>!c.active && c.raised.length);

  /* medications and consumables are reconciled, not "accepted" */
  const stock = sel.filter(o=>o.cat==="MED" || o.cat==="CONS").length;
  const onlyStock = stock===sel.length;
  const label = onlyStock ? "⇄ Reconcile" : stock ? "✓ Accept &amp; reconcile" : "✓ Accept";

  const bar = el(`
    <div class="act-bar">
      ${status==="TODO" && selOpen ? `<div class="ab-suggest warn">⏳ ${selOpen} of the selected order(s) will be accepted on an <b>open approval</b>.</div>`:""}
      <div class="ab-main">
        ${status==="TODO" && elsewhere.length ? `
        <div class="ab-alt">
          <span class="hd">⚠ ${elsewhere[0].raised.length} order(s) already approved under ${elsewhere[0].py.label.split("·")[0].trim()} — compare:</span>
          <span class="cmp">
            ${compare.filter(c=>c.py.kind!=="CASH").map(c=>`<span class="c ${c.active?"on":""}">
              <i>${c.py.label.split("·")[0].trim()}${c.active?" · billing":""}</i>
              pt <b>${fmt(c.patient)}</b> · co <b>${fmt(c.company)}</b>
              ${c.raised.length?` · <em>${c.raised.map(o=>(o.approvals.find(a=>a.payerId===c.py.id)||{}).status).join("/")}</em>`:""}
            </span>`).join("")}
          </span>
          <button class="btn sm" id="switchAlt">Switch</button>
        </div>`:""}
        <div class="ab-right">
          ${status==="TODO"?`<button class="btn primary lg" id="acceptGo">${label}</button>`:""}
          ${status==="ACCEPTED"?`<button class="btn" id="revokeBtn">↩ Revoke</button>
            <button class="btn" id="replaceBtn">⇄ Replace payer</button>`:""}
          ${(status==="TODO" && onlyStock) ? "" : `
          <div class="more-wrap">
            <button class="btn ghost" id="moreBtn">More ▾</button>
            <div class="more-menu" id="moreMenu" style="display:none"></div>
          </div>`}
        </div>
      </div>
    </div>`);

  const rp = bar.querySelector("#replaceBtn");
  if(rp) rp.onclick = ()=>{ state.replacePayer = { ids:sel.map(o=>o.id) }; render(); };
  const rv = bar.querySelector("#revokeBtn");
  if(rv) rv.onclick = ()=>{
    sel.forEach(o=>{
      /* revoking a package also releases whatever was reconciled into it */
      if(o.cat==="PACKAGE"){
        const pk = ipPackages(adm).find(x=>x.id===o.packageOf);
        if(pk) ipDetachPackage(adm, pk);
      }
      Object.assign(o, { state:"NEW", payerId:null, acceptMode:null, pkg:null, packageId:null, zeroPriced:false,
        discountPct:0, replacedNote:null, performedOn:null, performClinic:null, performedBy:null, openApproval:false });
    });
    state.ipSel={}; state.ipStatus="TODO"; render();
  };
  const sw = bar.querySelector("#switchAlt");
  if(sw) sw.onclick = ()=>{
    const id = elsewhere[0].py.id;
    adm.activePayerId = id; adm.payers.forEach(py=>py.active = py.id===id);
    render();
  };

  const menu = bar.querySelector("#moreMenu");
  const item = (label, hint, fn)=>{
    if(!menu) return;                       /* med / consumable selections have no More menu */
    const it = el(`<div class="mi"><b>${label}</b><span>${hint}</span></div>`);
    it.onclick = ()=>{ menu.style.display="none"; fn(); };
    menu.appendChild(it);
  };
  const withSel = (fn)=>{ sel.forEach(o=>fn(o)); state.ipSel={}; render(); };

  if(status==="TODO"){
    IP_ACCEPT_MODES.forEach(m=>item("Accept · "+m.label, m.hint, ()=>{
      state.ipAcceptForm.mode = m.key;
      ipAcceptSelected(adm, sel.map(o=>o.id), state.ipAcceptForm);
      state.ipSel={}; state.ipStatus="ACCEPTED"; render();
    }));
    item("Convert to cash", "Accept these orders against the cash payer", ()=>{
      const cash = adm.payers.find(py=>py.kind==="CASH");
      adm.activePayerId = cash.id; adm.payers.forEach(py=>py.active = py.id===cash.id);
      ipAcceptSelected(adm, sel.map(o=>o.id), { ...state.ipAcceptForm, mode:"ADVANCE" });
      state.ipSel={}; state.ipStatus="ACCEPTED"; render();
    });
    item("Cancel order", "Remove the order from billing", ()=>withSel(o=>{ if(o.state==="NEW") o.state="CANCELLED"; }));
  } else if(status==="ACCEPTED"){
    item("Replace → cash", "Move to the cash payer", ()=>withSel(o=>{ const cash=adm.payers.find(py=>py.kind==="CASH"); o.payerId=cash.id; o.acceptMode="ADVANCE"; o.pkg=null; o.replacedNote="replaced by cash"; }));
    item("Replace → self credit", "Keep the payer, settle on patient credit", ()=>withSel(o=>{ o.acceptMode="CREDIT"; o.replacedNote="self credit"; }));
    item("Replace → within package", "Move the charge into a package that bundles it", ()=>{
      const ids = sel.map(o=>o.id);
      const matches = ipPackageMatches(adm, ids, "ACCEPTED");
      if(matches.length===0){ alert("None of the selected procedures belong to a package on this admission."); return; }
      state.pkgPrompt = { mode:"replace", ids, choices:{}, acceptPk:{} };
      matches.forEach(({order, pks})=>{
        const live = pks.filter(pk=>pk.accepted);
        state.pkgPrompt.choices[order.id] = live.length===1 ? live[0].id : "STANDALONE";
      });
      render();
    });
    item("Replace → another payer", "Send these lines to a different company", ()=>{ state.replacePayer = { ids:sel.map(o=>o.id) }; render(); });


  }

  const mb = bar.querySelector("#moreBtn");
  if(mb) mb.onclick = (e)=>{ e.stopPropagation(); menu.style.display = menu.style.display==="none" ? "block" : "none"; };
  const ag = bar.querySelector("#acceptGo");
  if(ag) ag.onclick = ()=>{
    /* one-click accept: advance where there is balance, remainder on credit */
    const mode = fromAdv<=0 ? "CREDIT" : (toCredit>0 ? "ADVANCE_CREDIT" : "ADVANCE");
    const ids = sel.map(o=>o.id);
    /* medications and consumables always ask: reconcile at value, or at nil */
    if(onlyStock){
      const canValue = ipPackages(adm).length===0 || ipAcceptedPackages(adm).length>0;
      state.reconcilePrompt = { ids, acceptMode:mode, mode: canValue ? "VALUE" : "ZERO" };
      render(); return;
    }
    /* if any selected service belongs to a package, ask before billing it standalone */
    const matches = ipPackageMatches(adm, ids, "NEW");
    if(matches.length){
      state.pkgPrompt = { mode:"accept", ids, acceptMode:mode, choices:{}, acceptPk:{} };
      matches.forEach(({order, pks})=>{
        const live = pks.filter(pk=>pk.accepted);
        /* one accepted package is an obvious default; anything else needs a decision */
        state.pkgPrompt.choices[order.id] = live.length===1 ? live[0].id : "STANDALONE";
      });
      render(); return;
    }
    ipAcceptSelected(adm, ids, { ...state.ipAcceptForm, mode });
    state.ipSel={}; state.ipStatus="ACCEPTED"; render();
  };
  return bar;
}

/* ---------------- Layout A right rail: payer, package, ready-to-bill, invoices ---------------- */
function renderIpRail(adm){
  const rail = document.createElement("div");
  rail.className = "rail-col";

  const payerCard = el(`
    <div class="rail-card">
      <div class="rc-head">Billing Payer &amp; Approvals</div>
      <div class="rc-body">
        ${adm.payers.map(py=>{
          const ap = ipApproval(adm, py);
          const pctUsed = ap.approved ? Math.min(100, (ap.used/ap.approved)*100) : 0;
          return `<div class="rc-payer ${py.id===adm.activePayerId?'on':''}" data-py="${py.id}">
            <div class="n">${py.kind==="CASH"?"💵":"🛡"} ${py.label.split("·")[0].trim()}

            ${ap.hasApproval?`
              <div class="apbar"><div style="width:${pctUsed}%"></div></div>
              <div class="s"><b>${fmt(ap.left)}</b> approval left of ${fmt(ap.approved)}</div>
              ${ap.openCount?`<div class="s open">⏳ ${ap.openCount} order(s) on open approval · ${fmt(ap.openValue)}</div>`:""}
            `:`<div class="s">Settled directly by the patient</div>`}

      </div>
    </div>`);
  payerCard.querySelectorAll(".rc-payer").forEach(c=>c.onclick = ()=>{

  });
  payerCard.querySelector("#railPayerInfo").onclick = ()=>{ state.admDetails=true; render(); };
  rail.appendChild(payerCard);

  /* one card per package — dearest first, which is the order meds/consumables fill them */
  const pkgs = [...ipPackages(adm)].sort((a,b)=>b.price-a.price);
  const medBulk = ipBulk(adm,"MED"), consBulk = ipBulk(adm,"CONS");
  const pkgCard = el(`
    <div class="rail-card">
      <div class="rc-head">Packages (${pkgs.filter(p=>p.accepted).length}/${pkgs.length} accepted)</div>
      <div class="rc-body">
        ${pkgs.map(pk=>{
          const u = ipPkgUsage(adm, pk);
          const mine = pk.accepted && pk.payerId===adm.activePayerId;
          return `<div class="rc-pkgcard ${pk.accepted?"on":""}">
            <div class="ph"><b>${pk.name}</b><span>${fmt(pk.price)}</span></div>
            <div class="s">${pk.services.length} service(s) in bundle ${pk.accepted?`· accepted ${pk.acceptedOn||""}`:""}</div>
            ${ipPkgBuckets(adm, pk).map(b=>`
              <div class="rc-pkg">
                <div class="t"><span>${b.name}</span><b>${fmt(b.used)} / ${fmt(b.limit)}</b></div>
                <div class="bar"><div style="width:${b.limit?Math.min(100,(b.used/b.limit)*100):0}%"></div></div>
                <div class="s">${fmt(Math.max(0,b.limit-b.used))} left${b.lines.length?` · ${b.lines.length} item(s) inside`:""}</div>
              </div>`).join("")}
            <button class="btn sm ghost" data-pkexp="${pk.id}" style="width:100%;margin-top:6px">
              ${state.ipExpand["RPK-"+pk.id]?"Hide":"Show"} package contents</button>
            ${state.ipExpand["RPK-"+pk.id]?`<div class="rc-kids">
              ${pk.services.map(def=>{
                const taken = u.services.find(o=>o.code===def.code);
                return `<div class="k"><span>${def.name}</span><b>${taken?fmt(taken.price*taken.qty):"—"}</b></div>`;
              }).join("")}
              ${ipPkgBuckets(adm, pk).map(b=>`

                ${b.lines.map(o=>`<div class="k sub"><span>${o.name} ×${o.qty}</span><b>${fmt(o.price*o.qty)}</b></div>`).join("")}`).join("")}

  rail.appendChild(pkgCard);

  /* advance + credit — the same universal wallet card as OPD */
  rail.appendChild(renderWallet());

  return rail;
}

/* How should medications / consumables be reconciled — at value, or at nil? */
function renderReconcilePromptModal(){
  const adm = ipAdm();
  const pr = state.reconcilePrompt;
  const items = pr.ids.map(id=>adm.ipOrders.find(o=>o.id===id)).filter(Boolean);
  const gross = +items.reduce((a,o)=>a+o.price*o.qty,0).toFixed(2);
  const pkgs = ipPackages(adm);
  const live = ipAcceptedPackages(adm);
  const host = live[0] || null;
  /* with packages on the admission, value reconciliation needs one accepted first */
  const canValue = pkgs.length===0 || live.length>0;
  const room = host ? ipPkgUsage(adm, host) : null;
  const cats = [...new Set(items.map(o=>o.cat))];
  const label = cats.length===1 ? (cats[0]==="MED" ? "medication" : "consumable") : "item";
  /* where each line would actually land if reconciled at value */
  const plan = canValue ? ipPlanReconcile(adm, items) : null;
  const spillTotal = plan ? +plan.spill.reduce((a,o)=>a+o.price*o.qty,0).toFixed(2) : 0;
  const nameOfPkg = (id)=>(ipPackages(adm).find(x=>x.id===id)||{}).name || "—";

  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal wide">
      <span class="modal-close">✕</span>
      <h3>Reconcile ${items.length} ${label}${items.length>1?"s":""}</h3>
      <div class="sub">${fmt(gross)} at list price ·
        ${pkgs.length===0 ? `no package on this admission — value goes to the standalone services`
          : live.length ? `${host.name} is accepted` : `no package accepted yet`}</div>
      <div class="pkg-opts" id="recOpts">
        <div class="pkg-opt ${pr.mode==="VALUE"?"on":""} ${canValue?"":"off"}" data-m="VALUE">
          <div class="t"><b>Reconcile</b><span>${fmt(gross)}</span></div>
          <div class="s">${canValue
            ? (host
              ? `Fills <b>${host.name}</b> — ${fmt(room.medLeft)} medication / ${fmt(room.consLeft)} consumable amount left.
                 Anything over spills into <b>${BULK_LINES.MED.name}</b> / <b>${BULK_LINES.CONS.name}</b>.`
              : `Billed on the standalone <b>${BULK_LINES.MED.name}</b> / <b>${BULK_LINES.CONS.name}</b> services.`)
            : `<span style="color:var(--red)">Unavailable — accept a package first so these can reconcile into it.</span>`}</div>
        </div>
        <div class="pkg-opt ${pr.mode==="ZERO"?"on":""}" data-m="ZERO">
          <div class="t"><b>Zero reconcile</b><span>${fmt(0)}</span></div>
          <div class="s">Recorded against ${host?`<b>${host.name}</b>`:`<b>${BULK_LINES.MED.name}</b> / <b>${BULK_LINES.CONS.name}</b>`}
            at nil value — nothing is charged to the patient or the payer, and no package amount is consumed.</div>
        </div>
      </div>
      ${(pr.mode==="VALUE" && plan && plan.spill.length) ? `
      <div class="rec-note">
        ⚠ <b>${plan.spill.length} ${plan.spill.length>1?"lines":"line"} exceed the package amount</b> —
        ${plan.spill.map(o=>o.name).join(", ")} (${fmt(spillTotal)})
        will be billed on <b>${[...new Set(plan.spill.map(o=>BULK_LINES[o.cat].name))].join(" / ")}</b>,
        outside the package. ${plan.intoPkg.length?`The other ${plan.intoPkg.length} line(s) fit inside the package.`:""}
      </div>`:""}
      <table class="reg" style="margin-top:12px">
        <thead><tr><th>Code</th><th>Item</th><th class="num">Qty</th><th class="num">List</th>
          <th class="num">Will bill</th><th>Goes to</th></tr></thead>
        <tbody>${items.map(o=>{
          const zero = pr.mode==="ZERO";
          const where = zero ? (host ? host.name : BULK_LINES[o.cat].name)
                     : (plan && plan.assign[o.id] && plan.assign[o.id]!=="BULK") ? nameOfPkg(plan.assign[o.id])
                     : BULK_LINES[o.cat].name;
          const outside = !zero && plan && plan.assign[o.id]==="BULK";
          return `<tr class="${outside?"spill":""}">
            <td>${o.code}</td><td>${o.name}</td><td class="num">${o.qty}</td>
            <td class="num">${fmt(o.price*o.qty)}</td>
            <td class="num"><b>${zero?fmt(0):fmt(o.price*o.qty)}</b></td>
            <td>${zero?`<span class="badge locked">${where}</span>`
                :outside?`<span class="badge credit">${where}</span>`
                :`<span class="badge paid">${where}</span>`}</td></tr>`;
        }).join("")}</tbody>
      </table>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:14px">
        <button class="btn ghost" id="recCancel">Cancel</button>
        <button class="btn primary" id="recGo">⇄ ${pr.mode==="ZERO"?"Zero reconcile":"Reconcile"}</button>
      </div>
    </div>`);

  modal.querySelectorAll("[data-m]").forEach(d=>d.onclick = ()=>{
    if(d.dataset.m==="VALUE" && !canValue) return;
    pr.mode = d.dataset.m; render();
  });
  overlay.appendChild(modal);
  const close = ()=>{ state.reconcilePrompt=null; render(); };
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  modal.querySelector(".modal-close").onclick = close;
  modal.querySelector("#recCancel").onclick = close;
  modal.querySelector("#recGo").onclick = ()=>{
    ipAcceptSelected(adm, pr.ids, { ...state.ipAcceptForm, mode:pr.acceptMode }, null, { zero: pr.mode==="ZERO" });
    state.reconcilePrompt=null; state.ipSel={}; state.ipStatus="ACCEPTED"; render();
  };
  return overlay;
}

/* Prompt when a service is part of one or more packages — used both when accepting
   and when replacing an already-accepted standalone procedure into a package. */
function renderPackagePromptModal(){
  const adm = ipAdm();
  const pr = state.pkgPrompt;
  const replacing = pr.mode==="replace";
  const matches = ipPackageMatches(adm, pr.ids, replacing ? "ACCEPTED" : "NEW");
  const others = pr.ids.filter(id=>!matches.some(m=>m.order.id===id));
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal xwide">
      <span class="modal-close">✕</span>
      <h3>${replacing?"Replace into a package":"These services are part of a package"}</h3>
      <div class="sub">${replacing
        ? `Pick the package each procedure should move into — its charge is then covered by the package price.`
        : `Bill them inside a package (no separate charge) or as standalone procedures.`}
        ${others.length?`The other ${others.length} selected order(s) are unaffected.`:""}</div>
      <div id="pkgChoices"></div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding-top:14px">
        <button class="btn ghost" id="pkgCancel">Cancel</button>
        <button class="btn primary" id="pkgGo">${replacing?"Move into package":"✓ Accept"}</button>
      </div>
    </div>`);
  const list = modal.querySelector("#pkgChoices");

  if(matches.length===0)
    list.appendChild(el(`<div class="locked-msg">None of the selected procedures belong to a package on this admission.</div>`));

  matches.forEach(({order, pks})=>{
    const chosen = pr.choices[order.id];
    const row = el(`
      <div class="visit-opt" style="cursor:default">
        <div class="visit-top"><span class="ttl">${order.name}</span>
          <span class="tags"><span class="badge branch">${order.code}</span>
            <span class="badge opd">${fmt(order.price*order.qty)}</span>
            ${pks.length>1?`<span class="badge ipd">in ${pks.length} packages</span>`:""}</span></div>
        <div class="visit-meta">${pks.length>1
          ? `This procedure is bundled in <b>${pks.length}</b> packages — choose which one should carry it.`
          : `Bundled in <b>${pks[0].name}</b>.`}</div>
        <div class="pkg-opts">
          ${pks.map(pk=>{
            const u = ipPkgUsage(adm, pk);
            const on = chosen===pk.id;
            return `<div class="pkg-opt ${on?"on":""}" data-c="${pk.id}" data-o="${order.id}">
              <div class="t"><b>${pk.name}</b><span>${fmt(pk.price)}</span></div>
              <div class="s">${pk.accepted?`<span class="st approved">accepted</span> · ${u.kids.length} item(s) inside`
                :`<span class="st pending">not accepted yet</span>`}</div>
              ${!pk.accepted?`<label class="cb" style="margin-top:5px"><input type="checkbox" class="pkgAcc" data-pk="${pk.id}"
                ${pr.acceptPk && pr.acceptPk[pk.id]?"checked":""}> also accept this package</label>`:""}
            </div>`;
          }).join("")}
          <div class="pkg-opt ${chosen==="STANDALONE"?"on":""}" data-c="STANDALONE" data-o="${order.id}">
            <div class="t"><b>Standalone procedure</b><span>${fmt(order.price*order.qty)}</span></div>
            <div class="s">Billed on its own, outside any package</div>
          </div>
        </div>
      </div>`);
    row.querySelectorAll("[data-c]").forEach(d=>d.onclick = (e)=>{
      if(e.target.closest("label")) return;                  /* let the checkbox work */
      pr.choices[d.dataset.o] = d.dataset.c;
      if(d.dataset.c!=="STANDALONE"){
        const pk = ipPackages(adm).find(x=>x.id===d.dataset.c);
        if(pk && !pk.accepted){ pr.acceptPk = pr.acceptPk||{}; pr.acceptPk[pk.id] = true; }
      }
      render();
    });
    row.querySelectorAll(".pkgAcc").forEach(c=>c.onchange = (e)=>{
      e.stopPropagation();
      pr.acceptPk = pr.acceptPk||{};
      pr.acceptPk[c.dataset.pk] = c.checked;
      if(!c.checked && pr.choices[order.id]===c.dataset.pk) pr.choices[order.id] = "STANDALONE";
      render();
    });
    list.appendChild(row);
  });

  overlay.appendChild(modal);
  const close = ()=>{ state.pkgPrompt=null; render(); };
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  modal.querySelector(".modal-close").onclick = close;
  modal.querySelector("#pkgCancel").onclick = close;
  modal.querySelector("#pkgGo").onclick = ()=>{
    const form = { ...state.ipAcceptForm, mode:pr.acceptMode || state.ipAcceptForm.mode };
    /* accept any package the user opted into first, so services can reconcile into it */
    Object.keys(pr.acceptPk||{}).filter(k=>pr.acceptPk[k]).forEach(pkId=>{
      const pk = ipPackages(adm).find(x=>x.id===pkId);
      if(pk && !pk.accepted) ipAcceptPackage(adm, pk, form);
    });
    /* a package that was opted out of cannot hold the service */
    Object.keys(pr.choices).forEach(oid=>{
      const pkId = pr.choices[oid];
      if(pkId==="STANDALONE") return;
      const pk = ipPackages(adm).find(x=>x.id===pkId);
      if(!pk || !pk.accepted) pr.choices[oid] = "STANDALONE";
    });

    if(replacing){
      matches.forEach(({order})=>{
        const pkId = pr.choices[order.id];
        if(!pkId || pkId==="STANDALONE"){ order.pkg = null; order.packageId = null; order.replacedNote = "billed standalone"; return; }
        const pk = ipPackages(adm).find(x=>x.id===pkId);
        Object.assign(order, { pkg:"RECONCILED", packageId:pk.id, replacedNote:"moved into "+pk.name });
      });
    } else {
      ipAcceptSelected(adm, pr.ids, form, pr.choices);
      state.ipStatus = "ACCEPTED";
    }
    state.pkgPrompt=null; state.ipSel={}; render();
  };
  return overlay;
}

/* shared invoice detail panel (used by layout B's Invoices tab and layout A's rail) */

  const detail = el(`

      <h4>${inv.id} <span class="badge ${inv.status==="ACTIVE"?"paid":"unpaid"}">${inv.status}</span>

        </span>
      </h4>
      <div class="ph-sub">${inv.payerLabel} · raised ${inv.date} · accepted as ${(IP_ACCEPT_MODES.find(m=>m.key===inv.mode)||{label:inv.mode}).label}</div>
      <div class="inv-grid" style="margin-bottom:12px">

        <div class="g tot"><div class="k">Invoice Total</div><div class="v">${fmt(inv.amount)}</div></div>

          <th class="num">Tax</th><th class="num">Patient</th><th class="num">Company</th><th>Note</th></tr></thead>
        <tbody>${inv.items.map(it=>`
          <tr class="${it.inPackage?'disabled':''}">
            <td class="chg-name"><b>${it.name}</b><span>${it.bulk?`rolled up from ${it.rolledUp.length} line(s)`:""}</span></td>
            <td>${it.code}</td><td class="num">${it.qty}</td>
            <td class="num">${fmt(it.calc.gross)}</td>
            <td class="num">${it.calc.discount?fmt(it.calc.discount):"—"}</td>
            <td class="num">${fmt(it.calc.patientTax+it.calc.companyTax)}</td>
            <td class="num"><b>${fmt(it.calc.patientWithTax)}</b></td>
            <td class="num">${fmt(it.calc.companyWithTax)}</td>
            <td>${it.inPackage?`<span class="badge paid">In package</span>`:it.bulk?`<span class="badge credit">Bulk</span>`:it.discountPct?`<span class="badge ipd">${it.discountPct}% surgery</span>`:"—"}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`);
  detail.querySelector("#ipPrint").onclick = ()=>{
    state.ipPrint = { admissionId:adm.id, invoiceId:inv.id, format:detail.querySelector("#ipPrintFmt").value };
    render();
  };
  const rv = detail.querySelector("#ipRevoke");
  if(rv) rv.onclick = ()=>{
    inv.status = "REVOKED";
    /* Revoking the invoice undoes the acceptance as well: the orders go all the way
       back to To accept, so they can be re-checked, re-priced and accepted afresh. */
    const back = adm.ipOrders.filter(o=>o.invoiceId===inv.id);
    back.filter(o=>o.cat==="PACKAGE").forEach(o=>{
      const pk = ipPackages(adm).find(x=>x.id===o.packageOf);
      if(pk) ipDetachPackage(adm, pk);          /* releases whatever sat inside it */
    });
    back.forEach(o=>Object.assign(o, { state:"NEW", invoiceId:null, payerId:null, acceptMode:null,
      pkg:null, packageId:null, zeroPriced:false, discountPct:0, surgeryRole:null, surgeryManaged:false,
      performedOn:null, performClinic:null, performedBy:null, performedStatus:null,
      acceptedBy:null, acceptedOn:null, openApproval:false, replacedNote:"returned from "+inv.id }));
    ipMergeSplitLines(adm);

    /* put back what the invoice took from the wallet */
    const w = cWallet();
    if(inv.advanceAdjusted>0){
      w.advance.open = +(w.advance.open + inv.advanceAdjusted).toFixed(2);
      logAdvance({ type:"REFUND", category:"Open", mode:"IP INVOICE", amount:inv.advanceAdjusted,
        reason:"invoice "+inv.id+" revoked" });
    }
    if(inv.credit>0){
      w.creditOutstanding = Math.max(0, +(w.creditOutstanding - inv.credit).toFixed(2));
      logCredit(w, { type:"ADJUSTED", amount:inv.credit, ref:inv.id, mode:"REVOKE", note:"invoice revoked" });
    }
    adm.dedUsed = 0;
    state.ipTab = "orders"; state.ipStatus = "TODO"; state.ipSel = {};
    render();
  };
  return detail;
}

  return wrap;

/* three print layouts for a finalized inpatient invoice */
function renderIpPrintModal(){
  const { admissionId, invoiceId, format } = state.ipPrint;
  const adm = getVisit(admissionId);
  const inv = adm.ipInvoices.find(i=>i.id===invoiceId);
  const p = cp();
  const overlay = el(`<div class="overlay"></div>`);
  let bodyHtml = "";
  if(format==="Summary Invoice"){
    bodyHtml = `
      <table><tbody>
        <tr><td>Patient Share Total</td><td class="num">${fmt(inv.patientShare)}</td></tr>
        <tr><td>Company Share Total</td><td class="num">${fmt(inv.companyShare)}</td></tr>
        <tr><td>Total Tax</td><td class="num">${fmt(inv.tax)}</td></tr>
        <tr><td>Advance Adjusted</td><td class="num">${fmt(inv.advanceAdjusted)}</td></tr>
        <tr><td>Credit</td><td class="num">${fmt(inv.credit)}</td></tr>
        <tr><td><b>Invoice Total</b></td><td class="num"><b>${fmt(inv.amount)}</b></td></tr>
      </tbody></table>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">${inv.items.length} line(s) — detail suppressed in the summary format.</div>`;
  } else if(format==="Zatca Invoice"){
    bodyHtml = `
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:8px">
        <div><b>VAT Registration</b><br>310122393500003</div>
        <div style="text-align:right"><b>Simplified Tax Invoice</b><br>فاتورة ضريبية مبسطة</div>
      </div>
      <table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Taxable</th><th class="num">VAT 15%</th><th class="num">Total</th></tr></thead>
        <tbody>${inv.items.map(it=>`<tr><td>${it.name}</td><td class="num">${it.qty}</td>
          <td class="num">${fmt(it.calc.patient+it.calc.company)}</td>
          <td class="num">${fmt(it.calc.patientTax+it.calc.companyTax)}</td>
          <td class="num">${fmt(it.calc.patientWithTax+it.calc.companyWithTax)}</td></tr>`).join("")}</tbody></table>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px">
        <div style="width:70px;height:70px;background:repeating-linear-gradient(45deg,#111,#111 3px,#fff 3px,#fff 6px)"></div>
        <div style="text-align:right"><div>Total excl. VAT: ${fmt(inv.amount-inv.tax)}</div><div>VAT: ${fmt(inv.tax)}</div>
          <div style="font-weight:700;font-size:14px">Total: ${fmt(inv.amount)}</div></div>
      </div>`;
  } else {
    bodyHtml = `
      <table><thead><tr><th>Item</th><th>Code</th><th class="num">Qty</th><th class="num">Gross</th><th class="num">Disc</th><th class="num">Patient</th><th class="num">Company</th></tr></thead>
        <tbody>${inv.items.map(it=>`<tr><td>${it.name}${it.inPackage?" (in package)":it.bulk?" (bulk)":""}</td><td>${it.code}</td>
          <td class="num">${it.qty}</td><td class="num">${fmt(it.calc.gross)}</td><td class="num">${fmt(it.calc.discount||0)}</td>
          <td class="num">${fmt(it.calc.patientWithTax)}</td><td class="num">${fmt(it.calc.companyWithTax)}</td></tr>`).join("")}</tbody></table>
      <div style="text-align:right;font-weight:700;margin-top:6px">Invoice Total: ${fmt(inv.amount)}</div>`;
  }
  const modal = el(`
    <div class="modal wide">
      <span class="modal-close">✕</span>
      <h3>Print Preview — ${format}</h3>
      <div class="sub">${inv.id} · ${inv.payerLabel}</div>
      <div class="print-sheet">
        <div class="ph"><div><b>VIDA</b><div style="font-size:11px;color:var(--muted)">${CURRENT_HOSPITAL} — Inpatient</div></div>
          <div style="text-align:right;font-size:11px;color:var(--muted)">${inv.date}<br>${inv.id}</div></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
          <div><b>${p.info.name}</b><br>MRN ${p.info.mrn} · Adm ${adm.admissionNo}</div>
          <div style="text-align:right">${adm.ward} · ${adm.room}/${adm.bed}<br>${inv.payerLabel}</div>
        </div>
        ${bodyHtml}
      </div>
      <div style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px">
        <button class="btn ghost" id="ipClose">Close</button>
        <button class="btn primary" id="ipDoPrint">🖨 Print</button>
      </div>
    </div>`);
  overlay.appendChild(modal);
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.ipPrint=null; render(); } };
  modal.querySelector(".modal-close").onclick = ()=>{ state.ipPrint=null; render(); };
  modal.querySelector("#ipClose").onclick = ()=>{ state.ipPrint=null; render(); };
  modal.querySelector("#ipDoPrint").onclick = ()=>window.print();
  return overlay;
}

/* admission / payer detail popup — the insurance card extended with approvals + reconciliation */
function renderAdmDetailsModal(){
  const adm = ipAdm();
  const p = cp();
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal xwide">
      <span class="modal-close">✕</span>
      <h3>Payer &amp; Approval Details</h3>
      <div class="sub">${p.info.name} · Adm ${adm.admissionNo} — an admission can be billed to several payers over its stay.</div>
      ${adm.payers.map(py=>{
        const plan = ipPayerPlan(adm, py);
        const ap = ipApproval(adm, py);
        const acc = adm.ipOrders.filter(o=>o.payerId===py.id && o.state!=="NEW");
        const invd = adm.ipInvoices.filter(i=>i.payerId===py.id);
        const openOrders = acc.filter(o=>o.openApproval);
        const over = +(ap.consumed - ap.approved).toFixed(2);
        const cash = py.kind==="CASH";
        return `<div class="pay-card ${py.id===adm.activePayerId?"on":""}">
          <div class="pc-head">
            <div class="nm">${cash?"💵":"🛡"} ${py.label.split("·")[0].trim()}
              ${py.id===adm.activePayerId?`<span class="badge ipd">Billing now</span>`:""}
              ${py.from?`<span class="badge branch">from ${py.from}</span>`:""}</div>
            <div class="pc-sub">${plan
              ? `${plan.policyName} · policy <b>${plan.policyNo}</b> · contract <b>${plan.contract}</b>`
              : `The patient settles these charges directly in cash.`}</div>
          </div>
          <div class="pc-stats">
            ${ap.hasApproval?`
              <div class="s"><span>Open approvals</span><b>${fmt(ap.requested)}</b></div>
              <div class="s"><span>Approved</span><b>${fmt(ap.approved)}</b></div>
              <div class="s"><span>Consumed</span><b>${fmt(ap.consumed)}</b></div>
              <div class="s ${ap.left>0?"ok":"warn"}"><span>Remaining</span><b>${fmt(ap.left)}</b></div>`:""}
            <div class="s"><span>Orders accepted</span><b>${acc.length}</b></div>
            <div class="s"><span>Invoices raised</span><b>${invd.length}</b></div>
          </div>
          ${over>0?`<div class="pc-note warn">Consumption exceeds the approved amount by <b>${fmt(over)}</b> — raise another approval or move the excess to another payer.</div>`:""}
          ${openOrders.length?`<div class="pc-note">⏳ On an open approval: <b>${openOrders.map(o=>o.name).join(", ")}</b> — ${fmt(ap.openValue)}</div>`:""}
          ${ap.openReqs.length?`
          <details class="ap-audit">
            <summary>Open coverages from the approval module (${ap.openReqs.length})</summary>
            <table class="reg" style="margin-top:8px">
              <thead><tr><th>Approval No</th><th>Raised On</th><th>Raised By</th><th>Payer Ref</th>
                <th class="num">Requested</th><th class="num">Approved</th><th class="num">Consumed</th><th class="num">Balance</th><th>Status</th></tr></thead>
              <tbody>${ap.openReqs.map(r=>{
                const extra = r.id===ap.openReqs[0].id ? ap.used : 0;
                const cons = +(r.consumed + extra).toFixed(2);
                return `<tr>
                  <td><b>${r.id}</b><div class="svc-code">${r.note}</div></td>
                  <td>${r.raisedOn}</td><td>${r.raisedBy}</td><td>${r.ref}</td>
                  <td class="num">${fmt(r.requested)}</td>
                  <td class="num"><b>${fmt(r.approved)}</b></td>
                  <td class="num">${fmt(cons)}</td>
                  <td class="num"><b>${fmt(Math.max(0, r.approved-cons))}</b></td>
                  <td><span class="badge ${cons>=r.approved?'unpaid':'paid'}">${cons>=r.approved?"Exhausted":r.status}</span></td>
                </tr>`;
              }).join("")}</tbody>
            </table>
          </details>`:""}
        </div>`;
      }).join("")}
      <div class="panel" style="margin-top:6px">
        <h4>Package Reconciliation</h4>
        <div class="ph-sub">A package must be accepted before medications and consumables can reconcile into it; the dearest package fills first.</div>
        <table class="reg">
          <thead><tr><th>Package</th><th class="num">Package Price</th><th>Status</th>
            <th class="num">Med Limit</th><th class="num">Med Used</th><th class="num">Cons Limit</th><th class="num">Cons Used</th><th class="num">Items Inside</th></tr></thead>
          <tbody>${[...ipPackages(adm)].sort((a,b)=>b.price-a.price).map(pk=>{
            const u = ipPkgUsage(adm, pk);
            return `<tr><td><b>${pk.name}</b><div class="svc-code">${pk.code} · ${pk.services.map(x=>x.name).join(", ")}</div></td>
              <td class="num">${fmt(pk.price)}</td>
              <td>${pk.accepted?`<span class="badge paid">Accepted</span>`:`<span class="badge locked">Not accepted</span>`}</td>
              <td class="num">${fmt(pk.medLimit)}</td><td class="num">${fmt(u.medUsed)}</td>
              <td class="num">${fmt(pk.consLimit)}</td><td class="num">${fmt(u.consUsed)}</td>
              <td class="num">${u.kids.length}</td></tr>`;
          }).join("")}</tbody>
        </table>
        <div class="visit-meta" style="margin-top:8px">
          Billed outside every package — Inpatient Medication <b>${fmt(ipBulk(adm,"MED").total)}</b> ·
          Inpatient Consumable <b>${fmt(ipBulk(adm,"CONS").total)}</b>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="btn ghost" id="admClose">Close</button></div>
    </div>`);
  overlay.appendChild(modal);
  overlay.onclick = (e)=>{ if(e.target===overlay){ state.admDetails=false; render(); } };
  modal.querySelector(".modal-close").onclick = ()=>{ state.admDetails=false; render(); };
  modal.querySelector("#admClose").onclick = ()=>{ state.admDetails=false; render(); };
  return overlay;
}

/* ============================ GLOBAL INVOICES / REFUND REGISTER (dense, filterable, categorized) ============================ */
function allInvoices(){
  const rows = [];
  Object.keys(patientsDB).forEach(mrn=>{
    const p = patientsDB[mrn];
    p.visits.forEach(v=>{
      v.invoices.forEach(inv=>{
        rows.push({ mrn, name:p.info.name, visitId:v.id, invoiceId:inv.id, clinic:v.interbranch?v.hospital:v.clinic, doctor:v.interbranch?"—":v.doctor,
          encounter:v.interbranch?"Interbranch":v.admType, amount:inv.amount, date:inv.date, modes:inv.modes,
          status: invoiceStatus(inv).label });
      });
    });
  });
  return rows;
}
const invoiceCategories = ["All","OPD","IPD","ER","Referral","Interbranch","Credit Pending","Partially Refunded","Refunded"];

function renderInvoicesScreen(){
  const wrap = document.createElement("div");
  wrap.appendChild(el(`<div class="crumb"><a id="backHome">Billing</a><span class="sep">/</span><span>Invoices / Refund</span></div>`));

  const all = allInvoices();
  const clinicsList = [...new Set(all.map(r=>r.clinic))];
  const doctorsList = [...new Set(all.map(r=>r.doctor).filter(d=>d!=="—"))];

  wrap.appendChild(el(`
    <div class="cat-tabs" id="catTabs">${invoiceCategories.map(c=>`<div class="${c===state.invFilters.category?'on':''}" data-c="${c}">${c}</div>`).join("")}</div>
  `));

  const filters = el(`
    <div class="filters">
      <div class="f"><label>Invoice No</label><input id="fInv" placeholder="e.g. INV-1042" value="${state.invFilters.inv}"></div>
      <div class="f"><label>Patient MRN</label><input id="fMrn" placeholder="e.g. 7000667" value="${state.invFilters.mrn}"></div>
      <div class="f"><label>Clinic / Hospital</label><select id="fClinic"><option value="">All</option>${clinicsList.map(c=>`<option ${c===state.invFilters.clinic?"selected":""}>${c}</option>`).join("")}</select></div>
      <div class="f"><label>Doctor</label><select id="fDoctor"><option value="">All</option>${doctorsList.map(d=>`<option ${d===state.invFilters.doctor?"selected":""}>${d}</option>`).join("")}</select></div>
      <div class="f"><button class="btn" id="fClear">Clear Filters</button></div>
    </div>
  `);
  wrap.appendChild(filters);

  const tableWrap = document.createElement("div");
  function matchesCategory(r,cat){
    if(cat==="All") return true;
    if(["Credit Pending","Refunded","Partially Refunded"].includes(cat)) return r.status===cat;
    return r.encounter===cat;
  }
  function draw(){
    const rows = all.filter(r=>{
      /* invoice number: partial, case-insensitive, ignoring the INV- prefix and spaces */
      if(state.invFilters.inv){
        const norm = (v)=>String(v||"").toLowerCase().replace(/[\s-]/g,"");
        if(!norm(r.invoiceId).includes(norm(state.invFilters.inv))) return false;
      }
      if(state.invFilters.mrn && !r.mrn.includes(state.invFilters.mrn)) return false;
      if(state.invFilters.clinic && r.clinic !== state.invFilters.clinic) return false;
      if(state.invFilters.doctor && r.doctor !== state.invFilters.doctor) return false;
      if(!matchesCategory(r, state.invFilters.category)) return false;
      return true;
    });
    tableWrap.innerHTML = `
      <table class="reg">
        <thead><tr><th>Invoice</th><th>Patient</th><th>MRN</th><th>Clinic / Hospital</th><th>Encounter</th><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td>${r.invoiceId}</td><td>${r.name}</td><td>${r.mrn}</td><td>${r.clinic}</td><td>${r.encounter}</td><td>${r.date}</td><td>${fmt(r.amount)}</td>
            <td><span class="badge ${r.status==='Paid'?'paid':r.status==='Refunded'?'unpaid':'credit'}">${r.status}</span></td>
            <td><button class="btn sm ghost" data-preview="${r.mrn}|${r.visitId}|${r.invoiceId}">Preview</button>
                ${r.status!=='Refunded'?`<button class="btn sm danger" data-refund="${r.mrn}|${r.visitId}|${r.invoiceId}">Refund</button>`:""}</td>
          </tr>`).join("")}</tbody>
      </table>
      <div class="reg-foot">${rows.length} of ${all.length} invoices</div>
      ${rows.length===0?`<div class="ph-sub" style="margin-top:10px">No invoices match the current filters.</div>`:""}
    `;
    tableWrap.querySelectorAll("[data-preview]").forEach(b=>{ b.onclick = ()=>{ const [mrn,visitId,invoiceId]=b.dataset.preview.split("|"); openPatientTab(mrn); state.printModal={visitId:parseInt(visitId), invoiceId}; render(); }; });
    tableWrap.querySelectorAll("[data-refund]").forEach(b=>{ b.onclick = ()=>{ const [mrn,visitId,invoiceId]=b.dataset.refund.split("|"); openPatientTab(mrn); openRefundDrawer(parseInt(visitId), invoiceId, "invoices"); }; });
  }
  draw();
  wrap.appendChild(tableWrap);

  wrap.querySelector("#backHome").onclick = ()=>{ state.screen = state.activeMrn ? "workspace" : "search"; render(); };
  wrap.querySelectorAll("#catTabs div").forEach(d=>{ d.onclick = ()=>{ state.invFilters.category = d.dataset.c; render(); }; });
  filters.querySelector("#fInv").oninput = (e)=>{ state.invFilters.inv = e.target.value; draw(); };
  filters.querySelector("#fMrn").oninput = (e)=>{ state.invFilters.mrn = e.target.value; draw(); };
  filters.querySelector("#fClinic").onchange = (e)=>{ state.invFilters.clinic = e.target.value; draw(); };
  filters.querySelector("#fDoctor").onchange = (e)=>{ state.invFilters.doctor = e.target.value; draw(); };
  filters.querySelector("#fClear").onclick = ()=>{ state.invFilters = {inv:"",mrn:"",clinic:"",doctor:"",category:"All"}; render(); };

  return wrap;
}

/* ============================ REFERRAL POOL (outward referrals from this branch) ============================ */
function referralPoolRows(){
  const rows = [];
  Object.keys(patientsDB).forEach(mrn=>{
    const p = patientsDB[mrn];
    p.visits.forEach(v=>{
      v.orderedServices.forEach(s=>{
        if(s.referred){
          rows.push({ referralId:"REF-"+s.code.replace(/\D/g,""), encounterNo:"ENC-"+v.id+"-"+mrn.slice(-4), admissionNo:"ADM-"+(600000+v.id), patientName:p.info.name, mobile:p.info.mobile, status:"Pending Acceptance", hospital:s.referred.hospital, procedure:s.name, date:s.referred.date });
        }
      });
    });
  });
  return rows;
}
function renderReferralPool(){
  const wrap = document.createElement("div");
  wrap.appendChild(el(`<div class="crumb"><a id="backHome">Billing</a><span class="sep">/</span><span>Referral Pool</span></div>`));
  wrap.appendChild(el(`<h2 style="font-size:19px;color:#28323d;margin:2px 0 12px">Referral Pool</h2>`));
  wrap.appendChild(el(`<div class="seg"><div class="on">Outward Referrals</div></div>`));

  const rows = referralPoolRows();
  const table = el(`
    <table class="reg">
      <thead><tr><th>Referral Id</th><th>Encounter No</th><th>Admission No</th><th>Patient Name</th><th>Patient Mobile</th><th>Procedure</th><th>Referred To</th><th>Referral Status</th><th>Actions</th></tr></thead>
      <tbody>${rows.map(r=>`
        <tr><td>${r.referralId}</td><td>${r.encounterNo}</td><td>${r.admissionNo}</td><td>${r.patientName}</td><td>${r.mobile}</td><td>${r.procedure}</td><td>${r.hospital}</td>
        <td><span class="badge credit">${r.status}</span></td><td><button class="btn sm ghost">View</button></td></tr>`).join("")}</tbody>
    </table>
    ${rows.length===0?`<div style="text-align:center;padding:40px;color:var(--muted);font-size:13px">No Rows To Show — outward referrals initiated from this branch will appear here.</div>`:`<div class="reg-foot">${rows.length} outward referral(s) from ${CURRENT_HOSPITAL}</div>`}
  `);
  wrap.appendChild(table);
  wrap.querySelector("#backHome").onclick = ()=>{ state.screen = state.activeMrn ? "workspace" : "search"; render(); };
  return wrap;
}

seedInvoices();
seedIpPackageOrders();
render();
