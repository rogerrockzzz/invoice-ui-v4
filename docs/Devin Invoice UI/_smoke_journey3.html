<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><pre id="out">…</pre><script>
const log=[];const f=document.createElement('iframe');f.style.cssText='width:1100px;height:1100px';
f.onload=()=>{const w=f.contentWindow;w.onerror=(m,s,l)=>{log.push('RUNTIME-ERR @'+l+': '+m);return true;};
 const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)];
 const S=w.eval('state'), C=()=>w.eval('cases'), R=()=>w.eval('render')(), P=()=>w.eval('patients');
 const pt2=(c)=>P()[c.mrn];
 const wal=(c)=>P()[c.mrn].wallet;
 const open=(id)=>{ w.eval('openVisit')(id); return C().find(c=>c.id===id); };
 const stepQ=()=>q('.step h2').textContent.trim();
 const goHomeAndSearch=(t)=>{ S.screen='home'; S.q=t; R(); };
 const yes=()=>qa('.step .acts .btn')[0].click();
 const story=(id)=>{ if(id==='invoicing') id=w.eval('mainStory')(C().find(x=>x.id===S.caseId)); const b=qa('.stories [data-story]').find(x=>x.dataset.story===id);
   if(!b) throw new Error('no '+id+' story on this visit: '+qa('.stories [data-story]').map(x=>x.dataset.story).join(','));
   b.click(); };
 const pick=(mrn, card)=>{ const row=qa('.pcard').find(c=>c.querySelector('[data-open="'+mrn+'"]'));
   if(!row) throw new Error('patient '+mrn+' is not in the results');
   if(!row.classList.contains('open')) row.querySelector('.prow').click();
   if(card){ const b=qa('.pcard.open [data-hp]').find(x=>x.dataset.hp===card); if(!b) throw new Error('no '+card+' card'); b.click(); } };
 /* the walk-in's payer stage: let NPHIES answer, then choose a payer (and save its details if asked) */
 const wkPay=(id)=>{ w.eval('finishEligibility')(S.walkin.pctx); q('.step.walkin [data-choose="'+id+'"]').click(); if(q('#pySave')) q('#pySave').click(); };
 /* the wallet section: open it, switch tab, add advance through its story */
 const openWallet=()=>{ if(!q('.wsec')) q('#wOpen').click(); if(!q('.wsec')) throw new Error('the wallet section did not open'); };
 const wTab=(k)=>{ openWallet(); qa('.wsec [data-wt]').find(b=>b.dataset.wt===k).click(); };
 const wAddAdvance=(cat, amount)=>{ wTab('ADV'); if(q('#wDone')) q('#wDone').click(); q('#wAdd').click();
   q('.wsec [data-pot="'+cat+'"]').click(); const a=q('#waAmt'); a.value=String(amount); a.dispatchEvent(new w.Event('input'));
   q('#waGo').click(); q('#aGo').click(); };
 /* retrieve every invoice (tests only — the screen itself always asks for a range or a search) */
 const loadAll=(q)=>w.eval('loadInvoices')({ preset:'custom', from:'2000-01-01', to:'2100-12-31', clinic:'', doctor:'', payer:'', type:'', status:'', mode:'' }, q||'');
 const hasStory=(id)=>qa('.stories [data-story]').some(x=>x.dataset.story===id);
 const step=(n,fn)=>{ try{ const r=fn(); log.push('OK   '+n+(r!==undefined?' -> '+r:'')); }
   catch(e){ log.push('FAIL '+n+': '+e.message+' | '+(e.stack||'').split('\n')[1]); } };
 try{
  step('home loads nothing until you search', ()=>{
    S.screen='home'; S.q=''; S.tabs=[]; S.activeMrn=null; S.caseId=null; R();
    if(qa('.prow').length) throw new Error('nothing should be listed before a search');
    if(!q('.blank')) throw new Error('expected the empty state');
    if(!/Search for a patient/i.test(q('.blank').textContent)) throw new Error('no prompt to search');
    if(!q('.hsearch input')) throw new Error('no search box');
    return q('.blank .big').textContent.trim();
  });
  step('home: choosing a patient offers cards; today\'s actions load from their card', ()=>{
    S.homeSel=null; S.homePanel=null; S.walkin=null; S.q=''; R();
    if(q('#addVisit') || qa('.stories').length) throw new Error('the home page should carry no walk-in buttons');
    const box=q('#q'); box.value='mohammed'; box.dispatchEvent(new w.Event('input'));
    const card=q('.pcard');
    if(!card) throw new Error('no patient card');
    if(card.classList.contains('open') || qa('.pcard .pexp').length) throw new Error('nothing should open until the patient is chosen');
    const pv=w.eval('pendingVisits')('7000667');
    const todo=pv.today.filter(x=>x.kind==='act').length;
    /* the result shows the patient only — no pending counts until the patient is chosen */
    if(/to do today|waiting today|credit/.test(card.querySelector('.prow').textContent)) throw new Error('the patient row should carry no pending counts: '+card.querySelector('.prow').textContent.replace(/\s+/g,' '));
    if(card.classList.contains('needs')) throw new Error('no pending colour on the patient row');
    /* choosing the patient offers two cards, and loads nothing else */
    q('.pcard .prow').click();
    const opts=qa('.pcard.open [data-hp]').map(b=>b.dataset.hp);
    if(opts.join()!=='pending,walkin') throw new Error('expected the two cards, got '+opts.join());
    if(qa('.pcard .atile').length) throw new Error('actions must not load until their card is chosen');
    const pc=qa('.pcard.open [data-hp]').find(b=>b.dataset.hp==='pending');
    if(!new RegExp(todo+' to do').test(pc.textContent)) throw new Error('the card should summarise today\'s work');
    pc.click();
    const tiles=qa('.pcard .pexp .atile');
    if(tiles.length!==pv.today.length) throw new Error('only today\'s actions should load');
    if(!tiles.every(t=>t.classList.contains('mini'))) throw new Error('home tiles should be compact');
    const kinds=tiles.map(t=>t.classList.contains('act')?'act':'wait');
    if(kinds.join()!==kinds.slice().sort().join()) throw new Error('to-do should come first');
    /* the card closes again; the patient row closes everything */
    qa('.pcard.open [data-hp]').find(b=>b.dataset.hp==='pending').click();
    if(qa('.pcard .atile').length) throw new Error('choosing the card again should close it');
    q('.pcard .prow').click();
    if(qa('.pcard .pexp').length) throw new Error('clicking the patient again should close it');
    pick('7000667','pending');
    qa('.pcard .pexp .atile')[0].click();
    if(S.screen!=='visit') throw new Error('a tile should open its visit');
    goHomeAndSearch('mohammed');
    q('[data-open]').click();
    if(S.screen!=='patient') throw new Error('Open profile should still work');
    return 'patient → [pending | walk-in] → '+tiles.length+' tile(s)';
  });
  step('profile: pending actions show today, with buttons for upcoming and past', ()=>{
    S.pendView=null; S.profPendOpen=undefined;
    w.eval('openPatient')('7000667');
    const box=q('.pendbox');
    if(!box) throw new Error('the profile should have a pending actions section');
    const pv=w.eval('pendingVisits')('7000667');
    const segs=qa('.pendbox .pseg [data-pv]').map(b=>b.dataset.pv);
    if(segs.join()!=='today,upcoming,past') throw new Error('expected Today / Upcoming / Past buttons, got '+segs.join());
    if(!q('.pendbox [data-pv="today"]').classList.contains('on')) throw new Error('today should be shown first');
    if(qa('.pendbox .atile').length!==pv.today.length) throw new Error('only today\'s actions should show by default');
    if(!new RegExp(pv.upcoming.length).test(q('.pendbox [data-pv="upcoming"]').textContent)) throw new Error('the upcoming button should count them');
    /* upcoming */
    q('.pendbox [data-pv="upcoming"]').click();
    if(!pv.upcoming.length) throw new Error('the seed should include an upcoming visit');
    const fut=qa('.pendbox .atile');
    if(fut.length!==pv.upcoming.length || !fut.every(t=>t.classList.contains('future'))) throw new Error('only upcoming actions should show');
    if(!fut[0].textContent.includes(w.eval('BOOKED_1'))) throw new Error('the booked visit should show its date');
    /* past */
    q('.pendbox [data-pv="past"]').click();
    if(qa('.pendbox .atile').length!==pv.earlier.length) throw new Error('past should show earlier visits still open');
    if(!pv.earlier.length && !/No earlier visit/.test(q('.pendbox').textContent)) throw new Error('an empty past should say so');
    /* the choice holds, and a tile still opens its visit */
    q('.pendbox [data-pv="upcoming"]').click();
    w.eval('openPatient')('7000667');
    if(!q('.pendbox [data-pv="upcoming"]').classList.contains('on')) throw new Error('the chosen view should stick');
    q('.pendbox .atile').click();
    if(S.screen!=='visit' || !C().find(x=>x.id===S.caseId).future) throw new Error('an upcoming tile should open that visit');
    S.pendView='today';
    return pv.today.length+' today · '+pv.upcoming.length+' upcoming · '+pv.earlier.length+' past';
  });
  step('opening a patient shows every visit, newest first', ()=>{
    goHomeAndSearch('mohammed');
    q('[data-open]').click();
    if(S.screen!=='patient') throw new Error('it should open the patient profile');
    const rows=qa('.vrow');
    const vs=w.eval('visitsOf')('7000667');
    if(rows.length!==vs.length) throw new Error('expected '+vs.length+' visits, got '+rows.length);
    const keys=vs.map(v=>v.sortKey);
    if(keys.join()!==keys.slice().sort((a,b)=>b-a).join()) throw new Error('visits are not newest first');
    /* booked visits come first, flagged upcoming, then today's */
    const firstNonFuture=vs.findIndex(v=>!v.future);
    if(!/Today/.test(rows[firstNonFuture].textContent)) throw new Error('today\'s visit should follow the upcoming ones');
    vs.slice(0,firstNonFuture).forEach((v,i)=>{ if(!/Upcoming/.test(rows[i].textContent)) throw new Error('a booked visit should read Upcoming'); });
    const last=vs[vs.length-1];
    if(!rows[rows.length-1].textContent.includes(last.date)) throw new Error('the oldest visit should be last');
    return rows.length+' visits, newest first';
  });
  step('clicking a visit opens the actions, and both ways back work', ()=>{
    qa('.vrow')[0].click();
    if(S.screen!=='visit') throw new Error('it should open the visit');
    if(!q('.step')) throw new Error('no action card on the visit screen');
    /* back to the patient */
    q('.crumb #back').click();
    if(S.screen!=='patient') throw new Error('the crumb should return to the patient profile');
    /* and back to the homepage */
    q('.crumb #bHome').click();
    if(S.screen!=='home') throw new Error('the crumb should return home');
    return 'visit → patient → home';
  });
  step('several patients stay open as tabs', ()=>{
    w.eval('openPatient')('7000667');
    w.eval('openPatient')('7000203');
    w.eval('openVisit')(3);
    const tabs=qa('.tabs .tab').map(t=>t.textContent.replace(/[✕⌂]/g,'').trim()).filter(x=>x && x!=='Home' && x!=='Invoices');
    if(tabs.length!==3) throw new Error('expected three patients open, got '+tabs.join(' | '));
    if(S.activeMrn!=='7100482') throw new Error('the newest should be active');
    /* switching tabs moves between patients without losing the others */
    qa('.tabs .tab').find(t=>/MOHAMMED/i.test(t.textContent)).click();
    if(S.activeMrn!=='7000667' || S.screen!=='patient') throw new Error('the tab did not switch');
    if(qa('.tabs .tab [data-close]').length!==3) throw new Error('the other tabs should still be there');
    /* and one can be closed */
    qa('.tabs .tab [data-close]').find(x=>x.dataset.close==='7000203').click();
    if(S.tabs.includes('7000203')) throw new Error('the tab did not close');
    if(S.tabs.length!==2) throw new Error('closing one should leave the rest');
    return tabs.join(' | ')+' → closed one, '+S.tabs.length+' open';
  });
  step('a visit can be added from the home page for any patient', ()=>{
    S.screen='home'; S.homeSel=null; S.homePanel=null; S.walkin=null; R();
    /* a patient with no visit today can still be given one */
    goHomeAndSearch('rasangika');
    pick('1063301','walkin');
    if(!q('.stages[data-story="walkin"]')) throw new Error('the walk-in story should show its stages');
    if(!/Visit details/.test(q('.stages .sg.now').textContent)) throw new Error('the patient is already chosen, so it starts on visit details');
    if(!q('.stages .sg.done')) throw new Error('the Patient stage should show as done');
    /* a patient who already has an open visit can be given another */
    S.walkin=null; goHomeAndSearch('mohammed');
    const before=C().filter(x=>x.mrn==='7000667').length;
    pick('7000667','walkin');
    if(!/MOHAMMED/.test(q('.step.walkin .sub').textContent)) throw new Error('the walk-in should be for the chosen patient');
    const cl=q('#nvClinic'); cl.value='ENT'; cl.dispatchEvent(new w.Event('change'));
    const ty=q('#nvType'); ty.value='Follow-up'; ty.dispatchEvent(new w.Event('change'));
    q('#wkNext').click();                                   // stage 3: orders (optional)
    if(!/Orders/.test(q('.stages .sg.now').textContent)) throw new Error('stage 3 should be the optional orders stage');
    if(!/Skip/.test(q('#wkNext').textContent)) throw new Error('with nothing chosen the orders stage should offer Skip');
    q('#wkNext').click();                                   // stage 4: payer
    /* the payer stage runs the same eligibility check as the visit */
    if(!/Checking eligibility with NPHIES/.test(q('.step.walkin').textContent)) throw new Error('the payer stage should start with the eligibility check');
    if(q('#nvGo')) throw new Error('the visit cannot be created before a payer is chosen');
    w.eval('finishEligibility')(S.walkin.pctx);
    if(!q('.step.walkin [data-choose="BUPA-GOLD"]')) throw new Error('NPHIES-eligible BUPA should be offered: '+q('.step.walkin').textContent.slice(0,200));
    if(!q('.step.walkin #pyManual')) throw new Error('manual entry should be offered too');
    q('.step.walkin [data-choose="BUPA-GOLD"]').click();
    if(!q('.step.walkin [data-f="policyNo"]') || q('.step.walkin [data-f="policyNo"]').value!=='80737') throw new Error('the policy details should come from NPHIES');
    q('#pySave').click();
    if(!/Review/.test(q('.stages .sg.now').textContent)) throw new Error('choosing the payer should lead to the review');
    if(!/BUPA · GOLD/.test(q('.step.walkin .rv').textContent)) throw new Error('the review should show the payer');
    q('#nvGo').click();                                     // stage 5: created
    if(!/Visit created/.test(q('.step.walkin h2').textContent)) throw new Error('the last stage should confirm the visit');
    q('#wkOpen').click();
    const after=C().filter(x=>x.mrn==='7000667');
    if(after.length!==before+1) throw new Error('the visit was not created');
    const fresh=C().find(x=>x.id===S.caseId);
    if(fresh.clinic!=='ENT' || fresh.visitType!=='Follow-up') throw new Error('the new visit did not keep its details');
    if(S.screen!=='visit') throw new Error('it should open the new visit');
    if(fresh.consult.ins!=='pending') throw new Error('an insured visit should start awaiting approval');
    if(fresh.payerId!=='BUPA-GOLD' || !fresh.policy || fresh.policy.policyNo!=='80737') throw new Error('the visit should carry the chosen payer and policy');
    if(!fresh.history.some(h=>h.type==='ELIGIBILITY')) throw new Error('the eligibility check should come with the visit');
    if(!fresh.history.some(h=>/Visit created/.test(h.tx))) throw new Error('creation not recorded');
    /* and the patient profile now lists both */
    w.eval('openPatient')('7000667');
    if(qa('.vrow').length!==after.length) throw new Error('the profile should list every visit');
    return before+' → '+after.length+' visits for that patient';
  });


  /* ---- the sequence, on a patient whose approval has not arrived ---- */
  step('1 · no approval yet — the system says wait, and will not invoice', ()=>{
    const c=open(3);
    if(w.eval('nextStep')(c).key!=='CONSULT_WAIT') throw new Error('expected the waiting step');
    if(!/Approval not received/.test(stepQ())) throw new Error('wrong wording: '+stepQ());
    if(qa('.step .acts .btn').some(b=>/invoice/i.test(b.textContent) && !/self-pay/i.test(b.textContent)))
      throw new Error('invoicing must not be offered before the approval');
    return stepQ();
  });
  step('the payer can be changed before the consultation is invoiced', ()=>{
    const c=open(1);                                  // WADHA, approval already in, nothing invoiced
    const btns=qa('.step .acts .btn').map(b=>b.textContent.trim());
    if(btns.includes('Not yet')) throw new Error('the dead "Not yet" button should be gone');
    /* no button on the step — the payer chip in the header is the way in */
    if(btns.some(b=>/Change payer/.test(b))) throw new Error('the step should not carry a Change payer button: '+btns.join(' | '));
    const chip=q('#payerBtn');
    if(!chip) throw new Error('the payer chip should be a button');
    if(!chip.classList.contains('edit')) throw new Error('it should be changeable before anything is invoiced');
    if(!/NCCI/.test(chip.textContent) || !/deductible/.test(chip.textContent)) throw new Error('the chip should still show the payer details: '+chip.textContent);
    if(!/Change/.test(chip.textContent)) throw new Error('the chip should say it can be changed');
    /* the payer is a story: NPHIES eligibility first */
    chip.click();
    if(q('.stages').dataset.story!=='payer') throw new Error('the payer story should open');
    if(q('.stages .sg.now .t').textContent!=='Eligibility check') throw new Error('it should start with the eligibility check');
    if(!/Checking eligibility with NPHIES/.test(q('.step h2').textContent)) throw new Error('it should show the check running');
    w.eval('finishEligibility')(c);
    if(q('.stages .sg.now .t').textContent!=='Choose payer') throw new Error('then choose the payer');
    if(!c.history.some(h=>h.type==='ELIGIBILITY')) throw new Error('the eligibility check should be recorded');
    const nph=w.eval('NPHIES')[c.mrn];
    const chooseBtns=qa('.step [data-choose]').map(b=>b.dataset.choose);
    nph.filter(r=>r.status==='Eligible').forEach(r=>{ if(!chooseBtns.includes(r.id)) throw new Error('eligible '+r.id+' should be offered'); });
    /* nothing outside the eligibility result is loaded until searched for */
    w.eval('INTERNAL_PAYERS').forEach(x=>{ if(chooseBtns.includes(x.id)) throw new Error(x.id+' must not load until searched for'); });
    if(!q('#pyManual')) throw new Error('entering a payer manually should be offered');
    if(q('.step [data-f="group"]')) throw new Error('the manual search belongs on the policy details step, not here');
    if(!chooseBtns.includes('CASH')) throw new Error('cash must be one of the options');
    if(!/Consultation SAR/.test(q('.pchoice').textContent)) throw new Error('each option should show what the consultation would cost');
    /* the table of benefits opens in place */
    q('.step [data-tob]').click();
    if(!q('.step table.tob')) throw new Error('the table of benefits should open');
    if(!/Consultation/.test(q('.step table.tob').textContent)) throw new Error('the table should list the benefits');
    /* cash needs no policy details */
    const before=w.eval('due')(c);
    q('.step [data-choose="CASH"]').click();
    if(c.payerId!=='CASH') throw new Error('payer did not change');
    if(!/Payer set — Cash/.test(q('.step h2').textContent)) throw new Error('the story should finish on the result');
    if(!qa('.stages .sg.skip .t').some(x=>x.textContent==='Policy details')) throw new Error('cash should skip the policy details');
    if(!c.history.some(h=>/Payer changed/.test(h.tx))) throw new Error('the change was not recorded in history');
    if(!/Cash \/ Self-pay/.test(q('.phead').textContent)) throw new Error('the header should name the new payer');
    const cash=w.eval('nextStep')(c);
    if(cash.amt<=0) throw new Error('a self-pay consultation should be fully chargeable');
    /* an insurer: policy details come filled from NPHIES; a fresh insurer needs a fresh approval */
    const others=w.eval('pt')(c).payers.filter(p=>p.plan);
    const fresh=others.find(p=>!(c.consult.appr||{})[p.id] && nph.some(r=>r.id===p.id && r.status==='Eligible'));
    if(fresh){
      q('#payerBtn').click(); w.eval('finishEligibility')(c);
      q('.step [data-choose="'+fresh.id+'"]').click();
      if(q('.stages .sg.now .t').textContent!=='Policy details') throw new Error('an insurer needs the policy details');
      const r=nph.find(x=>x.id===fresh.id);
      if(q('.step [data-f="policyNo"]').value!==r.policyNo || q('.step [data-f="cardId"]').value!==r.cardId) throw new Error('the details should come from NPHIES');
      ['group','contract','policy','subPolicy','validTo','holderCode','holder'].forEach(k=>{ if(!q('.step [data-f="'+k+'"]')) throw new Error('missing field '+k); });
      q('#pySave').click();
      if(c.payerId!==fresh.id) throw new Error('the insurer should be set');
      if(c.consult.ins!=='pending') throw new Error('a new insurer needs a fresh approval, got '+c.consult.ins);
      if(!c.policy || c.policy.policyNo!==r.policyNo) throw new Error('the policy details should be kept on the visit');
    }
    /* an internal charity payer: a reference is required, and it approves on its own */
    q('#payerBtn').click(); w.eval('finishEligibility')(c);
    q('#pyManual').click();
    if(q('.stages .sg.now .t').textContent!=='Policy details') throw new Error('manual entry happens on the policy details step');
    if(!q('#pySave').disabled) throw new Error('nothing can be saved until a payer is picked');
    q('#pyBackList').click();
    if(q('.stages .sg.now .t').textContent!=='Choose payer') throw new Error('Back should return to Choose payer');
    q('#pyManual').click();
    const grp=q('.step [data-f="group"]'); grp.value='charity'; grp.dispatchEvent(new w.Event('input'));
    const hitIds=qa('.step #pySug [data-pick]').map(b=>b.dataset.pick);
    if(!hitIds.includes('CH-HABIB') || hitIds.includes('RAJHI-B')) throw new Error('the search should find only matching payers: '+hitIds.join(','));
    q('.step [data-pick="CH-HABIB"]').click();
    if(q('.step [data-f="contract"]').value!=='Charity programme 2026') throw new Error('picking a payer should fill its contract');
    if(!q('#pySave').disabled) throw new Error('a charity payer needs its reference before saving');
    const ref=q('.step [data-f="policyNo"]'); ref.value='CH-2026-0412'; ref.dispatchEvent(new w.Event('input'));
    if(q('#pySave').disabled) throw new Error('with the reference it can be saved');
    q('#pySave').click();
    if(c.payerId!=='CH-HABIB') throw new Error('the charity should be the payer');
    if(c.consult.ins!=='approved') throw new Error('an internal payer approves on its own reference');
    if(w.eval('priceLines')(c,[c.consult]).patient>0.001) throw new Error('the charity covers the consultation in full');
    /* back onto the insurer that had already answered, for the rest of the run */
    const answered=others.find(p=>(c.consult.appr||{})[p.id]) || others[0];
    q('#payerBtn').click(); w.eval('finishEligibility')(c);
    q('.step [data-choose="'+answered.id+'"]').click();
    if(q('#pySave')) q('#pySave').click();
    if(c.consult.appr && c.consult.appr[answered.id] && c.consult.ins!==c.consult.appr[answered.id]) throw new Error('the earlier answer from '+answered.label+' should be kept');
    const payers=P()[c.mrn].payers;
    return 'NPHIES → '+chooseBtns.length+' options (insurers, internal, cash) · cash, insurer and charity each set';
  });
  step('2 · approval arrives — now it asks whether to bill the consultation', ()=>{
    const c=open(3);                                  /* back to the patient under test */
    w.eval('simApproveConsult')(c);
    if(w.eval('nextStep')(c).key!=='CONSULT_BILL') throw new Error('should now offer to invoice');
    if(!/Approval received.*bill the consultation/i.test(stepQ())) throw new Error('wrong wording: '+stepQ());
    if(!q('details.ext')) throw new Error('the charge contents should be expandable');
    if(!/Approval received/.test(c.history[0].tx)) throw new Error('the approval was not recorded in history');
    return stepQ();
  });
  step('3 · no invoice is raised — billing goes straight to the payment mode', ()=>{
    const c=C().find(x=>x.id===3);
    const amt=w.eval('nextStep')(c).amt;
    const invBefore=c.invoices.length;
    yes();
    /* the charge is prepared, but nothing is invoiced yet */
    if(!c.bill) throw new Error('the charge was not prepared');
    if(c.invoices.length!==invBefore) throw new Error('an invoice must not exist before payment');
    if(c.consult.invoiceId) throw new Error('the consultation should carry no invoice number yet');
    if(c.history.some(h=>/invoiced/i.test(h.tx))) throw new Error('history should not claim an invoice was raised');
    if(Math.abs(w.eval('due')(c)-amt)>0.02) throw new Error('the open charge should match what was asked');
    const s2=w.eval('nextStep')(c);
    if(s2.key!=='COLLECT') throw new Error('expected the collection step, got '+s2.key);
    /* two buttons only — the modes live in the pop-up */
    if(qa('.step .modes').length) throw new Error('the mode grid should not be on the step any more');
    const btns=qa('.step .acts .btn').map(b=>b.textContent.trim());

    const st=w.eval('nextStep')(c);

    if(!c.history.some(h=>/Holding for the remaining approvals/.test(h.tx))) throw new Error('not recorded');
    /* the card separates what is known from what is still a guess */
    const figs=qa('.step .amtrow .amt').map(x=>x.textContent.replace(/\s+/g,' ').trim());
    if(figs.length!==2) throw new Error('expected a known figure and an estimate, got '+figs.join(' | '));

    if(!/if approved in full/.test(figs[1])) throw new Error('the estimate should be qualified: '+figs[1]);
    /* the estimate is priced after the held orders, so the two add up to a combined bill */
    const ready=st.amts[0].v, more=st.amts[1].v;

    const combined=w.eval('priceLines')(c,[...heldLines,...pendLines]).patient;
    if(Math.abs((ready+more)-combined)>0.02)
      throw new Error('the two figures should add up to a combined bill: '+ready+' + '+more+' vs '+combined);
    /* and the estimate must not assume a deductible the held orders will have eaten */
    const naive=w.eval('priceLines')(c,pendLines).patient;
    if(more > naive + 0.02) throw new Error('the estimate should not exceed the naive one: '+more+' vs '+naive);

    if(!/Bill the 2 approved now/.test(qa('.step .acts .btn').map(b=>b.textContent).join(' | ')))

    return 'held 2, waited, then billed all 3 together';

    const advTypes=w.eval('ledgerRows')('7000667','ADV').map(r=>r.type);
    const crTypes=w.eval('ledgerRows')('7000667','CREDIT').map(r=>r.type);

    /* each has a single running balance of its own, ending at the real figure */
    const a=w.eval('ledgerRows')('7000667','ADV'), cr=w.eval('ledgerRows')('7000667','CREDIT');
    if(Math.abs(a[0].balance - w.eval('advTotal')({mrn:'7000667'}))>0.02)

    if(Math.abs(cr[0].balance - w.eval('creditTotal')('7000667'))>0.02)
      throw new Error('credit balance '+cr[0].balance+' does not match the outstanding credit');
    /* replay each independently */
    [['ADV',a],['CREDIT',cr]].forEach(([k,list])=>{

      [...list].reverse().forEach(r=>{

    const link=crBox.querySelector('a.invlink');

  step('booking a package procedure makes a nil-priced visit without touching the package', ()=>{
    w.eval('openPatient')('7000667');
    const before=w.eval('visitsOf')('7000667').length;
    const items=w.eval('packageItems')('7000667');
    const target=items.find(x=>!x.child.visitId);
    const parentVisit=target.c, parentInv=target.inv;
    const parentLinesBefore=parentVisit.orders.length;
    const invRowsBefore=parentInv.rows.length;
    S.pkgOpen=true; R();
    q('[data-book]').click();
    if(!q('.pop')) throw new Error('the booking pop-up did not open');
    if(!/no charge/i.test(q('.pop').textContent)) throw new Error('it should say the visit carries no charge');
    /* the one clicked is pre-ticked; book it */
    if(!qa('.pbChk').some(x=>x.checked)) throw new Error('the chosen procedure should be pre-ticked');
    q('#pbGo').click();
    /* a new visit exists, opened, at nil charge */
    const after=w.eval('visitsOf')('7000667');
    if(after.length!==before+1) throw new Error('the visit was not created');
    const v=C().find(x=>x.id===S.caseId);
    if(v.visitType!=='Package procedure') throw new Error('wrong visit type: '+v.visitType);
    if(v.consult.price!==0) throw new Error('the consultation should be nil-priced');
    if(!v.orders.length || v.orders.some(o=>o.price!==0)) throw new Error('the procedure should carry no charge');
    if(!v.orders[0].fromPackage) throw new Error('the order should point back at the package');
    /* nothing was removed from the package or from the visit that billed it */
    if(parentVisit.orders.length!==parentLinesBefore) throw new Error('the original visit lost a line');
    if(parentInv.rows.length!==invRowsBefore) throw new Error('the package invoice changed');
    if(w.eval('packageItems')('7000667').length!==items.length) throw new Error('the package lost a child');
    const still=w.eval('packageItems')('7000667').find(x=>x.child.code===target.child.code);
    if(!still) throw new Error('the child should still belong to the package');
    if(still.child.visitId!==v.id) throw new Error('the child should be linked to the new visit');
    /* and it drops out of the "to book" list */
    if(w.eval('packageItemsLeft')('7000667').some(x=>x.child.code===target.child.code))
      throw new Error('a booked procedure should not be offered again');
    /* both visits record it */
    if(!v.history.some(h=>/package procedure/i.test(h.tx))) throw new Error('the new visit should record the booking');
    if(!parentVisit.history.some(h=>/booked for another day/i.test(h.tx))) throw new Error('the original visit should record it too');
    return 'booked '+target.child.name+' as visit '+v.id+', package intact';
  });

  step('cash is taken by counting notes, pre-picked and adjustable', ()=>{
    const c=open(1);
    c.prefs={}; c.bill=null; c.link=null; c.invoices=[]; c.dedUsed=0;
    c.consult={ name:'Paediatric Consultation', code:'CON-101', price:200, priceIns:200, priceCash:170, ins:'approved', paid:false };
    c.orders=[]; c.payerId='NCCI-A'; R();
    qa('.step .acts .btn')[0].click();
    qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click();
    const amount=w.eval('state').drawer.amount;
    /* the notes are pre-picked to the fewest that cover the amount */
    const notes=qa('.drawer [data-note]');
    if(!notes.length) throw new Error('no note picker on the cash mode');
    const d=()=>w.eval('state').drawer;
    const suggested=w.eval('suggestNotes')(amount);
    const tot=w.eval('notesTotal')(suggested);
    if(tot < amount - 0.004) throw new Error('the suggestion must cover the amount: '+tot+' vs '+amount);
    if(Math.abs(w.eval('notesTotal')(d().notes)-tot)>0.004) throw new Error('the drawer should open with the suggestion');
    /* it is labelled amount tendered, and shows the change */
    if(!/Cash handed over/.test(q('.drawer').textContent)) throw new Error('the tendered field is missing');
    const tendInput=q('#dTend');
    if(Math.abs(parseFloat(tendInput.value)-tot)>0.004) throw new Error('the tendered box should follow the notes');
    /* adding a note the patient actually gave changes the tender and the change */
    const five=notes.find(n=>n.dataset.note==='500');
    five.click();
    if(Math.abs(w.eval('notesTotal')(d().notes)-(tot+500))>0.004) throw new Error('tapping a note should add it');
    if(Math.abs(parseFloat(q('#dTend').value)-(tot+500))>0.004) throw new Error('the tendered amount should follow');
    /* three separate fields: what is owed, what was handed over, what goes back */
    const fldVal=(lbl)=>{ const f=qa('.drawer .fld').find(x=>x.querySelector('label') &&
        new RegExp(lbl).test(x.querySelector('label').textContent)); return f?parseFloat(f.querySelector('input').value):null; };
    if(Math.abs(fldVal('Amount to pay')-amount)>0.004) throw new Error('the amount to pay should be its own field');
    if(Math.abs(fldVal('Cash handed over')-(tot+500))>0.004) throw new Error('the tendered field should follow the notes');
    if(Math.abs(fldVal('Change to give back')-(tot+500-amount))>0.004) throw new Error('the change should be its own field');
    if(!qa('.drawer .fld').find(x=>/Notes handed over/.test(x.textContent))) throw new Error('the notes should be their own field');
    /* and taking it away again */
    q('.drawer [data-less="500"]').click();
    if(Math.abs(w.eval('notesTotal')(d().notes)-tot)>0.004) throw new Error('the minus should remove one');
    /* too little is called out rather than silently accepted */
    q('#dClear').click();
    qa('.drawer [data-note]').find(n=>n.dataset.note==='1').click();
    if(!/Still to allocate/.test(q('.drawer').textContent)) throw new Error('an underpayment should be flagged');
    if(!q('.drawer input.ro.bad')) throw new Error('the shortfall should be shown in the red field');
    /* a typed amount overrides the count */
    q('#dExact').click();
    const ti=q('#dTend'); ti.value='300'; ti.dispatchEvent(new w.Event('change'));
    if(!/typed in by hand/i.test(q('.drawer').textContent)) throw new Error('a hand-typed tender should say so');
    if(Math.abs(parseFloat(q('#dTend').value)-300)>0.004) throw new Error('the typed amount should stand');
    /* what was handed over, and the change, are recorded on the payment */
    q('#dGo').click();
    const inv=c.invoices[0];
    if(!inv) throw new Error('the payment did not go through');
    if(!/tendered SAR 300/.test(inv.viaDetail)) throw new Error('the tender was not recorded: '+inv.viaDetail);
    const expChange=+(300-inv.patient).toFixed(2);
    if(expChange>0.004 && !new RegExp('change').test(inv.viaDetail)) throw new Error('the change was not recorded: '+inv.viaDetail);
    if(!c.history.some(h=>/tendered SAR 300/.test(h.sub||''))) throw new Error('the history should show what was handed over');
    return 'suggested '+tot+' for '+amount+', tendered 300, '+inv.viaDetail;
  });

  step('a pending order can be billed as cash on its own, at the cash price', ()=>{
    const c=open(1);
    c.prefs={}; c.bill=null; c.link=null; c.invoices=[]; c.dedUsed=0; c.checks=0; c.lastCheck=null;
    c.payerId='NCCI-A';
    c.consult={ name:'Paediatric Consultation', code:'CON-101', price:200, priceIns:200, priceCash:170, ins:'approved', paid:false };
    c.orders=[{ code:'LAB-077', name:'Thyroid Panel', price:260, priceIns:260, priceCash:220, ins:'pending', paid:false }];
    R();
    /* consultation on insurance first */
    qa('.step .acts .btn')[0].click(); qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click(); q('#dGo').click();
    const consultInv=c.invoices[0];
    if(consultInv.company<=0) throw new Error('the consultation should be on the policy');
    /* now waiting on the order, with the cash option offered */
    if(w.eval('nextStep')(c).key!=='ORDERS_WAIT') throw new Error('expected the waiting step, got '+w.eval('nextStep')(c).key);
    const btn=qa('.step .acts .btn').find(b=>/Bill the 1 pending order\(s\) as cash now/.test(b.textContent));
    if(!btn) throw new Error('no order-only cash option: '+qa('.step .acts .btn').map(b=>b.textContent.trim()).join(' | '));
    btn.click();
    /* it is charged at the cash price, with no payer share and no payer discount */
    const st=w.eval('nextStep')(c);
    if(st.key!=='COLLECT') throw new Error('expected to collect for the order, got '+st.key);
    const expect=+(220*1.15).toFixed(2);
    if(Math.abs(w.eval('due')(c)-expect)>0.02) throw new Error('cash price not used: '+w.eval('due')(c)+' vs '+expect);
    if(c.bill.company!==0) throw new Error('no payer share on a cash order');
    if(c.bill.deductible!==0) throw new Error('a cash order must not eat the deductible pool');
    qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click(); q('#dGo').click();
    const cashInv=c.invoices.find(i=>i.cashOnly);
    if(!cashInv) throw new Error('no cash-only invoice raised');
    if(cashInv.billType!=='cash') throw new Error('it should be typed as a cash invoice');
    if(cashInv.rows.length!==1) throw new Error('only the order should be on it');
    /* the consultation stays on the policy — the visit payer is untouched */
    if(w.eval('planOf')(c)==null) throw new Error('the visit should still carry the policy');
    if(c.invoices.find(i=>i.id===consultInv.id).company<=0) throw new Error('the consultation invoice changed');
    if(!c.history.some(h=>/billed as cash while the approval is outstanding/i.test(h.tx)))
      throw new Error('the urgent cash billing was not recorded');
    /* billed is billed: orders invoicing moves on, and the outstanding approval is the Replace story's */
    if(w.eval('nextStep')(c).key!=='CLOSE') throw new Error('orders invoicing should be complete, got '+w.eval('nextStep')(c).key);
    if(qa('.step .acts .btn').some(b=>/Check approval|Replace/.test(b.textContent))) throw new Error('orders invoicing should carry no replace work');
    if(!hasStory('replace')) throw new Error('the Replace story should pick it up');
    return 'order billed at cash '+cashInv.patient+' on '+cashInv.id+', consultation still insured';
  });
