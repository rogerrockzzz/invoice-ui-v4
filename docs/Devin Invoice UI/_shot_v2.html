<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow; const S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],C=()=>w.eval('cases');
  if(n==='2'){ const c=C().find(x=>x.id===2); w.eval('simDesk')(c); }
  if(n==='3'){ const c=C().find(x=>x.id===2); w.eval('simDesk')(c); w.eval('render')(); q('#yes').click(); }
  if(n==='4'){ const c=C().find(x=>x.id===2); w.eval('simDesk')(c); w.eval('render')(); q('#yes').click();
               qa('.modes .m').find(m=>/Cash/.test(m.textContent)).click(); }
  if(n==='5'){ C().forEach(c=>{c.closed=true;}); w.eval('render')(); }
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
