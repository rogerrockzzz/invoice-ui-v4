<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><pre id="out">…</pre><script>
const log=[];const f=document.createElement('iframe');f.style.cssText='width:1100px;height:1100px';
f.onload=()=>{const w=f.contentWindow;w.onerror=(m,s,l)=>{log.push('RUNTIME-ERR @'+l+': '+m);return true;};
 const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)];
 const S=w.eval('state'), C=()=>w.eval('cases'), R=()=>w.eval('render')(), P=()=>w.eval('patients');
 const pt2=(c)=>P()[c.mrn];
 const wal=(c)=>P()[c.mrn].wallet;
 const open=(id)=>{ w.eval('openVisit')(id); return C().find(c=>c.id===id); };
 const stepQ=()=>q('.step h2').textContent.trim();
 const goHomeAndSearch=(t)=>{ S.screen='home'; S.q=t; R(); };
 const yes=()=>qa('.step .acts .btn')[0].click();
 const step=(n,fn)=>{ try{ const r=fn(); log.push('OK   '+n+(r!==undefined?' -> '+r:'')); }
   catch(e){ log.push('FAIL '+n+': '+e.message+' | '+(e.stack||'').split('\n')[1]); } };
 try{
  step('home loads nothing until you search', ()=>{
    S.screen='home'; S.q=''; S.tabs=[]; S.activeMrn=null; S.caseId=null; R();
    if(qa('.prow').length) throw new Error('nothing should be listed before a search');
    if(!q('.blank')) throw new Error('expected the empty state');
    if(!/Search for a patient/i.test(q('.blank').textContent)) throw new Error('no prompt to search');
    if(!q('.hsearch input')) throw new Error('no search box');
    return q('.blank .big').textContent.trim();
  });
  step('the patient row tags its pending work and expands to show it', ()=>{
    S.expanded={}; S.q=''; R();
    const box=q('#q'); box.value='mohammed'; box.dispatchEvent(new w.Event('input'));
    const heads=qa('.hhead h1').map(h=>h.textContent.trim());
    if(heads.length!==1 || heads[0]!=='Patients') throw new Error('there should be one section only: '+heads.join(' | '));
    if(/Pending actions/.test(q('main').textContent) && qa('.hhead h1').length>1)
      throw new Error('the separate pending-actions section should be gone');
    const card=q('.pcard');
    if(!card) throw new Error('no patient card');
    const openVs=C().filter(c=>c.mrn==='7000667' && !c.closed);
    const needing=openVs.filter(c=>w.eval('pendingSummary')(c).kind==='act').length;
    /* the tag tells you there is work without opening anything */
    if(!new RegExp(needing+' action').test(card.textContent))
      throw new Error('the row should tag how many actions need doing: '+card.textContent.replace(/\s+/g,' '));
    /* a single match opens itself, and the work sits inside the card */
    if(!card.classList.contains('open')) throw new Error('a lone match should expand automatically');
    const rows=qa('.pcard .pexp .arow');
    if(rows.length!==openVs.length) throw new Error('expected '+openVs.length+' action rows inside the card, got '+rows.length);
    if(!rows[0].closest('.pcard')) throw new Error('the actions should be nested in the patient card');
    /* collapse and expand by clicking the row */
    q('.pcard .prow').click();
    if(qa('.pcard .pexp').length) throw new Error('clicking should collapse it');
    q('.pcard .prow').click();
    if(!qa('.pcard .pexp .arow').length) throw new Error('clicking should expand it again');
    /* an action row opens that visit; the button opens the profile */
    qa('.pcard .pexp .arow')[0].click();
    if(S.screen!=='visit') throw new Error('the action row should open the visit');
    goHomeAndSearch('mohammed');
    q('[data-open]').click();
    if(S.screen!=='patient') throw new Error('the button should open the patient profile');
    return needing+' tagged, '+rows.length+' actions inside the card';
  });
  step('opening a patient shows every visit, newest first', ()=>{
    goHomeAndSearch('mohammed');
    q('[data-open]').click();
    if(S.screen!=='patient') throw new Error('it should open the patient profile');
    const rows=qa('.vrow');
    const vs=w.eval('visitsOf')('7000667');
    if(rows.length!==vs.length) throw new Error('expected '+vs.length+' visits, got '+rows.length);
    const keys=vs.map(v=>v.sortKey);
    if(keys.join()!==keys.slice().sort((a,b)=>b-a).join()) throw new Error('visits are not newest first');
    if(!/Today/.test(rows[0].textContent)) throw new Error('today\'s visit should be at the top');
    const last=vs[vs.length-1];
    if(!rows[rows.length-1].textContent.includes(last.date)) throw new Error('the oldest visit should be last');
    return rows.length+' visits, newest first';
  });
  step('clicking a visit opens the actions, and both ways back work', ()=>{
    qa('.vrow')[0].click();
    if(S.screen!=='visit') throw new Error('it should open the visit');
    if(!q('.step')) throw new Error('no action card on the visit screen');
    /* back to the patient */
    q('.crumb #back').click();
    if(S.screen!=='patient') throw new Error('the crumb should return to the patient profile');
    /* and back to the homepage */
    q('.crumb #bHome').click();
    if(S.screen!=='home') throw new Error('the crumb should return home');
    return 'visit → patient → home';
  });
  step('several patients stay open as tabs', ()=>{
    w.eval('openPatient')('7000667');
    w.eval('openPatient')('7000203');
    w.eval('openVisit')(3);
    const tabs=qa('.tabs .tab').map(t=>t.textContent.replace(/[✕⌂]/g,'').trim()).filter(x=>x && x!=='Home' && x!=='Invoices');
    if(tabs.length!==3) throw new Error('expected three patients open, got '+tabs.join(' | '));
    if(S.activeMrn!=='7100482') throw new Error('the newest should be active');
    /* switching tabs moves between patients without losing the others */
    qa('.tabs .tab').find(t=>/MOHAMMED/i.test(t.textContent)).click();
    if(S.activeMrn!=='7000667' || S.screen!=='patient') throw new Error('the tab did not switch');
    if(qa('.tabs .tab [data-close]').length!==3) throw new Error('the other tabs should still be there');
    /* and one can be closed */
    qa('.tabs .tab [data-close]').find(x=>x.dataset.close==='7000203').click();
    if(S.tabs.includes('7000203')) throw new Error('the tab did not close');
    if(S.tabs.length!==2) throw new Error('closing one should leave the rest');
    return tabs.join(' | ')+' → closed one, '+S.tabs.length+' open';
  });
  step('a visit can be added from the home page for any patient', ()=>{
    S.screen='home'; S.q=''; R();
    if(!q('#addVisit')) throw new Error('no Add visit option on the home page');
    q('#addVisit').click();
    const pop=q('.pop');
    if(!pop) throw new Error('the add-visit popup did not open');
    if(!q('#nvGo').disabled) throw new Error('it should not create anything until a patient is picked');
    /* every known patient is searchable, including one with no visit today */
    const pick=qa('#nvPick [data-m]').map(x=>x.dataset.m);
    if(pick.length!==Object.keys(P()).length) throw new Error('all patients should be listed');
    if(!pick.includes('1063301')) throw new Error('a patient with no visit today should still be pickable');
    /* a patient who already has an open visit can be given another */
    const before=C().filter(x=>x.mrn==='7000667').length;
    qa('#nvPick [data-m]').find(x=>x.dataset.m==='7000667').click();
    if(!/already has/.test(q('.pop').textContent)) throw new Error('it should note the existing open visit');
    const cl=q('#nvClinic'); cl.value='ENT'; cl.dispatchEvent(new w.Event('change'));
    const ty=q('#nvType'); ty.value='Follow-up'; ty.dispatchEvent(new w.Event('change'));
    q('#nvGo').click();
    const after=C().filter(x=>x.mrn==='7000667');
    if(after.length!==before+1) throw new Error('the visit was not created');
    const fresh=C().find(x=>x.id===S.caseId);
    if(fresh.clinic!=='ENT' || fresh.visitType!=='Follow-up') throw new Error('the new visit did not keep its details');
    if(S.screen!=='visit') throw new Error('it should open the new visit');
    if(fresh.consult.ins!=='pending') throw new Error('an insured visit should start awaiting approval');
    if(!fresh.history.some(h=>/Visit created/.test(h.tx))) throw new Error('creation not recorded');
    /* and the patient profile now lists both */
    w.eval('openPatient')('7000667');
    if(qa('.vrow').length!==after.length) throw new Error('the profile should list every visit');
    return before+' → '+after.length+' visits for that patient';
  });


  /* ---- the sequence, on a patient whose approval has not arrived ---- */
  step('1 · no approval yet — the system says wait, and will not invoice', ()=>{
    const c=open(3);
    if(w.eval('nextStep')(c).key!=='CONSULT_WAIT') throw new Error('expected the waiting step');
    if(!/Approval not received/.test(stepQ())) throw new Error('wrong wording: '+stepQ());
    if(qa('.step .acts .btn').some(b=>/invoice/i.test(b.textContent) && !/self-pay/i.test(b.textContent)))
      throw new Error('invoicing must not be offered before the approval');
    return stepQ();
  });
  step('the payer can be changed before the consultation is invoiced', ()=>{
    const c=open(1);                                  // WADHA, approval already in, nothing invoiced
    const btns=qa('.step .acts .btn').map(b=>b.textContent.trim());
    if(btns.includes('Not yet')) throw new Error('the dead "Not yet" button should be gone');
    /* no button on the step — the payer chip in the header is the way in */
    if(btns.some(b=>/Change payer/.test(b))) throw new Error('the step should not carry a Change payer button: '+btns.join(' | '));
    const chip=q('#payerBtn');
    if(!chip) throw new Error('the payer chip should be a button');
    if(!chip.classList.contains('edit')) throw new Error('it should be changeable before anything is invoiced');
    if(!/NCCI/.test(chip.textContent) || !/deductible/.test(chip.textContent)) throw new Error('the chip should still show the payer details: '+chip.textContent);
    if(!/Change/.test(chip.textContent)) throw new Error('the chip should say it can be changed');
    chip.click();
    const pop=q('.pop');
    if(!pop) throw new Error('the payer popup did not open');
    const rows=qa('.pop .payer');
    const payers=P()[c.mrn].payers;
    if(rows.length!==payers.length) throw new Error('every payer should be listed, got '+rows.length);
    if(!/Cash \/ Self-pay/.test(pop.textContent)) throw new Error('cash must be one of the options');
    if(!qa('.pop .payer.on').length) throw new Error('the current payer should be marked');
    /* each option shows what this consultation would cost under it */
    if(!/would be/.test(rows[0].textContent)) throw new Error('no estimate per payer');
    /* switching to cash reprices and is recorded */
    const before=w.eval('due')(c);
    rows.find(r=>r.dataset.p==='CASH').click();
    if(c.payerId!=='CASH') throw new Error('payer did not change');
    if(!c.history.some(h=>/Payer changed/.test(h.tx))) throw new Error('the change was not recorded in history');
    if(!/Cash \/ Self-pay/.test(q('.phead').textContent)) throw new Error('the header should name the new payer');
    const cash=w.eval('nextStep')(c);
    if(cash.amt<=0) throw new Error('a self-pay consultation should be fully chargeable');
    /* a different insurer needs a fresh approval; going back to one that already answered keeps its answer */
    const others=w.eval('pt')(c).payers.filter(p=>p.plan);
    const fresh=others.find(p=>!(c.consult.appr||{})[p.id]);
    if(fresh){
      S.payerPop={c}; R();
      qa('.pop .payer').find(r=>r.dataset.p===fresh.id).click();
      if(c.consult.ins!=='pending') throw new Error('a new insurer needs a fresh approval, got '+c.consult.ins);
      if(w.eval('nextStep')(c).key!=='CONSULT_WAIT') throw new Error('should be waiting for the new approval');
    }
    const answered=others.find(p=>(c.consult.appr||{})[p.id]);
    if(answered){
      S.payerPop={c}; R();
      qa('.pop .payer').find(r=>r.dataset.p===answered.id).click();
      if(c.consult.ins!==c.consult.appr[answered.id]) throw new Error('the earlier answer from '+answered.label+' should be kept');
    }
    if(w.eval('nextStep')(c).key==='CONSULT_WAIT') w.eval('simApproveConsult')(c);
    return payers.length+' payers offered incl. cash; switching repriced and re-requested approval';
  });
  step('2 · approval arrives — now it asks whether to bill the consultation', ()=>{
    const c=open(3);                                  /* back to the patient under test */
    w.eval('simApproveConsult')(c);
    if(w.eval('nextStep')(c).key!=='CONSULT_BILL') throw new Error('should now offer to invoice');
    if(!/Approval received.*bill the consultation/i.test(stepQ())) throw new Error('wrong wording: '+stepQ());
    if(!q('details.ext')) throw new Error('the charge contents should be expandable');
    if(!/Approval received/.test(c.history[0].tx)) throw new Error('the approval was not recorded in history');
    return stepQ();
  });
  step('3 · no invoice is raised — billing goes straight to the payment mode', ()=>{
    const c=C().find(x=>x.id===3);
    const amt=w.eval('nextStep')(c).amt;
    const invBefore=c.invoices.length;
    yes();
    /* the charge is prepared, but nothing is invoiced yet */
    if(!c.bill) throw new Error('the charge was not prepared');
    if(c.invoices.length!==invBefore) throw new Error('an invoice must not exist before payment');
    if(c.consult.invoiceId) throw new Error('the consultation should carry no invoice number yet');
    if(c.history.some(h=>/invoiced/i.test(h.tx))) throw new Error('history should not claim an invoice was raised');
    if(Math.abs(w.eval('due')(c)-amt)>0.02) throw new Error('the open charge should match what was asked');
    const s2=w.eval('nextStep')(c);
    if(s2.key!=='COLLECT') throw new Error('expected the collection step, got '+s2.key);
    /* two buttons only — the modes live in the pop-up */
    if(qa('.step .modes').length) throw new Error('the mode grid should not be on the step any more');
    const btns=qa('.step .acts .btn').map(b=>b.textContent.trim());
    if(btns.length!==2) throw new Error('expected exactly two buttons, got '+btns.join(' | '));
    /* the desk is the commonest, so it leads */
    if(btns[0]!=='Take payment at the desk') throw new Error('first button should be the desk: '+btns[0]);
    if(btns[1]!=='Send payment link') throw new Error('second button should send the link: '+btns[1]);
    if(!qa('.step .acts .btn')[0].classList.contains('yes')) throw new Error('the desk should be the primary button');
    if(c.link) throw new Error('nothing should be sent before a button is pressed');
    /* the desk button opens the pop-up with the modes inside it */
    qa('.step .acts .btn')[0].click();
    if(!q('.drawer')) throw new Error('the desk button should open the slide-in');
    const modes=qa('.drawer [data-m]').map(x=>x.dataset.m);
    ['Span','Visa','Master card','Cash','Credit'].forEach(m=>{
      if(!modes.includes(m)) throw new Error('the pop-up is missing '+m); });
    /* the rarer production modes sit behind "more", not on the face */
    ['MADA','Amex','INTER_COMPANY_REFERRAL_PAYMENT','Cash From Finance'].forEach(m=>{
      if(modes.includes(m)) throw new Error(m+' should be behind the more list, not on the face'); });
    q('#dMore').click();
    const hidden=qa('.drawer .modemenu [data-m]').map(x=>x.dataset.m);
    ['MADA','Amex','INTER_COMPANY_REFERRAL_PAYMENT','Cash From Finance','DOCTOR','CLINIC'].forEach(m=>{
      if(!hidden.includes(m)) throw new Error('the more list is missing '+m+': '+hidden.join(' | ')); });
    q('#dCancel').click();
    /* and the link button just sends the link */
    qa('.step .acts .btn')[1].click();
    if(!c.link) throw new Error('the link was not sent');
    if(c.invoices.length!==invBefore) throw new Error('sending a link must not create an invoice');
    return 'two buttons on the step; '+modes.length+' modes inside the pop-up';
  });
  step('the payment is what creates the invoice, in a single history line', ()=>{
    const c=C().find(x=>x.id===3);
    const invBefore=c.invoices.length, histBefore=c.history.length;
    w.eval('simPaid')(c);
    if(c.invoices.length!==invBefore+1) throw new Error('the payment should create exactly one invoice');
    const inv=c.invoices[0];
    if(!inv.paid || !inv.id) throw new Error('the invoice should be paid and numbered');
    if(c.consult.invoiceId!==inv.id) throw new Error('the line was not linked to the new invoice');
    if(c.bill) throw new Error('the open charge should be cleared');
    /* exactly one new history entry, and it names the invoice created */
    const added=c.history.length-histBefore;
    if(added!==1) throw new Error('expected one history entry for the payment, got '+added);
    if(!/Consultation paid/.test(c.history[0].tx)) throw new Error('wrong wording: '+c.history[0].tx);
    if(!new RegExp('invoice '+inv.id+' created').test(c.history[0].sub)) throw new Error('the entry should name the invoice: '+c.history[0].sub);
    if(c.history.filter(h=>/Consultation (paid|invoiced)/.test(h.tx)).length!==1)
      throw new Error('the consultation should appear once, not twice');
    return c.history[0].tx+' · '+c.history[0].sub;
  });
  step('4 · the doctor orders — mixed approvals are explained', ()=>{
    const c=C().find(x=>x.id===3);
    if(w.eval('due')(c)!==0) throw new Error('payment did not clear the balance');
    w.eval('simOrders')(c);
    const s=w.eval('nextStep')(c);
    if(s.key!=='ORDERS_MIXED') throw new Error('expected the wait-or-invoice question, got '+s.key);
    if(!/3 procedures were ordered/.test(s.q)) throw new Error('should state how many were ordered: '+s.q);
    if(/\bhave approval\b.*\b1 do not\b/.test(s.q)) throw new Error('singular/plural slip: '+s.q);
    if(!/have approval/.test(s.q)) throw new Error('should state how many are approved');
    /* both choices are offered */
    const btns=qa('.step .acts .btn').map(b=>b.textContent.trim());
    if(!btns.some(b=>/Bill the 2 approved now/.test(b))) throw new Error('no "bill approved" choice: '+btns);
    if(!btns.some(b=>/Wait for all approvals/.test(b))) throw new Error('no "wait for all" choice: '+btns);
    /* and the orders can be expanded */
    const ext=q('details.ext');
    if(!ext) throw new Error('no expandable order list');
    ext.open=true;
    const rows=qa('details.ext tbody tr');
    if(rows.length!==3) throw new Error('the extension should list all 3 orders');
    if(qa('details.ext tbody tr.pend').length!==1) throw new Error('the pending order should be marked');
    return s.q;
  });
  step('5 · billing the approved ones leaves the pending one alone', ()=>{
    const c=C().find(x=>x.id===3);
    const approvedCount=w.eval('approvedOrders')(c).length;
    yes();
    if(w.eval('nextStep')(c).key!=='COLLECT') throw new Error('should ask how it is being paid');
    if(c.invoices.some(i=>i.scope==='orders')) throw new Error('no orders invoice should exist before payment');
    qa('.step .acts .btn').find(b=>/Send payment link/.test(b.textContent)).click();            // send the link
    w.eval('simPaid')(c);
    if(w.eval('approvedOrders')(c).length!==0) throw new Error('approved orders were not billed');
    if(w.eval('pendingOrders')(c).length!==1) throw new Error('the pending order should still be pending');
    const inv=c.invoices.find(i=>i.scope==='orders');
    if(!inv) throw new Error('the payment should have created the orders invoice');
    if(inv.rows.length!==approvedCount) throw new Error('the invoice should carry only the approved lines');
    if(c.history.filter(h=>/Orders (paid|invoiced)/.test(h.tx)).length!==1)
      throw new Error('the orders should appear once in history, not twice');
    return approvedCount+' billed and paid on one invoice, 1 held';
  });
  step('6 · only one button remains: Check approval', ()=>{
    const c=C().find(x=>x.id===3);
    const st=w.eval('nextStep')(c);
    if(st.key!=='ORDERS_WAIT') throw new Error('expected the waiting step, got '+st.key);
    const btns=qa('.step .acts .btn').map(b=>b.textContent.trim());
    if(btns[0]!=='Check approval') throw new Error('checking should lead: '+btns.join(' | '));
    /* the only other way out is to bill it as cash and move it onto the policy later */
    /* the only other ways out are cash: this order alone, or the whole visit */
    const extra=btns.slice(1);
    const allowed=/^(Bill the \d+ pending order\(s\) as cash now|Replace orders with cash billing)$/;
    const bad=extra.filter(b=>!allowed.test(b));
    if(bad.length) throw new Error('unexpected extra buttons: '+btns.join(' | '));
    if(/continue.*automatically/i.test(q('.step').textContent)) throw new Error('the auto-continue question should be gone');
    return st.q+'  ['+btns[0]+']';
  });
  step('7 · first check warns that the approval has not arrived', ()=>{
    const c=C().find(x=>x.id===3);
    const pendBefore=w.eval('pendingOrders')(c).length;
    qa('.step .acts .btn')[0].click();
    if(w.eval('pendingOrders')(c).length!==pendBefore) throw new Error('the first check should not grant the approval');
    if(!/no answer yet/.test(q('.step .sub').textContent)) throw new Error('no warning on the step: '+q('.step .sub').textContent);
    if(!c.history.some(h=>/Approval checked/.test(h.tx))) throw new Error('the check was not recorded');
    if(qa('.step .acts .btn')[0].textContent.trim()!=='Check approval') throw new Error('checking should still lead');
    return q('.step .sub').textContent.replace(/\s+/g,' ').trim().slice(0,80);
  });
  step('8 · second check brings the approval and asks to bill and collect', ()=>{
    const c=C().find(x=>x.id===3);
    qa('.step .acts .btn')[0].click();
    if(w.eval('pendingOrders')(c).length) throw new Error('the second check should grant the approval');
    if(!c.history.some(h=>/Approval received/.test(h.tx))) throw new Error('approval not recorded');
    const st=w.eval('nextStep')(c);
    if(st.key!=='ORDERS_BILL') throw new Error('it should now ask to bill, got '+st.key);
    if(!/Bill them\?/.test(st.q)) throw new Error('wrong wording: '+st.q);
    /* and billing leads to the payment question as usual */
    qa('.step .acts .btn')[0].click();
    if(w.eval('nextStep')(c).key!=='COLLECT') throw new Error('billing should lead to collection');
    qa('.step .acts .btn').find(b=>/Send payment link/.test(b.textContent)).click();     // send the link
    w.eval('simPaid')(c);
    if(w.eval('nextStep')(c).key!=='CLOSE') throw new Error('the visit should now be complete');
    return 'checked twice → approved → billed → paid';
  });
  step('"Wait for all approvals" actually holds the approved ones back', ()=>{
    /* rebuild a mixed visit: two approved, one pending */
    const c=open(2);                                     /* render this patient's profile */
    c.prefs={}; c.bill=null; c.link=null; c.closed=false; c.checks=0; c.lastCheck=null;
    c.orders=[{ code:'L1', name:'Full Blood Count', price:120, ins:'approved', paid:false },
              { code:'L2', name:'Lipid Profile',    price:200, ins:'approved', paid:false },
              { code:'L3', name:'Thyroid Panel',    price:260, ins:'pending',  paid:false }];
    R();
    if(w.eval('nextStep')(c).key!=='ORDERS_MIXED') throw new Error('expected the mixed question');
    qa('.step .acts .btn')[1].click();                   // "Wait for all approvals"
    if(!c.prefs.waitAll) throw new Error('the choice was not stored');
    const st=w.eval('nextStep')(c);
    if(st.key!=='ORDERS_WAIT') throw new Error('it should now be waiting, not asking again — got '+st.key);
    if(!/being held with them/.test(st.sub)) throw new Error('it should say the approved ones are held: '+st.sub);
    if(!c.history.some(h=>/Holding for the remaining approvals/.test(h.tx))) throw new Error('not recorded');
    /* the card separates what is known from what is still a guess */
    const figs=qa('.step .amtrow .amt').map(x=>x.textContent.replace(/\s+/g,' ').trim());
    if(figs.length!==2) throw new Error('expected a known figure and an estimate, got '+figs.join(' | '));
    if(!/ready to bill/.test(figs[0])) throw new Error('the first figure should be the ready-to-bill amount: '+figs[0]);
    if(!/if approved in full/.test(figs[1])) throw new Error('the estimate should be qualified: '+figs[1]);
    /* the estimate is priced after the held orders, so the two add up to a combined bill */
    const ready=st.amts[0].v, more=st.amts[1].v;
    const heldLines=w.eval('approvedOrders')(c);
    const pendLines=w.eval('pendingOrders')(c).map(o=>({...o, ins:'approved'}));
    const combined=w.eval('priceLines')(c,[...heldLines,...pendLines]).patient;
    if(Math.abs((ready+more)-combined)>0.02)
      throw new Error('the two figures should add up to a combined bill: '+ready+' + '+more+' vs '+combined);
