<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow,S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  w.eval('openPatientTab')('7000667'); S.screen='ip'; S.ipAdmissionId=5; S.ipStatus='TODO'; R();
  const pkRow=qa('table.chg.ip tbody tr').find(r=>r.textContent.includes('Appendectomy Surgical Package'));
  S.ipSel[pkRow.querySelector('.ipChk').dataset.id]=true; R(); q('#acceptGo').click(); if(q('#pkgGo')) q('#pkgGo').click();
  S.ipStatus='TODO'; S.ipCat='MED'; S.ipSel={}; R();
  qa('.ipChk').forEach(c=>{S.ipSel[c.dataset.id]=true;}); R(); q('#acceptGo').click(); q('#recGo').click();
  S.ipStatus='ACCEPTED'; S.ipCat='MED'; S.ipSel={}; S.ipWide=true; R(); w.scrollTo(0,255);
  document.title='SHOT-READY';};
f.src='billing-ui-revamp-mockup-v4.html';document.body.appendChild(f);
</script></body></html>
