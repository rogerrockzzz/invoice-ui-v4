<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const n=new URLSearchParams(location.search).get('s')||'1';
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow;
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)];
  w.eval('openVisit')(2);
  qa('.step .acts .btn')[0].click();
  qa('.step .acts .btn').find(b=>/desk/i.test(b.textContent)).click();
  qa('.drawer [data-m]').find(x=>x.dataset.m==='Cash').click();
  q('#dClear').click(); qa('.drawer [data-note]').find(x=>x.dataset.note==='100').click();
  q('#dAdd').click();                                             // cash 100 taken
  qa('.drawer [data-m]').find(x=>x.dataset.m==='Span').click();
  q('#dRef').value='884120'; q('#dRef').dispatchEvent(new w.Event('input'));
  const pin=q('#dPart'); pin.value='73.69'; pin.dispatchEvent(new w.Event('change'));
  q('#dAdd').click();                                             // span 73.69 taken
  if(n==='1'){ qa('.drawer [data-m]').find(x=>x.dataset.m==='Credit').click(); }
  if(n==='2'){ const row=qa('.drawer .taken .tk').find(r=>/Span/.test(r.textContent)); row.click(); }
  document.title='SHOT-READY';};
f.src='journey-opd-v2.html';document.body.appendChild(f);
</script></body></html>
