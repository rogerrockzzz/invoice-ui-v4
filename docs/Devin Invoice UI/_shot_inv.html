<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0}iframe{width:100vw;height:100vh;border:0;display:block}</style></head><body>
<script>
const f=document.createElement('iframe');
f.onload=()=>{const w=f.contentWindow,S=w.eval('state');
  const q=s=>w.document.querySelector(s),qa=s=>[...w.document.querySelectorAll(s)],R=()=>w.eval('render')();
  w.eval('openSession')('7000667', 5); R();
  // accept the package, some services and reconcile the meds
  qa('table.chg.ip tbody tr').filter(r=>r.textContent.includes('PACKAGE')).slice(0,1)
    .forEach(r=>{S.ipSel[r.querySelector('.ipChk').dataset.id]=true;});
  R(); q('#acceptGo').click(); if(q('#pkgGo')) q('#pkgGo').click();
  S.ipStatus='TODO'; S.ipCat='SERVICE'; S.ipSel={}; R();
  qa('.ipChk').slice(0,2).forEach(c=>{S.ipSel[c.dataset.id]=true;}); R();
  q('#acceptGo').click(); if(q('#pkgGo')) q('#pkgGo').click();
  S.ipStatus='TODO'; S.ipCat='MED'; S.ipSel={}; R();
  qa('.ipChk').forEach(c=>{S.ipSel[c.dataset.id]=true;}); R();
  q('#acceptGo').click(); if(q('#recGo')) q('#recGo').click();
  S.ipTab='printed'; S.ipInvSub='progress'; S.ipWide=true; R();
  w.scrollTo(0,240);
  document.title='SHOT-READY';};
f.src='billing-ui-revamp-mockup-v4.html';document.body.appendChild(f);
</script></body></html>
